        window.setWeekMode = function (mode) {
            weekMode = mode;
            document.getElementById('week-mode-stacked').classList.toggle('active', mode === 'stacked');
            document.getElementById('week-mode-time').classList.toggle('active', mode === 'time');
            renderWeekView();
        };

        window.showWeekHelp = function () {
            const helpText = weekMode === 'stacked'
                ? 'Stacked view — each day shows its projects as blocks. Taller blocks = more time spent. Click any block to see that day\'s entries (and delete them if needed).'
                : 'Time Axis view — each block is positioned at the actual time of day it happened, so you can see when in the day you worked on each project. Click any block to see entries.';
            alert('Week View\n\n' + helpText + '\n\nUse ← / → to move between weeks.');
        };

        function computeDayProjectDurations(dayKey_) {
            const dayLogs = logs
                .filter(l => typeof l.timestamp === 'number' && !isNaN(l.timestamp) && dateKey(l.timestamp) === dayKey_)
                .sort((a, b) => a.timestamp - b.timestamp);
            if (dayLogs.length === 0) return {};

            const byProject = {};
            const nowMs = Date.now();
            const nextDayStart = new Date(dayKey_ + 'T00:00:00');
            nextDayStart.setDate(nextDayStart.getDate() + 1);
            const nextDayStartMs = nextDayStart.getTime();

            for (let i = 0; i < dayLogs.length; i++) {
                const cur = dayLogs[i];
                const next = dayLogs[i + 1];
                const project = cur.project || DEFAULT_PROJECT;
                let endMs;
                if (next) {
                    endMs = next.timestamp;
                } else {
                    endMs = Math.min(nowMs, nextDayStartMs);
                }
                const durationMs = Math.max(0, endMs - cur.timestamp);
                if (cur._isWrapUp) continue;

                if (!byProject[project]) byProject[project] = { ms: 0, entries: 0, paused: isSpecialProject(project), timestamps: [] };
                byProject[project].ms += durationMs;
                byProject[project].entries += 1;
                byProject[project].timestamps.push(cur.timestamp);
            }
            return byProject;
        }

        function renderWeekView() {
            if (!weekStartDate) weekStartDate = getMondayOf(new Date());
            const monday = new Date(weekStartDate);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            const mLabel = monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const sLabel = sunday.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('week-label').textContent = mLabel + ' – ' + sLabel;

            const thisMonday = getMondayOf(new Date());
            document.getElementById('week-next-btn').disabled = monday.getTime() >= thisMonday.getTime();

            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                days.push(d);
            }

            const todayKey_ = todayKey();

            const dayData = days.map(d => {
                const dk = dateKey(d.getTime());
                const projects = computeDayProjectDurations(dk);
                const totalMs = Object.values(projects).reduce((s, p) => s + (p.paused ? 0 : p.ms), 0);
                const pausedMs = Object.values(projects).reduce((s, p) => s + (p.paused ? p.ms : 0), 0);
                return { date: d, key: dk, projects: projects, totalMs: totalMs, pausedMs: pausedMs };
            });

            const weekTotalMs = dayData.reduce((s, d) => s + d.totalMs, 0);
            const weekPausedMs = dayData.reduce((s, d) => s + d.pausedMs, 0);
            const allProjectsThisWeek = new Set();
            dayData.forEach(d => Object.keys(d.projects).forEach(p => allProjectsThisWeek.add(p)));

            const summaryEl = document.getElementById('week-summary');
            if (weekTotalMs === 0 && weekPausedMs === 0) {
                summaryEl.innerHTML = '';
            } else {
                summaryEl.innerHTML = `
                    <div class="week-summary-row">
                        <div class="week-summary-item"><strong>${formatDuration(weekTotalMs)}</strong><span>Focus time</span></div>
                        <div class="week-summary-item"><strong>${formatDuration(weekPausedMs)}</strong><span>Paused</span></div>
                        <div class="week-summary-item"><strong>${allProjectsThisWeek.size}</strong><span>Projects</span></div>
                    </div>
                `;
            }

            const gridEl = document.getElementById('week-grid-container');

            if (weekMode === 'stacked') {
                let html = '<div class="week-grid">';
                dayData.forEach(day => {
                    const isToday = day.key === todayKey_;
                    html += `<div class="week-col ${isToday ? 'today' : ''}">`;
                    html += `<div class="week-col-header">`;
                    html += `<div class="week-col-day">${day.date.toLocaleDateString('en-US', { weekday: 'short' })}</div>`;
                    html += `<div class="week-col-date">${day.date.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' })}</div>`;
                    if (day.totalMs > 0) {
                        html += `<div class="week-col-total">${formatDuration(day.totalMs)}</div>`;
                    } else {
                        html += `<div class="week-col-total empty">—</div>`;
                    }
                    html += `</div>`;

                    const projectEntries = Object.entries(day.projects).sort((a, b) => b[1].ms - a[1].ms);
                    if (projectEntries.length === 0) {
                        html += `<div style="flex:1; display:flex; align-items:center; justify-content:center; color:#cbd5e1; font-size:0.7rem;">—</div>`;
                    } else {
                        html += `<div class="week-blocks">`;
                        const totalForScale = projectEntries.reduce((s, [, v]) => s + v.ms, 0) || 1;
                        projectEntries.forEach(([name, v]) => {
                            const color = projectColor(name);
                            const share = v.ms / totalForScale;
                            const height = Math.max(24, Math.round(share * 140));
                            const safeName = escapeHtml(name);
                            const duration = formatDuration(v.ms);
                            html += `<div class="week-block" style="background:${color}; height:${height}px;" onclick="openBlockDetail(event, '${day.key}', '${escapeHtml(name).replace(/'/g, '&#39;')}')" title="${safeName} · ${duration} · ${v.entries} ${v.entries === 1 ? 'entry' : 'entries'}">`;
                            html += `<div class="week-block-label"><span class="week-block-name">${safeName}</span><span class="week-block-duration">${duration}</span></div>`;
                            html += `</div>`;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
                html += '</div>';
                gridEl.innerHTML = html;
            } else {
                const startHour = 6;
                const endHour = 24;
                const hourHeight = 40;

                let html = '<div class="week-grid time-axis">';

                html += '<div class="time-axis-col">';
                html += '<div style="height: 0;"></div>';
                for (let h = startHour; h <= endHour; h++) {
                    html += `<div class="time-axis-hour">${String(h).padStart(2, '0')}:00</div>`;
                }
                html += '</div>';

                dayData.forEach(day => {
                    const isToday = day.key === todayKey_;
                    html += `<div class="week-col time-scheduled ${isToday ? 'today' : ''}">`;
                    html += `<div class="week-col-header">`;
                    html += `<div class="week-col-day">${day.date.toLocaleDateString('en-US', { weekday: 'short' })}</div>`;
                    html += `<div class="week-col-date">${day.date.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' })}</div>`;
                    if (day.totalMs > 0) {
                        html += `<div class="week-col-total">${formatDuration(day.totalMs)}</div>`;
                    }
                    html += `</div>`;

                    for (let h = startHour; h < endHour; h++) {
                        html += `<div style="position:absolute; left:0; right:0; top:${(h - startHour) * hourHeight + 50}px; height:1px; background:#eef2f6;"></div>`;
                    }

                    Object.entries(day.projects).forEach(([name, v]) => {
                        if (!v.timestamps || v.timestamps.length === 0) return;
                        const earliest = Math.min(...v.timestamps);
                        const firstDate = new Date(earliest);

                        const startOffsetHours = (firstDate.getHours() + firstDate.getMinutes() / 60) - startHour;
                        const topPx = Math.max(0, startOffsetHours * hourHeight) + 50;
                        const heightPx = Math.max(22, (v.ms / (60 * 60 * 1000)) * hourHeight);

                        const color = projectColor(name);
                        const safeName = escapeHtml(name);
                        const duration = formatDuration(v.ms);

                        html += `<div class="week-block-absolute" style="top:${topPx}px; height:${heightPx}px; background:${color};" onclick="openBlockDetail(event, '${day.key}', '${escapeHtml(name).replace(/'/g, '&#39;')}')" title="${safeName} · ${duration}">`;
                        html += `<span class="week-block-name">${safeName} ${duration}</span>`;
                        html += `</div>`;
                    });

                    html += `</div>`;
                });
                html += '</div>';
                gridEl.innerHTML = html;
            }

            const allProjects = new Set();
            dayData.forEach(d => Object.keys(d.projects).forEach(p => allProjects.add(p)));
            if (allProjects.size > 0) {
                let legendHtml = '';
                Array.from(allProjects).sort().forEach(name => {
                    const color = projectColor(name);
                    legendHtml += `<div class="week-legend-item"><span class="week-legend-swatch" style="background:${color};"></span>${escapeHtml(name)}</div>`;
                });
                document.getElementById('week-legend').innerHTML = legendHtml;
            } else {
                document.getElementById('week-legend').innerHTML = '<div class="week-empty-msg" style="padding: 0; width: 100%;">No entries this week yet.</div>';
            }
        }

        // ============================================================
        // BLOCK DETAIL POPOVER
        // ============================================================
        let currentPopoverContext = null;

        window.openBlockDetail = function (e, dayKey_, projectName) {
            e.stopPropagation();
            const existing = document.getElementById('block-detail-popover');
            if (existing) existing.remove();

            currentPopoverContext = { dayKey: dayKey_, projectName: projectName };

            const dayLogs = logs.filter(l => {
                if (typeof l.timestamp !== 'number') return false;
                if (dateKey(l.timestamp) !== dayKey_) return false;
                if ((l.project || DEFAULT_PROJECT) !== projectName) return false;
                return true;
            });

            if (dayLogs.length === 0) {
                currentPopoverContext = null;
                return;
            }

            const pop = document.createElement('div');
            pop.id = 'block-detail-popover';
            pop.className = 'block-detail-popover';

            const sorted = dayLogs.slice().sort((a, b) => b.timestamp - a.timestamp);

            const dateObj = new Date(dayKey_ + 'T12:00:00');
            let html = `<h4>📁 ${escapeHtml(projectName)} · ${relativeDateLabel(dateObj.getTime())}</h4>`;

            sorted.forEach(log => {
                const idx = logs.indexOf(log);
                html += `<div class="block-detail-entry">`;
                html += `<div class="block-detail-entry-body">`;
                html += `<div class="block-detail-time">${log.time}</div>`;
                html += `<div class="block-detail-text">${escapeHtml(log.text)}</div>`;
                html += `</div>`;
                html += `<button class="block-detail-delete-btn" title="Delete this entry" onclick="deleteEntryFromPopover(event, ${idx})">🗑️</button>`;
                html += `</div>`;
            });

            if (sorted.length > 1) {
                html += `<div class="block-detail-actions">`;
                html += `<button class="block-detail-delete-all" onclick="deleteAllInBlock(event)">🗑️ Delete all ${sorted.length} entries</button>`;
                html += `</div>`;
            }

            pop.innerHTML = html;

            let left = e.clientX + 10;
            let top = e.clientY + 10;
            if (left + 340 > window.innerWidth) left = window.innerWidth - 350;
            if (top + 400 > window.innerHeight) top = Math.max(10, window.innerHeight - 420);
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';

            document.body.appendChild(pop);
        };

        window.deleteEntryFromPopover = function (event, logIndex) {
            event.stopPropagation();
            if (logIndex < 0 || logIndex >= logs.length) return;
            const log = logs[logIndex];
            const preview = (log.text || '').split('\n')[0].slice(0, 50);
            if (!confirm('Delete this entry?\n\n"' + preview + (preview.length < (log.text || '').length ? '…' : '') + '"\n\nThis cannot be undone.')) return;

            logs.splice(logIndex, 1);
            saveLocal();
            renderLogs();
            populateProjectSuggestions();
            if (cloudUser) cloudSaveNow();

            refreshPopoverAfterDelete();
        };

        window.deleteAllInBlock = function (event) {
            event.stopPropagation();
            if (!currentPopoverContext) return;
            const { dayKey, projectName } = currentPopoverContext;

            const matching = logs.filter(l =>
                typeof l.timestamp === 'number' &&
                dateKey(l.timestamp) === dayKey &&
                (l.project || DEFAULT_PROJECT) === projectName
            );
            if (matching.length === 0) return;

            const dateObj = new Date(dayKey + 'T12:00:00');
            const dateLabel = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            if (!confirm('Delete all ' + matching.length + ' entries for "' + projectName + '" on ' + dateLabel + '?\n\nThis cannot be undone.')) return;

            for (let i = logs.length - 1; i >= 0; i--) {
                const l = logs[i];
                if (typeof l.timestamp !== 'number') continue;
                if (dateKey(l.timestamp) !== dayKey) continue;
                if ((l.project || DEFAULT_PROJECT) !== projectName) continue;
                logs.splice(i, 1);
            }
            saveLocal();
            renderLogs();
            populateProjectSuggestions();
            if (cloudUser) cloudSaveNow();

            const pop = document.getElementById('block-detail-popover');
            if (pop) pop.remove();
            currentPopoverContext = null;
            if (document.getElementById('week-modal').classList.contains('show')) {
                renderWeekView();
            }
        };

        function refreshPopoverAfterDelete() {
            const pop = document.getElementById('block-detail-popover');
            if (!pop) return;
            const ctx = currentPopoverContext;
            if (!ctx) { pop.remove(); return; }

            const stillHere = logs.filter(l =>
                typeof l.timestamp === 'number' &&
                dateKey(l.timestamp) === ctx.dayKey &&
                (l.project || DEFAULT_PROJECT) === ctx.projectName
            );

            if (document.getElementById('week-modal').classList.contains('show')) {
                renderWeekView();
            }

            if (stillHere.length === 0) {
                pop.remove();
                currentPopoverContext = null;
                return;
            }

            const sorted = stillHere.slice().sort((a, b) => b.timestamp - a.timestamp);
            const dateObj = new Date(ctx.dayKey + 'T12:00:00');
            let html = `<h4>📁 ${escapeHtml(ctx.projectName)} · ${relativeDateLabel(dateObj.getTime())}</h4>`;

            sorted.forEach(log => {
                const idx = logs.indexOf(log);
                html += `<div class="block-detail-entry">`;
                html += `<div class="block-detail-entry-body">`;
                html += `<div class="block-detail-time">${log.time}</div>`;
                html += `<div class="block-detail-text">${escapeHtml(log.text)}</div>`;
                html += `</div>`;
                html += `<button class="block-detail-delete-btn" title="Delete this entry" onclick="deleteEntryFromPopover(event, ${idx})">🗑️</button>`;
                html += `</div>`;
            });

            if (sorted.length > 1) {
                html += `<div class="block-detail-actions">`;
                html += `<button class="block-detail-delete-all" onclick="deleteAllInBlock(event)">🗑️ Delete all ${sorted.length} entries</button>`;
                html += `</div>`;
            }

            pop.innerHTML = html;
        }

        // ============================================================
        // REMINDERS
        // ============================================================
        function toggleReminderMenu() {
            document.getElementById('reminder-menu').classList.toggle('show');
            document.getElementById('cloud-menu').classList.remove('show');
        }
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('reminder-menu');
            const btn = document.getElementById('remind-btn');
            if (!btn.contains(event.target) && !menu.contains(event.target)) menu.classList.remove('show');
        });
        function setReminder(minutes) {
            const btn = document.getElementById('remind-btn');
            document.getElementById('reminder-menu').classList.remove('show');
            if (!("Notification" in window)) { alert("This browser does not support desktop notifications."); return; }
            if (Notification.permission !== "granted") {
                Notification.requestPermission().then(function (permission) {
                    if (permission === "granted") startReminderInterval(minutes, btn);
                });
            } else { startReminderInterval(minutes, btn); }
        }
        function startReminderInterval(minutes, btn) {
            if (reminderInterval) clearInterval(reminderInterval);
            const ms = minutes * 60 * 1000;
            btn.textContent = `🔔 Active (${minutes}m)`;
            btn.classList.add('reminder-active');
            new Notification("The Pause", { body: `Reminders set for every ${minutes} minutes.` });
            reminderInterval = setInterval(() => {
                new Notification("Time to pause?", { body: "Pause. What did you just do? What's next?" });
            }, ms);
        }
        function stopReminders() {
            if (reminderInterval) clearInterval(reminderInterval);
            const btn = document.getElementById('remind-btn');
            btn.textContent = "🔔 Remind";
            btn.classList.remove('reminder-active');
            document.getElementById('reminder-menu').classList.remove('show');
        }

        // ============================================================
        // EXPORT & ANALOG
        // ============================================================
        function exportMarkdown() {
            if (logs.length === 0) return alert("No logs to export.");
            let mdContent = "# The Pause — Daily Log\n\n";
            let currentProject = null;
            [...logs].reverse().forEach(log => {
                const project = log.project || DEFAULT_PROJECT;
                if (project !== currentProject) {
                    mdContent += `## 📁 ${project}\n\n`;
                    currentProject = project;
                }
                mdContent += `### ${log.time}\n${log.text}\n\n---\n`;
            });
            const blob = new Blob([mdContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `the-pause-log-${new Date().toISOString().slice(0,10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function toggleAnalog() {
            const body = document.body;
            const btn = document.getElementById('analog-toggle');
            if (body.style.backgroundColor === 'rgb(232, 228, 219)') {
                body.style.backgroundColor = 'var(--bg-color)';
                btn.classList.remove('active');
                btn.textContent = "📄 Analog";
            } else {
                body.style.backgroundColor = '#e8e4db';
                btn.classList.add('active');
                btn.textContent = "💻 Digital";
            }
        }

        // ============================================================
        // LOCAL BACKUP
        // ============================================================
        function currentLocalKey() {
            return cloudUser ? localKeyForUser(cloudUser.uid) : LOCAL_KEY_ANON;
        }
        function saveLocal() {
            try {
                localStorage.setItem(currentLocalKey(), JSON.stringify(logs));
            } catch (e) { console.error('Local save failed:', e); }
        }
        function loadLocal() {
            try {
                const raw = localStorage.getItem(currentLocalKey());
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        }

        // ============================================================
        // CLOUD SYNC
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCn-INjtwiFoS66VXAADfVLLAqmjJOyksc",
            authDomain: "qtodo-syn.firebaseapp.com",
            projectId: "qtodo-syn",
            messagingSenderId: "663058774385",
            appId: "1:663058774385:web:a2972f2eb032c8cc4d5ed0"
        };

        let cloudApp = null;

        function pauseDocRef() {
            return cloudDb.collection('users').doc(cloudUser.uid)
                .collection('pauseData').doc('logs');
        }

        function setCloudStatus(text) {
            const el = document.getElementById('cloudStatusLabel');
            if (el) el.textContent = text;
        }
        function flashCloudStatus(text, ms) {
            setCloudStatus(text);
            setTimeout(function () {
                if (document.getElementById('cloudStatusLabel').textContent === text) {
                    setCloudStatus('');
                }
            }, ms || 4000);
        }

        function initCloud() {
            try {
                cloudApp = firebase.initializeApp(firebaseConfig, 'thepause');
                cloudAuth = cloudApp.auth();
                cloudDb = cloudApp.firestore();
            } catch (err) {
                console.error('Firebase init failed:', err);
                setCloudStatus('Cloud unavailable');
                return;
            }

            cloudAuth.onAuthStateChanged(function(user) {
                cloudUser = user;
                updateAuthUI();
                if (user) {
                    loadFromCloud({ silent: true });
                } else {
                    logs = loadLocal();
                    renderLogs();
                    populateProjectSuggestions();
                }
            });

            cloudAuth.getRedirectResult().catch(function(err) {
                console.error('Redirect sign-in failed:', err);
            });
        }

        function updateAuthUI() {
            const signInBtn = document.getElementById('cloudSignInBtn');
            const signedInArea = document.getElementById('cloudSignedInArea');
            const userLabel = document.getElementById('cloudUserLabel');
            if (cloudUser) {
                signInBtn.style.display = 'none';
                signedInArea.style.display = 'inline-flex';
                userLabel.textContent = cloudUser.displayName || cloudUser.email || 'Signed in';
            } else {
                signInBtn.style.display = '';
                signedInArea.style.display = 'none';
            }
        }

        window.cloudSignIn = function () {
            const provider = new firebase.auth.GoogleAuthProvider();
            setCloudStatus('Signing in…');
            cloudAuth.signInWithPopup(provider).catch(function (err) {
                console.error('Popup sign-in failed, trying redirect:', err);
                setCloudStatus('Retrying…');
                cloudAuth.signInWithRedirect(provider).catch(function (err2) {
                    console.error('Redirect sign-in also failed:', err2);
                    setCloudStatus('Sign-in failed');
                });
            });
        };

        window.cloudSignOut = function () {
            document.getElementById('cloud-menu').classList.remove('show');
            cloudAuth.signOut().then(function() {
                setCloudStatus('');
                logs = loadLocal();
                renderLogs();
                populateProjectSuggestions();
            });
        };

        window.toggleCloudMenu = function () {
            document.getElementById('cloud-menu').classList.toggle('show');
            document.getElementById('reminder-menu').classList.remove('show');
        };
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('cloud-menu');
            const btn = document.getElementById('cloudMenuBtn');
            if (!menu || !btn) return;
            if (!btn.contains(event.target) && !menu.contains(event.target)) menu.classList.remove('show');
        });

        function cloudSaveNow() {
            if (!cloudUser) return Promise.resolve();
            return pauseDocRef().set({
                logsJson: JSON.stringify(logs),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(function () {
                flashCloudStatus('☁ Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
            }).catch(function (err) {
                console.error('Cloud save failed:', err);
                flashCloudStatus('☁ Save failed');
            });
        }

        window.cloudSave = function () {
            if (!cloudUser) return;
            document.getElementById('cloud-menu').classList.remove('show');
            setCloudStatus('Saving…');
            cloudSaveNow();
        };

        function loadFromCloud(opts) {
            opts = opts || {};
            if (!cloudUser) return;
            if (!opts.silent) setCloudStatus('Loading…');
            else setCloudStatus('Syncing…');

            pauseDocRef().get().then(function (doc) {
                if (doc.exists && doc.data().logsJson) {
                    try {
                        const cloudLogs = JSON.parse(doc.data().logsJson);
                        if (Array.isArray(cloudLogs)) {
                            logs = cloudLogs;
                            saveLocal();
                            renderLogs();
                            populateProjectSuggestions();
                            flashCloudStatus('☁ Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
                            return;
                        }
                    } catch (e) { console.error('Bad cloud data:', e); }
                }
                setCloudStatus('Uploading local data…');
                pauseDocRef().set({
                    logsJson: JSON.stringify(logs),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).then(function () {
                    flashCloudStatus('☁ Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
                });
            }).catch(function (err) {
                console.error('Cloud load failed:', err);
                setCloudStatus('Load failed');
            });
        }

        window.cloudLoad = function () {
            if (!cloudUser) return;
            document.getElementById('cloud-menu').classList.remove('show');
            if (!confirm('Reload from cloud? This will replace what\'s on screen with the cloud version.')) return;
            loadFromCloud({ silent: false });
        };

        window.syncNow = function () {
            if (!cloudUser) return;
            document.getElementById('cloud-menu').classList.remove('show');
            setCloudStatus('Syncing…');
            pauseDocRef().get().then(function (doc) {
                if (doc.exists && doc.data().logsJson) {
                    try {
                        const cloudLogs = JSON.parse(doc.data().logsJson);
                        if (Array.isArray(cloudLogs) && cloudLogs.length >= logs.length) {
                            logs = cloudLogs;
                            saveLocal();
                            renderLogs();
                            populateProjectSuggestions();
                        }
                    } catch (e) { /* fall through */ }
                }
                return pauseDocRef().set({
                    logsJson: JSON.stringify(logs),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            }).then(function () {
                flashCloudStatus('☁ Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
            }).catch(function (err) {
                console.error('Sync failed:', err);
                setCloudStatus('Sync failed');
            });
        };

        function scheduleCloudAutoSave() {
            if (!cloudUser) return;
            clearTimeout(cloudSaveTimer);
            cloudSaveTimer = setTimeout(function () {
                pauseDocRef().set({
                    logsJson: JSON.stringify(logs),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(function (err) {
                    console.error('Auto-save failed:', err);
                });
            }, 3000);
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const pop = document.getElementById('block-detail-popover');
                if (pop) { pop.remove(); currentPopoverContext = null; return; }
                if (document.getElementById('week-modal').classList.contains('show')) { closeWeekView(); return; }
                if (document.getElementById('summary-modal').classList.contains('show')) { closeSummary(); return; }
            }
            if (document.getElementById('week-modal').classList.contains('show')) {
                if (e.key === 'ArrowLeft') weekNavigate(-1);
                if (e.key === 'ArrowRight') weekNavigate(1);
            }
        });

        // ============================================================
        // BOOT
        // ============================================================
        window.addEventListener('DOMContentLoaded', function () {
            logs = loadLocal();
            renderLogs();
            populateProjectSuggestions();
            loadPreset();
            maybeShowFirstRunTip();
            weekStartDate = getMondayOf(new Date());
            initCloud();
        });

        window.addEventListener('beforeunload', function () {
            saveLocal();
        });
    </script>
</body>
</html>
