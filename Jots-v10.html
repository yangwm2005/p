<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cloud Jots</title>
    <!-- Firebase SDK (cloud sync) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .app-container {
            background: white;
            max-width: 700px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
            padding: 24px 20px 32px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        h1 span {
            font-size: 2rem;
        }
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            border-radius: 100px;
            padding: 8px 16px 8px 12px;
            margin-bottom: 24px;
            min-height: 56px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1e293b;
            flex-shrink: 0;
            object-fit: cover;
        }
        .user-name {
            font-weight: 500;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 10px 18px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, border 0.15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            white-space: nowrap;
        }
        .btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        .btn-google {
            background: white;
            border: 1px solid #dadce0;
            color: #3c4043;
            padding: 10px 20px;
            font-weight: 500;
            border-radius: 40px;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-google:hover {
            background: #f8f9fa;
            border-color: #c6c6c6;
        }
        .btn-google img {
            width: 18px;
            height: 18px;
        }
        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
            align-items: flex-start;
        }
        .add-section textarea {
            flex: 1;
            padding: 16px 18px;
            border-radius: 24px;
            border: 1.5px solid #e2e8f0;
            font-size: 1rem;
            font-family: inherit;
            background: #ffffff;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
            resize: vertical;
            min-height: 56px;
            max-height: 500px;
            line-height: 1.4;
            overflow-y: auto;
        }
        .add-section textarea:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.1);
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
            max-width: 120px;
            justify-content: flex-end;
        }
        .add-section button {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            padding: 0;
            font-size: 1.8rem;
            line-height: 1;
            background: #1e293b;
            color: white;
            border: none;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s, background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-section button:hover {
            background: #0f172a;
        }
        .add-section button:active {
            transform: scale(0.94);
        }
        .add-section button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .add-section button.newline-btn,
        .add-section button.bullet-btn,
        .add-section button.resize-btn {
            background: #ede7e1;
            color: #1e293b;
            font-size: 1.4rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        }
        .add-section button.newline-btn:hover,
        .add-section button.bullet-btn:hover,
        .add-section button.resize-btn:hover {
            background: #d9d0c6;
        }
        .add-section button.bullet-btn.active {
            background: #1e293b;
            color: #f5efe9;
            box-shadow: 0 6px 14px rgba(30, 41, 59, 0.25);
        }
        .add-section button.bullet-btn.active:hover {
            background: #0f172a;
        }
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 8px;
        }
        .item {
            background: #ffffff;
            border: 1px solid #e9eef3;
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: background 0.15s, border 0.15s;
            animation: fadeIn 0.15s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .item:hover {
            border-color: #cbd5e1;
            background: #fdfdfe;
        }
        .item.editing {
            border-color: #94a3b8;
            background: #f8fafc;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.12);
        }
        .item-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.1s, border 0.1s;
            font-size: 14px;
            color: white;
            user-select: none;
            margin-top: 2px;
        }
        .item-check.done {
            background: #1e293b;
            border-color: #1e293b;
        }
        .item-check.done::after {
            content: "✓";
            color: white;
            font-weight: bold;
        }
        .item-body {
            flex: 1;
            min-width: 0;
        }
        .item-text {
            font-size: 1rem;
            color: #1e293b;
            word-break: break-word;
            line-height: 1.4;
            cursor: pointer;
            white-space: pre-wrap;
        }
        .item-text.done {
            text-decoration: line-through;
            color: #94a3b8;
        }
        .item-meta {
            margin-top: 6px;
            font-size: 0.72rem;
            color: #94a3b8;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .item-meta .chip {
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 30px;
            cursor: help;
            user-select: none;
        }
        .item-meta .chip.edited {
            background: #ede7e1;
            color: #6d645b;
        }
        .item-actions {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
            align-items: center;
        }
        .item-actions button {
            background: none;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #94a3b8;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            line-height: 1;
        }
        .item-actions button:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .item-actions button.del-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .edit-textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1.5px solid #cbd5e1;
            font-size: 1rem;
            font-family: inherit;
            line-height: 1.4;
            background: white;
            outline: none;
            white-space: pre-wrap;
            resize: vertical;
            overflow: auto;
            min-height: 70px;
            max-height: 500px;
            display: block;
            box-sizing: border-box;
        }
        .edit-textarea:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.15);
        }
        .edit-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .edit-buttons .btn {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .edit-buttons .save-btn {
            background: #1e293b;
            color: white;
            border: none;
        }
        .edit-buttons .save-btn:hover {
            background: #0f172a;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 20px;
            font-size: 0.95rem;
            background: #f8fafc;
            border-radius: 20px;
        }
        .footer-note {
            margin-top: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .copyright {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e9eef3;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 0.2px;
        }
        .hint {
            font-size: 0.7rem;
            color: #a99d92;
            text-align: center;
            margin: -16px 0 20px;
            line-height: 1.5;
        }
        .hint kbd {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 1px 6px;
            font-family: inherit;
            font-size: 0.7rem;
            color: #1e293b;
        }
        .hidden {
            display: none !important;
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 560px) {
            .app-container { padding: 18px 14px 24px; border-radius: 24px; }
            h1 { font-size: 1.6rem; }
            .user-name { max-width: 120px; }
            .add-section { flex-wrap: wrap; }
            .add-section textarea { padding: 14px 16px; min-height: 50px; }
            .action-buttons { max-width: none; width: 100%; justify-content: flex-end; }
            .add-section button { width: 50px; height: 50px; font-size: 1.5rem; }
            .add-section button.newline-btn,
            .add-section button.bullet-btn,
            .add-section button.resize-btn { font-size: 1.2rem; }
            .btn { padding: 8px 14px; font-size: 0.85rem; }
            .item { padding: 12px 14px; }
            .item-actions button { width: 26px; height: 26px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Header -->
        <h1>
            <span>📋</span> Cloud Jots
        </h1>

        <!-- User bar / Google Sign-in area -->
        <div id="userBar" class="user-bar">
            <div id="signInContainer" style="width:100%; display: flex; justify-content: center;">
                <button id="googleSignInBtn" class="btn btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Sign in with Google
                </button>
            </div>
            <div id="userProfile" class="user-info hidden" style="width:100%; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 10px; overflow:hidden;">
                    <img id="userAvatar" class="user-avatar" src="" alt="avatar">
                    <span id="userName" class="user-name"></span>
                </div>
                <button id="signOutBtn" class="btn">Sign out</button>
            </div>
        </div>

        <!-- Add new item -->
        <div class="add-section" id="addSection">
            <textarea id="itemInput" placeholder="Write a to-do or idea…" autocomplete="off" maxlength="5000" rows="1"></textarea>
            <div class="action-buttons">
                <button id="bulletBtn" class="bullet-btn" aria-label="Toggle bullet mode" title="Bullet mode: auto-add • at start of each line">•</button>
                <button id="newlineBtn" class="newline-btn" aria-label="Insert new line" title="Insert a new line (Shift+Enter)">↵</button>
                <button id="resizeBtn" class="resize-btn" aria-label="Cycle input size" title="Cycle input height (small → medium → large)">▤</button>
                <button id="addBtn" aria-label="Add item" title="Add item (Enter)">+</button>
            </div>
        </div>
        <div class="hint" id="hintLine">
            <kbd>Enter</kbd> save · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line · <kbd>Esc</kbd> clear · click ✎ or double-click text to edit · drag edit box corner to resize
        </div>

        <!-- Items list -->
        <div id="itemsList" class="items-list"></div>

        <!-- Sync status / footer -->
        <div class="footer-note">
            <span id="syncStatus">☁️ Not signed in</span>
        </div>

        <!-- Copyright footnote -->
        <div class="copyright">
            Copyright 2026 Dr. Wen-Ming Yang. All Rights Reserved
        </div>
    </div>

    <script>
        // ===================================================================
        // 1. Firebase config — SAME project as your Pomodoro app
        // ===================================================================
        const FB_CONFIG = {
            apiKey: "AIzaSyCn-INjtwiFoS66VXAADfVLLAqmjJOyksc",
            authDomain: "qtodo-syn.firebaseapp.com",
            projectId: "qtodo-syn",
            storageBucket: "qtodo-syn.firebasestorage.app",
            messagingSenderId: "663058774385",
            appId: "1:663058774385:web:a2972f2eb032c8cc4d5ed0"
        };

        // ===================================================================
        // 2. Initialize Firebase with a NAMED app
        //    Wrap in try/catch so a double-init from a stale tab doesn't
        //    crash the page and leave auth half-broken.
        // ===================================================================
        let cloudApp, cloudAuth, cloudDb;
        let cloudReady = false;

        try {
            if (typeof firebase !== 'undefined') {
                try { cloudApp = firebase.app('cloud-notes'); }
                catch (e) { cloudApp = firebase.initializeApp(FB_CONFIG, 'cloud-notes'); }
                cloudAuth = firebase.auth(cloudApp);
                cloudDb = firebase.firestore(cloudApp);
                cloudReady = true;
            }
        } catch (e) {
            console.warn('Cloud sync unavailable:', e);
        }

        // Explicitly keep the auth session in localStorage. This is the
        // default, but being explicit avoids surprises if some extension
        // or prior script on the page changed the persistence mode.
        if (cloudReady) {
            try {
                cloudAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                    .catch((e) => console.warn('setPersistence failed:', e));
            } catch (e) { /* ignore */ }
        }

        const googleProvider = new firebase.auth.GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        // ===================================================================
        // 3. Global state & DOM references
        // ===================================================================
        let cloudUser = null;
        let itemsUnsubscribe = null;
        let itemsArray = [];

        let editingItemId = null;

        // Debounce guard for onAuthStateChanged: some popup flows briefly
        // deliver `null` before the real user, which would make the UI
        // flash "signed out" and then "signed in" again. We hold off
        // acting on a null for a short grace period; if a real user
        // arrives in that window, nothing is torn down.
        let nullUserTimer = null;
        const NULL_USER_GRACE_MS = 1500;

        const PREF_KEY = 'cloudNotesPrefs';
        let bulletMode = false;
        let manuallyResized = false;
        let resizeCycleIndex = 0;
        const RESIZE_CYCLE = [56, 120, 220, 340];

        function loadPrefs() {
            try {
                const raw = localStorage.getItem(PREF_KEY);
                if (!raw) return;
                const p = JSON.parse(raw);
                if (typeof p.bulletMode === 'boolean') bulletMode = p.bulletMode;
            } catch (e) { /* ignore */ }
        }
        function savePrefs() {
            try {
                localStorage.setItem(PREF_KEY, JSON.stringify({ bulletMode }));
            } catch (e) { /* ignore */ }
        }

        const signInContainer = document.getElementById('signInContainer');
        const userProfile = document.getElementById('userProfile');
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const newlineBtn = document.getElementById('newlineBtn');
        const bulletBtn = document.getElementById('bulletBtn');
        const resizeBtn = document.getElementById('resizeBtn');
        const hintLine = document.getElementById('hintLine');
        const itemsList = document.getElementById('itemsList');
        const syncStatus = document.getElementById('syncStatus');

        // ===================================================================
        // 4. Auto-resize the main input (until the user drags the corner)
        // ===================================================================
        function autoResizeInput() {
            if (manuallyResized) return;
            itemInput.style.height = 'auto';
            const natural = itemInput.scrollHeight;
            itemInput.style.height = Math.min(natural, 500) + 'px';
        }

        itemInput.addEventListener('mousedown', (e) => {
            const rect = itemInput.getBoundingClientRect();
            const nearCornerX = (rect.right - e.clientX) < 20;
            const nearCornerY = (rect.bottom - e.clientY) < 20;
            if (nearCornerX && nearCornerY) manuallyResized = true;
        });

        // ===================================================================
        // 5. Bullet mode
        // ===================================================================
        function setBulletMode(enabled, skipSave) {
            bulletMode = enabled;
            bulletBtn.classList.toggle('active', enabled);
            bulletBtn.title = enabled
                ? 'Bullet mode ON — press Enter to start the next bullet; Enter on an empty bullet to save'
                : 'Bullet mode: auto-add • at start of each line';
            if (enabled && itemInput.value === '') {
                itemInput.value = '• ';
                itemInput.selectionStart = itemInput.selectionEnd = 2;
                autoResizeInput();
            }
            if (!enabled && /^•\s*$/.test(itemInput.value)) {
                itemInput.value = '';
                autoResizeInput();
            }
            if (!skipSave) savePrefs();
        }

        bulletBtn.addEventListener('click', (e) => {
            e.preventDefault();
            setBulletMode(!bulletMode);
            itemInput.focus();
        });

        // ===================================================================
        // 6. Resize cycle button
        // ===================================================================
        function applyResizeCycle() {
            const h = RESIZE_CYCLE[resizeCycleIndex % RESIZE_CYCLE.length];
            itemInput.style.height = h + 'px';
            resizeCycleIndex++;
            manuallyResized = false;
            itemInput.focus();
        }
        resizeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            applyResizeCycle();
        });

        // ===================================================================
        // 7. Authentication flow
        //    We use popup only. On error, only show an alert for real
        //    failures (never for the "user closed the popup" case).
        // ===================================================================
        googleSignInBtn.addEventListener('click', async () => {
            if (!cloudReady) {
                alert("Cloud sync is unavailable right now (couldn't load Firebase). Check your connection and try again.");
                return;
            }
            try {
                await cloudAuth.signInWithPopup(googleProvider);
                // Success. onAuthStateChanged below will handle the UI.
            } catch (e) {
                const code = e && e.code ? e.code : '';
                const silent = [
                    'auth/popup-closed-by-user',
                    'auth/cancelled-popup-request',
                    'auth/popup-blocked',
                ];
                if (!silent.includes(code)) {
                    alert('Sign-in failed: ' + (e.message || code));
                }
            }
        });

        signOutBtn.addEventListener('click', () => {
            if (!cloudUser) return;
            stopCloudListener();
            if (nullUserTimer) { clearTimeout(nullUserTimer); nullUserTimer = null; }
            cloudAuth.signOut().catch((e) => console.error('Sign-out error:', e));
        });

        // ===================================================================
        // 8. onAuthStateChanged with a null-user debounce.
        //
        //    When Firebase fires a transient `null` during a popup flow,
        //    we hold the UI as-is for ~1.5s. If a real user arrives in that
        //    window, we cancel the teardown. This is what stops the app
        //    from bouncing back to the sign-in page right after sign-in.
        // ===================================================================
        if (cloudReady) {
            cloudAuth.onAuthStateChanged((user) => {
                if (user) {
                    // Real user — cancel any pending null teardown.
                    if (nullUserTimer) { clearTimeout(nullUserTimer); nullUserTimer = null; }

                    const wasSignedOut = !cloudUser;
                    cloudUser = user;

                    // Update UI
                    signInContainer.classList.add('hidden');
                    userProfile.classList.remove('hidden');
                    userAvatar.src = user.photoURL || 'https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/default-avatar.png';
                    userName.textContent = user.displayName || user.email || 'User';
                    if (wasSignedOut) syncStatus.textContent = '☁️ Loading...';

                    // Start (or restart) the Firestore listener.
                    subscribeToItems();
                } else {
                    // Transient null during a popup? Wait a moment before
                    // actually tearing the UI down.
                    if (nullUserTimer) clearTimeout(nullUserTimer);
                    nullUserTimer = setTimeout(() => {
                        nullUserTimer = null;
                        cloudUser = null;
                        signInContainer.classList.remove('hidden');
                        userProfile.classList.add('hidden');
                        syncStatus.textContent = '☁️ Not signed in';
                        stopCloudListener();
                        itemsArray = [];
                        editingItemId = null;
                        renderItems();
                    }, NULL_USER_GRACE_MS);
                }
            });
        }

        // ===================================================================
        // 9. Firestore realtime listener
        //    Errors here are LOGGED but never sign the user out. A
        //    permission error (e.g. while Firestore rules are being set
        //    up) shouldn't kill the auth session.
        // ===================================================================
        function itemsCollectionRef() {
            if (!cloudUser || !cloudDb) return null;
            return cloudDb.collection('users').doc(cloudUser.uid)
                          .collection('cloud_notes').doc('data')
                          .collection('items');
        }

        function subscribeToItems() {
            const ref = itemsCollectionRef();
            if (!ref) return;
            if (itemsUnsubscribe) itemsUnsubscribe();

            itemsUnsubscribe = ref.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                const newItems = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    newItems.push({
                        id: doc.id,
                        text: data.text || '',
                        done: data.done || false,
                        createdAt: data.createdAt || 0,
                        updatedAt: data.updatedAt || 0,
                    });
                });
                itemsArray = newItems;
                renderItems();
                setCloudStatus(snapshot.metadata.hasPendingWrites ? 'pending' : 'synced');
            }, (error) => {
                // NEVER sign out here. Just show the error status and
                // keep the session alive so a refresh or rule change
                // can recover it.
                console.error('Firestore listener error:', error);
                setCloudStatus('error');
            });
        }

        function stopCloudListener() {
            if (itemsUnsubscribe) { itemsUnsubscribe(); itemsUnsubscribe = null; }
        }

        function setCloudStatus(state) {
            if (!syncStatus) return;
            if (!cloudUser) { syncStatus.textContent = '☁️ Not signed in'; return; }
            if (state === 'pending') syncStatus.textContent = '🟡 Saving to cloud…';
            else if (state === 'synced') {
                const n = itemsArray.length;
                syncStatus.textContent = `🟢 Synced · ${n} item${n !== 1 ? 's' : ''}`;
            }
            else if (state === 'error') syncStatus.textContent = '🔴 Cloud error — retrying';
        }

        // ===================================================================
        // 10. Date formatting helpers
        // ===================================================================
        function pad(n) { return String(n).padStart(2, '0'); }

        function formatCreatedLabel(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const sameDay = (a, b) =>
                a.getFullYear() === b.getFullYear() &&
                a.getMonth() === b.getMonth() &&
                a.getDate() === b.getDate();
            const yest = new Date(now); yest.setDate(now.getDate() - 1);
            const tom  = new Date(now); tom.setDate(now.getDate() + 1);

            if (sameDay(d, now)) return 'Today';
            if (sameDay(d, yest)) return 'Yesterday';
            if (sameDay(d, tom))  return 'Tomorrow';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatTimeLabel(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        function formatFullTooltip(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
                   `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        // ===================================================================
        // 11. Render items (with edit mode)
        // ===================================================================
        function renderItems() {
            if (!itemsArray.length) {
                itemsList.innerHTML = `<div class="empty-state">✨ No items yet. Add a to‑do or idea above.</div>`;
                return;
            }

            let html = '';
            itemsArray.forEach((item) => {
                const doneClass = item.done ? 'done' : '';
                const isEditing = editingItemId === item.id;
                const createdLabel = formatCreatedLabel(item.createdAt);
                const timeLabel = formatTimeLabel(item.createdAt);
                const fullTooltip = formatFullTooltip(item.createdAt);

                const wasEdited = item.updatedAt && item.createdAt &&
                                  (item.updatedAt - item.createdAt) > 1000;

                if (isEditing) {
                    html += `
                        <div class="item editing" data-id="${item.id}">
                            <div class="item-check ${doneClass}" data-id="${item.id}" role="button" aria-label="toggle done"></div>
                            <div class="item-body">
                                <textarea class="edit-textarea" data-id="${item.id}" rows="2">${escapeHtml(item.text)}</textarea>
                                <div class="edit-buttons">
                                    <button class="btn save-btn" data-id="${item.id}" data-action="save">💾 Save</button>
                                    <button class="btn" data-id="${item.id}" data-action="cancel">Cancel</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="item" data-id="${item.id}">
                            <div class="item-check ${doneClass}" data-id="${item.id}" role="button" aria-label="toggle done"></div>
                            <div class="item-body">
                                <div class="item-text ${doneClass}" data-id="${item.id}" title="Double-click to edit">${escapeHtml(item.text)}</div>
                                <div class="item-meta">
                                    <span class="chip" title="${escapeHtml(fullTooltip)}">🕒 ${escapeHtml(createdLabel)} · ${escapeHtml(timeLabel)}</span>
                                    ${wasEdited ? `<span class="chip edited" title="Last edited: ${escapeHtml(formatFullTooltip(item.updatedAt))}">✎ edited</span>` : ''}
                                </div>
                            </div>
                            <div class="item-actions">
                                <button class="edit-btn" data-id="${item.id}" aria-label="edit" title="Edit (or double-click text)">✎</button>
                                <button class="del-btn" data-id="${item.id}" aria-label="delete" title="Delete">✕</button>
                            </div>
                        </div>
                    `;
                }
            });
            itemsList.innerHTML = html;

            if (editingItemId) {
                const ta = itemsList.querySelector(`.edit-textarea[data-id="${editingItemId}"]`);
                if (ta) {
                    ta.style.height = 'auto';
                    const natural = ta.scrollHeight;
                    ta.style.height = Math.min(Math.max(natural, 70), 500) + 'px';

                    ta.focus();
                    ta.selectionStart = ta.selectionEnd = ta.value.length;
                }
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ===================================================================
        // 12. Event delegation for item actions
        // ===================================================================
        itemsList.addEventListener('click', async (e) => {
            const target = e.target.closest('[data-id]');
            if (!target) return;
            const itemId = target.dataset.id;
            if (!itemId || !cloudUser) return;

            if (target.dataset.action === 'save') {
                await saveEdit(itemId);
                return;
            }
            if (target.dataset.action === 'cancel') {
                editingItemId = null;
                renderItems();
                return;
            }

            if (editingItemId === itemId && !target.classList.contains('item-check')) {
                return;
            }

            if (target.classList.contains('item-check')) {
                await toggleItemDone(itemId);
                return;
            }

            if (target.classList.contains('edit-btn')) {
                startEdit(itemId);
                return;
            }

            if (target.classList.contains('del-btn')) {
                await deleteItem(itemId);
                return;
            }

            if (target.classList.contains('item-text')) {
                await toggleItemDone(itemId);
                return;
            }
        });

        itemsList.addEventListener('dblclick', (e) => {
            const textEl = e.target.closest('.item-text');
            if (!textEl) return;
            const itemId = textEl.dataset.id;
            if (!itemId) return;
            startEdit(itemId);
        });

        function startEdit(itemId) {
            editingItemId = itemId;
            renderItems();
        }

        async function saveEdit(itemId) {
            const ta = itemsList.querySelector(`.edit-textarea[data-id="${itemId}"]`);
            if (!ta) return;
            const newText = ta.value.replace(/[ \t]+$/gm, '').trim();
            if (!newText) {
                alert('Item text cannot be empty. Press Cancel to keep the original.');
                return;
            }
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            if (newText === item.text) {
                editingItemId = null;
                renderItems();
                return;
            }
            try {
                await itemsCollectionRef().doc(itemId).update({
                    text: newText,
                    updatedAt: Date.now(),
                });
                editingItemId = null;
            } catch (error) {
                console.error('Error saving edit:', error);
                alert('Could not save edit. Check your connection.');
            }
        }

        async function toggleItemDone(itemId) {
            if (!cloudUser) return;
            if (editingItemId === itemId) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            try {
                await itemsCollectionRef().doc(itemId).update({
                    done: !item.done,
                    updatedAt: Date.now()
                });
            } catch (error) {
                console.error('Error toggling item:', error);
                alert('Could not update item. Please try again.');
            }
        }

        async function deleteItem(itemId) {
            if (!cloudUser) return;
            if (!confirm('Delete this item?')) return;
            try {
                await itemsCollectionRef().doc(itemId).delete();
                if (editingItemId === itemId) editingItemId = null;
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Could not delete item.');
            }
        }

        // ===================================================================
        // 13. Keyboard shortcuts inside the inline edit textarea
        // ===================================================================
        itemsList.addEventListener('keydown', (e) => {
            const ta = e.target;
            if (!ta.classList || !ta.classList.contains('edit-textarea')) return;
            const itemId = ta.dataset.id;

            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                saveEdit(itemId);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                editingItemId = null;
                renderItems();
            }
        });

        // ===================================================================
        // 14. Newline insertion in the main input (bullet-aware)
        // ===================================================================
        function insertNewlineAtCursor() {
            const start = itemInput.selectionStart;
            const end = itemInput.selectionEnd;
            const value = itemInput.value;

            let insertion = '\n';
            if (bulletMode) {
                const lineStart = value.lastIndexOf('\n', start - 1) + 1;
                const beforeCursor = value.slice(lineStart, start);
                insertion = (beforeCursor.trim() === '' && start === lineStart)
                    ? '• '
                    : '\n• ';
            }

            itemInput.value = value.slice(0, start) + insertion + value.slice(end);
            const newPos = start + insertion.length;
            itemInput.selectionStart = itemInput.selectionEnd = newPos;
            itemInput.focus();
            autoResizeInput();
        }

        newlineBtn.addEventListener('click', (e) => {
            e.preventDefault();
            insertNewlineAtCursor();
        });

        // ===================================================================
        // 15. Add new item
        // ===================================================================
        async function addNewItem() {
            if (!cloudUser) {
                alert('Please sign in with Google to save your notes.');
                return;
            }
            const text = itemInput.value.replace(/[ \t]+$/gm, '').trim();
            if (!text) { itemInput.focus(); return; }

            const ref = itemsCollectionRef();
            if (!ref) return;

            addBtn.disabled = true;
            addBtn.innerHTML = '<span class="loading-spinner"></span>';
            setCloudStatus('pending');

            const newDocRef = ref.doc();
            const now = Date.now();
            const optimisticItem = {
                id: newDocRef.id,
                text: text,
                done: false,
                createdAt: now,
                updatedAt: now,
            };

            itemsArray.unshift(optimisticItem);
            renderItems();

            itemInput.value = bulletMode ? '• ' : '';
            manuallyResized = false;
            itemInput.style.height = '';
            autoResizeInput();
            itemInput.focus();
            itemInput.selectionStart = itemInput.selectionEnd = itemInput.value.length;

            try {
                await newDocRef.set({
                    text: text,
                    done: false,
                    createdAt: now,
                    updatedAt: now,
                });
            } catch (error) {
                console.error('Error adding item:', error);
                alert('Could not add item. Check your connection.');
                setCloudStatus('error');
                itemsArray = itemsArray.filter(i => i.id !== newDocRef.id);
                renderItems();
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '+';
            }
        }

        addBtn.addEventListener('click', addNewItem);

        // ===================================================================
        // 16. Main input keyboard handling
        // ===================================================================
        itemInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') {
                if (e.key === 'Escape') {
                    itemInput.value = bulletMode ? '• ' : '';
                    manuallyResized = false;
                    itemInput.style.height = '';
                    autoResizeInput();
                    itemInput.selectionStart = itemInput.selectionEnd = itemInput.value.length;
                }
                return;
            }

            const value = itemInput.value;
            const pos = itemInput.selectionStart;
            const lineStart = value.lastIndexOf('\n', pos - 1) + 1;
            const currentLine = value.slice(lineStart, pos);
            const isEmptyBulletLine = /^•\s*$/.test(currentLine);

            if (!e.shiftKey) {
                e.preventDefault();
                if (bulletMode && isEmptyBulletLine) {
                    const cleaned = value.slice(0, lineStart) + value.slice(pos);
                    itemInput.value = cleaned.replace(/[ \t]+$/gm, '').trim();
                }
                addNewItem();
                return;
            }

            e.preventDefault();
            insertNewlineAtCursor();
        });

        itemInput.addEventListener('input', autoResizeInput);

        // ===================================================================
        // 17. Init
        // ===================================================================
        window.addEventListener('load', () => {
            loadPrefs();
            setBulletMode(bulletMode, true);
            if (bulletMode && itemInput.value === '') {
                itemInput.value = '• ';
                itemInput.selectionStart = itemInput.selectionEnd = 2;
            }
            autoResizeInput();
            setTimeout(() => {
                if (!cloudUser) {
                    syncStatus.textContent = '☁️ Sign in to sync';
                }
            }, 500);
        });
    </script>
</body>
</html>
