<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cloud Jots</title>
    <!-- Firebase SDK (cloud sync) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .app-container {
            background: white;
            max-width: 700px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
            padding: 24px 20px 32px;
            transition: all 0.2s;
        }

        /* HEADER */
        .app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .app-header h1 span {
            font-size: 1.7rem;
        }
        .header-search {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .header-search .search-icon {
            position: absolute;
            left: 14px;
            font-size: 0.95rem;
            color: #94a3b8;
            pointer-events: none;
            line-height: 1;
        }
        .header-search input {
            width: 100%;
            padding: 10px 38px 10px 38px;
            border-radius: 40px;
            border: 1.5px solid #e2e8f0;
            font-size: 0.9rem;
            font-family: inherit;
            background: #f8fafc;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .header-search input:focus {
            border-color: #94a3b8;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.1);
        }
        .header-search .search-clear {
            position: absolute;
            right: 6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .header-search .search-clear:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .header-search .search-clear.hidden {
            display: none;
        }

        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            border-radius: 100px;
            padding: 8px 16px 8px 12px;
            margin-bottom: 24px;
            min-height: 56px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1e293b;
            flex-shrink: 0;
            object-fit: cover;
        }
        .user-name {
            font-weight: 500;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 10px 18px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, border 0.15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            white-space: nowrap;
        }
        .btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        .btn-google {
            background: white;
            border: 1px solid #dadce0;
            color: #3c4043;
            padding: 10px 20px;
            font-weight: 500;
            border-radius: 40px;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-google:hover {
            background: #f8f9fa;
            border-color: #c6c6c6;
        }
        .btn-google img {
            width: 18px;
            height: 18px;
        }

        /* ADD SECTION */
        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
            align-items: flex-start;
        }
        .add-section .add-input-area {
            flex: 1;
            min-width: 0;
        }
        .add-section textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 24px;
            border: 1.5px solid #e2e8f0;
            font-size: 1rem;
            font-family: inherit;
            background: #ffffff;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
            resize: vertical;
            min-height: 52px;
            max-height: 500px;
            line-height: 1.4;
            overflow-y: auto;
        }
        .add-section textarea:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.1);
        }

        /* ACTION BUTTONS */
        .action-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: nowrap;
            align-items: center;
            padding-top: 4px;
        }
        .add-section button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            padding: 0;
            font-size: 1.2rem;
            line-height: 1;
            background: #1e293b;
            color: white;
            border: none;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.1s, background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-section button:hover {
            background: #0f172a;
        }
        .add-section button:active {
            transform: scale(0.92);
        }
        .add-section button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .add-section button.newline-btn,
        .add-section button.bullet-btn,
        .add-section button.resize-btn {
            background: #ede7e1;
            color: #1e293b;
            font-size: 1rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        .add-section button.newline-btn:hover,
        .add-section button.bullet-btn:hover,
        .add-section button.resize-btn:hover {
            background: #d9d0c6;
        }
        .add-section button.bullet-btn.active {
            background: #1e293b;
            color: #f5efe9;
            box-shadow: 0 4px 10px rgba(30, 41, 59, 0.25);
        }
        .add-section button.bullet-btn.active:hover {
            background: #0f172a;
        }

        /* ============================================================
           BOTTOM ROW — hint text + inline tag toggle link
           ============================================================ */
        .hint-row {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: #a99d92;
            line-height: 1.5;
            margin: 0 0 16px;
            padding: 0 4px;
        }
        .hint-row kbd {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 1px 6px;
            font-family: inherit;
            font-size: 0.7rem;
            color: #1e293b;
        }
        .hint-row .hint-tag {
            background: #e0e7ff;
            color: #3730a3;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .hint-row .hint-sep {
            color: #d5cbc1;
            user-select: none;
        }
        /* The tag toggle is now a plain text link with no background */
        .tag-toggle-link {
            background: none;
            border: none;
            color: #4f46e5;
            font-size: 0.7rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 1px 4px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: background 0.15s, color 0.15s;
            line-height: 1.4;
        }
        .tag-toggle-link:hover {
            background: #eef2ff;
            color: #4338ca;
        }
        .tag-toggle-link .tag-toggle-caret {
            font-size: 0.6rem;
            line-height: 1;
            transition: transform 0.15s ease;
            display: inline-block;
        }
        .tag-toggle-link.open .tag-toggle-caret {
            transform: rotate(180deg);
        }
        .tag-toggle-link .tag-toggle-count {
            background: #e0e7ff;
            color: #3730a3;
            padding: 0 5px;
            border-radius: 20px;
            font-size: 0.62rem;
            font-weight: 700;
        }
        .tag-toggle-link.has-active-filter {
            color: #92400e;
        }
        .tag-toggle-link.has-active-filter:hover {
            background: #fef3c7;
            color: #78350f;
        }
        .tag-toggle-link.has-active-filter .tag-toggle-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #f59e0b;
            display: inline-block;
        }

        /* ============================================================
           TAG PANEL (opens below the hint row)
           ============================================================ */
        .tag-panel {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 10px 12px;
            margin-bottom: 16px;
            animation: fadeIn 0.15s ease;
        }
        .tag-panel.open {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tag-panel .panel-section {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tag-panel .panel-section .section-label {
            font-size: 0.68rem;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .tag-panel .new-tag-input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 3px 4px 3px 10px;
            transition: border 0.15s, box-shadow 0.15s;
        }
        .tag-panel .new-tag-input-wrap:focus-within {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.1);
        }
        .tag-panel .new-tag-input-wrap .te-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        .tag-panel .new-tag-input-wrap .te-chips:empty {
            display: none;
        }
        .tag-panel .new-tag-input-wrap .te-chips .pending-tag {
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-weight: 600;
        }
        .tag-panel .new-tag-input-wrap .te-chips .pending-tag button {
            background: none;
            border: none;
            color: #6366f1;
            cursor: pointer;
            font-size: 0.68rem;
            padding: 0 2px;
            line-height: 1;
        }
        .tag-panel .new-tag-input-wrap .te-chips .pending-tag button:hover {
            color: #dc2626;
        }
        .tag-panel .new-tag-input-wrap input {
            flex: 1;
            min-width: 80px;
            border: none;
            background: transparent;
            padding: 4px 4px;
            font-size: 0.82rem;
            font-family: inherit;
            outline: none;
        }
        .tag-panel .new-tag-input-wrap input::placeholder {
            color: #cbd5e1;
        }
        .tag-panel .existing-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .tag-panel .existing-tags:empty::before {
            content: 'No tags yet — add one above';
            font-size: 0.72rem;
            color: #cbd5e1;
            font-style: italic;
        }
        .tag-panel .existing-tags .existing-tag {
            background: #f1f5f9;
            color: #475569;
            padding: 3px 9px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.15s, color 0.15s;
            border: 1px solid transparent;
        }
        .tag-panel .existing-tags .existing-tag:hover {
            background: #e2e8f0;
        }
        .tag-panel .existing-tags .existing-tag.active {
            background: #6366f1;
            color: white;
        }
        .tag-panel .existing-tags .existing-tag .tag-count {
            opacity: 0.65;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .tag-panel .existing-tags .clear-all {
            background: none;
            border: none;
            font-size: 0.68rem;
            color: #64748b;
            cursor: pointer;
            text-decoration: underline;
            padding: 3px 6px;
            margin-left: auto;
        }
        .tag-panel .existing-tags .clear-all:hover {
            color: #dc2626;
        }

        /* ITEMS LIST */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 8px;
        }
        .item {
            background: #ffffff;
            border: 1px solid #e9eef3;
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: background 0.15s, border 0.15s;
            animation: fadeIn 0.15s ease;
            flex-wrap: wrap;
        }
        .item:hover {
            border-color: #cbd5e1;
            background: #fdfdfe;
        }
        .item.editing {
            border-color: #94a3b8;
            background: #f8fafc;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.12);
        }
        .item.pinned {
            border-color: #fbbf24;
            background: #fffdf5;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.12);
        }
        .item.pinned:hover {
            border-color: #f59e0b;
            background: #fffdf0;
        }
        .item-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.1s, border 0.1s;
            font-size: 14px;
            color: white;
            user-select: none;
            margin-top: 2px;
        }
        .item-check.done {
            background: #1e293b;
            border-color: #1e293b;
        }
        .item-check.done::after {
            content: "✓";
            color: white;
            font-weight: bold;
        }
        .item-body {
            flex: 1;
            min-width: 0;
        }
        .item-text {
            font-size: 1rem;
            color: #1e293b;
            word-break: break-word;
            line-height: 1.4;
            cursor: text;
            white-space: pre-wrap;
        }
        .item-text:hover {
            background: #f8fafc;
            border-radius: 6px;
            box-shadow: 0 0 0 4px #f8fafc;
        }
        .item-text.done {
            text-decoration: line-through;
            color: #94a3b8;
        }
        .item-meta {
            margin-top: 6px;
            font-size: 0.72rem;
            color: #94a3b8;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .item-meta .chip {
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 30px;
            cursor: help;
            user-select: none;
        }
        .item-meta .chip.edited {
            background: #ede7e1;
            color: #6d645b;
        }
        .item-meta .chip.pin-chip {
            background: #fef3c7;
            color: #92400e;
        }
        .item-meta .chip.tag-chip {
            background: #e0e7ff;
            color: #3730a3;
            cursor: pointer;
            transition: background 0.15s;
        }
        .item-meta .chip.tag-chip:hover {
            background: #c7d2fe;
        }
        .item-meta .chip.tag-chip.active {
            background: #6366f1;
            color: white;
        }
        .item-meta .chip.reply-chip {
            background: #dbeafe;
            color: #1e40af;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.15s;
        }
        .item-meta .chip.reply-chip:hover {
            background: #bfdbfe;
        }
        .item-meta .chip.reply-chip .reply-caret {
            font-size: 0.7rem;
            line-height: 1;
            transition: transform 0.15s ease;
            display: inline-block;
        }
        .item-meta .chip.reply-chip.collapsed .reply-caret {
            transform: rotate(-90deg);
        }
        .item-actions {
            display: flex;
            flex-direction: row;
            gap: 2px;
            flex-shrink: 0;
            align-items: center;
            margin-left: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .item:hover .item-actions,
        .item:focus-within .item-actions {
            opacity: 1;
            pointer-events: auto;
        }
        .item-actions button {
            background: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            line-height: 1;
            padding: 0;
        }
        .item-actions button:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .item-actions button.del-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .item-actions button.pin-btn.pinned {
            color: #f59e0b;
        }
        .item-actions button.pin-btn.pinned:hover {
            background: #fef3c7;
            color: #d97706;
        }
        .item-actions button.pin-btn:hover {
            background: #fef3c7;
            color: #f59e0b;
        }
        .item-actions button.reply-btn:hover {
            background: #dbeafe;
            color: #2563eb;
        }
        .item-actions button.reply-btn.active {
            background: #dbeafe;
            color: #2563eb;
        }
        .item-actions button.tag-btn:hover {
            background: #e0e7ff;
            color: #4338ca;
        }
        .item-actions button.tag-btn.active {
            background: #e0e7ff;
            color: #4338ca;
        }

        /* INLINE TAG EDITOR on an item */
        .tag-editor-row {
            flex-basis: 100%;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            padding: 8px 10px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 14px;
        }
        .tag-editor-row .te-label {
            font-size: 0.72rem;
            color: #64748b;
            font-weight: 600;
        }
        .tag-editor-row input {
            flex: 1;
            min-width: 100px;
            padding: 5px 10px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            font-size: 0.8rem;
            font-family: inherit;
            background: white;
            outline: none;
        }
        .tag-editor-row input:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.1);
        }
        .tag-editor-row .te-actions {
            display: flex;
            gap: 4px;
        }
        .tag-editor-row .te-actions button {
            padding: 4px 10px;
            border-radius: 20px;
            border: none;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .tag-editor-row .te-save {
            background: #1e293b;
            color: white;
        }
        .tag-editor-row .te-save:hover {
            background: #0f172a;
        }
        .tag-editor-row .te-cancel {
            background: #e2e8f0;
            color: #1e293b;
        }
        .tag-editor-row .te-cancel:hover {
            background: #cbd5e1;
        }

        /* REPLIES */
        .replies-wrap {
            flex-basis: 100%;
            margin-top: 10px;
            padding-left: 36px;
            border-left: 2px solid #e2e8f0;
            margin-left: 12px;
        }
        .replies-wrap.collapsed {
            display: none;
        }
        .reply {
            background: #f8fafc;
            border: 1px solid #eef2f7;
            border-radius: 14px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: fadeIn 0.15s ease;
            flex-wrap: wrap;
        }
        .reply:last-child {
            margin-bottom: 0;
        }
        .reply-check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.1s, border 0.1s;
            font-size: 12px;
            color: white;
            user-select: none;

        .reply-meta {

        .reply-add-row button:hover {

        .edit-buttons .save-btn {

        .empty-state {
            text-align: center;

        .footer-note {

        @media (max-width: 560px) {
            .app-container { padding: 18px 14px 24px; border-radius: 24px; }
