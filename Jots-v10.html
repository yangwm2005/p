            .reply-actions { opacity: 1; pointer-events: auto; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="app-header">
            <h1><span>📋</span> Cloud Jots</h1>
            <div class="header-search">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search… or type #tag" autocomplete="off" aria-label="Search notes">
                <button id="searchClearBtn" class="search-clear hidden" aria-label="Clear search" title="Clear search">✕</button>
            </div>
        </div>

        <div id="userBar" class="user-bar">
            <div id="signInContainer" style="width:100%; display: flex; justify-content: center;">
                <button id="googleSignInBtn" class="btn btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Sign in with Google
                </button>
            </div>
            <div id="userProfile" class="user-info hidden" style="width:100%; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 10px; overflow:hidden;">
                    <img id="userAvatar" class="user-avatar" src="" alt="avatar">
                    <span id="userName" class="user-name"></span>
                </div>
                <button id="signOutBtn" class="btn">Sign out</button>
            </div>
        </div>

        <!-- Add new item -->
        <div class="add-section" id="addSection">
            <div class="add-input-area">
                <textarea id="itemInput" placeholder="Write a to-do or idea…" autocomplete="off" maxlength="5000" rows="1"></textarea>
            </div>
            <div class="action-buttons">
                <button id="bulletBtn" class="bullet-btn" aria-label="Toggle bullet mode" title="Bullet mode: auto-add • at start of each line">•</button>
                <button id="newlineBtn" class="newline-btn" aria-label="Insert new line" title="Insert a new line (Shift+Enter)">↵</button>
                <button id="resizeBtn" class="resize-btn" aria-label="Cycle input size" title="Cycle input height (small → medium → large)">▤</button>
                <button id="addBtn" aria-label="Add item" title="Add item (Enter)">+</button>
            </div>
        </div>

        <!-- Hint row: keyboard hints + inline tag toggle link (no pill/circle) -->
        <div class="hint-row" id="hintRow">
            <span><kbd>Enter</kbd> save</span>
            <span class="hint-sep">·</span>
            <span><kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
            <span class="hint-sep">·</span>
            <span>click text to edit</span>
            <span class="hint-sep">·</span>
            <span><span class="hint-tag">#tag</span> in search</span>
            <span class="hint-sep">·</span>
            <button type="button" class="tag-toggle-link" id="tagToggleLink" title="Show / hide tags panel">
                <span>🏷️ Tags</span>
                <span class="tag-toggle-count hidden" id="tagToggleCount">0</span>
                <span class="tag-toggle-dot" id="tagToggleDot" style="display:none;"></span>
                <span class="tag-toggle-caret">▾</span>
            </button>
        </div>

        <!-- Tag panel (opens below the hint row) -->
        <div class="tag-panel" id="tagPanel">
            <!-- Section 1 — add a new tag -->
            <div class="panel-section">
                <span class="section-label">Add</span>
                <div class="new-tag-input-wrap">
                    <div class="te-chips" id="pendingTags"></div>
                    <input type="text" id="tagInput" placeholder="type a tag, press Enter…" autocomplete="off" aria-label="Add tags">
                </div>
            </div>

            <!-- Section 2 — existing tags (click to filter) -->
            <div class="panel-section">
                <span class="section-label">Filter</span>
                <div class="existing-tags" id="existingTags"></div>
            </div>
        </div>

        <!-- Items list -->
        <div id="itemsList" class="items-list"></div>

        <div class="footer-note">
            <span id="syncStatus">☁️ Not signed in</span>
        </div>

        <div class="copyright">
            Copyright 2026 Dr. Wen-Ming Yang. All Rights Reserved
        </div>
    </div>

    <script>
        // ===================================================================
        // Firebase
        // ===================================================================
        const FB_CONFIG = {
            apiKey: "AIzaSyCn-INjtwiFoS66VXAADfVLLAqmjJOyksc",
            authDomain: "qtodo-syn.firebaseapp.com",
            projectId: "qtodo-syn",
            storageBucket: "qtodo-syn.firebasestorage.app",
            messagingSenderId: "663058774385",
            appId: "1:663058774385:web:a2972f2eb032c8cc4d5ed0"
        };

        let cloudApp, cloudAuth, cloudDb;
        let cloudReady = false;
        try {
            if (typeof firebase !== 'undefined') {
                try { cloudApp = firebase.app('cloud-notes'); }
                catch (e) { cloudApp = firebase.initializeApp(FB_CONFIG, 'cloud-notes'); }
                cloudAuth = firebase.auth(cloudApp);
                cloudDb = firebase.firestore(cloudApp);
                cloudReady = true;
            }
        } catch (e) {
            console.warn('Cloud sync unavailable:', e);
        }
        if (cloudReady) {
            try {
                cloudAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                    .catch((e) => console.warn('setPersistence failed:', e));
            } catch (e) { /* ignore */ }
        }
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        // ===================================================================
        // State
        // ===================================================================
        let cloudUser = null;
        let itemsUnsubscribe = null;
        let itemsArray = [];
        let editingItemId = null;
        let replyingToId = null;
        let editingReply = null;
        let tagEditingItemId = null;
        let collapsedItems = new Set();
        const COLLAPSE_KEY = 'cloudNotesCollapsed';
        let activeTagFilters = new Set();
        let pendingTags = [];

        // Panel open/closed state
        let tagPanelOpen = false;

        let nullUserTimer = null;
        const NULL_USER_GRACE_MS = 1500;

        const PREF_KEY = 'cloudNotesPrefs';
        let bulletMode = false;
        let manuallyResized = false;
        let resizeCycleIndex = 0;
        const RESIZE_CYCLE = [52, 120, 220, 340];

        let searchQuery = '';

        function loadCollapseState() {
            try {
                const raw = localStorage.getItem(COLLAPSE_KEY);
                if (!raw) return;
                const arr = JSON.parse(raw);
                if (Array.isArray(arr)) collapsedItems = new Set(arr);
            } catch (e) { /* ignore */ }
        }
        function saveCollapseState() {
            try {
                localStorage.setItem(COLLAPSE_KEY, JSON.stringify(Array.from(collapsedItems)));
            } catch (e) { /* ignore */ }
        }
        function loadPrefs() {
            try {
                const raw = localStorage.getItem(PREF_KEY);
                if (!raw) return;
                const p = JSON.parse(raw);
                if (typeof p.bulletMode === 'boolean') bulletMode = p.bulletMode;
            } catch (e) { /* ignore */ }
        }
        function savePrefs() {
            try {
                localStorage.setItem(PREF_KEY, JSON.stringify({ bulletMode }));
            } catch (e) { /* ignore */ }
        }

        const signInContainer = document.getElementById('signInContainer');
        const userProfile = document.getElementById('userProfile');
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const itemInput = document.getElementById('itemInput');
        const tagInput = document.getElementById('tagInput');
        const tagPanel = document.getElementById('tagPanel');
        const tagToggleLink = document.getElementById('tagToggleLink');
        const tagToggleCount = document.getElementById('tagToggleCount');
        const tagToggleDot = document.getElementById('tagToggleDot');
        const pendingTagsEl = document.getElementById('pendingTags');
        const existingTagsEl = document.getElementById('existingTags');
        const addBtn = document.getElementById('addBtn');
        const newlineBtn = document.getElementById('newlineBtn');
        const bulletBtn = document.getElementById('bulletBtn');
        const resizeBtn = document.getElementById('resizeBtn');
        const hintRow = document.getElementById('hintRow');
        const itemsList = document.getElementById('itemsList');
        const syncStatus = document.getElementById('syncStatus');
        const searchInput = document.getElementById('searchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');

        // ===================================================================
        // Tag helpers
        // ===================================================================
        function normalizeTag(raw) {
            if (raw == null) return '';
            let t = String(raw).trim().toLowerCase();
            if (t.startsWith('#')) t = t.slice(1);
            t = t.replace(/[^a-z0-9\-_]/g, '');
            return t;
        }
        function parseTagString(str) {
            if (!str) return [];
            const parts = String(str).split(/[\s,]+/);
            const out = [];
            const seen = new Set();
            for (const p of parts) {
                const t = normalizeTag(p);
                if (t && !seen.has(t)) { seen.add(t); out.push(t); }
            }
            return out;
        }
        function mergeTags(existing, incoming) {
            const seen = new Set();
            const out = [];
            (existing || []).forEach(t => {
                const n = normalizeTag(t);
                if (n && !seen.has(n)) { seen.add(n); out.push(n); }
            });
            (incoming || []).forEach(t => {
                const n = normalizeTag(t);
                if (n && !seen.has(n)) { seen.add(n); out.push(n); }
            });
            return out;
        }
        function getAllTagsWithCounts() {
            const counts = new Map();
            for (const it of itemsArray) {
                (it.tags || []).forEach(t => {
                    const n = normalizeTag(t);
                    if (n) counts.set(n, (counts.get(n) || 0) + 1);
                });
                (it.replies || []).forEach(r => {
                    (r.tags || []).forEach(t => {
                        const n = normalizeTag(t);
                        if (n) counts.set(n, (counts.get(n) || 0) + 1);
                    });
                });
            }
            return Array.from(counts.entries())
                .map(([tag, count]) => ({ tag, count }))
                .sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag));
        }

        // ===================================================================
        // Tag toggle + panel
        // ===================================================================
        function updateTagToggle() {
            const n = pendingTags.length;
            if (n === 0) {
                tagToggleCount.classList.add('hidden');
            } else {
                tagToggleCount.textContent = String(n);
                tagToggleCount.classList.remove('hidden');
            }
            if (activeTagFilters.size > 0) {
                tagToggleLink.classList.add('has-active-filter');
                tagToggleDot.style.display = 'inline-block';
                tagToggleLink.title = 'Filter active — click to manage tags';
            } else {
                tagToggleLink.classList.remove('has-active-filter');
                tagToggleDot.style.display = 'none';
                tagToggleLink.title = 'Show / hide tags panel';
            }
        }

        function renderPendingTags() {
            if (!pendingTags.length) {
                pendingTagsEl.innerHTML = '';
                return;
            }
            pendingTagsEl.innerHTML = pendingTags.map(t =>
                `<span class="pending-tag">#${escapeHtml(t)}<button data-pending-tag="${escapeHtml(t)}" title="Remove tag">✕</button></span>`
            ).join('');
        }

        function renderExistingTags() {
            const all = getAllTagsWithCounts();
            if (!all.length) {
                existingTagsEl.innerHTML = '';
                return;
            }
            const shown = all.slice(0, 24);
            let html = shown.map(({ tag, count }) => {
                const active = activeTagFilters.has(tag);
                return `<span class="existing-tag ${active ? 'active' : ''}" data-existing-tag="${escapeHtml(tag)}" title="Filter by #${escapeHtml(tag)}">#${escapeHtml(tag)} <span class="tag-count">${count}</span></span>`;
            }).join('');
            if (all.length > shown.length) {
                html += `<span style="font-size:0.68rem;color:#94a3b8;align-self:center;">+${all.length - shown.length} more — type in search</span>`;
            }
            if (activeTagFilters.size > 0) {
                html += `<button class="clear-all" data-clear-all="1">Clear all</button>`;
            }
            existingTagsEl.innerHTML = html;
        }

        function openTagPanel() {
            tagPanelOpen = true;
            tagPanel.classList.add('open');
            tagToggleLink.classList.add('open');
            // IMPORTANT: render existing tags right after opening so the Filter
            // section isn't empty the first time the panel opens.
            renderExistingTags();
            setTimeout(() => tagInput.focus(), 0);
        }

        function closeTagPanel() {
            // Commit any half-typed tag
            if (tagInput.value.trim()) {
                const newTags = parseTagString(tagInput.value);
                if (newTags.length) pendingTags = mergeTags(pendingTags, newTags);
                tagInput.value = '';
            }
            tagPanelOpen = false;
            tagPanel.classList.remove('open');
            tagToggleLink.classList.remove('open');
            renderPendingTags();
            updateTagToggle();
        }

        tagToggleLink.addEventListener('click', () => {
            if (tagPanelOpen) closeTagPanel();
            else openTagPanel();
        });

        tagInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (tagInput.value.trim()) {
                    const newTags = parseTagString(tagInput.value);
                    if (newTags.length) pendingTags = mergeTags(pendingTags, newTags);
                    tagInput.value = '';
                    renderPendingTags();
                    updateTagToggle();
                } else {
                    closeTagPanel();
                    itemInput.focus();
                }
                return;
            }
            if (e.key === ',' || e.key === ' ') {
                e.preventDefault();
                const newTags = parseTagString(tagInput.value);
                if (newTags.length) {
                    pendingTags = mergeTags(pendingTags, newTags);
                    tagInput.value = '';
                    renderPendingTags();
                    updateTagToggle();
                }
                return;
            }
            if (e.key === 'Backspace' && tagInput.value === '' && pendingTags.length) {
                pendingTags.pop();
                renderPendingTags();
                updateTagToggle();
                return;
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                closeTagPanel();
                itemInput.focus();
            }
        });

        pendingTagsEl.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-pending-tag]');
            if (!btn) return;
            const t = btn.dataset.pendingTag;
            pendingTags = pendingTags.filter(x => x !== t);
            renderPendingTags();
            updateTagToggle();
        });

        existingTagsEl.addEventListener('click', (e) => {
            const clearBtn = e.target.closest('[data-clear-all]');
            if (clearBtn) {
                activeTagFilters.clear();
                renderItems();
                updateTagToggle();
                return;
            }
            const tagEl = e.target.closest('[data-existing-tag]');
            if (!tagEl) return;
            const t = tagEl.dataset.existingTag;
            if (activeTagFilters.has(t)) activeTagFilters.delete(t);
            else activeTagFilters.add(t);
            renderItems();
            updateTagToggle();
        });

        // ===================================================================
        // Auto-resize
        // ===================================================================
        function autoResizeInput() {
            if (manuallyResized) return;
            itemInput.style.height = 'auto';
            const natural = itemInput.scrollHeight;
            itemInput.style.height = Math.min(natural, 500) + 'px';
        }
        itemInput.addEventListener('mousedown', (e) => {
            const rect = itemInput.getBoundingClientRect();
            const nearCornerX = (rect.right - e.clientX) < 20;
            const nearCornerY = (rect.bottom - e.clientY) < 20;
            if (nearCornerX && nearCornerY) manuallyResized = true;
        });

        // ===================================================================
        // Bullet mode
        // ===================================================================
        function setBulletMode(enabled, skipSave) {
            bulletMode = enabled;
            bulletBtn.classList.toggle('active', enabled);
            bulletBtn.title = enabled
                ? 'Bullet mode ON — press Enter to start the next bullet; Enter on an empty bullet to save'
                : 'Bullet mode: auto-add • at start of each line';
            if (enabled && itemInput.value === '') {
                itemInput.value = '• ';
                itemInput.selectionStart = itemInput.selectionEnd = 2;
                autoResizeInput();
            }
            if (!enabled && /^•\s*$/.test(itemInput.value)) {
                itemInput.value = '';
                autoResizeInput();
            }
            if (!skipSave) savePrefs();
        }
        bulletBtn.addEventListener('click', (e) => {
            e.preventDefault();
            setBulletMode(!bulletMode);
            itemInput.focus();
        });

        // ===================================================================
        // Resize cycle
        // ===================================================================
        function applyResizeCycle() {
            const h = RESIZE_CYCLE[resizeCycleIndex % RESIZE_CYCLE.length];
            itemInput.style.height = h + 'px';
            resizeCycleIndex++;
            manuallyResized = false;
            itemInput.focus();
        }
        resizeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            applyResizeCycle();
        });

        // ===================================================================
        // Auth
        // ===================================================================
        googleSignInBtn.addEventListener('click', async () => {
            if (!cloudReady) {
                alert("Cloud sync is unavailable right now (couldn't load Firebase). Check your connection and try again.");
                return;
            }
            try {
                await cloudAuth.signInWithPopup(googleProvider);
            } catch (e) {
                const code = e && e.code ? e.code : '';
                const silent = [
                    'auth/popup-closed-by-user',
                    'auth/cancelled-popup-request',
                    'auth/popup-blocked',
                ];
                if (!silent.includes(code)) {
                    alert('Sign-in failed: ' + (e.message || code));
                }
            }
        });

        signOutBtn.addEventListener('click', () => {
            if (!cloudUser) return;
            stopCloudListener();
            if (nullUserTimer) { clearTimeout(nullUserTimer); nullUserTimer = null; }
            cloudAuth.signOut().catch((e) => console.error('Sign-out error:', e));
        });

        if (cloudReady) {
            cloudAuth.onAuthStateChanged((user) => {
                if (user) {
                    if (nullUserTimer) { clearTimeout(nullUserTimer); nullUserTimer = null; }
                    const wasSignedOut = !cloudUser;
                    cloudUser = user;
                    signInContainer.classList.add('hidden');
                    userProfile.classList.remove('hidden');
                    userAvatar.src = user.photoURL || 'https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/default-avatar.png';
                    userName.textContent = user.displayName || user.email || 'User';
                    if (wasSignedOut) syncStatus.textContent = '☁️ Loading...';
                    subscribeToItems();
                } else {
                    if (nullUserTimer) clearTimeout(nullUserTimer);
                    nullUserTimer = setTimeout(() => {
                        nullUserTimer = null;
                        cloudUser = null;
                        signInContainer.classList.remove('hidden');
                        userProfile.classList.add('hidden');
                        syncStatus.textContent = '☁️ Not signed in';
                        stopCloudListener();
                        itemsArray = [];
                        editingItemId = null;
                        replyingToId = null;
                        editingReply = null;
                        tagEditingItemId = null;
                        renderItems();
                    }, NULL_USER_GRACE_MS);
                }
            });
        }

        // ===================================================================
        // Firestore
        // ===================================================================
        function itemsCollectionRef() {
            if (!cloudUser || !cloudDb) return null;
            return cloudDb.collection('users').doc(cloudUser.uid)
                          .collection('cloud_notes').doc('data')
                          .collection('items');
        }
        function subscribeToItems() {
            const ref = itemsCollectionRef();
            if (!ref) return;
            if (itemsUnsubscribe) itemsUnsubscribe();
            itemsUnsubscribe = ref.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                const newItems = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    newItems.push({
                        id: doc.id,
                        text: data.text || '',
                        done: data.done || false,
                        pinned: data.pinned || false,
                        tags: Array.isArray(data.tags) ? data.tags : [],
                        createdAt: data.createdAt || 0,
                        updatedAt: data.updatedAt || 0,
                        replies: Array.isArray(data.replies) ? data.replies.map(r => ({
                            id: r.id,
                            text: r.text || '',
                            done: r.done || false,
                            tags: Array.isArray(r.tags) ? r.tags : [],
                            createdAt: r.createdAt || 0,
                            updatedAt: r.updatedAt || 0,
                        })) : [],
                    });
                });
                itemsArray = newItems;
                renderItems();
                // If the tag panel is open, keep the Filter section fresh
                if (tagPanelOpen) renderExistingTags();
                setCloudStatus(snapshot.metadata.hasPendingWrites ? 'pending' : 'synced');
            }, (error) => {
                console.error('Firestore listener error:', error);
                setCloudStatus('error');
            });
        }
        function stopCloudListener() {
            if (itemsUnsubscribe) { itemsUnsubscribe(); itemsUnsubscribe = null; }
        }
        function setCloudStatus(state) {
            if (!syncStatus) return;
            if (!cloudUser) { syncStatus.textContent = '☁️ Not signed in'; return; }
            if (state === 'pending') syncStatus.textContent = '🟡 Saving to cloud…';
            else if (state === 'synced') {
                const n = itemsArray.length;
                syncStatus.textContent = `🟢 Synced · ${n} item${n !== 1 ? 's' : ''}`;
            }
            else if (state === 'error') syncStatus.textContent = '🔴 Cloud error — retrying';
        }

        // ===================================================================
        // Date helpers
        // ===================================================================
        function pad(n) { return String(n).padStart(2, '0'); }
        function formatCreatedLabel(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const sameDay = (a, b) =>
                a.getFullYear() === b.getFullYear() &&
                a.getMonth() === b.getMonth() &&
                a.getDate() === b.getDate();
            const yest = new Date(now); yest.setDate(now.getDate() - 1);
            const tom  = new Date(now); tom.setDate(now.getDate() + 1);
            if (sameDay(d, now)) return 'Today';
            if (sameDay(d, yest)) return 'Yesterday';
            if (sameDay(d, tom))  return 'Tomorrow';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        function formatTimeLabel(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }
        function formatFullTooltip(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
                   `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        // ===================================================================
        // Search parsing
        // ===================================================================
        function parseSearchQuery(q) {
            const out = { text: '', tags: [] };
            if (!q) return out;
            const tokens = q.split(/\s+/);
            const freeText = [];
            const tagSet = new Set();
            for (const tok of tokens) {
                if (tok.startsWith('#') && tok.length > 1) {
                    const t = normalizeTag(tok);
                    if (t) tagSet.add(t);
                } else if (tok) {
                    freeText.push(tok.toLowerCase());
                }
            }
            out.text = freeText.join(' ').trim();
            out.tags = Array.from(tagSet);
            return out;
        }
        function itemMatchesSearch(it, parsed) {
            if (parsed.tags.length) {
                const itemTags = new Set((it.tags || []).map(normalizeTag));
                const replyTags = new Set();
                (it.replies || []).forEach(r => (r.tags || []).forEach(t => replyTags.add(normalizeTag(t))));
                const all = new Set([...itemTags, ...replyTags]);
                for (const t of parsed.tags) {
                    if (!all.has(t)) return false;
                }
            }
            if (parsed.text) {
                const needle = parsed.text;
                if (it.text.toLowerCase().includes(needle)) return true;
                if ((it.replies || []).some(r => (r.text || '').toLowerCase().includes(needle))) return true;
                if ((it.tags || []).some(t => t.includes(needle))) return true;
                if ((it.replies || []).some(r => (r.tags || []).some(t => t.includes(needle)))) return true;
                return false;
            }
            return true;
        }
        function getVisibleItems() {
            const parsed = parseSearchQuery(searchQuery);
            const allTags = new Set([...parsed.tags, ...activeTagFilters]);
            let list = itemsArray;
            if (allTags.size || parsed.text) {
                list = list.filter(it => itemMatchesSearch(it, { text: parsed.text, tags: Array.from(allTags) }));
            }
            const pinned = list.filter(it => it.pinned);
            const unpinned = list.filter(it => !it.pinned);
            return pinned.concat(unpinned);
        }

        // ===================================================================
        // Render items
        // ===================================================================
        function renderItems() {
            updateTagToggle();
            if (tagPanelOpen) renderExistingTags();

            const visible = getVisibleItems();
            if (!visible.length) {
                if (searchQuery.trim() || activeTagFilters.size) {
                    itemsList.innerHTML = `<div class="empty-state">🔍 No items match your filter.</div>`;
                } else {
                    itemsList.innerHTML = `<div class="empty-state">✨ No items yet. Add a to‑do or idea above.</div>`;
                }
                return;
            }

            let html = '';
            visible.forEach((item) => {
                const doneClass = item.done ? 'done' : '';
                const pinnedClass = item.pinned ? 'pinned' : '';
                const isEditing = editingItemId === item.id;
                const createdLabel = formatCreatedLabel(item.createdAt);
                const timeLabel = formatTimeLabel(item.createdAt);
                const fullTooltip = formatFullTooltip(item.createdAt);
                const wasEdited = item.updatedAt && item.createdAt &&
                                  (item.updatedAt - item.createdAt) > 1000;
                const replies = Array.isArray(item.replies) ? item.replies : [];
                const replyCount = replies.length;
                const showReplyBox = replyingToId === item.id;
                const showTagEditor = tagEditingItemId === item.id;
                const isCollapsed = collapsedItems.has(item.id) && !showReplyBox;
                const wrapCollapsedClass = isCollapsed ? ' collapsed' : '';

                const itemTags = Array.isArray(item.tags) ? item.tags : [];
                const itemTagChips = itemTags.map(t => {
                    const isActive = activeTagFilters.has(t);
                    return `<span class="chip tag-chip ${isActive ? 'active' : ''}" data-id="${item.id}" data-action="filter-tag" data-tag="${escapeHtml(t)}" title="Filter by #${escapeHtml(t)}">#${escapeHtml(t)}</span>`;
                }).join('');

                let repliesHtml = '';
                if (replies.length || showReplyBox) {
                    repliesHtml += `<div class="replies-wrap${wrapCollapsedClass}">`;
                    replies.forEach(r => {
                        const rDone = r.done ? 'done' : '';
                        const rIsEditing = editingReply &&
                                            editingReply.itemId === item.id &&
                                            editingReply.replyId === r.id;
                        const rCreated = formatCreatedLabel(r.createdAt);
                        const rTime = formatTimeLabel(r.createdAt);
                        const rWasEdited = r.updatedAt && r.createdAt &&
                                           (r.updatedAt - r.createdAt) > 1000;
                        const rTags = Array.isArray(r.tags) ? r.tags : [];
                        const rTagChips = rTags.map(t => {
                            const isActive = activeTagFilters.has(t);
                            return `<span class="chip tag-chip ${isActive ? 'active' : ''}" data-id="${item.id}" data-reply-id="${r.id}" data-action="filter-tag" data-tag="${escapeHtml(t)}" title="Filter by #${escapeHtml(t)}">#${escapeHtml(t)}</span>`;
                        }).join('');

                        if (rIsEditing) {
                            repliesHtml += `
                                <div class="reply" data-reply-id="${r.id}">
                                    <div class="reply-check ${rDone}" data-id="${item.id}" data-reply-id="${r.id}" data-action="toggle-reply" role="button" aria-label="toggle reply done"></div>
                                    <div class="reply-body">
                                        <textarea class="edit-textarea" data-reply-edit="1" data-id="${item.id}" data-reply-id="${r.id}" rows="2">${escapeHtml(r.text || '')}</textarea>
                                        <div class="edit-buttons">
                                            <button class="btn save-btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="save-reply">💾 Save</button>
                                            <button class="btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="cancel-reply">Cancel</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            repliesHtml += `
                                <div class="reply" data-reply-id="${r.id}">
                                    <div class="reply-check ${rDone}" data-id="${item.id}" data-reply-id="${r.id}" data-action="toggle-reply" role="button" aria-label="toggle reply done"></div>
                                    <div class="reply-body">
                                        <div class="reply-text ${rDone}" data-id="${item.id}" data-reply-id="${r.id}" title="Click to edit">${escapeHtml(r.text || '')}</div>
                                        <div class="reply-meta">
                                            <span class="chip" title="${escapeHtml(formatFullTooltip(r.createdAt))}">🕒 ${escapeHtml(rCreated)} · ${escapeHtml(rTime)}</span>
                                            ${rWasEdited ? `<span class="chip edited" title="Last edited: ${escapeHtml(formatFullTooltip(r.updatedAt))}">✎ edited</span>` : ''}
                                            ${rTagChips}
                                            <div class="reply-actions">
                                                <button class="edit-reply-btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="edit-reply" title="Edit reply" aria-label="edit reply">✎</button>
                                                <button class="del-btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="delete-reply" title="Delete reply" aria-label="delete reply">✕</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    });

                    if (showReplyBox) {
                        repliesHtml += `
                            <div class="reply-add-row">
                                <textarea data-reply-input="1" data-id="${item.id}" rows="1" placeholder="Write a reply… (Enter to post, Esc to cancel)" maxlength="2000"></textarea>
                                <button data-id="${item.id}" data-action="post-reply" title="Post reply" aria-label="post reply">➤</button>
                            </div>
                        `;
                    }
                    repliesHtml += `</div>`;
                }

                let replyChipHtml = '';
                if (replyCount) {
                    replyChipHtml = `<span class="chip reply-chip ${isCollapsed ? 'collapsed' : ''}" data-id="${item.id}" data-action="toggle-collapse" title="${isCollapsed ? 'Click to expand replies' : 'Click to collapse replies'}">
                        <span class="reply-caret">▼</span> 💬 ${replyCount} repl${replyCount === 1 ? 'y' : 'ies'}
                    </span>`;
                }

                let tagEditorHtml = '';
                if (showTagEditor) {
                    tagEditorHtml = `
                        <div class="tag-editor-row">
                            <span class="te-label">🏷️ Tags</span>
                            <input type="text" id="tagEditorInput-${item.id}" value="${escapeHtml((item.tags || []).join(', '))}" placeholder="comma or space separated…">
                            <div class="te-actions">
                                <button class="te-save" data-id="${item.id}" data-action="save-tags">Save</button>
                                <button class="te-cancel" data-id="${item.id}" data-action="cancel-tags">Cancel</button>
                            </div>
                        </div>
                    `;
                }

                if (isEditing) {
                    html += `
                        <div class="item editing ${pinnedClass}" data-id="${item.id}">
                            <div class="item-check ${doneClass}" data-id="${item.id}" role="button" aria-label="toggle done"></div>
                            <div class="item-body">
                                <textarea class="edit-textarea" data-id="${item.id}" rows="2">${escapeHtml(item.text)}</textarea>
                                <div class="edit-buttons">
                                    <button class="btn save-btn" data-id="${item.id}" data-action="save">💾 Save</button>
                                    <button class="btn" data-id="${item.id}" data-action="cancel">Cancel</button>
                                </div>
                            </div>
                            ${tagEditorHtml}
                            ${repliesHtml}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="item ${pinnedClass}" data-id="${item.id}">
                            <div class="item-check ${doneClass}" data-id="${item.id}" role="button" aria-label="toggle done"></div>
                            <div class="item-body">
                                <div class="item-text ${doneClass}" data-id="${item.id}" title="Click to edit">${escapeHtml(item.text)}</div>
                                <div class="item-meta">
                                    <span class="chip" title="${escapeHtml(fullTooltip)}">🕒 ${escapeHtml(createdLabel)} · ${escapeHtml(timeLabel)}</span>
                                    ${item.pinned ? `<span class="chip pin-chip" title="Pinned to top">📌 pinned</span>` : ''}
                                    ${wasEdited ? `<span class="chip edited" title="Last edited: ${escapeHtml(formatFullTooltip(item.updatedAt))}">✎ edited</span>` : ''}
                                    ${itemTagChips}
                                    ${replyChipHtml}
                                    <div class="item-actions">
                                        <button class="tag-btn ${showTagEditor ? 'active' : ''}" data-id="${item.id}" data-action="open-tag-editor" aria-label="tags" title="Edit tags">🏷️</button>
                                        <button class="reply-btn ${showReplyBox ? 'active' : ''}" data-id="${item.id}" data-action="open-reply" aria-label="reply" title="Add a reply / sub-note">💬</button>
                                        <button class="pin-btn ${item.pinned ? 'pinned' : ''}" data-id="${item.id}" aria-label="pin" title="${item.pinned ? 'Unpin' : 'Pin to top'}">${item.pinned ? '📌' : '📍'}</button>
                                        <button class="edit-btn" data-id="${item.id}" aria-label="edit" title="Edit (or click text)">✎</button>
                                        <button class="del-btn" data-id="${item.id}" aria-label="delete" title="Delete">✕</button>
                                    </div>
                                </div>
                            </div>
                            ${tagEditorHtml}
                            ${repliesHtml}
                        </div>
                    `;
                }
            });
            itemsList.innerHTML = html;

            if (editingItemId) {
                const ta = itemsList.querySelector(`.edit-textarea[data-id="${editingItemId}"]:not([data-reply-edit])`);
                if (ta) {
                    ta.style.height = 'auto';
                    const natural = ta.scrollHeight;
                    ta.style.height = Math.min(Math.max(natural, 70), 500) + 'px';
                    ta.focus();
                    ta.selectionStart = ta.selectionEnd = ta.value.length;
                }
            }
            if (replyingToId) {
                const rta = itemsList.querySelector(`textarea[data-reply-input][data-id="${replyingToId}"]`);
                if (rta) {
                    rta.style.height = 'auto';
                    rta.style.height = Math.min(Math.max(rta.scrollHeight, 36), 200) + 'px';
                    rta.focus();
                    rta.selectionStart = rta.selectionEnd = rta.value.length;
                }
            }
            if (editingReply) {
                const reta = itemsList.querySelector(`.edit-textarea[data-reply-edit][data-reply-id="${editingReply.replyId}"]`);
                if (reta) {
                    reta.style.height = 'auto';
                    reta.style.height = Math.min(Math.max(reta.scrollHeight, 44), 200) + 'px';
                    reta.focus();
                    reta.selectionStart = reta.selectionEnd = reta.value.length;
                }
            }
            if (tagEditingItemId) {
                const te = itemsList.querySelector(`#tagEditorInput-${tagEditingItemId}`);
                if (te) {
                    te.focus();
                    te.selectionStart = te.selectionEnd = te.value.length;
                }
            }
        }

        function escapeHtml(unsafe) {
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ===================================================================
        // Event delegation
        // ===================================================================
        itemsList.addEventListener('click', async (e) => {
            const replyTarget = e.target.closest('[data-reply-id]');
            if (replyTarget) {
                const itemId = replyTarget.dataset.id;
                const replyId = replyTarget.dataset.replyId;
                const action = replyTarget.dataset.action;
                if (!itemId || !replyId || !cloudUser) return;
                if (action === 'save-reply') { await saveReplyEdit(itemId, replyId); return; }
                if (action === 'cancel-reply') { editingReply = null; renderItems(); return; }
                if (action === 'toggle-reply') { await toggleReplyDone(itemId, replyId); return; }
                if (action === 'edit-reply') { editingReply = { itemId, replyId }; replyingToId = null; renderItems(); return; }
                if (action === 'delete-reply') { await deleteReply(itemId, replyId); return; }
                if (action === 'filter-tag') { toggleTagFilter(replyTarget.dataset.tag); return; }
                if (replyTarget.classList.contains('reply-text')) {
                    editingReply = { itemId, replyId };
                    replyingToId = null;
                    renderItems();
                    return;
                }
                return;
            }

            const target = e.target.closest('[data-id]');
            if (!target) return;
            const itemId = target.dataset.id;
            if (!itemId || !cloudUser) return;
            const action = target.dataset.action;

            if (action === 'save') { await saveEdit(itemId); return; }
            if (action === 'cancel') { editingItemId = null; renderItems(); return; }
            if (action === 'open-reply') {
                replyingToId = (replyingToId === itemId) ? null : itemId;
                editingReply = null;
                tagEditingItemId = null;
                if (replyingToId === itemId) { collapsedItems.delete(itemId); saveCollapseState(); }
                renderItems();
                return;
            }
            if (action === 'post-reply') { await postReply(itemId); return; }
            if (action === 'toggle-collapse') { toggleCollapse(itemId); return; }
            if (action === 'open-tag-editor') {
                tagEditingItemId = (tagEditingItemId === itemId) ? null : itemId;
                editingItemId = null;
                replyingToId = null;
                renderItems();
                return;
            }
            if (action === 'save-tags') { await saveItemTags(itemId); return; }
            if (action === 'cancel-tags') { tagEditingItemId = null; renderItems(); return; }
            if (action === 'filter-tag') { toggleTagFilter(target.dataset.tag); return; }

            if (editingItemId === itemId && !target.classList.contains('item-check')) return;

            if (target.classList.contains('item-check')) { await toggleItemDone(itemId); return; }
            if (target.classList.contains('pin-btn')) { await toggleItemPin(itemId); return; }
            if (target.classList.contains('edit-btn')) { startEdit(itemId); return; }
            if (target.classList.contains('del-btn')) { await deleteItem(itemId); return; }
            if (target.classList.contains('item-text')) { startEdit(itemId); return; }
        });

        function toggleTagFilter(tag) {
            const t = normalizeTag(tag);
            if (!t) return;
            if (activeTagFilters.has(t)) activeTagFilters.delete(t);
            else activeTagFilters.add(t);
            renderItems();
            updateTagToggle();
        }

        function toggleCollapse(itemId) {
            if (collapsedItems.has(itemId)) collapsedItems.delete(itemId);
            else {
                collapsedItems.add(itemId);
                if (replyingToId === itemId) replyingToId = null;
                if (editingReply && editingReply.itemId === itemId) editingReply = null;
            }
            saveCollapseState();
            renderItems();
        }

        async function saveItemTags(itemId) {
            const input = itemsList.querySelector(`#tagEditorInput-${itemId}`);
            if (!input) return;
            const newTags = parseTagString(input.value);
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            item.tags = newTags;
            tagEditingItemId = null;
            renderItems();
            try {
                await itemsCollectionRef().doc(itemId).update({
                    tags: newTags,
                    updatedAt: Date.now(),
                });
            } catch (error) {
                console.error('Error saving tags:', error);
                alert('Could not save tags. Check your connection.');
            }
        }

        itemsList.addEventListener('keydown', (e) => {
            const input = e.target;
            if (!input.matches || !input.matches('[id^="tagEditorInput-"]')) return;
            const itemId = input.id.replace('tagEditorInput-', '');
            if (e.key === 'Enter') {
                e.preventDefault();
                saveItemTags(itemId);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                tagEditingItemId = null;
                renderItems();
            }
        });

        itemsList.addEventListener('dblclick', (e) => {
            const textEl = e.target.closest('.item-text');
            if (textEl) {
                const itemId = textEl.dataset.id;
                if (!itemId) return;
                startEdit(itemId);
                return;
            }
            const replyEl = e.target.closest('.reply-text');
            if (replyEl) {
                const itemId = replyEl.dataset.id;
                const replyId = replyEl.dataset.replyId;
                if (!itemId || !replyId) return;
                editingReply = { itemId, replyId };
                replyingToId = null;
                renderItems();
            }
        });

        function startEdit(itemId) {
            editingItemId = itemId;
            editingReply = null;
            tagEditingItemId = null;
            renderItems();
        }

        async function saveEdit(itemId) {
            const ta = itemsList.querySelector(`.edit-textarea[data-id="${itemId}"]:not([data-reply-edit])`);
            if (!ta) return;
            const newText = ta.value.replace(/[ \t]+$/gm, '').trim();
            if (!newText) {
                alert('Item text cannot be empty. Press Cancel to keep the original.');
                return;
            }
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            if (newText === item.text) { editingItemId = null; renderItems(); return; }
            try {
                await itemsCollectionRef().doc(itemId).update({
                    text: newText,
                    updatedAt: Date.now(),
                });
                editingItemId = null;
            } catch (error) {
                console.error('Error saving edit:', error);
                alert('Could not save edit. Check your connection.');
            }
        }

        async function toggleItemDone(itemId) {
            if (!cloudUser) return;
            if (editingItemId === itemId) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            try {
                await itemsCollectionRef().doc(itemId).update({
                    done: !item.done,
                    updatedAt: Date.now()
                });
            } catch (error) {
                console.error('Error toggling item:', error);
                alert('Could not update item. Please try again.');
            }
        }

        async function toggleItemPin(itemId) {
            if (!cloudUser) return;
            if (editingItemId === itemId) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            try {
                await itemsCollectionRef().doc(itemId).update({
                    pinned: !item.pinned,
                    updatedAt: Date.now()
                });
            } catch (error) {
                console.error('Error toggling pin:', error);
                alert('Could not update pin. Please try again.');
            }
        }

        async function deleteItem(itemId) {
            if (!cloudUser) return;
            if (!confirm('Delete this item and all its replies?')) return;
            try {
                await itemsCollectionRef().doc(itemId).delete();
                if (editingItemId === itemId) editingItemId = null;
                if (replyingToId === itemId) replyingToId = null;
                if (editingReply && editingReply.itemId === itemId) editingReply = null;
                if (tagEditingItemId === itemId) tagEditingItemId = null;
                if (collapsedItems.has(itemId)) { collapsedItems.delete(itemId); saveCollapseState(); }
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Could not delete item.');
            }
        }

        // ===================================================================
        // Reply actions
        // ===================================================================
        function makeReplyId() {
            return 'r_' + Date.now().toString(36) + '_' +
                   Math.random().toString(36).slice(2, 8);
        }

        async function postReply(itemId) {
            const ta = itemsList.querySelector(`textarea[data-reply-input][data-id="${itemId}"]`);
            if (!ta) return;
            const text = ta.value.replace(/[ \t]+$/gm, '').trim();
            if (!text) { ta.focus(); return; }
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            const now = Date.now();
            const inlineTags = parseTagString(text);
            const cleanText = text.replace(/#[a-z0-9\-_]+/gi, '').replace(/\s+/g, ' ').trim() || text;
            const newReply = {
                id: makeReplyId(),
                text: cleanText,
                done: false,
                tags: inlineTags,
                createdAt: now,
                updatedAt: now,
            };
            const updatedReplies = (Array.isArray(item.replies) ? item.replies : []).concat(newReply);
            item.replies = updatedReplies;
            replyingToId = null;
            collapsedItems.delete(itemId);
            saveCollapseState();
            renderItems();
            try {
                await itemsCollectionRef().doc(itemId).update({
                    replies: updatedReplies,
                    updatedAt: now,
                });
            } catch (error) {
                console.error('Error posting reply:', error);
                alert('Could not post reply. Check your connection.');
            }
        }

        async function saveReplyEdit(itemId, replyId) {
            const ta = itemsList.querySelector(`.edit-textarea[data-reply-edit][data-reply-id="${replyId}"]`);
            if (!ta) return;
            const newText = ta.value.replace(/[ \t]+$/gm, '').trim();
            if (!newText) {
                alert('Reply cannot be empty. Press Cancel to keep the original.');
                return;
            }
            const item = itemsArray.find(i => i.id === itemId);
            if (!item || !Array.isArray(item.replies)) return;
            const idx = item.replies.findIndex(r => r.id === replyId);
            if (idx === -1) return;
            const inlineTags = parseTagString(newText);
            const cleanText = newText.replace(/#[a-z0-9\-_]+/gi, '').replace(/\s+/g, ' ').trim() || newText;
            const updatedReplies = item.replies.slice();
            updatedReplies[idx] = Object.assign({}, updatedReplies[idx], {
                text: cleanText,
                tags: inlineTags,
                updatedAt: Date.now(),
            });
            item.replies = updatedReplies;
            editingReply = null;
            renderItems();
            try {
                await itemsCollectionRef().doc(itemId).update({
                    replies: updatedReplies,
                    updatedAt: Date.now(),
                });
            } catch (error) {
                console.error('Error saving reply edit:', error);
                alert('Could not save reply edit. Check your connection.');
            }
        }

        async function toggleReplyDone(itemId, replyId) {
            if (!cloudUser) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item || !Array.isArray(item.replies)) return;
            const idx = item.replies.findIndex(r => r.id === replyId);
            if (idx === -1) return;
            const updatedReplies = item.replies.slice();
            updatedReplies[idx] = Object.assign({}, updatedReplies[idx], {
                done: !updatedReplies[idx].done,
                updatedAt: Date.now(),
            });
            item.replies = updatedReplies;
            renderItems();
            try {
                await itemsCollectionRef().doc(itemId).update({
                    replies: updatedReplies,
                    updatedAt: Date.now(),
                });
            } catch (error) {
                console.error('Error toggling reply:', error);
                alert('Could not update reply. Please try again.');
            }
        }

        async function deleteReply(itemId, replyId) {
            if (!cloudUser) return;
            if (!confirm('Delete this reply?')) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item || !Array.isArray(item.replies)) return;
            const updatedReplies = item.replies.filter(r => r.id !== replyId);
            item.replies = updatedReplies;
            if (editingReply && editingReply.replyId === replyId) editingReply = null;
            renderItems();
            try {
                await itemsCollectionRef().doc(itemId).update({
                    replies: updatedReplies,
                    updatedAt: Date.now(),
                });
            } catch (error) {
                console.error('Error deleting reply:', error);
                alert('Could not delete reply.');
            }
        }

        // ===================================================================
        // Auto-close empty reply box on click outside
        // ===================================================================
        document.addEventListener('mousedown', (e) => {
            if (!replyingToId) return;
            if (editingReply) return;
            const inReplyBox = e.target.closest && e.target.closest('.reply-add-row');
            const onReplyToggle = e.target.closest && e.target.closest('.reply-btn');
            const onCollapseToggle = e.target.closest && e.target.closest('.reply-chip');
            const onItemCard = e.target.closest && e.target.closest('.item');
            if (inReplyBox) return;
            if (onReplyToggle) return;
            if (onCollapseToggle) return;
            if (onItemCard) {
                const sameItem = onItemCard.dataset && onItemCard.dataset.id === replyingToId;
                if (sameItem) {
                    const actionBtn = e.target.closest('button, .item-text, .item-check, .reply-chip, .tag-chip');
                    if (actionBtn) return;
                }
            }
            const ta = itemsList.querySelector(`textarea[data-reply-input][data-id="${replyingToId}"]`);
            const hasDraft = ta && ta.value.trim().length > 0;
            if (!hasDraft) { replyingToId = null; renderItems(); }
        });

        // ===================================================================
        // Keyboard inside edit textareas
        // ===================================================================
        itemsList.addEventListener('keydown', (e) => {
            const ta = e.target;
            if (ta.matches && ta.matches('textarea[data-reply-input]')) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    postReply(ta.dataset.id);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    replyingToId = null;
                    renderItems();
                }
                return;
            }
            if (!ta.classList || !ta.classList.contains('edit-textarea')) return;
            const itemId = ta.dataset.id;
            if (ta.dataset.replyEdit) {
                const replyId = ta.dataset.replyId;
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    saveReplyEdit(itemId, replyId);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    editingReply = null;
                    renderItems();
                }
                return;
            }
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                saveEdit(itemId);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                editingItemId = null;
                renderItems();
            }
        });

        itemsList.addEventListener('input', (e) => {
            const ta = e.target;
            if (ta.matches && ta.matches('textarea[data-reply-input]')) {
                ta.style.height = 'auto';
                ta.style.height = Math.min(Math.max(ta.scrollHeight, 36), 200) + 'px';
            }
        });

        // ===================================================================
        // Newline insertion
        // ===================================================================
        function insertNewlineAtCursor() {
            const start = itemInput.selectionStart;
            const end = itemInput.selectionEnd;
            const value = itemInput.value;
            let insertion = '\n';
            if (bulletMode) {
                const lineStart = value.lastIndexOf('\n', start - 1) + 1;
                const beforeCursor = value.slice(lineStart, start);
                insertion = (beforeCursor.trim() === '' && start === lineStart)
                    ? '• '
                    : '\n• ';
            }
            itemInput.value = value.slice(0, start) + insertion + value.slice(end);
            const newPos = start + insertion.length;
            itemInput.selectionStart = itemInput.selectionEnd = newPos;
            itemInput.focus();
            autoResizeInput();
        }
        newlineBtn.addEventListener('click', (e) => {
            e.preventDefault();
            insertNewlineAtCursor();
        });

        // ===================================================================
        // Add new item
        // ===================================================================
        async function addNewItem() {
            if (!cloudUser) {
                alert('Please sign in with Google to save your notes.');
                return;
            }
            const rawText = itemInput.value.replace(/[ \t]+$/gm, '').trim();
            if (!rawText) { itemInput.focus(); return; }

            if (tagPanelOpen && tagInput.value.trim()) {
                const liveTags = parseTagString(tagInput.value);
                if (liveTags.length) pendingTags = mergeTags(pendingTags, liveTags);
                tagInput.value = '';
            }

            const inlineTags = parseTagString(rawText);
            const cleanText = rawText.replace(/#[a-z0-9\-_]+/gi, '').replace(/\s+/g, ' ').trim() || rawText;
            const finalTags = mergeTags(pendingTags, inlineTags);

            const ref = itemsCollectionRef();
            if (!ref) return;

            addBtn.disabled = true;
            addBtn.innerHTML = '<span class="loading-spinner"></span>';
            setCloudStatus('pending');

            const newDocRef = ref.doc();
            const now = Date.now();
            const optimisticItem = {
                id: newDocRef.id,
                text: cleanText,
                done: false,
                pinned: false,
                tags: finalTags,
                createdAt: now,
                updatedAt: now,
                replies: [],
            };

            itemsArray.unshift(optimisticItem);
            renderItems();

            itemInput.value = bulletMode ? '• ' : '';
            pendingTags = [];
            renderPendingTags();
            updateTagToggle();
            // Auto-close the tag panel after posting
            tagPanelOpen = false;
            tagPanel.classList.remove('open');
            tagToggleLink.classList.remove('open');
            manuallyResized = false;
            itemInput.style.height = '';
            autoResizeInput();
            itemInput.focus();
            itemInput.selectionStart = itemInput.selectionEnd = itemInput.value.length;

            try {
                await newDocRef.set({
                    text: cleanText,
                    done: false,
                    pinned: false,
                    tags: finalTags,
                    createdAt: now,
                    updatedAt: now,
                    replies: [],
                });
            } catch (error) {
                console.error('Error adding item:', error);
                alert('Could not add item. Check your connection.');
                setCloudStatus('error');
                itemsArray = itemsArray.filter(i => i.id !== newDocRef.id);
                renderItems();
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '+';
            }
        }
        addBtn.addEventListener('click', addNewItem);

        // ===================================================================
        // Main input keyboard
        // ===================================================================
        itemInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') {
                if (e.key === 'Escape') {
                    itemInput.value = bulletMode ? '• ' : '';
                    manuallyResized = false;
                    itemInput.style.height = '';
                    autoResizeInput();
                    itemInput.selectionStart = itemInput.selectionEnd = itemInput.value.length;
                }
                return;
            }
            const value = itemInput.value;
            const pos = itemInput.selectionStart;
            const lineStart = value.lastIndexOf('\n', pos - 1) + 1;
            const currentLine = value.slice(lineStart, pos);
            const isEmptyBulletLine = /^•\s*$/.test(currentLine);
            if (!e.shiftKey) {
                e.preventDefault();
                if (bulletMode && isEmptyBulletLine) {
                    const cleaned = value.slice(0, lineStart) + value.slice(pos);
                    itemInput.value = cleaned.replace(/[ \t]+$/gm, '').trim();
                }
                addNewItem();
                return;
            }
            e.preventDefault();
            insertNewlineAtCursor();
        });
        itemInput.addEventListener('input', autoResizeInput);

        // ===================================================================
        // Search
        // ===================================================================
        searchInput.addEventListener('input', () => {
            searchQuery = searchInput.value;
            searchClearBtn.classList.toggle('hidden', searchQuery.length === 0);
            renderItems();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                e.preventDefault();
                clearSearch();
            }
        });
        searchClearBtn.addEventListener('click', () => { clearSearch(); });
        function clearSearch() {
            searchQuery = '';
            searchInput.value = '';
            searchClearBtn.classList.add('hidden');
            renderItems();
            searchInput.focus();
        }

        // ===================================================================
        // Init
        // ===================================================================
        window.addEventListener('load', () => {
            loadPrefs();
            loadCollapseState();
            setBulletMode(bulletMode, true);
            if (bulletMode && itemInput.value === '') {
                itemInput.value = '• ';
                itemInput.selectionStart = itemInput.selectionEnd = 2;
            }
            autoResizeInput();
            renderPendingTags();
            updateTagToggle();
            setTimeout(() => {
                if (!cloudUser) {
                    syncStatus.textContent = '☁️ Sign in to sync';
                }
            }, 500);
        });
    </script>
</body>
</html>
