        /* Numbered lists (from the "/" menu or the item hover panel's
           Number conversion) previously used the browser's default <ol>
           styling (~40px left padding, ~1em top/bottom margin), which
           didn't line up with bullet or checkbox lines at ~20px. Matching
           padding/margin here keeps all three markers flush together. */
        [contenteditable="true"] ol {
            padding-left: 20px;
            margin: 0;
        }

        [contenteditable="true"] ol li {
            margin-bottom: 0px;
        }

        /* Hanging indent for checkbox lines. A checkbox line is a plain
           <div><input type="checkbox"> text...</div> — with no special
           handling, long text wraps back to the div's left edge, landing
           directly under the checkbox instead of lining up with the text
           itself. Flex layout fixes that: the checkbox becomes a fixed-
           width column and the text (an anonymous flex item) wraps within
           its own column, staying aligned under itself, not the checkbox. */
        [contenteditable="true"] div:has(> input[type="checkbox"]) {
            display: flex;
            align-items: flex-start;
        }

        [contenteditable="true"] div:has(> input[type="checkbox"]) > input[type="checkbox"] {
            flex: 0 0 auto;

/* Add to your existing CSS */
.floating-btn-group {
    position: fixed;
    top: 50%;
    right: max(2.5vw, 20px);
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 1000;
}

.floating-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background-color: rgba(220, 220, 220, 0.85); /* Light grey with transparency */
    color: #333;
    border: 1px solid rgba(255, 255, 255, 0.9);
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    opacity: 0.9;
    backdrop-filter: blur(2px);
}

.floating-btn:hover {
    opacity: 1;
    transform: scale(1.1);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
}

#floating-save {
    background-color: rgba(128, 0, 128, 0.7);
    color: white;
}

#floating-save:hover {
    background-color: rgba(106, 13, 173, 0.9);
}

#floating-bullet::before {
    content: "•";
    font-size: 24px;
    line-height: 1;
}

#floating-checkbox::before {
    content: "✓";
    font-size: 18px;
}

/* Animation for button feedback */
@keyframes floatBtnBounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

.floating-btn.clicked {
    animation: floatBtnBounce 0.3s ease;
}

/* Floating "Add table" bar: bottom-center, replaces the old
   secondary-toolbar / bottom-toolbar which just duplicated these same
   five buttons at different scroll positions. One floating bar stays
   visible everywhere instead. */
.floating-add-bar {
    position: fixed;
    bottom: max(2vh, 14px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    gap: 6px;
    max-width: 96vw;
    overflow-x: auto;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(3px);
    padding: 6px 8px;
    border-radius: 24px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    z-index: 1000;
}

.floating-add-bar button {
    margin: 0;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 13px;
    white-space: nowrap;
    flex: 0 0 auto;
}

/* Selection-triggered floating formatting toolbar (appears when you
   select text inside a cell — same pattern as the Outliner's floating
   inline toolbar). Bold/Italic/Underline/Strike live here now instead
   of sitting in the top toolbar at all times. */
#selection-toolbar {
    position: fixed;
    display: none;
    align-items: center;
    gap: 2px;
    background: #222;
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    z-index: 3000;
}

#selection-toolbar.show {
    display: flex;
}

#selection-toolbar button {
    margin: 0;
    padding: 5px 9px;
    background: transparent;
    color: #fff;
    font-size: 13px;
    border-radius: 4px;
}

#selection-toolbar button:hover {
    background: #444;
}

/* Wrapper for deletable tables (Add New Table / Review / Summary / Single) */
.table-wrapper {

/* Per-item hover control (☰): appears next to a bullet-list item on

.item-hover-icon {
    position: fixed;

    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;

}

.item-hover-icon.show {

}

.item-hover-icon:hover {

}

.item-hover-panel {
    position: fixed;
    display: none;
    flex-direction: column;
    background: #222;
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);

.item-hover-panel button {

}

.item-hover-panel button:hover {
    background: #444;
}

.item-hover-panel-divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.15);
    margin: 3px 2px;
}

.item-hover-panel button.active {
    background: #444;
    color: #7fd0ff;
}

/* Line-level "mark as complete" state, set via the ☰ hover panel.
   Mirrors Outliner's node.done styling: strikethrough + faded. */
.line-done {
    text-decoration: line-through;
    opacity: 0.55;
}

/* Collapse/expand toggle (▸/▾), shown left of the ☰ icon only when a
   line has deeper-indented lines following it (its "children"). */
.line-collapse-toggle {
    position: fixed;
    display: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background-color: rgba(0, 0, 0, 0.15);
    color: #444;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    z-index: 2500;
    user-select: none;
}
.line-collapse-toggle.show { display: flex; }
.line-collapse-toggle.has-children { display: flex; }
.line-collapse-toggle:hover { background-color: rgba(0, 0, 0, 0.3); }

/* Drag handle (⠿), shown left of the ☰ icon; drag it onto another
   line to reorder — mirrors Outliner's draggable bullet. */
.line-drag-handle {
    position: fixed;
    display: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 18px;
    border-radius: 3px;
    background-color: rgba(0, 0, 0, 0.15);
    color: #444;
    font-size: 11px;
    line-height: 1;
    cursor: grab;
    z-index: 2500;
    user-select: none;
}
.line-drag-handle.show { display: flex; }
.line-drag-handle:hover { background-color: rgba(0, 0, 0, 0.3); }
.line-drag-handle:active { cursor: grabbing; }

/* A line currently being dragged. */
.line-dragging { opacity: 0.4; }

/* Drop position indicator on the line being hovered over while dragging. */
.line-drop-before { box-shadow: inset 0 2px 0 0 #2d8cff; }
.line-drop-after { box-shadow: inset 0 -2px 0 0 #2d8cff; }

/* Children hidden by a collapsed parent line. */
.line-child-hidden { display: none !important; }

/* Color popover: shared by the item hover panel and the selection
   toolbar for picking a text color or background color. */
.color-popover {
    position: fixed;
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    width: 116px;
    background: #fff;
    border-radius: 6px;
    padding: 7px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    z-index: 4000;
}

.color-popover.show {
    display: flex;
}

.color-swatch {
    width: 20px;
    height: 20px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.2);
    cursor: pointer;

.color-swatch:hover {
    transform: scale(1.12);
}

.color-swatch.clear {
    background-image:
        linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%),
        linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%);
    background-size: 8px 8px;
    background-position: 0 0, 4px 4px;
}

.color-swatch-custom {

    padding: 0;
    margin: 0;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 50%;
    cursor: pointer;
    overflow: hidden;
}

    // Creates a table wrapped with a small delete (×) button so it can be
    // removed later. Used by all "Add ..." table functions below — the
    // original mainTable is never wrapped, so it can't be deleted.
    function createDeletableTable(rowsHtml) {
        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';

        const newTable = document.createElement('table');
        newTable.innerHTML = rowsHtml;

        const delBtn = document.createElement('button');
        delBtn.className = 'table-delete-btn';
        delBtn.title = 'Delete this table';
        delBtn.textContent = '×';
        delBtn.onclick = function () {
            if (confirm('Delete this table? This cannot be undone.')) {
                wrapper.remove();
            }
        };

        wrapper.appendChild(newTable);
        wrapper.appendChild(delBtn);
        document.getElementById('tablesContainer').appendChild(wrapper);

        // Scroll to the new table and drop the cursor into its first
        // editable cell, so you can start typing immediately instead of
        // scrolling down and clicking in by hand.
        wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const firstCell = newTable.querySelector('[contenteditable="true"]');
        if (firstCell) {
            setTimeout(function () {
                firstCell.focus();
                const range = document.createRange();
                range.selectNodeContents(firstCell);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }, 300);
        }

        return wrapper;
    }

    async function saveFile() {
        try {
            const defaultTitle = document.getElementById('pageTitle').innerText.trim() || 'Untitled';
            const options = {
                suggestedName: `${defaultTitle}.html`,
                types: [
                    {
                        description: 'HTML Files',
                        accept: {
                            'text/html': ['.html'],
                        },
                    },
                ],
            };

            const fileHandle = await window.showSaveFilePicker(options);
            const writableStream = await fileHandle.createWritable();
            await writableStream.write(document.documentElement.outerHTML);
            await writableStream.close();
            console.log('File saved successfully.');
        } catch (error) {
            console.error('Error saving file:', error);
        }
    }

    async function openFile() {
        try {
            const [fileHandle] = await window.showOpenFilePicker({
                types: [
                    {
                        description: 'HTML Files',
                        accept: {
                            'text/html': ['.html'],
                        },
                    },
                ],
            });

            const file = await fileHandle.getFile();
            // IMPORTANT: don't load the content via innerHTML — browsers
            // never execute <script> tags inserted that way, which is why
            // the item hover panel, selection toolbar, and color pickers
            // (all built by JS at page load) used to disappear after
            // Save → Open. Navigating to the file's actual bytes via a
            // blob URL triggers a real page load instead, so every script
            // runs again exactly as if the file had been opened fresh.
            const url = URL.createObjectURL(file);
            window.location.href = url;
            console.log('File opened successfully.');
        } catch (error) {
            console.error('Error opening file:', error);
        }
    }

    function insertBulletPoint() {
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            const parentBlock = range.startContainer.parentElement;
            const editor = parentBlock.closest('[contenteditable="true"]');
            if (!editor) return;
            let ul = parentBlock.closest('ul');
            if (!ul || parentBlock === editor) {
                ul = document.createElement('ul');
                ul.classList.add('custom-bullet-list');
                range.insertNode(ul);
            }
            const li = document.createElement('li');
            li.appendChild(document.createTextNode('\u200B'));
            ul.appendChild(li);
            const newRange = document.createRange();
            newRange.setStart(li, 0);
            newRange.setEnd(li, 0);
            selection.removeAllRanges();
            selection.addRange(newRange);
        }
    }

    // Indent step used by Sub/Outdent (Tab / Shift+Tab / hover panel).
    // Uses 'ch' units (~1 character width) instead of the browser's
    // default execCommand('indent'), which jumps ~40px per level.
    const INDENT_STEP_CH = 3;

    // Finds the actual editable "line" element containing `node` — a
    // bullet <li>, or a div/p that holds real line content (not a
    // wrapper around a <ul>/<ol>/table/nested div). Climbs ancestor by
    // ancestor checking each one, rather than assuming the line always
    // sits exactly one level below the editable root: some lines (e.g.
    // a checkbox line converted from a bullet item) end up nested two
    // levels deep, inside the wrapper div that also holds the cell's
    // <ul class="custom-bullet-list">. Assuming a fixed depth there
    // used to return that wrapper div itself, so indenting it shifted
    // everything inside it — looking like the whole cell/document
    // indented.
    function isLineCandidateEl(el) {
        if (!el || el.nodeType !== 1) return false;
        const tag = el.tagName;
        if (tag === 'LI') return true;
        if (tag === 'DIV' || tag === 'P') {
            for (const child of el.children) {
                if (['UL', 'OL', 'TABLE', 'DIV'].includes(child.tagName)) return false;
            }
            return true;
        }
        return false;
    }

    function getLineElement(node) {
        if (!node) return null;
        if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
        const editable = node.closest && node.closest('[contenteditable="true"]');
        if (!editable || node === editable) return null;
        let cur = node;
        while (cur && cur !== editable) {
            if (isLineCandidateEl(cur)) return cur;
            cur = cur.parentElement;
        }
        return null;
    }

    function currentIndentCh(line) {
        const match = /^(-?\d*\.?\d+)ch$/.exec(line.style.marginLeft || '');
        return match ? parseFloat(match[1]) : 0;
    }

    function adjustLineIndent(line, deltaSteps) {
        if (!line) return;
        const next = Math.max(0, currentIndentCh(line) + deltaSteps * INDENT_STEP_CH);
        line.style.marginLeft = next ? next + 'ch' : '';
    }

    function insertSubBullet() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const line = getLineElement(sel.getRangeAt(0).startContainer);
        adjustLineIndent(line, 1);
    }

    function outdentCurrentLine() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const line = getLineElement(sel.getRangeAt(0).startContainer);
        adjustLineIndent(line, -1);
    }

    function insertCheckbox() {
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.style.marginRight = '5px';
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            range.deleteContents();
            const parentBlock = range.startContainer.parentElement;
            const editor = parentBlock.closest('[contenteditable="true"]');
            if (!editor || parentBlock === editor) {
                const newLine = document.createElement('div');
                newLine.appendChild(checkbox);
                newLine.appendChild(document.createTextNode(' '));
                range.insertNode(newLine);
            } else {
                range.insertNode(document.createTextNode(' '));
                range.insertNode(checkbox);
            }
            const newRange = document.createRange();
            newRange.setStartAfter(checkbox);
            newRange.setEndAfter(checkbox);
            selection.removeAllRanges();
            selection.addRange(newRange);
        }
    }

    function insertChecklist() {
        const list = document.createElement('ul');
        list.style.listStyleType = 'none';
        list.style.padding = '0';
        const labels = [' ', ' ', ' '];
        let firstCheckbox = null;
        labels.forEach((label, index) => {
            const listItem = document.createElement('li');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            if (index === 0) {
                firstCheckbox = checkbox;
            }
            listItem.appendChild(checkbox);
            listItem.appendChild(document.createTextNode(' ' + label));
            list.appendChild(listItem);
        });
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            range.deleteContents();
            const container = document.createElement('div');
            container.appendChild(list);
            range.insertNode(container);
            if (firstCheckbox) {
                const newRange = document.createRange();
                newRange.setStartAfter(firstCheckbox);
                newRange.setEndAfter(firstCheckbox);
                selection.removeAllRanges();
                selection.addRange(newRange);
            }
        }
    }

    window.applyFormat = function (format) {
        const contextMenu = document.getElementById("contextMenu");
        contextMenu.style.display = "none";
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            switch (format) {
                case "bold":
                    document.execCommand("bold");
                    break;
                case "copy":
                    document.execCommand("copy");
                    break;
                case "paste":
                    navigator.clipboard.readText().then((text) => {
                        range.deleteContents();
                        range.insertNode(document.createTextNode(text));
                    }).catch((err) => {
                        console.error("Failed to paste: ", err);
                        alert("Paste failed. Please ensure the page is served over HTTPS or localhost.");
                    });
                    break;
                case "strikeThrough":
                    document.execCommand("strikeThrough");
                    break;
            }
        }
    };

    function isCursorAtBeginningOfLine() {
        const selection = window.getSelection();
        if (!selection.rangeCount) return false;
        const range = selection.getRangeAt(0);
        if (!range.collapsed) return false;
        if (range.startContainer.nodeType === Node.TEXT_NODE && range.startOffset === 0) return true;
        if (range.startOffset === 0) {
            const node = range.startContainer;
            const parentBlock = node.parentElement;
            if (parentBlock.getAttribute('contenteditable') === 'true' && 
                (parentBlock.firstChild === node || node.previousSibling === null)) {
                return true;
            }
            if (node.nodeType === Node.ELEMENT_NODE && 
                (node.tagName === 'DIV' || node.tagName === 'P')) {
                return true;
            }
        }
        return false;
    }

    document.addEventListener("keydown", function (event) {
        if (event.key === "/" && isCursorAtBeginningOfLine()) {
            event.preventDefault();
            if (placeholder) removePlaceholder();
            if (menu) menu.remove();
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            placeholder = insertPlaceholder(range);
            showMenu(range.startContainer.parentElement, range);
        }
    });

    function insertPlaceholder(range) {
        const span = document.createElement("span");
        span.textContent = "/";
        span.style.color = "black";
        span.classList.add("slash-placeholder");
        range.insertNode(span);
        return span;
    }

    function showMenu(target, range) {
        menu = document.createElement("div");
        menu.classList.add("options-menu");
        menu.innerHTML = `
            <button onclick="applyOption('bullet')">• Bullet List</button>
            <button onclick="applyOption('checkbox')">☑ Checklist</button>
            <button onclick="applyOption('number')">1. Number List</button>
            <button onclick="applyOption('hr')">— Horizontal Line</button>
        `;
        document.body.appendChild(menu);
        const rect = target.getBoundingClientRect();
        menu.style.left = `${rect.left}px`;
        menu.style.top = `${rect.top + window.scrollY + 25}px`;
        requestAnimationFrame(() => {
            menu.style.opacity = "1";
            menu.style.transform = "scale(1)";
        });
        document.addEventListener("click", closeMenuOnClickOutside, true);
    }

    function closeMenuOnClickOutside(event) {
        if (menu && !menu.contains(event.target)) {
            cleanupMenu();
        }
    }

    function cleanupMenu() {
        if (menu) {
            menu.remove();
            menu = null;
        }
        removePlaceholder();
        document.removeEventListener("click", closeMenuOnClickOutside, true);
    }

    function removePlaceholder() {
        if (placeholder) {
            placeholder.remove();
            placeholder = null;
        }
    }

    window.applyOption = function(option) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        const range = selection.getRangeAt(0);
        range.deleteContents();
        switch(option) {
            case "bullet":
                insertBulletPoint();
                break;
            case "number":
                document.execCommand("insertOrderedList");
                break;
            case "checkbox":
                insertCheckbox();
                break;
            case "hr":
                document.execCommand("insertHorizontalRule");
                break;
        }
        cleanupMenu();
    };

    document.addEventListener('DOMContentLoaded', function() {
        const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
        dropdownToggles.forEach(toggle => {
            toggle.addEventListener('click', function(event) {
                event.stopPropagation();
                const dropdown = this.parentElement;
                const dropdownContent = dropdown.querySelector('.dropdown-content');
                document.querySelectorAll('.dropdown-content').forEach(content => {
                    if (content !== dropdownContent) {
                        content.classList.remove('show');
                    }
                });
                dropdownContent.classList.toggle('show');
            });
        });
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown-content').forEach(content => {
                    content.classList.remove('show');
                });
            }
        });
    });


function insertCheckboxInCell(button) {
    // Find the parent cell
    const cell = button.closest('td');
    
    // Create a new line with checkbox
    const newLine = document.createElement('div');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.style.marginRight = '5px';
    
    // Add some space after the checkbox
    const space = document.createTextNode(' ');
    
    // Create a zero-width space to position cursor
    const zeroWidthSpace = document.createTextNode('\u200B');
    
    newLine.appendChild(checkbox);
    newLine.appendChild(space);
    newLine.appendChild(zeroWidthSpace);
    
    // Append to the cell
    cell.appendChild(newLine);
    
    // Set focus to the new line
    const range = document.createRange();
    range.setStart(zeroWidthSpace, 0);
    range.setEnd(zeroWidthSpace, 0);
    
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    
    // Scroll to the new checkbox if needed
    newLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.addEventListener('keydown', function(event) {
    // Check if Enter key was pressed
    if (event.key === 'Enter') {
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        
        const range = selection.getRangeAt(0);
        const container = range.startContainer;
        
        // Find the current line element (could be div, p, li, etc.)
        let currentLine = container;
        while (currentLine && currentLine.nodeType === Node.TEXT_NODE) {
            currentLine = currentLine.parentNode;
        }
        
        if (!currentLine) return;
        
        // Check if current line has a checkbox
        const hasCheckbox = currentLine.querySelector('input[type="checkbox"]');
        
        // Check if current line starts with a bullet
        const hasBullet = currentLine.textContent.trim().startsWith('•') || 
                         currentLine.querySelector('span[style*="margin-right: 5px"]');
        
        // Prevent default Enter behavior
        event.preventDefault();
        
        // Create new line based on current line type
        if (hasCheckbox) {
            insertNewCheckboxLine(currentLine);
        } else if (hasBullet) {
            insertNewBulletLine(currentLine);
        } else {
            // Default behavior - just insert a new line
            document.execCommand('insertParagraph', false);
        }
    }
});

function insertNewCheckboxLine(currentLine) {
    const newLine = document.createElement('div');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.style.marginRight = '5px';
    
    // Add some space after the checkbox
    const space = document.createTextNode(' ');
    
    newLine.appendChild(checkbox);
    newLine.appendChild(space);
    
    // Insert after current line
    currentLine.parentNode.insertBefore(newLine, currentLine.nextSibling);
    
    // Set focus to the new line
    const range = document.createRange();
    range.setStart(space, 1);
    range.collapse(true);
    
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
}

        // --- Shared color-popover helper (used by both the selection

        // --- Floating selection toolbar (Bold/Italic/Underline/Strike) ---
        (function () {

            function getEditableAncestor(node) {

                const el = node.nodeType === 1 ? node : node.parentElement;
                return el ? el.closest('[contenteditable="true"]') : null;
            }

            function hideSelToolbar() {
                selToolbar.classList.remove('show');
            }

            function updateSelToolbar() {
                const selection = window.getSelection();
                if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
                    hideSelToolbar();
                    return;
                }
                const range = selection.getRangeAt(0);
                if (!getEditableAncestor(range.commonAncestorContainer)) {
                    hideSelToolbar();
                    return;
                }
                const rect = range.getBoundingClientRect();
                if (rect.width === 0 && rect.height === 0) {
                    hideSelToolbar();
                    return;
                }
                selToolbar.classList.add('show');
                const tbRect = selToolbar.getBoundingClientRect();
                let top = rect.top - tbRect.height - 8;
                if (top < 4) top = rect.bottom + 8;
                let left = rect.left + (rect.width / 2) - (tbRect.width / 2);
                left = Math.max(4, Math.min(left, window.innerWidth - tbRect.width - 4));
                selToolbar.style.top = top + 'px';
                selToolbar.style.left = left + 'px';

            // Keep the text selection intact when clicking a toolbar button
            selToolbar.addEventListener('mousedown', function (e) {
                e.preventDefault();

            const selBgColorBtn = document.getElementById('sel-bg-color-btn');
            const selTextColorPopover = createColorPopover();
            const selBgColorPopover = createColorPopover();
            let savedRange = null;

            function saveSelection() {
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
            }
            function restoreSelection() {
                if (!savedRange) return;
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);

        (function () {

            const doneBtn = makePanelButton('✓ Mark as complete', 'Mark this line complete (strikethrough)');
            const boldBtn = makePanelButton('B Bold', 'Bold this entire line');
            const divider1 = document.createElement('div');
            divider1.className = 'item-hover-panel-divider';
            hoverPanel.appendChild(divider1);
            const itemTextColorBtn = makePanelButton('A Text Color', 'Set text color for this item');
            const itemBgColorBtn = makePanelButton('▧ Background', 'Set background color for this item');
            const divider2 = document.createElement('div');
            divider2.className = 'item-hover-panel-divider';

            const outdentBtn = makePanelButton('Outdent (Shift+Tab)', 'Outdent this item');
            document.body.appendChild(hoverPanel);

            const itemBgColorPopover = createColorPopover();

            function applyLineTextColor(line, color) {
                if (!line) return;

            function applyLineBgColor(line, color) {

                    line.style.borderRadius = '4px';
                } else {
                    line.style.removeProperty('background-color');
                    line.style.removeProperty('padding');
                    line.style.removeProperty('border-radius');
                }
            }

            let currentLine = null;
            let hideTimer = null;

            // A "line" is: a bullet/number list item (li); a div whose
            // first real child is a checkbox; or any other plain div/p
            // line that doesn't itself wrap block-level content (so
            // wrapper divs holding a ul aren't mistaken for a line).
            function isTargetLine(el) {
                if (!el || el.nodeType !== 1) return false;
                if (!el.closest('[contenteditable="true"]')) return false;
                const tag = el.tagName;
                if (tag === 'LI') return true;
                if (tag === 'DIV' || tag === 'P') {
                    for (const child of el.children) {
                        if (['UL', 'OL', 'TABLE', 'DIV'].includes(child.tagName)) return false;
                    }
                    return true;
                }
                return false;
            }

            function findLineEl(target) {
                let el = target;

                    el = el.parentElement;

            }

            // --- Hierarchy helpers (children = deeper-indented lines that
            // immediately follow, same as Outliner's parent/child model,
            // but derived from indent level rather than a stored tree). ---
            function collectAllLines(editable) {
                const all = [];
                editable.querySelectorAll('*').forEach(function (el) {
                    if (isTargetLine(el)) all.push(el);
                });
                return all;
            }

            function getDescendantLines(line, allLines) {
                const idx = allLines.indexOf(line);
                if (idx === -1) return [];
                const baseIndent = currentIndentCh(line);
                const result = [];
                for (let i = idx + 1; i < allLines.length; i++) {
                    const ind = currentIndentCh(allLines[i]);
                    if (ind > baseIndent) result.push(allLines[i]);
                    else break;
                }
                return result;
            }

            // --- Line-type conversion (Bullet / Number / Checkbox) ---
            function getLineTextContent(line) {
                let text = '';
                line.childNodes.forEach(function (node) {
                    if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'INPUT') return;
                    text += node.textContent;
                });
                return text.replace(/\u200B/g, '').trim();
            }

            function placeCursorAtEnd(el) {
                const range = document.createRange();
                range.selectNodeContents(el);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }

            // Places the cursor immediately after the line's checkbox —
            // used instead of placeCursorAtEnd() when converting a line
            // to a checkbox, so the cursor lands right next to the
            // checkbox rather than jumping to the end of any existing text.
            function placeCursorAfterCheckbox(line) {
                const cb = Array.prototype.find.call(
                    line.children, c => c.tagName === 'INPUT' && c.type === 'checkbox'

                if (!cb) {
                    placeCursorAtEnd(line);

            function toggleLineBold(line) {

                line.style.fontWeight = isBold ? '' : 'bold';

            function refreshPanelState(line) {

                doneBtn.textContent = line.classList.contains('line-done')

                const isBold = line.style.fontWeight === 'bold' || line.style.fontWeight === '700';
                boldBtn.classList.toggle('active', isBold);

            function toggleCheckbox(line) {
                // If the line is a bullet/number <li>, the checkbox should
                // replace that marker entirely — not sit alongside it — so
                // rebuild the line as a plain checkbox div.
                if (line.tagName === 'LI') {
                    const parentList = line.parentElement;
                    const indent = line.style.marginLeft || '';
                    const text = getLineTextContent(line);
                    const div = document.createElement('div');
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.style.marginRight = '5px';
                    div.appendChild(cb);
                    div.appendChild(document.createTextNode(text));
                    if (indent) div.style.marginLeft = indent;
                    if (parentList.children.length === 1) {
                        parentList.replaceWith(div);
                    } else {
                        parentList.removeChild(line);
                        parentList.after(div);
                    }
                    return div;
                }
                // Otherwise it's a plain/checkbox div — just toggle the
                // checkbox on or off within it.
                const existing = Array.prototype.find.call(
                    line.children, c => c.tagName === 'INPUT' && c.type === 'checkbox'
                );
                if (existing) {
                    existing.remove();
                } else {
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.style.marginRight = '5px';

                }

            }

            function convertLineToList(line, wantTag, wantClass) {
                const indent = line.style.marginLeft || '';
                const text = getLineTextContent(line);

                if (line.tagName === 'LI') {
                    const parentList = line.parentElement;
                    if (parentList && parentList.tagName === wantTag &&
                        (!wantClass || parentList.classList.contains(wantClass))) {
                        return line; // already the right type
                    }
                    const li = document.createElement('li');
                    li.textContent = text || '\u200B';
                    if (indent) li.style.marginLeft = indent;
                    const list = document.createElement(wantTag);
                    if (wantClass) list.className = wantClass;
                    list.appendChild(li);
                    if (parentList.children.length === 1) {
                        parentList.replaceWith(list);
                    } else {
                        parentList.removeChild(line);
                        parentList.after(list);
                    }
                    return li;
                }

                // line is a DIV/P — rebuild as an <li>, merging into an
                // adjacent list of the right type if one is right there.
                const li = document.createElement('li');
                li.textContent = text || '\u200B';
                if (indent) li.style.marginLeft = indent;
                const prev = line.previousElementSibling;
                const next = line.nextElementSibling;
                if (prev && prev.tagName === wantTag && (!wantClass || prev.classList.contains(wantClass))) {
                    prev.appendChild(li);
                    line.remove();
                } else if (next && next.tagName === wantTag && (!wantClass || next.classList.contains(wantClass))) {
                    next.insertBefore(li, next.firstChild);
                    line.remove();
                } else {
                    const list = document.createElement(wantTag);
                    if (wantClass) list.className = wantClass;
                    list.appendChild(li);
                    line.replaceWith(list);
                }
                return li;
            }

            function positionIcon(line) {

                const kids = getDescendantLines(line, allLines);

            function toggleLineCollapse(line) {
                if (!line) return;

                if (!editable) return;
                const allLines = collectAllLines(editable);
                const kids = getDescendantLines(line, allLines);
                if (!kids.length) return;
                const collapsing = !line.classList.contains('line-collapsed');
                line.classList.toggle('line-collapsed', collapsing);
                kids.forEach(function (k) { k.classList.toggle('line-child-hidden', collapsing); });
                collapseToggle.textContent = collapsing ? '▾' : '▸';
            }

            function scheduleHide() {
                clearTimeout(hideTimer);
                hideTimer = setTimeout(function () {
                    hoverIcon.classList.remove('show');
                    dragHandle.classList.remove('show');
                    collapseToggle.classList.remove('show', 'has-children');
                    hoverPanel.classList.remove('show');

            function cancelHide() {
                clearTimeout(hideTimer);

            function isHoverChrome(el) {
                return el === hoverIcon || el === dragHandle || el === collapseToggle ||
                    (hoverIcon.contains && hoverIcon.contains(el)) ||
                    (dragHandle.contains && dragHandle.contains(el)) ||
                    (collapseToggle.contains && collapseToggle.contains(el));

                scheduleHide();
            });

            dragHandle.addEventListener('mouseenter', cancelHide);
            dragHandle.addEventListener('mouseleave', function (e) {
                const related = e.relatedTarget;
                if (related && isHoverChrome(related)) return;
                scheduleHide();
            });

            collapseToggle.addEventListener('mouseenter', cancelHide);
            collapseToggle.addEventListener('mouseleave', function (e) {

            // --- Drag-and-drop reordering (grip handle mirrors Outliner's
            // draggable bullet). Dragging a line brings its deeper-indented
            // children along, same grouping used by the collapse toggle. ---
            let draggingLine = null;
            let draggingBlock = [];
            let dropTargetLine = null;

            function clearDropIndicator() {
                if (dropTargetLine) dropTargetLine.classList.remove('line-drop-before', 'line-drop-after');
                dropTargetLine = null;
            }

            dragHandle.addEventListener('dragstart', function (e) {
                if (!currentLine) { e.preventDefault(); return; }
                draggingLine = currentLine;
                const editable = draggingLine.closest('[contenteditable="true"]');
                const allLines = editable ? collectAllLines(editable) : [];
                draggingBlock = [draggingLine].concat(getDescendantLines(draggingLine, allLines));
                draggingBlock.forEach(function (el) { el.classList.add('line-dragging'); });
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', 'weekgoal-line-drag'); } catch (err) {}
            });

            dragHandle.addEventListener('dragend', function () {
                draggingBlock.forEach(function (el) { el.classList.remove('line-dragging'); });
                draggingBlock = [];
                draggingLine = null;

                if (!draggingLine) return;
                const line = findLineEl(e.target) || findLineEl(document.elementFromPoint(e.clientX, e.clientY));
                if (!line || draggingBlock.indexOf(line) !== -1) { clearDropIndicator(); return; }
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const rect = line.getBoundingClientRect();
                const before = (e.clientY - rect.top) < rect.height / 2;
                if (dropTargetLine && dropTargetLine !== line) {
                    dropTargetLine.classList.remove('line-drop-before', 'line-drop-after');
                }
                dropTargetLine = line;
                line.classList.toggle('line-drop-before', before);
                line.classList.toggle('line-drop-after', !before);
            });

                if (!draggingLine) return;
                const line = findLineEl(e.target) || findLineEl(document.elementFromPoint(e.clientX, e.clientY));
                clearDropIndicator();
                if (!line || draggingBlock.indexOf(line) !== -1) return;
                e.preventDefault();
                const rect = line.getBoundingClientRect();
                const before = (e.clientY - rect.top) < rect.height / 2;
                const parent = line.parentElement;
                const refNode = before ? line : line.nextSibling;
                draggingBlock.forEach(function (el) { parent.insertBefore(el, refNode); });
                scheduleSaveIfAvailable();
            });

            // Some builds define a scheduleSave()/persist hook elsewhere in
            // the app; call it after a drag if present, otherwise no-op.
            function scheduleSaveIfAvailable() {
                if (typeof window.scheduleSave === 'function') window.scheduleSave();
                if (typeof window.saveState === 'function') window.saveState();
            }

            hoverIcon.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!currentLine) return;
                const rect = hoverIcon.getBoundingClientRect();
                hoverPanel.style.top = (rect.bottom + 4) + 'px';
                hoverPanel.style.left = rect.left + 'px';
                hoverPanel.classList.add('show');
                refreshPanelState(currentLine);
            });

            // Keep the current selection/cursor position intact when
            // clicking the ☰ icon or a panel button — same fix already
            // used by the selection toolbar and color popovers above,
            // just missing here. Without this, mousedown on the button
            // steals focus from the contenteditable cell first, so by the
            // time the click handler runs the real cursor position (and
            // sometimes the precise "line" it was in) has already been
            // lost, which is also what caused Tab to mis-target far above
            // the intended line.
            hoverIcon.addEventListener('mousedown', function (e) { e.preventDefault(); });
            dragHandle.addEventListener('mousedown', function (e) {
                // Don't block the native drag gesture itself.
                if (e.button !== 0) return;
            });
            collapseToggle.addEventListener('mousedown', function (e) { e.preventDefault(); });
            hoverPanel.addEventListener('mousedown', function (e) { e.preventDefault(); });

            hoverPanel.addEventListener('mouseenter', cancelHide);
            hoverPanel.addEventListener('mouseleave', scheduleHide);
            itemTextColorPopover.pop.addEventListener('mouseenter', cancelHide);
            itemTextColorPopover.pop.addEventListener('mouseleave', scheduleHide);
            itemBgColorPopover.pop.addEventListener('mouseenter', cancelHide);
            itemBgColorPopover.pop.addEventListener('mouseleave', scheduleHide);

            function closePanel() {
                hoverPanel.classList.remove('show');
                hoverIcon.classList.remove('show');
            }

            bulletBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                const li = convertLineToList(currentLine, 'UL', 'custom-bullet-list');
                currentLine = li;
                placeCursorAtEnd(li);
                closePanel();
            });

            numberBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                const li = convertLineToList(currentLine, 'OL', null);
                currentLine = li;
                placeCursorAtEnd(li);
                closePanel();
            });

            checkboxBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                const line = toggleCheckbox(currentLine);
                currentLine = line;
                placeCursorAfterCheckbox(line);
                closePanel();
            });

            doneBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                toggleLineDone(currentLine);
                refreshPanelState(currentLine);
            });

            boldBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                toggleLineBold(currentLine);
                refreshPanelState(currentLine);
            });

            itemTextColorBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!currentLine) return;
                showColorPopover(itemTextColorPopover.pop, itemTextColorBtn.getBoundingClientRect());
            });
            itemBgColorBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!currentLine) return;
                showColorPopover(itemBgColorPopover.pop, itemBgColorBtn.getBoundingClientRect());
            });

            itemTextColorPopover.pop.addEventListener('click', function (e) {
                const sw = e.target.closest('.color-swatch');
                if (!sw || !currentLine) return;
                applyLineTextColor(currentLine, sw.dataset.color);
                hideColorPopover(itemTextColorPopover.pop);
                closePanel();
            });
            itemTextColorPopover.customInput.addEventListener('input', function (e) {
                if (!currentLine) return;
                applyLineTextColor(currentLine, e.target.value);
            });
            itemTextColorPopover.customInput.addEventListener('change', function () {
                hideColorPopover(itemTextColorPopover.pop);
                closePanel();
            });

            itemBgColorPopover.pop.addEventListener('click', function (e) {
                const sw = e.target.closest('.color-swatch');
                if (!sw || !currentLine) return;
                applyLineBgColor(currentLine, sw.dataset.color);
                hideColorPopover(itemBgColorPopover.pop);
                closePanel();
            });
            itemBgColorPopover.customInput.addEventListener('input', function (e) {
                if (!currentLine) return;
                applyLineBgColor(currentLine, e.target.value);
            });
            itemBgColorPopover.customInput.addEventListener('change', function () {
                hideColorPopover(itemBgColorPopover.pop);
                closePanel();
            });

            subBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                adjustLineIndent(currentLine, 1);
                hoverPanel.classList.remove('show');
                hoverIcon.classList.remove('show');
            });

            outdentBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                adjustLineIndent(currentLine, -1);
                closePanel();
            });

            window.addEventListener('scroll', function () {
                if (currentLine) positionIcon(currentLine);
            }, true);

            // Tab / Shift+Tab: indent / outdent the current line while
            // editing, instead of the browser's default focus-jump.
            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Tab') return;
                const editable = e.target.closest && e.target.closest('[contenteditable="true"]');
                if (!editable) return;
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return;
                const line = getLineElement(sel.getRangeAt(0).startContainer);
                if (!line) return;
                e.preventDefault();
                adjustLineIndent(line, e.shiftKey ? -1 : 1);
            });
        })();

        // Open 4 pooout windows by one clicking
		function openPopups4(url1, url2, url3, url4) {
            // Open first popup window
            window.open(url1, '_blank', 'width=700,height=450,left=50,top=50');
            // Open second popup window
            window.open(url2, '_blank', 'width=700,height=450,left=800,top=50');
            // Open third popup window
            window.open(url3, '_blank', 'width=700,height=450,left=50,top=550');
            // Open 4th popup window
            window.open(url4, '_blank', 'width=700,height=450,left=800,top=550');
        }

</script>
