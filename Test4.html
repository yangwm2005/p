<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cloud Notes · To-dos & Ideas</title>
    <!-- Google Identity Services + Firebase (for Auth & Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .app-container {
            background: white;
            max-width: 700px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
            padding: 24px 20px 32px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        h1 span {
            font-size: 2rem;
        }
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            border-radius: 100px;
            padding: 8px 16px 8px 12px;
            margin-bottom: 24px;
            min-height: 56px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1e293b;
            flex-shrink: 0;
            object-fit: cover;
        }
        .user-name {
            font-weight: 500;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 10px 18px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, border 0.15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            white-space: nowrap;
        }
        .btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        .btn-primary {
            background: #1e293b;
            border: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-primary:hover {
            background: #0f172a;
        }
        .btn-google {
            background: white;
            border: 1px solid #dadce0;
            color: #3c4043;
            padding: 10px 20px;
            font-weight: 500;
            border-radius: 40px;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-google:hover {
            background: #f8f9fa;
            border-color: #c6c6c6;
        }
        .btn-google img {
            width: 18px;
            height: 18px;
        }
        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
            align-items: center;
        }
        .add-section input {
            flex: 1;
            padding: 16px 18px;
            border-radius: 60px;
            border: 1.5px solid #e2e8f0;
            font-size: 1rem;
            background: #ffffff;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
        }
        .add-section input:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.1);
        }
        .add-section button {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            padding: 0;
            font-size: 1.8rem;
            line-height: 1;
            background: #1e293b;
            color: white;
            border: none;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s, background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-section button:hover {
            background: #0f172a;
        }
        .add-section button:active {
            transform: scale(0.94);
        }
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 8px;
        }
        .item {
            background: #ffffff;
            border: 1px solid #e9eef3;
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: background 0.15s, border 0.15s;
            animation: fadeIn 0.15s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .item:hover {
            border-color: #cbd5e1;
            background: #fdfdfe;
        }
        .item-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.1s, border 0.1s;
            font-size: 14px;
            color: white;
            user-select: none;
        }
        .item-check.done {
            background: #1e293b;
            border-color: #1e293b;
        }
        .item-check.done::after {
            content: "✓";
            color: white;
            font-weight: bold;
        }
        .item-text {
            flex: 1;
            font-size: 1rem;
            color: #1e293b;
            word-break: break-word;
            line-height: 1.4;
            cursor: pointer;
            padding: 4px 0;
        }
        .item-text.done {
            text-decoration: line-through;
            color: #94a3b8;
        }
        .item-delete {
            background: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #94a3b8;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
            line-height: 1;
        }
        .item-delete:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 20px;
            font-size: 0.95rem;
            background: #f8fafc;
            border-radius: 20px;
        }
        .status-badge {
            font-size: 0.75rem;
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 30px;
            color: #475569;
            font-weight: 500;
            white-space: nowrap;
        }
        .footer-note {
            margin-top: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .hidden {
            display: none !important;
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* small screens */
        @media (max-width: 480px) {
            .app-container { padding: 18px 14px 24px; border-radius: 24px; }
            h1 { font-size: 1.6rem; }
            .user-name { max-width: 120px; }
            .add-section input { padding: 14px 16px; }
            .add-section button { width: 50px; height: 50px; font-size: 1.6rem; }
            .btn { padding: 8px 14px; font-size: 0.85rem; }
            .item { padding: 12px 14px; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Header -->
        <h1>
            <span>📋</span> Cloud Notes
        </h1>

        <!-- User bar / Google Sign-in area -->
        <div id="userBar" class="user-bar">
            <!-- Will be populated by JS -->
            <div id="signInContainer" style="width:100%; display: flex; justify-content: center;">
                <button id="googleSignInBtn" class="btn btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Sign in with Google
                </button>
            </div>
            <div id="userProfile" class="user-info hidden" style="width:100%; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img id="userAvatar" class="user-avatar" src="" alt="avatar" style="width:40px; height:40px; border-radius:50%;">
                    <span id="userName" class="user-name"></span>
                </div>
                <button id="signOutBtn" class="btn">Sign out</button>
            </div>
        </div>

        <!-- Add new item -->
        <div class="add-section" id="addSection">
            <input type="text" id="itemInput" placeholder="Write a to-do or idea..." autocomplete="off" maxlength="200">
            <button id="addBtn" aria-label="Add item">+</button>
        </div>

        <!-- Items list -->
        <div id="itemsList" class="items-list">
            <!-- dynamic items go here -->
        </div>

        <!-- Sync status / footer -->
        <div class="footer-note">
            <span id="syncStatus">☁️ Not signed in</span>
        </div>
    </div>

    <script>
        // ----------------------------------------------------------------
        // 1. Firebase configuration (replace with your own project keys)
        // ----------------------------------------------------------------
        const firebaseConfig = {
            // ⚠️ REPLACE THESE WITH YOUR OWN FIREBASE PROJECT CONFIG
            apiKey: "AIzaSyDemoKey-ReplaceWithYours",
            authDomain: "cloud-notes-demo.firebaseapp.com",
            projectId: "cloud-notes-demo",
            storageBucket: "cloud-notes-demo.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        // ----------------------------------------------------------------
        // 2. Initialize Firebase
        // ----------------------------------------------------------------
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Use Google Auth Provider
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        // ----------------------------------------------------------------
        // 3. Global state & DOM references
        // ----------------------------------------------------------------
        let currentUser = null;          // firebase user object
        let itemsUnsubscribe = null;     // firestore listener unsubscribe
        let itemsArray = [];             // local cache of items

        const userBar = document.getElementById('userBar');
        const signInContainer = document.getElementById('signInContainer');
        const userProfile = document.getElementById('userProfile');
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const itemsList = document.getElementById('itemsList');
        const syncStatus = document.getElementById('syncStatus');

        // ----------------------------------------------------------------
        // 4. Authentication flow
        // ----------------------------------------------------------------
        googleSignInBtn.addEventListener('click', () => {
            auth.signInWithPopup(googleProvider).catch((error) => {
                console.error('Google sign-in error:', error);
                alert('Sign-in failed: ' + error.message);
            });
        });

        signOutBtn.addEventListener('click', () => {
            auth.signOut().catch((error) => console.error('Sign-out error:', error));
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                // Signed in
                currentUser = user;
                // Update UI
                signInContainer.classList.add('hidden');
                userProfile.classList.remove('hidden');
                userAvatar.src = user.photoURL || 'https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/default-avatar.png';
                userName.textContent = user.displayName || user.email || 'User';
                syncStatus.textContent = '☁️ Syncing...';

                // Subscribe to Firestore realtime updates
                subscribeToItems(user.uid);
            } else {
                // Signed out
                currentUser = null;
                signInContainer.classList.remove('hidden');
                userProfile.classList.add('hidden');
                syncStatus.textContent = '☁️ Not signed in';
                // Detach Firestore listener
                if (itemsUnsubscribe) {
                    itemsUnsubscribe();
                    itemsUnsubscribe = null;
                }
                // Clear list
                itemsArray = [];
                renderItems();
            }
        });

        // ----------------------------------------------------------------
        // 5. Firestore realtime listener per user
        // ----------------------------------------------------------------
        function subscribeToItems(userId) {
            if (itemsUnsubscribe) {
                itemsUnsubscribe();  // remove previous listener
            }

            const itemsRef = db.collection('users').doc(userId).collection('items')
                .orderBy('createdAt', 'desc');

            itemsUnsubscribe = itemsRef.onSnapshot((snapshot) => {
                const newItems = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    newItems.push({
                        id: doc.id,
                        text: data.text || '',
                        done: data.done || false,
                        createdAt: data.createdAt || null
                    });
                });
                itemsArray = newItems;
                renderItems();
                syncStatus.textContent = `☁️ Synced · ${itemsArray.length} item${itemsArray.length !== 1 ? 's' : ''}`;
            }, (error) => {
                console.error('Firestore listener error:', error);
                syncStatus.textContent = '⚠️ Sync error';
            });
        }

        // ----------------------------------------------------------------
        // 6. Render the items list (with completion state)
        // ----------------------------------------------------------------
        function renderItems() {
            if (!itemsArray.length) {
                itemsList.innerHTML = `<div class="empty-state">✨ No items yet. Add a to‑do or idea above.</div>`;
                return;
            }

            // Sort: newest first (already sorted by query, but we keep array order)
            let html = '';
            itemsArray.forEach((item) => {
                const doneClass = item.done ? 'done' : '';
                html += `
                    <div class="item" data-id="${item.id}">
                        <div class="item-check ${doneClass}" data-id="${item.id}" role="button" aria-label="toggle done"></div>
                        <div class="item-text ${doneClass}" data-id="${item.id}">${escapeHtml(item.text)}</div>
                        <button class="item-delete" data-id="${item.id}" aria-label="delete">✕</button>
                    </div>
                `;
            });
            itemsList.innerHTML = html;

            // Attach event listeners using event delegation on container
            // (we will use one listener on itemsList but need to handle all actions)
        }

        // Helper to escape HTML
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ----------------------------------------------------------------
        // 7. Event delegation for item actions (toggle, delete, edit text)
        // ----------------------------------------------------------------
        itemsList.addEventListener('click', async (e) => {
            const target = e.target.closest('[data-id]');
            if (!target) return;
            const itemId = target.dataset.id;
            if (!itemId || !currentUser) return;

            // Handle delete button
            if (target.classList.contains('item-delete')) {
                await deleteItem(itemId);
                return;
            }

            // Handle checkbox toggle (click on check circle)
            if (target.classList.contains('item-check')) {
                await toggleItemDone(itemId);
                return;
            }

            // Handle click on text: we could allow editing, but for simplicity we toggle done on text click too.
            // Actually better UX: click on text also toggles done. We'll do that.
            if (target.classList.contains('item-text')) {
                await toggleItemDone(itemId);
                return;
            }
        });

        // Toggle done status
        async function toggleItemDone(itemId) {
            if (!currentUser) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;

            try {
                const itemRef = db.collection('users').doc(currentUser.uid).collection('items').doc(itemId);
                await itemRef.update({
                    done: !item.done
                });
                // realtime listener will update UI
            } catch (error) {
                console.error('Error toggling item:', error);
                alert('Could not update item. Please try again.');
            }
        }

        // Delete item
        async function deleteItem(itemId) {
            if (!currentUser) return;
            if (!confirm('Delete this item?')) return;

            try {
                const itemRef = db.collection('users').doc(currentUser.uid).collection('items').doc(itemId);
                await itemRef.delete();
                // listener updates UI
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Could not delete item.');
            }
        }

        // ----------------------------------------------------------------
        // 8. Add new item
        // ----------------------------------------------------------------
        async function addNewItem() {
            if (!currentUser) {
                alert('Please sign in with Google to save your notes.');
                return;
            }

            const text = itemInput.value.trim();
            if (!text) {
                itemInput.focus();
                return;
            }

            // Disable add button briefly to prevent double submission
            addBtn.disabled = true;
            addBtn.innerHTML = '<span class="loading-spinner"></span>';

            try {
                const itemsRef = db.collection('users').doc(currentUser.uid).collection('items');
                await itemsRef.add({
                    text: text,
                    done: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                // Clear input
                itemInput.value = '';
                itemInput.focus();
                // The realtime listener will update the list
            } catch (error) {
                console.error('Error adding item:', error);
                alert('Could not add item. Check your connection.');
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '+';
            }
        }

        addBtn.addEventListener('click', addNewItem);

        // Allow pressing Enter in input to add
        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addNewItem();
            }
        });

        // ----------------------------------------------------------------
        // 9. Initial render (empty) and check for any pre-existing auth
        // ----------------------------------------------------------------
        // The onAuthStateChanged will handle the rest.

        // Optional: sign out on page unload? No, keep session.
        // If no user, show placeholder list

        // Make sure add section is always enabled but we check user on add.
        // Also if not signed in, show message.
        // We rely on onAuthStateChanged.

        // Initially, before auth resolves, we show sign-in button and empty list
        window.addEventListener('load', () => {
            // slight delay to let auth settle
            setTimeout(() => {
                if (!currentUser) {
                    syncStatus.textContent = '☁️ Sign in to sync';
                }
            }, 500);
        });
    </script>
</body>
</html>
