        body {
            background: linear-gradient(145deg, #f0f4fe 0%, #e2e9fa 100%);

        .sync-status.error { background: #f44336; }
        .sync-status.offline { background: #9e9e9e; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

            padding: 4px 16px;
            border: none;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;

            background: #0a1a3a;

        .add-btn {

        .icon-picker-wrapper::-webkit-scrollbar-thumb { background: #b0c6e8; border-radius: 10px; }

            .icon-card .icon-wrap { font-size: 2.2rem; }
            .picker-item { width: 38px; height: 38px; font-size: 1.2rem; }
            .modal-box { padding: 1.5rem 1rem; }

// ── HELPERS ─────────────────────────────────────────────────
function generateId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 8); }

function openPopup(url) {
    if (!url) return;
    let fullUrl = url;
    if (!/^https?:\/\//i.test(url)) fullUrl = 'https://' + url;
    window.open(fullUrl, '_blank', 'width=700,height=600,scrollbars=yes,resizable=yes,status=no,toolbar=no,menubar=no,location=yes');
}

// ── FIRESTORE HELPERS ──────────────────────────────────────
function ylGetRef() {
    if (!ylUser) return null;
    return ylDb.collection('users').doc(ylUser.uid)
               .collection('yanglab').doc('websites');
}

function ylSetSyncStatus(status) {
    syncStatus.className = 'sync-status ' + status;
    syncStatus.title = status === 'synced' ? 'Synced to cloud' :
                       status === 'syncing' ? 'Syncing...' :
                       status === 'error' ? 'Sync error' : 'Offline';
}

function ylPushToCloud() {
    if (!ylUser || ylPushing) return;
    const ref = ylGetRef();
    if (!ref) return;
    
    ylPushing = true;
    ylSetSyncStatus('syncing');
    
    const data = {
        items: ylItems,
        updatedAt: Date.now()
    };
    
    ref.set(data).then(() => {
        ylLastPush = Date.now();
        ylPushing = false;
        ylSetSyncStatus('synced');
    }).catch((err) => {
        console.warn('Push error:', err);
        ylPushing = false;
        ylSetSyncStatus('error');
    });
}

function ylLoadFromCloud() {
    if (!ylUser) return;
    const ref = ylGetRef();
    if (!ref) return;
    
    ylSetSyncStatus('syncing');
    ref.get().then((doc) => {
        if (doc.exists) {
            const data = doc.data();
            if (data.items && Array.isArray(data.items)) {
                ylItems = data.items;
                render();
                ylSetSyncStatus('synced');
                ylLastPush = data.updatedAt || Date.now();
            }
        } else {
            // First time user — push defaults
            seedDefault();
            ylPushToCloud();
        }
    }).catch((err) => {
        console.warn('Load error:', err);
        ylSetSyncStatus('error');
        // Still render local items if any
        if (ylItems.length > 0) render();
        else seedDefault();
    });
}

function ylStartListening() {
    if (ylListeners.unsubscribe) return;
    const ref = ylGetRef();
    if (!ref) return;
    
    ylListeners.unsubscribe = ref.onSnapshot((snap) => {
        if (!snap.exists) return;
        const data = snap.data();
        const remoteTs = data.updatedAt || 0;
        // Ignore if this is our own push or if remote is older
        if (remoteTs <= ylLastPush) return;
        if (data.items && Array.isArray(data.items)) {
            ylItems = data.items;
            render();
            ylLastPush = remoteTs;
        }
    }, (err) => {
        console.warn('Listener error:', err);
    });
}

function ylStopListening() {
    if (ylListeners.unsubscribe) {
        ylListeners.unsubscribe();
        ylListeners.unsubscribe = null;
    }
}

// ── AUTH ────────────────────────────────────────────────────
function updateAuthUI() {
    if (ylUser) {
        const name = ylUser.displayName || ylUser.email || 'User';
        userName.textContent = '👤 ' + name;
        authBtn.textContent = '🚪 Sign Out';
        authBtn.className = 'auth-btn sign-out';
        // Load data if not loaded yet
        if (ylItems.length === 0) {
            ylLoadFromCloud();
            ylStartListening();
        }
    } else {
        userName.textContent = '🔓 Not signed in';
        authBtn.textContent = '🔑 Sign In';
        authBtn.className = 'auth-btn';
        ylItems = [];
        ylStopListening();
        ylSetSyncStatus('offline');
        seedDefault();
    }
}

function toggleAuth() {
    if (ylUser) {
        ylStopListening();
        ylAuth.signOut();
        return;
    }
    const provider = new firebase.auth.GoogleAuthProvider();
    ylAuth.signInWithPopup(provider).catch((e) => {
        if (e.code !== 'auth/popup-closed-by-user') {
            alert('Sign-in failed: ' + e.message);
        }
    });
}

// Auth state listener
ylAuth.onAuthStateChanged((user) => {
    ylUser = user;
    updateAuthUI();
});

// ── RENDER ──────────────────────────────────────────────────
function renderPicker(selectedClass) {
    pickerGrid.innerHTML = '';
    ICON_CATEGORIES.forEach(category => {
        const label = document.createElement('div');
        label.className = 'picker-section-label';
        label.textContent = category.label;
        pickerGrid.appendChild(label);
        
        category.icons.forEach(cls => {
            const div = document.createElement('div');
            div.className = 'picker-item' + (cls === selectedClass ? ' selected' : '');
            div.innerHTML = `<i class="${cls}"></i>`;
            div.dataset.iconClass = cls;
            div.addEventListener('click', () => {
                ylSelectedIcon = cls;
                renderPicker(ylSelectedIcon);
            });
            pickerGrid.appendChild(div);
        });
    });
}

function render() {
    if (ylItems.length === 0) {
        grid.innerHTML = `<div style="width:100%; padding:2rem 0; text-align:center; color:#4a6188;">🧪 No websites yet. Click “Add website” to start.</div>`;
        emptyHint.style.display = 'block';
        return;
    }
    emptyHint.style.display = 'block';
    let html = '';
    ylItems.forEach((item, index) => {
        const iconHtml = item.icon ? `<i class="${item.icon}"></i>` : '🌐';
        const protectedClass = item.protected ? 'protected' : '';
        const protectedBadge = item.protected ? `<span class="protected-badge"><i class="fas fa-lock"></i> </span>` : '';
        html += `
            <div class="icon-card ${protectedClass}" draggable="true" data-id="${item.id}" data-index="${index}">
                ${protectedBadge}
                <div class="icon-wrap" data-url="${item.url}" data-title="${item.title}">${iconHtml}</div>
                <div class="title" title="${item.title}">${item.title}</div>
                <div class="card-actions">
                    <button class="edit-btn" data-id="${item.id}" title="Edit"><i class="fas fa-edit"></i></button>
                    <button class="delete-btn" data-id="${item.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
        `;
    });
    grid.innerHTML = html;
    
    // Popup on icon click
    grid.querySelectorAll('.icon-wrap').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            const url = el.getAttribute('data-url');
            if (url) openPopup(url);
        });
    });
    
    // Edit
    grid.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-id');
            const item = ylItems.find(it => it.id === id);
            if (item && !item.protected) {
                openEditModal(id, item);
            } else {
                alert('⛔ This icon is locked and cannot be edited.');
            }
        });
    });
    
    // Delete
    grid.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-id');
            const item = ylItems.find(it => it.id === id);
            if (item && item.protected) {
                alert('⛔ This icon is locked and cannot be deleted.');
                return;
            }
            if (confirm('Delete this website?')) {
                ylItems = ylItems.filter(it => it.id !== id);
                render();
                if (ylUser) ylPushToCloud();
            }
        });
    });
    
    // Drag and drop
    const cards = grid.querySelectorAll('.icon-card');
    let dragSrcId = null;
    cards.forEach(card => {
        card.addEventListener('dragstart', (e) => {
            dragSrcId = card.getAttribute('data-id');
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', dragSrcId);
        });
        card.addEventListener('dragend', (e) => {
            card.classList.remove('dragging');
        });
        card.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });
        card.addEventListener('drop', (e) => {
            e.preventDefault();
            const targetId = card.getAttribute('data-id');
            if (!dragSrcId || dragSrcId === targetId) return;
            const srcIndex = ylItems.findIndex(it => it.id === dragSrcId);
            const targetIndex = ylItems.findIndex(it => it.id === targetId);
            if (srcIndex === -1 || targetIndex === -1) return;
            const [removed] = ylItems.splice(srcIndex, 1);
            ylItems.splice(targetIndex, 0, removed);
            render();
            if (ylUser) ylPushToCloud();
        });
    });
}

// ── MODAL ──────────────────────────────────────────────────
function openEditModal(id, item) {
    ylCurrentEditId = id;
    modalTitle.textContent = 'Edit website';
    inputTitle.value = item.title || '';
    inputUrl.value = item.url || '';
    ylSelectedIcon = item.icon || 'fa-solid fa-globe';
    renderPicker(ylSelectedIcon);
    overlay.classList.add('active');
}

function openAddModal() {
    ylCurrentEditId = null;
    modalTitle.textContent = 'Add website';
    inputTitle.value = 'My website';
    inputUrl.value = 'https://example.com';
    ylSelectedIcon = 'fa-solid fa-globe';
    renderPicker(ylSelectedIcon);
    overlay.classList.add('active');
}

function closeModal() {
    overlay.classList.remove('active');
    ylCurrentEditId = null;
}

function saveFromModal() {
    const icon = ylSelectedIcon;
    const title = inputTitle.value.trim() || 'Untitled';
    let url = inputUrl.value.trim();
    if (!url) {
        alert('Please enter a URL.');
        return;
    }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    
    if (ylCurrentEditId) {
        const item = ylItems.find(it => it.id === ylCurrentEditId);
        if (item && !item.protected) {
            item.icon = icon;
            item.title = title;
            item.url = url;
        }
    } else {
        ylItems.push({
            id: generateId(),
            icon: icon,
            title: title,
            url: url,
            protected: false,
        });
    }
    closeModal();
    render();
    if (ylUser) ylPushToCloud();
}

// ── SEED ────────────────────────────────────────────────────
function seedDefault() {
    ylItems = [
        { id: generateId(), icon: 'fa-brands fa-github', title: 'GitHub', url: 'https://github.com', protected: true },
        { id: generateId(), icon: 'fa-brands fa-twitter', title: 'Twitter', url: 'https://twitter.com', protected: true },
        { id: generateId(), icon: 'fa-solid fa-newspaper', title: 'BBC News', url: 'https://bbc.com', protected: true },
        { id: generateId(), icon: 'fa-brands fa-dev', title: 'Dev.to', url: 'https://dev.to', protected: false },
        { id: generateId(), icon: 'fa-brands fa-youtube', title: 'YouTube', url: 'https://youtube.com', protected: false },
        { id: generateId(), icon: 'fa-solid fa-flask', title: 'YangLab', url: 'https://github.com', protected: false },
    ];
    render();
}

// ── EVENT BINDING ──────────────────────────────────────────
addBtn.addEventListener('click', openAddModal);
saveBtn.addEventListener('click', saveFromModal);
cancelBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('active')) closeModal();
});

// ── INIT ────────────────────────────────────────────────────
seedDefault();
</script>
