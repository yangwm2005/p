<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cloud Jots</title>
    <!-- Firebase SDK (cloud sync) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .app-container {
            background: white;
            max-width: 700px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
            padding: 24px 20px 32px;
            transition: all 0.2s;
        }

        /* ============================================================
           HEADER — title on the left, compact search on the right
           ============================================================ */
        .app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .app-header h1 span {
            font-size: 1.7rem;
        }
        .header-search {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .header-search .search-icon {
            position: absolute;
            left: 14px;
            font-size: 0.95rem;
            color: #94a3b8;
            pointer-events: none;
            line-height: 1;
        }
        .header-search input {
            width: 100%;
            padding: 10px 38px 10px 38px;
            border-radius: 40px;
            border: 1.5px solid #e2e8f0;
            font-size: 0.9rem;
            font-family: inherit;
            background: #f8fafc;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .header-search input:focus {
            border-color: #94a3b8;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.1);
        }
        .header-search .search-clear {
            position: absolute;
            right: 6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .header-search .search-clear:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .header-search .search-clear.hidden {
            display: none;
        }

        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            border-radius: 100px;
            padding: 8px 16px 8px 12px;
            margin-bottom: 24px;
            min-height: 56px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1e293b;
            flex-shrink: 0;
            object-fit: cover;
        }
        .user-name {
            font-weight: 500;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 10px 18px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, border 0.15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            white-space: nowrap;
        }
        .btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        .btn-google {
            background: white;
            border: 1px solid #dadce0;
            color: #3c4043;
            padding: 10px 20px;
            font-weight: 500;
            border-radius: 40px;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-google:hover {
            background: #f8f9fa;
            border-color: #c6c6c6;
        }
        .btn-google img {
            width: 18px;
            height: 18px;
        }

        /* ============================================================
           ADD SECTION — input on the left, compact round buttons on the right
           ============================================================ */
        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
            align-items: flex-start;
        }
        .add-section textarea {
            flex: 1;
            padding: 14px 18px;
            border-radius: 24px;
            border: 1.5px solid #e2e8f0;
            font-size: 1rem;
            font-family: inherit;
            background: #ffffff;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
            resize: vertical;
            min-height: 52px;
            max-height: 500px;
            line-height: 1.4;
            overflow-y: auto;
        }
        .add-section textarea:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: nowrap;
            align-items: center;
            padding-top: 4px;
        }
        .add-section button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            padding: 0;
            font-size: 1.2rem;
            line-height: 1;
            background: #1e293b;
            color: white;
            border: none;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.1s, background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-section button:hover {
            background: #0f172a;
        }
        .add-section button:active {
            transform: scale(0.92);
        }
        .add-section button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .add-section button.newline-btn,
        .add-section button.bullet-btn,
        .add-section button.resize-btn {
            background: #ede7e1;
            color: #1e293b;
            font-size: 1rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        .add-section button.newline-btn:hover,
        .add-section button.bullet-btn:hover,
        .add-section button.resize-btn:hover {
            background: #d9d0c6;
        }
        .add-section button.bullet-btn.active {
            background: #1e293b;
            color: #f5efe9;
            box-shadow: 0 4px 10px rgba(30, 41, 59, 0.25);
        }
        .add-section button.bullet-btn.active:hover {
            background: #0f172a;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 8px;
        }
        .item {
            background: #ffffff;
            border: 1px solid #e9eef3;
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: background 0.15s, border 0.15s;
            animation: fadeIn 0.15s ease;
            flex-wrap: wrap;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .item:hover {
            border-color: #cbd5e1;
            background: #fdfdfe;
        }
        .item.editing {
            border-color: #94a3b8;
            background: #f8fafc;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.12);
        }

        /* ---- Pinned item styling ---- */
        .item.pinned {
            border-color: #fbbf24;
            background: #fffdf5;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.12);
        }
        .item.pinned:hover {
            border-color: #f59e0b;
            background: #fffdf0;
        }
        .item-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.1s, border 0.1s;
            font-size: 14px;
            color: white;
            user-select: none;
            margin-top: 2px;
        }
        .item-check.done {
            background: #1e293b;
            border-color: #1e293b;
        }
        .item-check.done::after {
            content: "✓";
            color: white;
            font-weight: bold;
        }
        .item-body {
            flex: 1;
            min-width: 0;
        }

        /* ============================================================
           ITEM TEXT — single-click now enters edit mode
           ============================================================ */
        .item-text {
            font-size: 1rem;
            color: #1e293b;
            word-break: break-word;
            line-height: 1.4;
            cursor: text;              /* was: pointer — now signals editing */
            white-space: pre-wrap;
        }
        .item-text:hover {
            background: #f8fafc;
            border-radius: 6px;
            box-shadow: 0 0 0 4px #f8fafc;  /* soft highlight on hover */
        }
        .item-text.done {
            text-decoration: line-through;
            color: #94a3b8;
        }

        /* ============================================================
           ITEM META ROW — chips on the left, action buttons on the right
           ============================================================ */
        .item-meta {
            margin-top: 6px;
            font-size: 0.72rem;
            color: #94a3b8;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .item-meta .chip {
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 30px;
            cursor: help;
            user-select: none;
        }
        .item-meta .chip.edited {
            background: #ede7e1;
            color: #6d645b;
        }
        .item-meta .chip.pin-chip {
            background: #fef3c7;
            color: #92400e;
        }
        .item-meta .chip.reply-chip {
            background: #dbeafe;
            color: #1e40af;
            cursor: pointer;
        }
        .item-meta .chip.reply-chip:hover {
            background: #bfdbfe;
        }

        /* ============================================================
           ITEM ACTIONS — horizontal, right-aligned, in the meta row
           ============================================================ */
        .item-actions {
            display: flex;
            flex-direction: row;
            gap: 2px;
            flex-shrink: 0;
            align-items: center;
            margin-left: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .item:hover .item-actions,
        .item:focus-within .item-actions {
            opacity: 1;
            pointer-events: auto;
        }
        .item-actions button {
            background: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            line-height: 1;
            padding: 0;
        }
        .item-actions button:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .item-actions button.del-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .item-actions button.pin-btn.pinned {
            color: #f59e0b;
        }
        .item-actions button.pin-btn.pinned:hover {
            background: #fef3c7;
            color: #d97706;
        }
        .item-actions button.pin-btn:hover {
            background: #fef3c7;
            color: #f59e0b;
        }
        .item-actions button.reply-btn:hover {
            background: #dbeafe;
            color: #2563eb;
        }
        .item-actions button.reply-btn.active {
            background: #dbeafe;
            color: #2563eb;
        }

        /* ============================================================
           REPLY / SUB-NOTE THREAD
           ============================================================ */
        .replies-wrap {
            flex-basis: 100%;
            margin-top: 10px;
            padding-left: 36px;
            border-left: 2px solid #e2e8f0;
            margin-left: 12px;
        }
        .reply {
            background: #f8fafc;
            border: 1px solid #eef2f7;
            border-radius: 14px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            animation: fadeIn 0.15s ease;
        }
        .reply:last-child {
            margin-bottom: 0;
        }
        .reply-body {
            flex: 1;
            min-width: 0;
        }
        .reply-text {
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
            cursor: text;              /* now signals editing, like the item text */
        }
        .reply-text.done {
            text-decoration: line-through;
            color: #94a3b8;
        }
        .reply-meta {
            margin-top: 4px;
            font-size: 0.68rem;
            color: #94a3b8;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .reply-meta .chip {
            background: #eef2f7;
            padding: 1px 8px;
            border-radius: 30px;
        }
        .reply-meta .chip.edited {
            background: #ede7e1;
            color: #6d645b;
        }
        .reply-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .reply:hover .reply-actions {
            opacity: 1;
        }
        .reply-actions button {
            background: none;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #94a3b8;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            padding: 0;
        }
        .reply-actions button:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .reply-actions button.del-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .reply-actions button.done-btn.done {
            color: #16a34a;
        }

        /* Inline "add reply" row */
        .reply-add-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            align-items: flex-start;
        }
        .reply-add-row textarea {
            flex: 1;
            padding: 8px 12px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            font-size: 0.88rem;
            font-family: inherit;
            background: #ffffff;
            outline: none;
            resize: vertical;
            min-height: 36px;
            max-height: 200px;
            line-height: 1.4;
            transition: border 0.15s, box-shadow 0.15s;
        }
        .reply-add-row textarea:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.1);
        }
        .reply-add-row button {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 3px 8px rgba(37, 99, 235, 0.2);
        }
        .reply-add-row button:hover {
            background: #1d4ed8;
        }
        .reply-add-row button:active {
            transform: scale(0.92);
        }
        .reply-add-row button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Reply edit textarea reuses .edit-textarea but smaller */
        .reply .edit-textarea {
            min-height: 44px;
            font-size: 0.88rem;
            padding: 8px 12px;
        }
        .reply .edit-buttons .btn {
            padding: 4px 12px;
            font-size: 0.75rem;
        }

        .edit-textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1.5px solid #cbd5e1;
            font-size: 1rem;
            font-family: inherit;
            line-height: 1.4;
            background: white;
            outline: none;
            white-space: pre-wrap;
            resize: vertical;
            overflow: auto;
            min-height: 70px;
            max-height: 500px;
            display: block;
            box-sizing: border-box;
        }
        .edit-textarea:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.15);
        }
        .edit-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .edit-buttons .btn {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .edit-buttons .save-btn {
            background: #1e293b;
            color: white;
            border: none;
        }
        .edit-buttons .save-btn:hover {
            background: #0f172a;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 20px;
            font-size: 0.95rem;
            background: #f8fafc;
            border-radius: 20px;
        }
        .footer-note {
            margin-top: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .copyright {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e9eef3;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 0.2px;
        }
        .hint {
            font-size: 0.7rem;
            color: #a99d92;
            text-align: center;
            margin: -16px 0 20px;
            line-height: 1.5;
        }
        .hint kbd {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 1px 6px;
            font-family: inherit;
            font-size: 0.7rem;
            color: #1e293b;
        }
        .hidden {
            display: none !important;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 560px) {
            .app-container { padding: 18px 14px 24px; border-radius: 24px; }

            .app-header { flex-wrap: wrap; gap: 10px; }
            .app-header h1 { font-size: 1.4rem; }
            .app-header h1 span { font-size: 1.5rem; }
            .header-search { flex-basis: 100%; order: 2; }

            .user-name { max-width: 120px; }
            .add-section { flex-wrap: wrap; }
            .add-section textarea { padding: 12px 16px; min-height: 48px; }
            .action-buttons { max-width: none; width: 100%; justify-content: flex-end; }
            .add-section button { width: 38px; height: 38px; font-size: 1.05rem; }
            .add-section button.newline-btn,
            .add-section button.bullet-btn,
            .add-section button.resize-btn { font-size: 0.95rem; }
            .btn { padding: 8px 14px; font-size: 0.85rem; }
            .item { padding: 12px 14px; }
            .item-actions button { width: 22px; height: 22px; font-size: 0.8rem; }
            .replies-wrap { padding-left: 20px; margin-left: 6px; }

            .item-actions,
            .reply-actions {
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Header: title + compact search on the same row -->
        <div class="app-header">
            <h1><span>📋</span> Cloud Jots</h1>
            <div class="header-search">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search…" autocomplete="off" aria-label="Search notes">
                <button id="searchClearBtn" class="search-clear hidden" aria-label="Clear search" title="Clear search">✕</button>
            </div>
        </div>

        <!-- User bar / Google Sign-in area -->
        <div id="userBar" class="user-bar">
            <div id="signInContainer" style="width:100%; display: flex; justify-content: center;">
                <button id="googleSignInBtn" class="btn btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Sign in with Google
                </button>
            </div>
            <div id="userProfile" class="user-info hidden" style="width:100%; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 10px; overflow:hidden;">
                    <img id="userAvatar" class="user-avatar" src="" alt="avatar">
                    <span id="userName" class="user-name"></span>
                </div>
                <button id="signOutBtn" class="btn">Sign out</button>
            </div>
        </div>

        <!-- Add new item -->
        <div class="add-section" id="addSection">
            <textarea id="itemInput" placeholder="Write a to-do or idea…" autocomplete="off" maxlength="5000" rows="1"></textarea>
            <div class="action-buttons">
                <button id="bulletBtn" class="bullet-btn" aria-label="Toggle bullet mode" title="Bullet mode: auto-add • at start of each line">•</button>
                <button id="newlineBtn" class="newline-btn" aria-label="Insert new line" title="Insert a new line (Shift+Enter)">↵</button>
                <button id="resizeBtn" class="resize-btn" aria-label="Cycle input size" title="Cycle input height (small → medium → large)">▤</button>
                <button id="addBtn" aria-label="Add item" title="Add item (Enter)">+</button>
            </div>
        </div>
        <div class="hint" id="hintLine">
            <kbd>Enter</kbd> save · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line · <kbd>Esc</kbd> clear · click text to edit · click ○ to mark done
        </div>

        <!-- Items list -->
        <div id="itemsList" class="items-list"></div>

        <!-- Sync status / footer -->
        <div class="footer-note">
            <span id="syncStatus">☁️ Not signed in</span>
        </div>

        <!-- Copyright footnote -->
        <div class="copyright">
            Copyright 2026 Dr. Wen-Ming Yang. All Rights Reserved
        </div>
    </div>

    <script>
        // ===================================================================
        // 1. Firebase config — SAME project as your Pomodoro app
        // ===================================================================
        const FB_CONFIG = {
            apiKey: "AIzaSyCn-INjtwiFoS66VXAADfVLLAqmjJOyksc",
            authDomain: "qtodo-syn.firebaseapp.com",
            projectId: "qtodo-syn",
            storageBucket: "qtodo-syn.firebasestorage.app",
            messagingSenderId: "663058774385",
            appId: "1:663058774385:web:a2972f2eb032c8cc4d5ed0"
        };

        // ===================================================================
        // 2. Initialize Firebase with a NAMED app
        // ===================================================================
        let cloudApp, cloudAuth, cloudDb;
        let cloudReady = false;

        try {
            if (typeof firebase !== 'undefined') {
                try { cloudApp = firebase.app('cloud-notes'); }
                catch (e) { cloudApp = firebase.initializeApp(FB_CONFIG, 'cloud-notes'); }
                cloudAuth = firebase.auth(cloudApp);
                cloudDb = firebase.firestore(cloudApp);
                cloudReady = true;
            }
        } catch (e) {
            console.warn('Cloud sync unavailable:', e);
        }

        if (cloudReady) {
            try {
                cloudAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                    .catch((e) => console.warn('setPersistence failed:', e));
            } catch (e) { /* ignore */ }
        }

        const googleProvider = new firebase.auth.GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        // ===================================================================
        // 3. Global state & DOM references
        // ===================================================================
        let cloudUser = null;
        let itemsUnsubscribe = null;
        let itemsArray = [];
        let editingItemId = null;

        // Reply state
        let replyingToId = null;
        let editingReply = null;

        let nullUserTimer = null;
        const NULL_USER_GRACE_MS = 1500;

        const PREF_KEY = 'cloudNotesPrefs';
        let bulletMode = false;
        let manuallyResized = false;
        let resizeCycleIndex = 0;
        const RESIZE_CYCLE = [52, 120, 220, 340];

        let searchQuery = '';

        function loadPrefs() {
            try {
                const raw = localStorage.getItem(PREF_KEY);
                if (!raw) return;
                const p = JSON.parse(raw);
                if (typeof p.bulletMode === 'boolean') bulletMode = p.bulletMode;
            } catch (e) { /* ignore */ }
        }
        function savePrefs() {
            try {
                localStorage.setItem(PREF_KEY, JSON.stringify({ bulletMode }));
            } catch (e) { /* ignore */ }
        }

        const signInContainer = document.getElementById('signInContainer');
        const userProfile = document.getElementById('userProfile');
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const newlineBtn = document.getElementById('newlineBtn');
        const bulletBtn = document.getElementById('bulletBtn');
        const resizeBtn = document.getElementById('resizeBtn');
        const hintLine = document.getElementById('hintLine');
        const itemsList = document.getElementById('itemsList');
        const syncStatus = document.getElementById('syncStatus');
        const searchInput = document.getElementById('searchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');

        // ===================================================================
        // 4. Auto-resize the main input
        // ===================================================================
        function autoResizeInput() {
            if (manuallyResized) return;
            itemInput.style.height = 'auto';
            const natural = itemInput.scrollHeight;
            itemInput.style.height = Math.min(natural, 500) + 'px';
        }

        itemInput.addEventListener('mousedown', (e) => {
            const rect = itemInput.getBoundingClientRect();
            const nearCornerX = (rect.right - e.clientX) < 20;
            const nearCornerY = (rect.bottom - e.clientY) < 20;
            if (nearCornerX && nearCornerY) manuallyResized = true;
        });

        // ===================================================================
        // 5. Bullet mode
        // ===================================================================
        function setBulletMode(enabled, skipSave) {
            bulletMode = enabled;
            bulletBtn.classList.toggle('active', enabled);
            bulletBtn.title = enabled
                ? 'Bullet mode ON — press Enter to start the next bullet; Enter on an empty bullet to save'
                : 'Bullet mode: auto-add • at start of each line';
            if (enabled && itemInput.value === '') {
                itemInput.value = '• ';
                itemInput.selectionStart = itemInput.selectionEnd = 2;
                autoResizeInput();
            }
            if (!enabled && /^•\s*$/.test(itemInput.value)) {
                itemInput.value = '';
                autoResizeInput();
            }
            if (!skipSave) savePrefs();
        }

        bulletBtn.addEventListener('click', (e) => {
            e.preventDefault();
            setBulletMode(!bulletMode);
            itemInput.focus();
        });

        // ===================================================================
        // 6. Resize cycle button
        // ===================================================================
        function applyResizeCycle() {
            const h = RESIZE_CYCLE[resizeCycleIndex % RESIZE_CYCLE.length];
            itemInput.style.height = h + 'px';
            resizeCycleIndex++;
            manuallyResized = false;
            itemInput.focus();
        }
        resizeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            applyResizeCycle();
        });

        // ===================================================================
        // 7. Authentication flow
        // ===================================================================
        googleSignInBtn.addEventListener('click', async () => {
            if (!cloudReady) {
                alert("Cloud sync is unavailable right now (couldn't load Firebase). Check your connection and try again.");
                return;
            }
            try {
                await cloudAuth.signInWithPopup(googleProvider);
            } catch (e) {
                const code = e && e.code ? e.code : '';
                const silent = [
                    'auth/popup-closed-by-user',
                    'auth/cancelled-popup-request',
                    'auth/popup-blocked',
                ];
                if (!silent.includes(code)) {
                    alert('Sign-in failed: ' + (e.message || code));
                }
            }
        });

        signOutBtn.addEventListener('click', () => {
            if (!cloudUser) return;
            stopCloudListener();
            if (nullUserTimer) { clearTimeout(nullUserTimer); nullUserTimer = null; }
            cloudAuth.signOut().catch((e) => console.error('Sign-out error:', e));
        });

        // ===================================================================
        // 8. onAuthStateChanged with a null-user debounce
        // ===================================================================
        if (cloudReady) {
            cloudAuth.onAuthStateChanged((user) => {
                if (user) {
                    if (nullUserTimer) { clearTimeout(nullUserTimer); nullUserTimer = null; }
                    const wasSignedOut = !cloudUser;
                    cloudUser = user;

                    signInContainer.classList.add('hidden');
                    userProfile.classList.remove('hidden');
                    userAvatar.src = user.photoURL || 'https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/default-avatar.png';
                    userName.textContent = user.displayName || user.email || 'User';
                    if (wasSignedOut) syncStatus.textContent = '☁️ Loading...';

                    subscribeToItems();
                } else {
                    if (nullUserTimer) clearTimeout(nullUserTimer);
                    nullUserTimer = setTimeout(() => {
                        nullUserTimer = null;
                        cloudUser = null;
                        signInContainer.classList.remove('hidden');
                        userProfile.classList.add('hidden');
                        syncStatus.textContent = '☁️ Not signed in';
                        stopCloudListener();
                        itemsArray = [];
                        editingItemId = null;
                        replyingToId = null;
                        editingReply = null;
                        renderItems();
                    }, NULL_USER_GRACE_MS);
                }
            });
        }

        // ===================================================================
        // 9. Firestore realtime listener
        // ===================================================================
        function itemsCollectionRef() {
            if (!cloudUser || !cloudDb) return null;
            return cloudDb.collection('users').doc(cloudUser.uid)
                          .collection('cloud_notes').doc('data')
                          .collection('items');
        }

        function subscribeToItems() {
            const ref = itemsCollectionRef();
            if (!ref) return;
            if (itemsUnsubscribe) itemsUnsubscribe();

            itemsUnsubscribe = ref.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                const newItems = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    newItems.push({
                        id: doc.id,
                        text: data.text || '',
                        done: data.done || false,
                        pinned: data.pinned || false,
                        createdAt: data.createdAt || 0,
                        updatedAt: data.updatedAt || 0,
                        replies: Array.isArray(data.replies) ? data.replies : [],
                    });
                });
                itemsArray = newItems;
                renderItems();
                setCloudStatus(snapshot.metadata.hasPendingWrites ? 'pending' : 'synced');
            }, (error) => {
                console.error('Firestore listener error:', error);
                setCloudStatus('error');
            });
        }

        function stopCloudListener() {
            if (itemsUnsubscribe) { itemsUnsubscribe(); itemsUnsubscribe = null; }
        }

        function setCloudStatus(state) {
            if (!syncStatus) return;
            if (!cloudUser) { syncStatus.textContent = '☁️ Not signed in'; return; }
            if (state === 'pending') syncStatus.textContent = '🟡 Saving to cloud…';
            else if (state === 'synced') {
                const n = itemsArray.length;
                syncStatus.textContent = `🟢 Synced · ${n} item${n !== 1 ? 's' : ''}`;
            }
            else if (state === 'error') syncStatus.textContent = '🔴 Cloud error — retrying';
        }

        // ===================================================================
        // 10. Date formatting helpers
        // ===================================================================
        function pad(n) { return String(n).padStart(2, '0'); }

        function formatCreatedLabel(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const sameDay = (a, b) =>
                a.getFullYear() === b.getFullYear() &&
                a.getMonth() === b.getMonth() &&
                a.getDate() === b.getDate();
            const yest = new Date(now); yest.setDate(now.getDate() - 1);
            const tom  = new Date(now); tom.setDate(now.getDate() + 1);

            if (sameDay(d, now)) return 'Today';
            if (sameDay(d, yest)) return 'Yesterday';
            if (sameDay(d, tom))  return 'Tomorrow';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatTimeLabel(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        function formatFullTooltip(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
                   `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        // ===================================================================
        // 10b. Filtered + sorted view of itemsArray
        // ===================================================================
        function getVisibleItems() {
            const q = searchQuery.trim().toLowerCase();
            let list = itemsArray;
            if (q) {
                list = list.filter(it => {
                    if (it.text.toLowerCase().includes(q)) return true;
                    if (Array.isArray(it.replies)) {
                        return it.replies.some(r => (r.text || '').toLowerCase().includes(q));
                    }
                    return false;
                });
            }
            const pinned = list.filter(it => it.pinned);
            const unpinned = list.filter(it => !it.pinned);
            return pinned.concat(unpinned);
        }

        // ===================================================================
        // 11. Render items (with edit mode + pin + search + replies)
        // ===================================================================
        function renderItems() {
            const visible = getVisibleItems();

            if (!visible.length) {
                if (searchQuery.trim()) {
                    itemsList.innerHTML = `<div class="empty-state">🔍 No items match "<strong>${escapeHtml(searchQuery.trim())}</strong>".</div>`;
                } else {
                    itemsList.innerHTML = `<div class="empty-state">✨ No items yet. Add a to‑do or idea above.</div>`;
                }
                return;
            }

            let html = '';
            visible.forEach((item) => {
                const doneClass = item.done ? 'done' : '';
                const pinnedClass = item.pinned ? 'pinned' : '';
                const isEditing = editingItemId === item.id;
                const createdLabel = formatCreatedLabel(item.createdAt);
                const timeLabel = formatTimeLabel(item.createdAt);
                const fullTooltip = formatFullTooltip(item.createdAt);

                const wasEdited = item.updatedAt && item.createdAt &&
                                  (item.updatedAt - item.createdAt) > 1000;

                const replies = Array.isArray(item.replies) ? item.replies : [];
                const replyCount = replies.length;
                const showReplyBox = replyingToId === item.id;

                // ---- replies HTML ----
                let repliesHtml = '';
                if (replies.length || showReplyBox) {
                    repliesHtml += `<div class="replies-wrap">`;

                    replies.forEach(r => {
                        const rDone = r.done ? 'done' : '';
                        const rIsEditing = editingReply &&
                                            editingReply.itemId === item.id &&
                                            editingReply.replyId === r.id;
                        const rCreated = formatCreatedLabel(r.createdAt);
                        const rTime = formatTimeLabel(r.createdAt);
                        const rWasEdited = r.updatedAt && r.createdAt &&
                                           (r.updatedAt - r.createdAt) > 1000;

                        if (rIsEditing) {
                            repliesHtml += `
                                <div class="reply" data-reply-id="${r.id}">
                                    <div class="reply-body">
                                        <textarea class="edit-textarea" data-reply-edit="1" data-id="${item.id}" data-reply-id="${r.id}" rows="2">${escapeHtml(r.text || '')}</textarea>
                                        <div class="edit-buttons">
                                            <button class="btn save-btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="save-reply">💾 Save</button>
                                            <button class="btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="cancel-reply">Cancel</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            repliesHtml += `
                                <div class="reply" data-reply-id="${r.id}">
                                    <div class="reply-body">
                                        <div class="reply-text ${rDone}" data-id="${item.id}" data-reply-id="${r.id}" title="Click to edit · use ✓ button to toggle done">${escapeHtml(r.text || '')}</div>
                                        <div class="reply-meta">
                                            <span class="chip" title="${escapeHtml(formatFullTooltip(r.createdAt))}">🕒 ${escapeHtml(rCreated)} · ${escapeHtml(rTime)}</span>
                                            ${rWasEdited ? `<span class="chip edited" title="Last edited: ${escapeHtml(formatFullTooltip(r.updatedAt))}">✎ edited</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="reply-actions">
                                        <button class="done-btn ${rDone}" data-id="${item.id}" data-reply-id="${r.id}" data-action="toggle-reply" title="Mark done / undone" aria-label="toggle reply done">✓</button>
                                        <button class="edit-reply-btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="edit-reply" title="Edit reply" aria-label="edit reply">✎</button>
                                        <button class="del-btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="delete-reply" title="Delete reply" aria-label="delete reply">✕</button>
                                    </div>
                                </div>
                            `;
                        }
                    });

                    if (showReplyBox) {
                        repliesHtml += `
                            <div class="reply-add-row">
                                <textarea data-reply-input="1" data-id="${item.id}" rows="1" placeholder="Write a reply… (Enter to post, Esc to cancel)" maxlength="2000"></textarea>
                                <button data-id="${item.id}" data-action="post-reply" title="Post reply" aria-label="post reply">➤</button>
                            </div>
                        `;
                    }

                    repliesHtml += `</div>`;
                }

                if (isEditing) {
                    html += `
                        <div class="item editing ${pinnedClass}" data-id="${item.id}">
                            <div class="item-check ${doneClass}" data-id="${item.id}" role="button" aria-label="toggle done"></div>
                            <div class="item-body">
                                <textarea class="edit-textarea" data-id="${item.id}" rows="2">${escapeHtml(item.text)}</textarea>
                                <div class="edit-buttons">
                                    <button class="btn save-btn" data-id="${item.id}" data-action="save">💾 Save</button>
                                    <button class="btn" data-id="${item.id}" data-action="cancel">Cancel</button>
                                </div>
                            </div>
                            ${repliesHtml}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="item ${pinnedClass}" data-id="${item.id}">
                            <div class="item-check ${doneClass}" data-id="${item.id}" role="button" aria-label="toggle done"></div>
                            <div class="item-body">
                                <div class="item-text ${doneClass}" data-id="${item.id}" title="Click to edit">${escapeHtml(item.text)}</div>
                                <div class="item-meta">
                                    <span class="chip" title="${escapeHtml(fullTooltip)}">🕒 ${escapeHtml(createdLabel)} · ${escapeHtml(timeLabel)}</span>
                                    ${item.pinned ? `<span class="chip pin-chip" title="Pinned to top">📌 pinned</span>` : ''}
                                    ${wasEdited ? `<span class="chip edited" title="Last edited: ${escapeHtml(formatFullTooltip(item.updatedAt))}">✎ edited</span>` : ''}
                                    ${replyCount ? `<span class="chip reply-chip" data-id="${item.id}" data-action="toggle-replies" title="Click to open the reply box">💬 ${replyCount} repl${replyCount === 1 ? 'y' : 'ies'}</span>` : ''}
                                    <div class="item-actions">
                                        <button class="reply-btn ${showReplyBox ? 'active' : ''}" data-id="${item.id}" data-action="open-reply" aria-label="reply" title="Add a reply / sub-note">💬</button>
                                        <button class="pin-btn ${item.pinned ? 'pinned' : ''}" data-id="${item.id}" aria-label="pin" title="${item.pinned ? 'Unpin' : 'Pin to top'}">${item.pinned ? '📌' : '📍'}</button>
                                        <button class="edit-btn" data-id="${item.id}" aria-label="edit" title="Edit (or click text)">✎</button>
                                        <button class="del-btn" data-id="${item.id}" aria-label="delete" title="Delete">✕</button>
                                    </div>
                                </div>
                            </div>
                            ${repliesHtml}
                        </div>
                    `;
                }
            });
            itemsList.innerHTML = html;

            if (editingItemId) {
                const ta = itemsList.querySelector(`.edit-textarea[data-id="${editingItemId}"]:not([data-reply-edit])`);
                if (ta) {
                    ta.style.height = 'auto';
                    const natural = ta.scrollHeight;
                    ta.style.height = Math.min(Math.max(natural, 70), 500) + 'px';
                    ta.focus();
                    ta.selectionStart = ta.selectionEnd = ta.value.length;
                }
            }

            if (replyingToId) {
                const rta = itemsList.querySelector(`textarea[data-reply-input][data-id="${replyingToId}"]`);
                if (rta) {
                    rta.style.height = 'auto';
                    rta.style.height = Math.min(Math.max(rta.scrollHeight, 36), 200) + 'px';
                    rta.focus();
                    rta.selectionStart = rta.selectionEnd = rta.value.length;
                }
            }

            if (editingReply) {
                const reta = itemsList.querySelector(`.edit-textarea[data-reply-edit][data-reply-id="${editingReply.replyId}"]`);
                if (reta) {
                    reta.style.height = 'auto';
                    reta.style.height = Math.min(Math.max(reta.scrollHeight, 44), 200) + 'px';
                    reta.focus();
                    reta.selectionStart = reta.selectionEnd = reta.value.length;
                }
            }
        }

        function escapeHtml(unsafe) {
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ===================================================================
        // 12. Event delegation for item + reply actions
        //
        //   Behaviour change:
        //   • Clicking .item-text  → enter edit mode (was: toggle done)
        //   • Clicking .item-check → toggle done (unchanged)
        //   • Clicking .reply-text → enter reply edit mode (was: toggle done)
        //   • Clicking ✓ button on a reply → toggle reply done (unchanged)
        // ===================================================================
        itemsList.addEventListener('click', async (e) => {
            // ---- Reply-related clicks first (they carry data-reply-id) ----
            const replyTarget = e.target.closest('[data-reply-id]');
            if (replyTarget) {
                const itemId = replyTarget.dataset.id;
                const replyId = replyTarget.dataset.replyId;
                const action = replyTarget.dataset.action;
                if (!itemId || !replyId || !cloudUser) return;

                if (action === 'save-reply') {
                    await saveReplyEdit(itemId, replyId);
                    return;
                }
                if (action === 'cancel-reply') {
                    editingReply = null;
                    renderItems();
                    return;
                }
                if (action === 'toggle-reply') {
                    await toggleReplyDone(itemId, replyId);
                    return;
                }
                if (action === 'edit-reply') {
                    editingReply = { itemId, replyId };
                    replyingToId = null;
                    renderItems();
                    return;
                }
                if (action === 'delete-reply') {
                    await deleteReply(itemId, replyId);
                    return;
                }
                // Clicking the reply text now opens the reply editor
                if (replyTarget.classList.contains('reply-text')) {
                    editingReply = { itemId, replyId };
                    replyingToId = null;
                    renderItems();
                    return;
                }
                return;
            }

            // ---- Item-level clicks ----
            const target = e.target.closest('[data-id]');
            if (!target) return;
            const itemId = target.dataset.id;
            if (!itemId || !cloudUser) return;

            if (target.dataset.action === 'save') {
                await saveEdit(itemId);
                return;
            }
            if (target.dataset.action === 'cancel') {
                editingItemId = null;
                renderItems();
                return;
            }
            if (target.dataset.action === 'open-reply') {
                replyingToId = (replyingToId === itemId) ? null : itemId;
                editingReply = null;
                renderItems();
                return;
            }
            if (target.dataset.action === 'post-reply') {
                await postReply(itemId);
                return;
            }
            if (target.dataset.action === 'toggle-replies') {
                replyingToId = (replyingToId === itemId) ? null : itemId;
                renderItems();
                return;
            }

            if (editingItemId === itemId && !target.classList.contains('item-check')) {
                return;
            }

            if (target.classList.contains('item-check')) {
                await toggleItemDone(itemId);
                return;
            }
            if (target.classList.contains('pin-btn')) {
                await toggleItemPin(itemId);
                return;
            }
            if (target.classList.contains('edit-btn')) {
                startEdit(itemId);
                return;
            }
            if (target.classList.contains('del-btn')) {
                await deleteItem(itemId);
                return;
            }
            // Clicking the item text now enters edit mode
            if (target.classList.contains('item-text')) {
                startEdit(itemId);
                return;
            }
        });

        // Double-click on text also opens edit mode (unchanged, still convenient)
        itemsList.addEventListener('dblclick', (e) => {
            const textEl = e.target.closest('.item-text');
            if (textEl) {
                const itemId = textEl.dataset.id;
                if (!itemId) return;
                startEdit(itemId);
                return;
            }
            const replyEl = e.target.closest('.reply-text');
            if (replyEl) {
                const itemId = replyEl.dataset.id;
                const replyId = replyEl.dataset.replyId;
                if (!itemId || !replyId) return;
                editingReply = { itemId, replyId };
                replyingToId = null;
                renderItems();
            }
        });

        function startEdit(itemId) {
            editingItemId = itemId;
            editingReply = null;
            renderItems();
        }

        async function saveEdit(itemId) {
            const ta = itemsList.querySelector(`.edit-textarea[data-id="${itemId}"]:not([data-reply-edit])`);
            if (!ta) return;
            const newText = ta.value.replace(/[ \t]+$/gm, '').trim();
            if (!newText) {
                alert('Item text cannot be empty. Press Cancel to keep the original.');
                return;
            }
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            if (newText === item.text) {
                editingItemId = null;
                renderItems();
                return;
            }
            try {
                await itemsCollectionRef().doc(itemId).update({
                    text: newText,
                    updatedAt: Date.now(),
                });
                editingItemId = null;
            } catch (error) {
                console.error('Error saving edit:', error);
                alert('Could not save edit. Check your connection.');
            }
        }

        async function toggleItemDone(itemId) {
            if (!cloudUser) return;
            if (editingItemId === itemId) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            try {
                await itemsCollectionRef().doc(itemId).update({
                    done: !item.done,
                    updatedAt: Date.now()
                });
            } catch (error) {
                console.error('Error toggling item:', error);
                alert('Could not update item. Please try again.');
            }
        }

        async function toggleItemPin(itemId) {
            if (!cloudUser) return;
            if (editingItemId === itemId) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            try {
                await itemsCollectionRef().doc(itemId).update({
                    pinned: !item.pinned,
                    updatedAt: Date.now()
                });
            } catch (error) {
                console.error('Error toggling pin:', error);
                alert('Could not update pin. Please try again.');
            }
        }

        async function deleteItem(itemId) {
            if (!cloudUser) return;
            if (!confirm('Delete this item and all its replies?')) return;
            try {
                await itemsCollectionRef().doc(itemId).delete();
                if (editingItemId === itemId) editingItemId = null;
                if (replyingToId === itemId) replyingToId = null;
                if (editingReply && editingReply.itemId === itemId) editingReply = null;
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Could not delete item.');
            }
        }

        // ===================================================================
        // 12b. Reply actions
        // ===================================================================
        function makeReplyId() {
            return 'r_' + Date.now().toString(36) + '_' +
                   Math.random().toString(36).slice(2, 8);
        }

        async function postReply(itemId) {
            const ta = itemsList.querySelector(`textarea[data-reply-input][data-id="${itemId}"]`);
            if (!ta) return;
            const text = ta.value.replace(/[ \t]+$/gm, '').trim();
            if (!text) { ta.focus(); return; }

            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;

            const now = Date.now();
            const newReply = {
                id: makeReplyId(),
                text: text,
                done: false,
                createdAt: now,
                updatedAt: now,
            };
            const updatedReplies = (Array.isArray(item.replies) ? item.replies : []).concat(newReply);

            item.replies = updatedReplies;
            replyingToId = null;
            renderItems();

            try {
                await itemsCollectionRef().doc(itemId).update({
                    replies: updatedReplies,
                    updatedAt: now,
                });
            } catch (error) {
                console.error('Error posting reply:', error);
                alert('Could not post reply. Check your connection.');
            }
        }

        async function saveReplyEdit(itemId, replyId) {
            const ta = itemsList.querySelector(`.edit-textarea[data-reply-edit][data-reply-id="${replyId}"]`);
            if (!ta) return;
            const newText = ta.value.replace(/[ \t]+$/gm, '').trim();
            if (!newText) {
                alert('Reply cannot be empty. Press Cancel to keep the original.');
                return;
            }
            const item = itemsArray.find(i => i.id === itemId);
            if (!item || !Array.isArray(item.replies)) return;
            const idx = item.replies.findIndex(r => r.id === replyId);
            if (idx === -1) return;

            const updatedReplies = item.replies.slice();
            updatedReplies[idx] = Object.assign({}, updatedReplies[idx], {
                text: newText,
                updatedAt: Date.now(),
            });

            item.replies = updatedReplies;
            editingReply = null;
            renderItems();

            try {
                await itemsCollectionRef().doc(itemId).update({
                    replies: updatedReplies,
                    updatedAt: Date.now(),
                });
            } catch (error) {
                console.error('Error saving reply edit:', error);
                alert('Could not save reply edit. Check your connection.');
            }
        }

        async function toggleReplyDone(itemId, replyId) {
            if (!cloudUser) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item || !Array.isArray(item.replies)) return;
            const idx = item.replies.findIndex(r => r.id === replyId);
            if (idx === -1) return;

            const updatedReplies = item.replies.slice();
            updatedReplies[idx] = Object.assign({}, updatedReplies[idx], {
                done: !updatedReplies[idx].done,
                updatedAt: Date.now(),
            });

            item.replies = updatedReplies;
            renderItems();

            try {
                await itemsCollectionRef().doc(itemId).update({
                    replies: updatedReplies,
                    updatedAt: Date.now(),
                });
            } catch (error) {
                console.error('Error toggling reply:', error);
                alert('Could not update reply. Please try again.');
            }
        }

        async function deleteReply(itemId, replyId) {
            if (!cloudUser) return;
            if (!confirm('Delete this reply?')) return;
            const item = itemsArray.find(i => i.id === itemId);
            if (!item || !Array.isArray(item.replies)) return;

            const updatedReplies = item.replies.filter(r => r.id !== replyId);
            item.replies = updatedReplies;
            if (editingReply && editingReply.replyId === replyId) editingReply = null;
            renderItems();

            try {
                await itemsCollectionRef().doc(itemId).update({
                    replies: updatedReplies,
                    updatedAt: Date.now(),
                });
            } catch (error) {
                console.error('Error deleting reply:', error);
                alert('Could not delete reply.');
            }
        }

        // ===================================================================
        // 12c. Auto-close empty reply box on click outside
        // ===================================================================
        document.addEventListener('mousedown', (e) => {
            if (!replyingToId) return;
            if (editingReply) return;

            const inReplyBox = e.target.closest && e.target.closest('.reply-add-row');
            const onReplyToggle = e.target.closest && e.target.closest('.reply-btn');
            const onReplyChip = e.target.closest && e.target.closest('.reply-chip');
            const onItemCard = e.target.closest && e.target.closest('.item');

            if (inReplyBox) return;
            if (onReplyToggle) return;
            if (onReplyChip) return;

            if (onItemCard) {
                const sameItem = onItemCard.dataset && onItemCard.dataset.id === replyingToId;
                if (sameItem) {
                    const actionBtn = e.target.closest('button, .item-text, .item-check, .reply-chip');
                    if (actionBtn) return;
                }
            }

            const ta = itemsList.querySelector(`textarea[data-reply-input][data-id="${replyingToId}"]`);
            const hasDraft = ta && ta.value.trim().length > 0;

            if (!hasDraft) {
                replyingToId = null;
                renderItems();
            }
        });

        // ===================================================================
        // 13. Keyboard shortcuts inside the inline edit textareas
        // ===================================================================
        itemsList.addEventListener('keydown', (e) => {
            const ta = e.target;

            if (ta.matches && ta.matches('textarea[data-reply-input]')) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    postReply(ta.dataset.id);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    replyingToId = null;
                    renderItems();
                }
                return;
            }

            if (!ta.classList || !ta.classList.contains('edit-textarea')) return;
            const itemId = ta.dataset.id;

            if (ta.dataset.replyEdit) {
                const replyId = ta.dataset.replyId;
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    saveReplyEdit(itemId, replyId);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    editingReply = null;
                    renderItems();
                }
                return;
            }

            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                saveEdit(itemId);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                editingItemId = null;
                renderItems();
            }
        });

        itemsList.addEventListener('input', (e) => {
            const ta = e.target;
            if (ta.matches && ta.matches('textarea[data-reply-input]')) {
                ta.style.height = 'auto';
                ta.style.height = Math.min(Math.max(ta.scrollHeight, 36), 200) + 'px';
            }
        });

        // ===================================================================
        // 14. Newline insertion in the main input
        // ===================================================================
        function insertNewlineAtCursor() {
            const start = itemInput.selectionStart;
            const end = itemInput.selectionEnd;
            const value = itemInput.value;

            let insertion = '\n';
            if (bulletMode) {
                const lineStart = value.lastIndexOf('\n', start - 1) + 1;
                const beforeCursor = value.slice(lineStart, start);
                insertion = (beforeCursor.trim() === '' && start === lineStart)
                    ? '• '
                    : '\n• ';
            }

            itemInput.value = value.slice(0, start) + insertion + value.slice(end);
            const newPos = start + insertion.length;
            itemInput.selectionStart = itemInput.selectionEnd = newPos;
            itemInput.focus();
            autoResizeInput();
        }

        newlineBtn.addEventListener('click', (e) => {
            e.preventDefault();
            insertNewlineAtCursor();
        });

        // ===================================================================
        // 15. Add new item
        // ===================================================================
        async function addNewItem() {
            if (!cloudUser) {
                alert('Please sign in with Google to save your notes.');
                return;
            }
            const text = itemInput.value.replace(/[ \t]+$/gm, '').trim();
            if (!text) { itemInput.focus(); return; }

            const ref = itemsCollectionRef();
            if (!ref) return;

            addBtn.disabled = true;
            addBtn.innerHTML = '<span class="loading-spinner"></span>';
            setCloudStatus('pending');

            const newDocRef = ref.doc();
            const now = Date.now();
            const optimisticItem = {
                id: newDocRef.id,
                text: text,
                done: false,
                pinned: false,
                createdAt: now,
                updatedAt: now,
                replies: [],
            };

            itemsArray.unshift(optimisticItem);
            renderItems();

            itemInput.value = bulletMode ? '• ' : '';
            manuallyResized = false;
            itemInput.style.height = '';
            autoResizeInput();
            itemInput.focus();
            itemInput.selectionStart = itemInput.selectionEnd = itemInput.value.length;

            try {
                await newDocRef.set({
                    text: text,
                    done: false,
                    pinned: false,
                    createdAt: now,
                    updatedAt: now,
                    replies: [],
                });
            } catch (error) {
                console.error('Error adding item:', error);
                alert('Could not add item. Check your connection.');
                setCloudStatus('error');
                itemsArray = itemsArray.filter(i => i.id !== newDocRef.id);
                renderItems();
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '+';
            }
        }

        addBtn.addEventListener('click', addNewItem);

        // ===================================================================
        // 16. Main input keyboard handling
        // ===================================================================
        itemInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') {
                if (e.key === 'Escape') {
                    itemInput.value = bulletMode ? '• ' : '';
                    manuallyResized = false;
                    itemInput.style.height = '';
                    autoResizeInput();
                    itemInput.selectionStart = itemInput.selectionEnd = itemInput.value.length;
                }
                return;
            }

            const value = itemInput.value;
            const pos = itemInput.selectionStart;
            const lineStart = value.lastIndexOf('\n', pos - 1) + 1;
            const currentLine = value.slice(lineStart, pos);
            const isEmptyBulletLine = /^•\s*$/.test(currentLine);

            if (!e.shiftKey) {
                e.preventDefault();
                if (bulletMode && isEmptyBulletLine) {
                    const cleaned = value.slice(0, lineStart) + value.slice(pos);
                    itemInput.value = cleaned.replace(/[ \t]+$/gm, '').trim();
                }
                addNewItem();
                return;
            }

            e.preventDefault();
            insertNewlineAtCursor();
        });

        itemInput.addEventListener('input', autoResizeInput);

        // ===================================================================
        // 16b. Search input handling
        // ===================================================================
        searchInput.addEventListener('input', () => {
            searchQuery = searchInput.value;
            searchClearBtn.classList.toggle('hidden', searchQuery.length === 0);
            renderItems();
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                e.preventDefault();
                clearSearch();
            }
        });

        searchClearBtn.addEventListener('click', () => {
            clearSearch();
        });

        function clearSearch() {
            searchQuery = '';
            searchInput.value = '';
            searchClearBtn.classList.add('hidden');
            renderItems();
            searchInput.focus();
        }

        // ===================================================================
        // 17. Init
        // ===================================================================
        window.addEventListener('load', () => {
            loadPrefs();
            setBulletMode(bulletMode, true);
            if (bulletMode && itemInput.value === '') {
                itemInput.value = '• ';
                itemInput.selectionStart = itemInput.selectionEnd = 2;
            }
            autoResizeInput();
            setTimeout(() => {
                if (!cloudUser) {
                    syncStatus.textContent = '☁️ Sign in to sync';
                }
            }, 500);
        });
    </script>
</body>
</html>
