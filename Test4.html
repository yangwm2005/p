<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cloud Jots</title>
    <!-- Firebase SDK (cloud sync) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .app-container {
            background: white;
            max-width: 700px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
            padding: 24px 20px 32px;
            transition: all 0.2s;
        }

        /* HEADER */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .app-header h1 span {
            font-size: 1.7rem;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .user-chip .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.7rem;
            color: #475569;
            flex-shrink: 0;
            object-fit: cover;
            border: 1.5px solid #e2e8f0;
        }
        .user-chip .user-name {
            font-weight: 500;
            font-size: 0.78rem;
            color: #475569;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }
        .user-chip .chip-btn {
            background: none;
            border: none;
            font-size: 0.7rem;
            color: #64748b;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 20px;
            font-family: inherit;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .user-chip .chip-btn:hover {
            background: #f1f5f9;
            color: #1e293b;
        }
        .user-chip .chip-btn.sign-in {
            color: #4f46e5;
            font-weight: 600;
        }
        .user-chip .chip-btn.sign-in:hover {
            background: #eef2ff;
            color: #4338ca;
        }
        .user-chip .chip-sep {
            color: #cbd5e1;
            font-size: 0.7rem;
            user-select: none;
        }

        /* ADD SECTION */
        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
            align-items: flex-start;
        }
        .add-section .add-input-area {
            flex: 1;
            min-width: 0;
        }
        .add-section textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 24px;
            border: 1.5px solid #e2e8f0;
            font-size: 1rem;
            font-family: inherit;
            background: #ffffff;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
            resize: vertical;
            min-height: 52px;
            max-height: 500px;
            line-height: 1.4;
            overflow-y: auto;
        }
        .add-section textarea:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.1);
        }

        /* ACTION BUTTONS — compact */
        .action-buttons {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            flex-wrap: nowrap;
            align-items: center;
            padding-top: 8px;
        }
        .add-section button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            padding: 0;
            font-size: 1rem;
            line-height: 1;
            background: #1e293b;
            color: white;
            border: none;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.1s, background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-section button:hover {
            background: #0f172a;
        }
        .add-section button:active {
            transform: scale(0.92);
        }
        .add-section button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .add-section button.newline-btn,
        .add-section button.bullet-btn,
        .add-section button.resize-btn {
            background: #ede7e1;
            color: #1e293b;
            font-size: 0.85rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        .add-section button.newline-btn:hover,
        .add-section button.bullet-btn:hover,
        .add-section button.resize-btn:hover {
            background: #d9d0c6;
        }
        .add-section button.bullet-btn.active {
            background: #1e293b;
            color: #f5efe9;
            box-shadow: 0 3px 8px rgba(30, 41, 59, 0.25);
        }
        .add-section button.bullet-btn.active:hover {
            background: #0f172a;
        }

        /* BOTTOM ROW */
        .hint-row {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: #a99d92;
            line-height: 1.5;
            margin: 0 0 16px;
            padding: 0 4px;
        }
        .hint-row kbd {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 1px 6px;
            font-family: inherit;
            font-size: 0.7rem;
            color: #1e293b;
        }
        .hint-row .hint-tag {
            background: #e0e7ff;
            color: #3730a3;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .hint-row .hint-sep {
            color: #d5cbc1;
            user-select: none;
        }
        .tag-toggle-link {
            background: none;
            border: none;
            color: #4f46e5;
            font-size: 0.7rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 1px 4px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: background 0.15s, color 0.15s;
            line-height: 1.4;
        }
        .tag-toggle-link:hover {
            background: #eef2ff;
            color: #4338ca;
        }
        .tag-toggle-link .tag-toggle-caret {
            font-size: 0.6rem;
            line-height: 1;
            transition: transform 0.15s ease;
            display: inline-block;
        }
        .tag-toggle-link.open .tag-toggle-caret {
            transform: rotate(180deg);
        }
        .tag-toggle-link .tag-toggle-count {
            background: #e0e7ff;
            color: #3730a3;
            padding: 0 5px;
            border-radius: 20px;
            font-size: 0.62rem;
            font-weight: 700;
        }
        .tag-toggle-link.has-active-filter {
            color: #92400e;
        }
        .tag-toggle-link.has-active-filter:hover {
            background: #fef3c7;
            color: #78350f;
        }
        .tag-toggle-link.has-active-filter .tag-toggle-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #f59e0b;
            display: inline-block;
        }

        /* TAG PANEL */
        .tag-panel {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            animation: fadeIn 0.15s ease;
        }
        .tag-panel.open {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tag-panel .panel-section {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tag-panel .panel-section .section-label {
            font-size: 0.68rem;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            flex-shrink: 0;
            min-width: 52px;
        }

        .tag-panel .search-in-panel {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }
        .tag-panel .search-in-panel .search-icon {
            position: absolute;
            left: 12px;
            font-size: 0.85rem;
            color: #94a3b8;
            pointer-events: none;
            line-height: 1;
        }
        .tag-panel .search-in-panel input {
            width: 100%;
            padding: 8px 34px 8px 32px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            font-size: 0.85rem;
            font-family: inherit;
            background: #ffffff;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
        }
        .tag-panel .search-in-panel input:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.1);
        }
        .tag-panel .search-in-panel .search-clear {
            position: absolute;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .tag-panel .search-in-panel .search-clear:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .tag-panel .search-in-panel .search-clear.hidden {
            display: none;
        }

        /* NEW-TAG INPUT WRAP */
        .tag-panel .new-tag-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
        }
        .tag-panel .new-tag-input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 3px 4px 3px 10px;
            transition: border 0.15s, box-shadow 0.15s;
        }
        .tag-panel .new-tag-input-wrap:focus-within {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.1);
        }
        .tag-panel .new-tag-input-wrap .te-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        .tag-panel .new-tag-input-wrap .te-chips:empty {
            display: none;
        }
        .tag-panel .new-tag-input-wrap .te-chips .pending-tag {
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-weight: 600;
        }
        .tag-panel .new-tag-input-wrap .te-chips .pending-tag button {
            background: none;
            border: none;
            color: #6366f1;
            cursor: pointer;
            font-size: 0.68rem;
            padding: 0 2px;
            line-height: 1;
        }
        .tag-panel .new-tag-input-wrap .te-chips .pending-tag button:hover {
            color: #dc2626;
        }
        .tag-panel .new-tag-input-wrap input {
            flex: 1;
            min-width: 80px;
            border: none;
            background: transparent;
            padding: 4px 4px;
            font-size: 0.82rem;
            font-family: inherit;
            outline: none;
        }
        .tag-panel .new-tag-input-wrap input::placeholder {
            color: #cbd5e1;
        }

        /* SHARED TAG SUGGESTIONS DROPDOWN */
        .tag-suggestions {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            max-height: 220px;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.04);
            z-index: 30;
            padding: 4px;
            display: none;
        }
        .tag-suggestions.visible {
            display: block;
        }
        .tag-suggestions .suggestion {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.82rem;
            color: #334155;
            gap: 8px;
        }
        .tag-suggestions .suggestion:hover,
        .tag-suggestions .suggestion.active {
            background: #eef2ff;
            color: #3730a3;
        }
        .tag-suggestions .suggestion .sugg-hash {
            color: #6366f1;
            font-weight: 600;
        }
        .tag-suggestions .suggestion .sugg-count {
            font-size: 0.68rem;
            color: #94a3b8;
            font-weight: 600;
            flex-shrink: 0;
        }
        .tag-suggestions .suggestion.active .sugg-count,
        .tag-suggestions .suggestion:hover .sugg-count {
            color: #6366f1;
        }

        .tag-panel .existing-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .tag-panel .existing-tags:empty::before {
            content: 'No tags yet — add one above';
            font-size: 0.72rem;
            color: #cbd5e1;
            font-style: italic;
        }
        .tag-panel .existing-tags .existing-tag {
            background: #f1f5f9;
            color: #475569;
            padding: 3px 9px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.15s, color 0.15s;
            border: 1px solid transparent;
        }
        .tag-panel .existing-tags .existing-tag:hover {
            background: #e2e8f0;
        }
        .tag-panel .existing-tags .existing-tag.active {
            background: #6366f1;
            color: white;
        }
        .tag-panel .existing-tags .existing-tag .tag-count {
            opacity: 0.65;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .tag-panel .existing-tags .clear-all {
            background: none;
            border: none;
            font-size: 0.68rem;
            color: #64748b;
            cursor: pointer;
            text-decoration: underline;
            padding: 3px 6px;
            margin-left: auto;
        }
        .tag-panel .existing-tags .clear-all:hover {
            color: #dc2626;
        }

        /* DATE chips */
        .tag-panel .date-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .tag-panel .date-filters .date-chip {
            background: #f1f5f9;
            color: #475569;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid transparent;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            user-select: none;
        }
        .tag-panel .date-filters .date-chip:hover {
            background: #e2e8f0;
        }
        .tag-panel .date-filters .date-chip .date-range {
            font-weight: 500;
            font-size: 0.65rem;
            opacity: 0.75;
        }
        .tag-panel .date-filters .date-chip.today.active {
            background: #16a34a;
            border-color: #16a34a;
            color: white;
        }
        .tag-panel .date-filters .date-chip.three-days.active {
            background: #0ea5e9;
            border-color: #0ea5e9;
            color: white;
        }
        .tag-panel .date-filters .date-chip.this-week.active {
            background: #6366f1;
            border-color: #6366f1;
            color: white;
        }
        .tag-panel .date-filters .date-chip.last-week.active {
            background: #a855f7;
            border-color: #a855f7;
            color: white;
        }
        .tag-panel .date-filters .date-chip.active .date-range {
            opacity: 0.9;
        }

        /* ITEMS LIST */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 8px;
        }
        .item {
            background: #ffffff;
            border: 1px solid #e9eef3;
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: background 0.15s, border 0.15s;
            animation: fadeIn 0.15s ease;
            flex-wrap: wrap;
        }
        .item:hover {
            border-color: #cbd5e1;
            background: #fdfdfe;
        }
        .item.editing {
            border-color: #94a3b8;
            background: #f8fafc;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.12);
        }
        .item.pinned {
            border-color: #fbbf24;
            background: #fffdf5;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.12);
        }
        .item.pinned:hover {
            border-color: #f59e0b;
            background: #fffdf0;
        }
        .item-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.1s, border 0.1s;
            font-size: 14px;
            color: white;
            user-select: none;
            margin-top: 2px;
        }
        .item-check.done {
            background: #1e293b;
            border-color: #1e293b;
        }
        .item-check.done::after {
            content: "✓";
            color: white;
            font-weight: bold;
        }
        .item-body {
            flex: 1;
            min-width: 0;
        }
        .item-text {
            font-size: 1rem;
            color: #1e293b;
            word-break: break-word;
            line-height: 1.4;
            cursor: text;
            white-space: pre-wrap;
        }
        .item-text:hover {
            background: #f8fafc;
            border-radius: 6px;
            box-shadow: 0 0 0 4px #f8fafc;
        }
        .item-text.done {
            text-decoration: line-through;
            color: #94a3b8;
        }
        .item-meta {
            margin-top: 6px;
            font-size: 0.72rem;
            color: #94a3b8;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .item-meta .chip {
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 30px;
            cursor: help;
            user-select: none;
        }
        .item-meta .chip.edited {
            background: #ede7e1;
            color: #6d645b;
        }
        .item-meta .chip.pin-chip {
            background: #fef3c7;
            color: #92400e;
        }
        .item-meta .chip.tag-chip {
            background: #e0e7ff;
            color: #3730a3;
            cursor: pointer;
            transition: background 0.15s;
        }
        .item-meta .chip.tag-chip:hover {
            background: #c7d2fe;
        }
        .item-meta .chip.tag-chip.active {
            background: #6366f1;
            color: white;
        }
        .item-meta .chip.reply-chip {
            background: #dbeafe;
            color: #1e40af;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.15s;
        }
        .item-meta .chip.reply-chip:hover {
            background: #bfdbfe;
        }
        .item-meta .chip.reply-chip .reply-caret {
            font-size: 0.7rem;
            line-height: 1;
            transition: transform 0.15s ease;
            display: inline-block;
        }
        .item-meta .chip.reply-chip.collapsed .reply-caret {
            transform: rotate(-90deg);
        }
        .item-actions {
            display: flex;
            flex-direction: row;
            gap: 2px;
            flex-shrink: 0;
            align-items: center;
            margin-left: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .item:hover .item-actions,
        .item:focus-within .item-actions {
            opacity: 1;
            pointer-events: auto;
        }
        .item-actions button {
            background: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            line-height: 1;
            padding: 0;
        }
        .item-actions button:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .item-actions button.del-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .item-actions button.pin-btn.pinned {
            color: #f59e0b;
        }
        .item-actions button.pin-btn.pinned:hover {
            background: #fef3c7;
            color: #d97706;
        }
        .item-actions button.pin-btn:hover {
            background: #fef3c7;
            color: #f59e0b;
        }
        .item-actions button.reply-btn:hover {
            background: #dbeafe;
            color: #2563eb;
        }
        .item-actions button.reply-btn.active {
            background: #dbeafe;
            color: #2563eb;
        }
        .item-actions button.tag-btn:hover {
            background: #e0e7ff;
            color: #4338ca;
        }
        .item-actions button.tag-btn.active {
            background: #e0e7ff;
            color: #4338ca;

        // ===================================================================
        // Tag helpers
        // ===================================================================
        function normalizeTag(raw) {
            if (raw == null) return '';
            let t = String(raw).trim().toLowerCase();
            if (t.startsWith('#')) t = t.slice(1);
            t = t.replace(/[^a-z0-9\-_]/g, '');
            return t;
        }

        function parseTagInput(str) {
            if (!str) return [];
            const parts = String(str).split(/[\s,]+/);
            const out = [];
            const seen = new Set();
            for (const p of parts) {
                const t = normalizeTag(p);
                if (t && !seen.has(t)) { seen.add(t); out.push(t); }
            }
            return out;
        }

        function parseExplicitTags(text) {
            if (!text) return [];
            const out = [];
            const seen = new Set();
            const re = /(^|[^a-z0-9])#([a-z0-9][a-z0-9\-_]*)/gi;
            let m;
            while ((m = re.exec(text)) !== null) {
                const t = normalizeTag(m[2]);
                if (t && !seen.has(t)) { seen.add(t); out.push(t); }
            }
            return out;
        }

        function mergeTags(existing, incoming) {
            const seen = new Set();
            const out = [];
            (existing || []).forEach(t => {
                const n = normalizeTag(t);
                if (n && !seen.has(n)) { seen.add(n); out.push(n); }
            });
            (incoming || []).forEach(t => {
                const n = normalizeTag(t);
                if (n && !seen.has(n)) { seen.add(n); out.push(n); }
            });
            return out;
        }

        function stripExplicitTags(text) {
            if (!text) return '';
            let out = text.replace(/(^|[^a-z0-9])#([a-z0-9][a-z0-9\-_]*)/gi, '$1');
            out = out.replace(/[ \t]{2,}/g, ' ');
            out = out.replace(/[ \t]+$/gm, '');
            return out.trim();
        }

        function getAllTagsWithCounts() {
            const counts = new Map();
            for (const it of itemsArray) {
                (it.tags || []).forEach(t => {
                    const n = normalizeTag(t);
                    if (n) counts.set(n, (counts.get(n) || 0) + 1);
                });
                (it.replies || []).forEach(r => {
                    (r.tags || []).forEach(t => {
                        const n = normalizeTag(t);
                        if (n) counts.set(n, (counts.get(n) || 0) + 1);
                    });
                });
            }
            return Array.from(counts.entries())
                .map(([tag, count]) => ({ tag, count }))
                .sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag));
        }

        // ===================================================================
        // Date range helpers
        // ===================================================================
        function startOfToday() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return d;
        }
        function getTodayRange() {
            const s = startOfToday();
            const e = new Date(s);
            e.setDate(s.getDate() + 1);
            return { start: s.getTime(), end: e.getTime() };
        }
        function getThreeDayRange() {
            const s = startOfToday();
            s.setDate(s.getDate() - 2);
            const e = new Date(startOfToday());
            e.setDate(e.getDate() + 1);
            return { start: s.getTime(), end: e.getTime() };
        }
        function getThisWeekRange() {
            const now = new Date();
            const day = now.getDay();
            const daysSinceMonday = (day === 0 ? 6 : day - 1);
            const monday = new Date(now);
            monday.setHours(0, 0, 0, 0);
            monday.setDate(now.getDate() - daysSinceMonday);
            const nextMonday = new Date(monday);
            nextMonday.setDate(monday.getDate() + 7);
            return { start: monday.getTime(), end: nextMonday.getTime() };
        }
        function getLastWeekRange() {
            const thisWeek = getThisWeekRange();
            const lastMonday = new Date(thisWeek.start - 7 * 24 * 60 * 60 * 1000);
            return { start: lastMonday.getTime(), end: thisWeek.start };
        }
        function formatDateRangeShort(range) {
            const s = new Date(range.start);
            const e = new Date(range.end - 1);
            const fmt = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            return `${fmt(s)} – ${fmt(e)}`;
        }

        // ===================================================================
        // Free-text date parsing (for search)
        //
        // Returns { start, end } in ms, or null if the token wasn't a date.
        // Supports:
        //   "Sep 16", "Sept 16", "September 16"
        //   "16 Sep", "16 Sep 2026"
        //   "2026-09-16", "9/16", "9-16", "09/16/2026", "9.16"
        //   "today", "yesterday", "tomorrow"
        // Month names are the full month or the first 3 letters (case-insensitive).
        // ===================================================================
        const MONTHS = {
            jan: 0, january: 0,
            feb: 1, february: 1,
            mar: 2, march: 2,
            apr: 3, april: 3,
            may: 4,
            jun: 5, june: 5,
            jul: 6, july: 6,
            aug: 7, august: 7,
            sep: 8, sept: 8, september: 8,
            oct: 9, october: 9,
            nov: 10, november: 10,
            dec: 11, december: 11,
        };

        function dayRangeFromParts(year, monthIndex, day) {
            const s = new Date(year, monthIndex, day, 0, 0, 0, 0);
            if (isNaN(s.getTime())) return null;
            // Validate (e.g. Feb 30 → Date would roll over)
            if (s.getFullYear() !== year || s.getMonth() !== monthIndex || s.getDate() !== day) return null;
            const e = new Date(s);
            e.setDate(s.getDate() + 1);
            return { start: s.getTime(), end: e.getTime() };
        }

        function parseDateQuery(q) {
            if (!q) return null;
            let str = String(q).trim().toLowerCase();
            if (!str) return null;

            // Relative keywords
            const today = startOfToday();
            if (str === 'today') {
                return { start: today.getTime(), end: today.getTime() + 86400000 };
            }
            if (str === 'yesterday') {
                const y = new Date(today); y.setDate(today.getDate() - 1);
                return { start: y.getTime(), end: today.getTime() };
            }
            if (str === 'tomorrow') {
                const t = new Date(today); t.setDate(today.getDate() + 1);
                return { start: t.getTime(), end: t.getTime() + 86400000 };
            }

            // Normalize separators / dots into spaces
            let work = str
                .replace(/[,]+/g, ' ')
                .replace(/[\/\-\.]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            const parts = work.split(' ').filter(Boolean);
            if (!parts.length || parts.length > 3) return null;

            const now = new Date();
            const thisYear = now.getFullYear();

            // --- Format A: "Sep 16" / "Sep 16 2026" / "September 16" ---
            if (MONTHS[parts[0]] !== undefined) {
                const m = MONTHS[parts[0]];
                const day = parseInt(parts[1], 10);
                if (!Number.isFinite(day)) return null;
                const yr = parts[2] !== undefined ? parseInt(parts[2], 10) : thisYear;
                if (!Number.isFinite(yr)) return null;
                return dayRangeFromParts(yr, m, day);
            }

            // --- Format B: "16 Sep" / "16 Sep 2026" ---
            if (/^\d{1,2}$/.test(parts[0]) && parts[1] && MONTHS[parts[1]] !== undefined) {
                const day = parseInt(parts[0], 10);
                const m = MONTHS[parts[1]];
                const yr = parts[2] !== undefined ? parseInt(parts[2], 10) : thisYear;
                if (!Number.isFinite(yr)) return null;
                return dayRangeFromParts(yr, m, day);
            }

            // --- Format C: ISO "2026 09 16" (from 2026-09-16) ---
            if (parts.length === 3 && parts.every(p => /^\d+$/.test(p))) {
                const a = parseInt(parts[0], 10);
                const b = parseInt(parts[1], 10);
                const c = parseInt(parts[2], 10);
                // Year first: 2026 09 16
                if (a >= 1900 && a <= 2999 && b >= 1 && b <= 12 && c >= 1 && c <= 31) {
                    return dayRangeFromParts(a, b - 1, c);
                }
                // US: 09 16 2026
                if (c >= 1900 && c <= 2999 && a >= 1 && a <= 12 && b >= 1 && b <= 31) {
                    return dayRangeFromParts(c, a - 1, b);
                }
                return null;
            }

            // --- Format D: "09 16" (from 9/16) — assume current year ---
            if (parts.length === 2 && parts.every(p => /^\d+$/.test(p))) {
                const a = parseInt(parts[0], 10);
                const b = parseInt(parts[1], 10);
                if (a >= 1 && a <= 12 && b >= 1 && b <= 31) {
                    return dayRangeFromParts(thisYear, a - 1, b);
                }
                return null;
            }

            return null;
        }

        // ===================================================================
        // Tag toggle + panel
        // ===================================================================
        function updateTagToggle() {
            const n = pendingTags.length;
            if (n === 0) {
                tagToggleCount.classList.add('hidden');
            } else {
                tagToggleCount.textContent = String(n);
                tagToggleCount.classList.remove('hidden');
            }
            const hasFilter = activeTagFilters.size > 0 || activeDateFilter !== null || searchQuery.trim();
            if (hasFilter) {
                tagToggleLink.classList.add('has-active-filter');
                tagToggleDot.style.display = 'inline-block';
                tagToggleLink.title = 'Filter active — click to manage';
            } else {
                tagToggleLink.classList.remove('has-active-filter');
                tagToggleDot.style.display = 'none';
                tagToggleLink.title = 'Show / hide tags, search & date filters panel';
            }
        }

        function renderPendingTags() {
            if (!pendingTags.length) {
                pendingTagsEl.innerHTML = '';
                return;
            }
            pendingTagsEl.innerHTML = pendingTags.map(t =>
                `<span class="pending-tag">#${escapeHtml(t)}<button data-pending-tag="${escapeHtml(t)}" title="Remove tag">✕</button></span>`
            ).join('');
        }

        function renderExistingTags() {
            const all = getAllTagsWithCounts();
            if (!all.length) {
                existingTagsEl.innerHTML = '';
                return;
            }
            const shown = all.slice(0, 24);
            let html = shown.map(({ tag, count }) => {
                const active = activeTagFilters.has(tag);
                return `<span class="existing-tag ${active ? 'active' : ''}" data-existing-tag="${escapeHtml(tag)}" title="Filter by #${escapeHtml(tag)}">#${escapeHtml(tag)} <span class="tag-count">${count}</span></span>`;
            }).join('');
            if (all.length > shown.length) {
                html += `<span style="font-size:0.68rem;color:#94a3b8;align-self:center;">+${all.length - shown.length} more — type in search</span>`;
            }
            if (activeTagFilters.size > 0) {
                html += `<button class="clear-all" data-clear-all="1">Clear tags</button>`;
            }
            existingTagsEl.innerHTML = html;
        }

        function renderDateFilters() {
            const today = getTodayRange();
            const three = getThreeDayRange();
            const thisWeek = getThisWeekRange();
            const lastWeek = getLastWeekRange();

            const labelToday = formatDateRangeShort(today);
            const labelThree = formatDateRangeShort(three);
            const labelThis = formatDateRangeShort(thisWeek);
            const labelLast = formatDateRangeShort(lastWeek);

            let html = '';
            html += `<span class="date-chip today ${activeDateFilter === 'today' ? 'active' : ''}" data-date-filter="today" title="Items created today (${escapeHtml(labelToday)})">☀️ Today <span class="date-range">${escapeHtml(labelToday)}</span></span>`;
            html += `<span class="date-chip three-days ${activeDateFilter === 'threeDays' ? 'active' : ''}" data-date-filter="threeDays" title="Items created in the last 3 days (${escapeHtml(labelThree)})">🕒 3 days <span class="date-range">${escapeHtml(labelThree)}</span></span>`;
            html += `<span class="date-chip this-week ${activeDateFilter === 'thisWeek' ? 'active' : ''}" data-date-filter="thisWeek" title="Items created this week (${escapeHtml(labelThis)})">📅 This week <span class="date-range">${escapeHtml(labelThis)}</span></span>`;
            html += `<span class="date-chip last-week ${activeDateFilter === 'lastWeek' ? 'active' : ''}" data-date-filter="lastWeek" title="Items created last week (${escapeHtml(labelLast)})">📅 Last week <span class="date-range">${escapeHtml(labelLast)}</span></span>`;

            if (activeDateFilter) {
                html += `<button class="clear-all" data-clear-date="1">Clear date</button>`;
            }
            dateFiltersEl.innerHTML = html;
        }

        function openTagPanel() {
            tagPanelOpen = true;
            tagPanel.classList.add('open');
            tagToggleLink.classList.add('open');
            renderExistingTags();
            renderDateFilters();
            setTimeout(() => {
                if (searchQuery.trim()) searchInput.focus();
                else tagInput.focus();
            }, 0);
        }

        function closeTagPanel() {
            hideSuggestions();
            if (tagInput.value.trim()) {
                const newTags = parseTagInput(tagInput.value);
                if (newTags.length) pendingTags = mergeTags(pendingTags, newTags);
                tagInput.value = '';
            }
            tagPanelOpen = false;
            tagPanel.classList.remove('open');
            tagToggleLink.classList.remove('open');
            renderPendingTags();
            updateTagToggle();
        }

        tagToggleLink.addEventListener('click', () => {
            if (tagPanelOpen) closeTagPanel();
            else openTagPanel();
        });

        // ===================================================================
        // Panel tag suggestions (autocomplete)
        // ===================================================================
        function hideSuggestions() {
            suggestionList = [];
            suggestionIndex = -1;
            tagSuggestionsEl.classList.remove('visible');
            tagSuggestionsEl.innerHTML = '';
        }

        function showSuggestions() {
            const raw = tagInput.value.trim();
            if (!raw) { hideSuggestions(); return; }

            const parts = raw.split(/[\s,]+/);
            const prefix = normalizeTag(parts[parts.length - 1] || '');
            if (!prefix) { hideSuggestions(); return; }

            const alreadyPending = new Set(pendingTags);
            const allTags = getAllTagsWithCounts()
                .filter(({ tag }) => !alreadyPending.has(tag))
                .filter(({ tag }) => tag.startsWith(prefix) && tag !== prefix);

            const top = allTags.slice(0, 8);
            if (!top.length) { hideSuggestions(); return; }

            suggestionList = top.map(({ tag, count }) => ({ tag, count }));
            suggestionIndex = 0;
            renderSuggestions();
        }

        function renderSuggestions() {
            if (!suggestionList.length) { hideSuggestions(); return; }
            tagSuggestionsEl.innerHTML = suggestionList.map((s, i) => `
                <div class="suggestion ${i === suggestionIndex ? 'active' : ''}" data-sugg-index="${i}" data-sugg-tag="${escapeHtml(s.tag)}" role="option">
                    <span><span class="sugg-hash">#</span>${escapeHtml(s.tag)}</span>
                    <span class="sugg-count">used ${s.count}×</span>
                </div>
            `).join('');
            tagSuggestionsEl.classList.add('visible');
        }

        tagSuggestionsEl.addEventListener('mousedown', (e) => {
            const el = e.target.closest('[data-sugg-tag]');
            if (!el) return;
            e.preventDefault();
            commitSuggestion(el.dataset.suggTag);
        });

        function commitSuggestion(tag) {
            if (!tag) return;
            pendingTags = mergeTags(pendingTags, [tag]);
            const val = tagInput.value;
            const m = val.match(/^(.*?)([^\s,]*)$/);
            tagInput.value = m ? m[1] : '';
            renderPendingTags();
            updateTagToggle();
            hideSuggestions();
            tagInput.focus();
        }

        // ===================================================================
        // Per-item tag editor suggestions (autocomplete)
        // ===================================================================
        function hideItemSuggestions() {
            itemSuggList = [];
            itemSuggIndex = -1;
            const box = itemsList.querySelector('.tag-suggestions.visible.item-sugg');
            if (box) {
                box.classList.remove('visible');
                box.innerHTML = '';
            }
        }

        function buildItemSuggestions(itemId, currentText) {
            const prefix = normalizeTag((currentText || '').split(/[\s,]+/).pop() || '');
            if (!prefix) return [];

            const item = itemsArray.find(i => i.id === itemId);
            const currentTags = new Set(parseTagInput(currentText || ''));
            (item && item.tags ? item.tags : []).forEach(t => currentTags.add(normalizeTag(t)));

            const allTags = getAllTagsWithCounts()
                .filter(({ tag }) => !currentTags.has(tag))
                .filter(({ tag }) => tag.startsWith(prefix) && tag !== prefix);

            return allTags.slice(0, 8);
        }

        function renderItemSuggestions() {
            const input = itemsList.querySelector('[id^="tagEditorInput-"]');
            if (!input) return;
            const wrap = input.parentElement;
            if (!wrap) return;
            let box = wrap.querySelector('.tag-suggestions.item-sugg');
            if (!box) {
                box = document.createElement('div');
                box.className = 'tag-suggestions item-sugg';
                box.setAttribute('role', 'listbox');
                wrap.appendChild(box);
            }
            if (!itemSuggList.length) {
                box.classList.remove('visible');
                box.innerHTML = '';
                return;
            }
            box.innerHTML = itemSuggList.map((s, i) => `
                <div class="suggestion ${i === itemSuggIndex ? 'active' : ''}" data-item-sugg-tag="${escapeHtml(s.tag)}" role="option">
                    <span><span class="sugg-hash">#</span>${escapeHtml(s.tag)}</span>
                    <span class="sugg-count">used ${s.count}×</span>
                </div>
            `).join('');
            box.classList.add('visible');
        }

        function commitItemSuggestion(tag) {
            const input = itemsList.querySelector('[id^="tagEditorInput-"]');
            if (!input) return;
            const val = input.value;
            const m = val.match(/^(.*?)([^\s,]*)$/);
            const left = m ? m[1] : '';
            input.value = (left ? left.replace(/[\s,]+$/, '') + ', ' : '') + tag;
            input.focus();
            const len = input.value.length;
            try { input.setSelectionRange(len, len); } catch (e) {}
            itemSuggList = buildItemSuggestions(tagEditingItemId, input.value);
            itemSuggIndex = itemSuggList.length ? 0 : -1;
            renderItemSuggestions();
        }

        // ===================================================================
        // Auto-resize
        // ===================================================================
        function autoResizeInput() {
            if (manuallyResized) return;
            itemInput.style.height = 'auto';
            const natural = itemInput.scrollHeight;
            itemInput.style.height = Math.min(natural, 500) + 'px';
        }
        itemInput.addEventListener('mousedown', (e) => {
            const rect = itemInput.getBoundingClientRect();
            const nearCornerX = (rect.right - e.clientX) < 20;
            const nearCornerY = (rect.bottom - e.clientY) < 20;
            if (nearCornerX && nearCornerY) manuallyResized = true;
        });

        // ===================================================================
        // Bullet mode
        // ===================================================================
        function setBulletMode(enabled, skipSave) {
            bulletMode = enabled;
            bulletBtn.classList.toggle('active', enabled);
            bulletBtn.title = enabled
                ? 'Bullet mode ON — press Enter to start the next bullet; Enter on an empty bullet to save'
                : 'Bullet mode: auto-add • at start of each line';
            if (enabled && itemInput.value === '') {
                itemInput.value = '• ';
                itemInput.selectionStart = itemInput.selectionEnd = 2;
                autoResizeInput();
            }
            if (!enabled && /^•\s*$/.test(itemInput.value)) {
                itemInput.value = '';
                autoResizeInput();
            }
            if (!skipSave) savePrefs();
        }
        bulletBtn.addEventListener('click', (e) => {
            e.preventDefault();
            setBulletMode(!bulletMode);
            itemInput.focus();
        });

        // ===================================================================
        // Resize cycle
        // ===================================================================
        function applyResizeCycle() {
            const h = RESIZE_CYCLE[resizeCycleIndex % RESIZE_CYCLE.length];
            itemInput.style.height = h + 'px';
            resizeCycleIndex++;
            manuallyResized = false;
            itemInput.focus();
        }
        resizeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            applyResizeCycle();
        });

        // ===================================================================
        // Auth UI
        // ===================================================================
        function updateAuthUI() {
            if (cloudUser) {
                googleSignInBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                userProfile.style.display = 'flex';
                userAvatar.src = cloudUser.photoURL || 'https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/default-avatar.png';
                const fullName = cloudUser.displayName || cloudUser.email || 'User';
                const first = fullName.split(/[\s@]/)[0];
                userName.textContent = first;
                userName.title = fullName;
            } else {
                googleSignInBtn.classList.remove('hidden');
                userProfile.classList.add('hidden');
                userProfile.style.display = 'none';
            }
        }

        googleSignInBtn.addEventListener('click', async () => {
            if (!cloudReady) {
                alert("Cloud sync is unavailable right now (couldn't load Firebase). Check your connection and try again.");
                return;
            }
            try {
                await cloudAuth.signInWithPopup(googleProvider);
            } catch (e) {
                const code = e && e.code ? e.code : '';
                const silent = [
                    'auth/popup-closed-by-user',
                    'auth/cancelled-popup-request',
                    'auth/popup-blocked',
                ];
                if (!silent.includes(code)) {
                    alert('Sign-in failed: ' + (e.message || code));
                }
            }
        });

        signOutBtn.addEventListener('click', () => {
            if (!cloudUser) return;
            stopCloudListener();
            if (nullUserTimer) { clearTimeout(nullUserTimer); nullUserTimer = null; }
            cloudAuth.signOut().catch((e) => console.error('Sign-out error:', e));
        });

        if (cloudReady) {
            cloudAuth.onAuthStateChanged((user) => {
                if (user) {
                    if (nullUserTimer) { clearTimeout(nullUserTimer); nullUserTimer = null; }
                    const wasSignedOut = !cloudUser;
                    cloudUser = user;
                    updateAuthUI();
                    if (wasSignedOut) syncStatus.textContent = '☁️ Loading...';
                    subscribeToItems();
                } else {
                    if (nullUserTimer) clearTimeout(nullUserTimer);
                    nullUserTimer = setTimeout(() => {
                        nullUserTimer = null;
                        cloudUser = null;
                        updateAuthUI();
                        syncStatus.textContent = '☁️ Not signed in';
                        stopCloudListener();
                        itemsArray = [];
                        editingItemId = null;
                        replyingToId = null;
                        editingReply = null;
                        tagEditingItemId = null;
                        renderItems();
                    }, NULL_USER_GRACE_MS);
                }
            });
        } else {
            updateAuthUI();
        }

        // ===================================================================
        // Firestore
        // ===================================================================
        function itemsCollectionRef() {
            if (!cloudUser || !cloudDb) return null;
            return cloudDb.collection('users').doc(cloudUser.uid)
                          .collection('cloud_notes').doc('data')
                          .collection('items');
        }
        function subscribeToItems() {
            const ref = itemsCollectionRef();
            if (!ref) return;
            if (itemsUnsubscribe) itemsUnsubscribe();
            itemsUnsubscribe = ref.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                try {
                    const newItems = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        newItems.push({
                            id: doc.id,
                            text: data.text || '',
                            done: data.done || false,
                            pinned: data.pinned || false,
                            tags: Array.isArray(data.tags) ? data.tags : [],
                            createdAt: data.createdAt || 0,
                            updatedAt: data.updatedAt || 0,
                            replies: Array.isArray(data.replies) ? data.replies.map(r => ({
                                id: r.id,
                                text: r.text || '',
                                done: r.done || false,
                                tags: Array.isArray(r.tags) ? r.tags : [],
                                createdAt: r.createdAt || 0,
                                updatedAt: r.updatedAt || 0,
                            })) : [],
                        });
                    });
                    itemsArray = newItems;
                    renderItems();
                    if (tagPanelOpen) {
                        renderExistingTags();
                        renderDateFilters();
                    }
                    setCloudStatus(snapshot.metadata.hasPendingWrites ? 'pending' : 'synced');
                } catch (err) {
                    console.error('Error processing snapshot:', err);
                    setCloudStatus('error');
                }
            }, (error) => {
                console.error('Firestore listener error:', error);
                setCloudStatus('error');
            });
        }
        function stopCloudListener() {
            if (itemsUnsubscribe) { itemsUnsubscribe(); itemsUnsubscribe = null; }
        }
        function setCloudStatus(state) {
            if (!syncStatus) return;
            if (!cloudUser) { syncStatus.textContent = '☁️ Not signed in'; return; }
            if (state === 'pending') syncStatus.textContent = '🟡 Saving to cloud…';
            else if (state === 'synced') {
                const n = itemsArray.length;
                syncStatus.textContent = `🟢 Synced · ${n} item${n !== 1 ? 's' : ''}`;
            }
            else if (state === 'error') syncStatus.textContent = '🔴 Cloud error — retrying';
        }

        // ===================================================================
        // Date helpers (display)
        // ===================================================================
        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function formatCreatedLabel(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const sameDay = (a, b) =>
                a.getFullYear() === b.getFullYear() &&
                a.getMonth() === b.getMonth() &&
                a.getDate() === b.getDate();
            const yest = new Date(now); yest.setDate(now.getDate() - 1);
            const tom  = new Date(now); tom.setDate(now.getDate() + 1);
            if (sameDay(d, now)) return 'Today';
            if (sameDay(d, yest)) return 'Yesterday';
            if (sameDay(d, tom))  return 'Tomorrow';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        function formatTimeLabel(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }
        function formatFullTooltip(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
                   `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        // ===================================================================
        // Search parsing
        //
        // A query can contain:
        //   • free text tokens  → matched against item/reply text and tags
        //   • "#tag" tokens     → matched against tags
        //   • a date expression → matched against item createdAt
        //
        // The date expression is what's left of the query after removing
        // #tag tokens. So typing:
        //   "meeting"          → text search
        //   "#work"            → tag filter
        //   "Sep 16"           → date filter
        //   "#work Sep 16"     → tag AND date
        //   "meeting Sep 16"   → text AND date
        // ===================================================================
        function parseSearchQuery(q) {
            const out = { text: '', tags: [], dateRange: null };
            if (!q) return out;

            const tokens = q.trim().split(/\s+/);
            const nonTagTokens = [];
            const tagSet = new Set();

            for (const tok of tokens) {
                if (tok.startsWith('#') && tok.length > 1) {
                    const t = normalizeTag(tok);
                    if (t) tagSet.add(t);
                } else if (tok) {
                    nonTagTokens.push(tok);
                }
            }
            out.tags = Array.from(tagSet);

            // Try to recognize a date at the end of the remaining tokens.
            // Try suffixes of length 3, 2, 1 (longest first so "Sep 16 2026"
            // wins over "16 2026").
            let consumed = 0;
            let dateRange = null;
            for (let len = Math.min(3, nonTagTokens.length); len >= 1; len--) {
                const candidate = nonTagTokens.slice(nonTagTokens.length - len).join(' ');
                const r = parseDateQuery(candidate);
                if (r) {
                    dateRange = r;
                    consumed = len;
                    break;
                }
            }

            const textTokens = consumed
                ? nonTagTokens.slice(0, nonTagTokens.length - consumed)
                : nonTagTokens;

            out.text = textTokens.join(' ').toLowerCase().trim();
            out.dateRange = dateRange;
            return out;
        }

        function itemMatchesSearch(it, parsed) {
            // Tag filter (AND): all requested tags must be present on
            // the item OR on any of its replies.
            if (parsed.tags && parsed.tags.length) {
                const itemTags = new Set((it.tags || []).map(normalizeTag));
                const replyTags = new Set();
                (it.replies || []).forEach(r => (r.tags || []).forEach(t => replyTags.add(normalizeTag(t))));
                const all = new Set([...itemTags, ...replyTags]);
                for (const t of parsed.tags) {
                    if (!all.has(t)) return false;
                }
            }

            // Date filter: item's createdAt must fall in the range
            if (parsed.dateRange) {
                const ts = it.createdAt || 0;
                if (ts < parsed.dateRange.start || ts >= parsed.dateRange.end) return false;
            }

            // Free-text filter: match item text, reply text, or tags
            if (parsed.text) {
                const needle = parsed.text;
                if (it.text.toLowerCase().includes(needle)) return true;
                if ((it.replies || []).some(r => (r.text || '').toLowerCase().includes(needle))) return true;
                if ((it.tags || []).some(t => t.includes(needle))) return true;
                if ((it.replies || []).some(r => (r.tags || []).some(t => t.includes(needle)))) return true;
                return false;
            }

            return true;
        }

        function getVisibleItems() {
            const parsed = parseSearchQuery(searchQuery);
            const allTags = new Set([...parsed.tags, ...activeTagFilters]);

            // Date filter from the chips (button row) as well
            let dateRange = parsed.dateRange;
            if (!dateRange) {
                if (activeDateFilter === 'today')      dateRange = getTodayRange();
                else if (activeDateFilter === 'threeDays') dateRange = getThreeDayRange();
                else if (activeDateFilter === 'thisWeek')  dateRange = getThisWeekRange();
                else if (activeDateFilter === 'lastWeek')  dateRange = getLastWeekRange();
            }

            let list = itemsArray;

            if (dateRange) {
                list = list.filter(it => {
                    const ts = it.createdAt || 0;
                    return ts >= dateRange.start && ts < dateRange.end;
                });
            }

            if (allTags.size || parsed.text) {
                list = list.filter(it => itemMatchesSearch(it, {
                    text: parsed.text,
                    tags: Array.from(allTags),
                    dateRange: null, // already applied above
                }));
            }

            const pinned = list.filter(it => it.pinned);
            const unpinned = list.filter(it => !it.pinned);
            return pinned.concat(unpinned);
        }

        // ===================================================================
        // Render items
        // ===================================================================
        function renderItems() {
            updateTagToggle();
            if (tagPanelOpen) {
                renderExistingTags();
                renderDateFilters();
            }

            const visible = getVisibleItems();
            const hasFilters = searchQuery.trim() || activeTagFilters.size || activeDateFilter;

            if (!visible.length) {
                if (hasFilters) {
                    itemsList.innerHTML = `<div class="empty-state">🔍 No items match your filter.</div>`;
                } else {
                    itemsList.innerHTML = `<div class="empty-state">✨ No items yet. Add a to‑do or idea above.</div>`;
                }
                return;
            }

            let html = '';
            visible.forEach((item) => {
                const doneClass = item.done ? 'done' : '';
                const pinnedClass = item.pinned ? 'pinned' : '';
                const isEditing = editingItemId === item.id;
                const createdLabel = formatCreatedLabel(item.createdAt);
                const timeLabel = formatTimeLabel(item.createdAt);
                const fullTooltip = formatFullTooltip(item.createdAt);
                const wasEdited = item.updatedAt && item.createdAt &&
                                  (item.updatedAt - item.createdAt) > 1000;
                const replies = Array.isArray(item.replies) ? item.replies : [];
                const replyCount = replies.length;
                const showReplyBox = replyingToId === item.id;
                const showTagEditor = tagEditingItemId === item.id;
                const isCollapsed = collapsedItems.has(item.id) && !showReplyBox;
                const wrapCollapsedClass = isCollapsed ? ' collapsed' : '';

                const itemTags = Array.isArray(item.tags) ? item.tags : [];
                const itemTagChips = itemTags.map(t => {
                    const isActive = activeTagFilters.has(t);
                    return `<span class="chip tag-chip ${isActive ? 'active' : ''}" data-id="${item.id}" data-action="filter-tag" data-tag="${escapeHtml(t)}" title="Filter by #${escapeHtml(t)}">#${escapeHtml(t)}</span>`;
                }).join('');

                let repliesHtml = '';
                if (replies.length || showReplyBox) {
                    repliesHtml += `<div class="replies-wrap${wrapCollapsedClass}">`;
                    replies.forEach(r => {
                        const rDone = r.done ? 'done' : '';
                        const rIsEditing = editingReply &&
                                            editingReply.itemId === item.id &&
                                            editingReply.replyId === r.id;
                        const rCreated = formatCreatedLabel(r.createdAt);
                        const rTime = formatTimeLabel(r.createdAt);
                        const rWasEdited = r.updatedAt && r.createdAt &&
                                           (r.updatedAt - r.createdAt) > 1000;
                        const rTags = Array.isArray(r.tags) ? r.tags : [];
                        const rTagChips = rTags.map(t => {
                            const isActive = activeTagFilters.has(t);
                            return `<span class="chip tag-chip ${isActive ? 'active' : ''}" data-id="${item.id}" data-reply-id="${r.id}" data-action="filter-tag" data-tag="${escapeHtml(t)}" title="Filter by #${escapeHtml(t)}">#${escapeHtml(t)}</span>`;
                        }).join('');

                        if (rIsEditing) {
                            repliesHtml += `
                                <div class="reply" data-reply-id="${r.id}">
                                    <div class="reply-check ${rDone}" data-id="${item.id}" data-reply-id="${r.id}" data-action="toggle-reply" role="button" aria-label="toggle reply done"></div>
                                    <div class="reply-body">
                                        <textarea class="edit-textarea" data-reply-edit="1" data-id="${item.id}" data-reply-id="${r.id}" rows="2">${escapeHtml(r.text || '')}</textarea>
                                        <div class="edit-buttons">
                                            <button class="btn save-btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="save-reply">💾 Save</button>
                                            <button class="btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="cancel-reply">Cancel</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            repliesHtml += `
                                <div class="reply" data-reply-id="${r.id}">
                                    <div class="reply-check ${rDone}" data-id="${item.id}" data-reply-id="${r.id}" data-action="toggle-reply" role="button" aria-label="toggle reply done"></div>
                                    <div class="reply-body">
                                        <div class="reply-text ${rDone}" data-id="${item.id}" data-reply-id="${r.id}" title="Click to edit">${escapeHtml(r.text || '')}</div>
                                        <div class="reply-meta">
                                            <span class="chip" title="${escapeHtml(formatFullTooltip(r.createdAt))}">🕒 ${escapeHtml(rCreated)} · ${escapeHtml(rTime)}</span>
                                            ${rWasEdited ? `<span class="chip edited" title="Last edited: ${escapeHtml(formatFullTooltip(r.updatedAt))}">✎ edited</span>` : ''}
                                            ${rTagChips}
                                            <div class="reply-actions">
                                                <button class="edit-reply-btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="edit-reply" title="Edit reply" aria-label="edit reply">✎</button>
                                                <button class="del-btn" data-id="${item.id}" data-reply-id="${r.id}" data-action="delete-reply" title="Delete reply" aria-label="delete reply">✕</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    });

                    if (showReplyBox) {
                        repliesHtml += `
                            <div class="reply-add-row">
                                <textarea data-reply-input="1" data-id="${item.id}" rows="1" placeholder="Write a reply… (Enter to post, Esc to cancel)" maxlength="2000"></textarea>
                                <button data-id="${item.id}" data-action="post-reply" title="Post reply" aria-label="post reply">➤</button>
                            </div>
                        `;
                    }
                    repliesHtml += `</div>`;
                }

                let replyChipHtml = '';
                if (replyCount) {
                    replyChipHtml = `<span class="chip reply-chip ${isCollapsed ? 'collapsed' : ''}" data-id="${item.id}" data-action="toggle-collapse" title="${isCollapsed ? 'Click to expand replies' : 'Click to collapse replies'}">
                        <span class="reply-caret">▼</span> 💬 ${replyCount} repl${replyCount === 1 ? 'y' : 'ies'}
                    </span>`;
                }

                let tagEditorHtml = '';
                if (showTagEditor) {
                    tagEditorHtml = `
                        <div class="tag-editor-row">
                            <span class="te-label">🏷️ Tags</span>
                            <div class="te-input-wrap">
                                <input type="text" id="tagEditorInput-${item.id}" value="${escapeHtml((item.tags || []).join(', '))}" placeholder="comma or space separated…" autocomplete="off">
                            </div>
                            <div class="te-actions">
                                <button class="te-save" data-id="${item.id}" data-action="save-tags">Save</button>
                                <button class="te-cancel" data-id="${item.id}" data-action="cancel-tags">Cancel</button>
                            </div>
                        </div>
                    `;
                }

                if (isEditing) {
                    html += `
                        <div class="item editing ${pinnedClass}" data-id="${item.id}">
                            <div class="item-check ${doneClass}" data-id="${item.id}" role="button" aria-label="toggle done"></div>
                            <div class="item-body">
                                <textarea class="edit-textarea" data-id="${item.id}" rows="2">${escapeHtml(item.text)}</textarea>
                                <div class="edit-buttons">
                                    <button class="btn save-btn" data-id="${item.id}" data-action="save">💾 Save</button>
                                    <button class="btn" data-id="${item.id}" data-action="cancel">Cancel</button>
                                </div>
                            </div>
                            ${tagEditorHtml}
                            ${repliesHtml}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="item ${pinnedClass}" data-id="${item.id}">
                            <div class="item-check ${doneClass}" data-id="${item.id}" role="button" aria-label="toggle done"></div>
                            <div class="item-body">
                                <div class="item-text ${doneClass}" data-id="${item.id}" title="Click to edit">${escapeHtml(item.text)}</div>
                                <div class="item-meta">
                                    <span class="chip" title="${escapeHtml(fullTooltip)}">🕒 ${escapeHtml(createdLabel)} · ${escapeHtml(timeLabel)}</span>
                                    ${item.pinned ? `<span class="chip pin-chip" title="Pinned to top">📌 pinned</span>` : ''}
                                    ${wasEdited ? `<span class="chip edited" title="Last edited: ${escapeHtml(formatFullTooltip(item.updatedAt))}">✎ edited</span>` : ''}
                                    ${itemTagChips}
                                    ${replyChipHtml}
                                    <div class="item-actions">
                                        <button class="tag-btn ${showTagEditor ? 'active' : ''}" data-id="${item.id}" data-action="open-tag-editor" aria-label="tags" title="Edit tags">🏷️</button>
                                        <button class="reply-btn ${showReplyBox ? 'active' : ''}" data-id="${item.id}" data-action="open-reply" aria-label="reply" title="Add a reply / sub-note">💬</button>
                                        <button class="pin-btn ${item.pinned ? 'pinned' : ''}" data-id="${item.id}" aria-label="pin" title="${item.pinned ? 'Unpin' : 'Pin to top'}">${item.pinned ? '📌' : '📍'}</button>
                                        <button class="edit-btn" data-id="${item.id}" aria-label="edit" title="Edit (or click text)">✎</button>
                                        <button class="del-btn" data-id="${item.id}" aria-label="delete" title="Delete">✕</button>
                                    </div>
                                </div>
                            </div>
                            ${tagEditorHtml}
                            ${repliesHtml}
                        </div>
                    `;
                }
            });
            itemsList.innerHTML = html;

            if (editingItemId) {
                const ta = itemsList.querySelector(`.edit-textarea[data-id="${editingItemId}"]:not([data-reply-edit])`);
                if (ta) {
                    ta.style.height = 'auto';
                    const natural = ta.scrollHeight;
                    ta.style.height = Math.min(Math.max(natural, 70), 500) + 'px';
                    ta.focus();
                    ta.selectionStart = ta.selectionEnd = ta.value.length;
                }
            }
            if (replyingToId) {
                const rta = itemsList.querySelector(`textarea[data-reply-input][data-id="${replyingToId}"]`);
                if (rta) {
                    rta.style.height = 'auto';
                    rta.style.height = Math.min(Math.max(rta.scrollHeight, 36), 200) + 'px';
                    rta.focus();
                    rta.selectionStart = rta.selectionEnd = rta.value.length;
                }
            }
            if (editingReply) {
                const reta = itemsList.querySelector(`.edit-textarea[data-reply-edit][data-reply-id="${editingReply.replyId}"]`);
                if (reta) {
                    reta.style.height = 'auto';
                    reta.style.height = Math.min(Math.max(reta.scrollHeight, 44), 200) + 'px';
                    reta.focus();
                    reta.selectionStart = reta.selectionEnd = reta.value.length;
                }
            }
            if (tagEditingItemId) {
                const te = itemsList.querySelector(`#tagEditorInput-${tagEditingItemId}`);
                if (te) {
                    te.focus();
                    te.selectionStart = te.selectionEnd = te.value.length;
                    itemSuggList = buildItemSuggestions(tagEditingItemId, te.value);
                    itemSuggIndex = itemSuggList.length ? 0 : -1;
                    renderItemSuggestions();
                }
            }
        }

        function escapeHtml(unsafe) {
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ===================================================================
        // Event delegation
        // ===================================================================
        itemsList.addEventListener('click', async (e) => {
            const replyTarget = e.target.closest('[data-reply-id]');
            if (replyTarget) {
                const itemId = replyTarget.dataset.id;
                const replyId = replyTarget.dataset.replyId;
                const action = replyTarget.dataset.action;
                if (!itemId || !replyId || !cloudUser) return;
                if (action === 'save-reply') { await saveReplyEdit(itemId, replyId); return; }
                if (action === 'cancel-reply') { editingReply = null; renderItems(); return; }
                if (action === 'toggle-reply') { await toggleReplyDone(itemId, replyId); return; }
                if (action === 'edit-reply') { editingReply = { itemId, replyId }; replyingToId = null; renderItems(); return; }
                if (action === 'delete-reply') { await deleteReply(itemId, replyId); return; }
                if (action === 'filter-tag') { toggleTagFilter(replyTarget.dataset.tag); return; }
                if (replyTarget.classList.contains('reply-text')) {
                    editingReply = { itemId, replyId };
                    replyingToId = null;
                    renderItems();
                    return;
                }
                return;
            }

            const target = e.target.closest('[data-id]');
            if (!target) return;
            const itemId = target.dataset.id;
            if (!itemId || !cloudUser) return;
            const action = target.dataset.action;

            if (action === 'save') { await saveEdit(itemId); return; }
            if (action === 'cancel') { editingItemId = null; renderItems(); return; }
            if (action === 'open-reply') {
                replyingToId = (replyingToId === itemId) ? null : itemId;
                editingReply = null;
                tagEditingItemId = null;
                if (replyingToId === itemId) { collapsedItems.delete(itemId); saveCollapseState(); }
                renderItems();
                return;
            }
            if (action === 'post-reply') { await postReply(itemId); return; }
            if (action === 'toggle-collapse') { toggleCollapse(itemId); return; }
            if (action === 'open-tag-editor') {
                tagEditingItemId = (tagEditingItemId === itemId) ? null : itemId;
                editingItemId = null;
                replyingToId = null;
                renderItems();
                return;
            }
            if (action === 'save-tags') { await saveItemTags(itemId); return; }
            if (action === 'cancel-tags') { tagEditingItemId = null; hideItemSuggestions(); renderItems(); return; }
            if (action === 'filter-tag') { toggleTagFilter(target.dataset.tag); return; }

            if (editingItemId === itemId && !target.classList.contains('item-check')) return;

            if (target.classList.contains('item-check')) { await toggleItemDone(itemId); return; }
            if (target.classList.contains('pin-btn')) { await toggleItemPin(itemId); return; }
            if (target.classList.contains('edit-btn')) { startEdit(itemId); return; }
            if (target.classList.contains('del-btn')) { await deleteItem(itemId); return; }
            if (target.classList.contains('item-text')) { startEdit(itemId); return; }
        });

        function toggleTagFilter(tag) {
            const t = normalizeTag(tag);
            if (!t) return;
            if (activeTagFilters.has(t)) activeTagFilters.delete(t);
            else activeTagFilters.add(t);
            renderItems();
            updateTagToggle();
            if (tagPanelOpen) renderExistingTags();
        }

        function toggleCollapse(itemId) {
            if (collapsedItems.has(itemId)) collapsedItems.delete(itemId);
            else {
                collapsedItems.add(itemId);
                if (replyingToId === itemId) replyingToId = null;
                if (editingReply && editingReply.itemId === itemId) editingReply = null;
            }
            saveCollapseState();
            renderItems();
        }

        async function saveItemTags(itemId) {
            const input = itemsList.querySelector(`#tagEditorInput-${itemId}`);
            if (!input) return;
            const newTags = parseTagInput(input.value);
            const item = itemsArray.find(i => i.id === itemId);
            if (!item) return;
            item.tags = newTags;
            tagEditingItemId = null;
            hideItemSuggestions();
            renderItems();
            try {
                await itemsCollectionRef().doc(itemId).update({
                    tags: newTags,
                    updatedAt: Date.now(),
                });
            } catch (error) {
                console.error('Error saving tags:', error);
                alert('Could not save tags. Check your connection.');
            }
        }

        itemsList.addEventListener('keydown', (e) => {
