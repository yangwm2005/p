                    if (legacy && legacy.json) {
                        return createProject('My Notes', JSON.parse(legacy.json));
                    }
                    return createProject('My Notes', defaultProjectTablesData());
                });
            }).then(function () {
                renderProjectsList();
                setStatus('');
                flushPendingLocalSync();
            }).catch(function (err) {
                console.error('Loading projects failed:', err);
                // Cloud unreachable — fall back to whatever was cached
                // locally last time, so the app still opens to something
                // usable instead of a blank/failed state.
                const uid = currentUser && currentUser.uid;
                const cachedList = uid ? readLocalProjectsList(uid) : null;
                if (cachedList && cachedList.length) {
                    projectsCache = cachedList;
                    const target = readLocalProject(uid, cachedList[0].id);
                    if (target) {
                        suppressAutoSave = true;
                        let parsed;
                        try { parsed = JSON.parse(target.json); }
                        catch (e2) { parsed = defaultProjectTablesData(); }
                        rebuildTablesContainer(parsed);
                        suppressAutoSave = false;
                        currentProjectId = cachedList[0].id;
                        applyProjectNameToUI(target.name || cachedList[0].name);
                    }
                    renderProjectsList();
                    setStatus('Loaded from local backup (offline)');
                } else {
                    setStatus('Project list failed to load');
                }
            });
        }

        function createProject(name, initialData) {
            return projectsCollection().add({
                name: name,
                json: JSON.stringify(initialData || defaultProjectTablesData()),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                pinned: false
            }).then(function (docRef) {
                // Approximate createdAt/updatedAt with the client clock
                // until the next full list reload resolves the real
                // server timestamps — good enough for immediate sort
                // placement (a brand-new project sorts as "now" either
                // way) without waiting on a round trip.
                projectsCache.push({ id: docRef.id, name: name, updatedAt: Date.now(), createdAt: Date.now(), pinned: false });
                if (currentUser) writeLocalProjectsList(currentUser.uid, projectsCache);
                return switchProject(docRef.id, { skipSaveCurrent: true });
            });
        }

        window.createProjectFromInput = function (inputId) {
            const input = document.getElementById(inputId || 'newProjectNameInput');
            const name = (input.value || '').trim();
            if (!name) return;
            input.value = '';
            setStatus('Creating…');
            createProject(name, defaultProjectTablesData()).then(function () {
                renderProjectsList();
                setStatus('Created "' + name + '"');
            }).catch(function (err) {
                console.error('Create project failed:', err);
                setStatus('Create failed');
            });
        };

        // "Aug 21 Sat" style — Month, day-of-month, weekday abbreviation.
        function formatWeekTitle(date) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            return months[date.getMonth()] + ' ' + date.getDate() + ' ' + days[date.getDay()];
        }

        // The Monday on/before the given date — weeks are always
        // Monday-through-Sunday here regardless of which day of the
        // week you happen to click the button on.
        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay(); // 0 = Sunday
            const diff = (day === 0 ? -6 : 1) - day;
            d.setDate(d.getDate() + diff);
            return d;
        }

        // Seven small single-cell tables, Monday through Sunday, each
        // titled with that day's date (see formatWeekTitle) — laid out
        // two-per-row the same way "Add Small" cells are (see
        // table.cell-table-small), wrapping to a new row after every
        // pair. Each includes a quick-add-checkbox button (+✓) since
        // day cells are typically task/goal checklists.
        function weeklyDayTablesData(monday) {
            const tables = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                tables.push({
                    wrapped: true,
                    mainTableId: false,
                    small: true,
                    rows: [[{ title: formatWeekTitle(d), checkboxBtn: true, collapsed: false, fullHeight: false, tree: [] }]]
                });
            }
            return { version: 1, sidebarNotes: '', thinkLog: [], tables: tables };
        }

        // Creates a brand-new project containing that structure —
        // offsetDays days from today (0 for this week, 7 for next)
        // before finding that week's Monday, so it always lands on the
        // right week's Mon–Sun regardless of what day you click it.
        function createWeeklyProject(offsetDays) {
            if (!currentUser) { alert('Sign in first (☁ Sign in) to create a new project.'); return; }
            const base = new Date();
            base.setDate(base.getDate() + offsetDays);
            const monday = getMonday(base);
            const title = formatWeekTitle(monday);
            setStatus('Creating…');
            createProject(title, weeklyDayTablesData(monday)).then(function () {
                renderProjectsList();
                setStatus('Created "' + title + '"');
            }).catch(function (err) {
                console.error('Create project failed:', err);
                setStatus('Create failed');
            });
        }
        window.createThisWeekProject = function () { createWeeklyProject(0); };
        window.createNextWeekProject = function () { createWeeklyProject(7); };

        // One table, one cell — a row with a single cell (colCount < 2)
        // is left alone by applyCellTableLayout (no side-by-side column
        // split happens), so it naturally spans the table's full width
        // instead of sitting in one of two half-width columns. Same shape
        // as the spanning table defaultProjectTablesData() now uses, just
        // without the rest of the 6-cell weekly layout around it.
        function singleTableProjectData() {
            return {
                version: 1, sidebarNotes: '', thinkLog: [],
                tables: [
                    // wrapped: true gets this table a .table-wrapper with
                    // the × delete button (see rebuildTablesContainer) —
                    // same as any table added via "+ Add Table", so it can
                    // be removed later instead of being permanently stuck
                    // in the project like the main 6-cell table is.
                    { wrapped: true, mainTableId: false, rows: [[{ title: 'Notes', checkboxBtn: false, tree: [] }]] }
                ]
            };
        }

        window.createSingleTableProject = function () {
            if (!currentUser) { alert('Sign in first (☁ Sign in) to create a new project.'); return; }
            const title = formatWeekTitle(new Date());
            setStatus('Creating…');
            createProject(title, singleTableProjectData()).then(function () {
                renderProjectsList();
                setStatus('Created "' + title + '"');
            }).catch(function (err) {
                console.error('Create project failed:', err);
                setStatus('Create failed');
            });
        };

        // Clones the currently active project — all its tables, content,
        // and structure — into a brand new project, e.g. to start next
        // week from this week's plan instead of a blank page. Checkbox
        // done/undone state is carried over as-is; rename or clear
        // items afterward as needed.
        window.duplicateCurrentProject = function () {
            if (!currentUser || !currentProjectId) return;
            const current = projectsCache.find(function (p) { return p.id === currentProjectId; });
            const baseName = (current && current.name) ||
                (document.getElementById('pageTitle').textContent || 'Project').trim();
            const newName = baseName + ' (copy)';
            setStatus('Duplicating…');
            const data = serializeTablesContainer();
            createProject(newName, data).then(function () {
                renderProjectsList();
                setStatus('Duplicated as "' + newName + '"');
            }).catch(function (err) {
                console.error('Duplicate project failed:', err);
                setStatus('Duplicate failed');
            });
        };

        // --- Export / Import (JSON) ---
        // Downloads a project (or every project) as a JSON file to your
        // computer's own Downloads folder — a local backup / hand-off
        // file, independent of cloud sync. Importing that file back in
        // always creates a brand new project; it never overwrites or
        // merges into whatever project is currently open.
        function downloadJson(filename, obj) {
            const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function safeFileName(name) {
            return (name || 'project').replace(/[\\/:*?"<>|]/g, '-').trim() || 'project';
        }

        window.toggleExportMenu = function () {
            document.getElementById('exportMenu').classList.toggle('show');
        };
        document.addEventListener('click', function (e) {
            const menu = document.getElementById('exportMenu');
            if (menu && menu.classList.contains('show') && !e.target.closest('#exportMenu') &&
                !e.target.closest('[onclick="toggleExportMenu()"]')) {
                menu.classList.remove('show');
            }
        });

        window.exportCurrentProjectAsJson = function () {
            document.getElementById('exportMenu').classList.remove('show');
            if (!currentUser || !currentProjectId) { alert('Sign in and select a project first.'); return; }
            const current = projectsCache.find(function (p) { return p.id === currentProjectId; });
            const name = (current && current.name) || (document.getElementById('pageTitle').textContent || 'Project').trim();
            const payload = {
                type: 'thoughts-project-export',
                version: 1,
                name: name,
                exportedAt: new Date().toISOString(),
                data: serializeTablesContainer()
            };
            downloadJson(safeFileName(name) + '.json', payload);
            setStatus('Exported "' + name + '"');
        };

        window.exportAllProjectsAsJson = function () {
            document.getElementById('exportMenu').classList.remove('show');
            if (!currentUser) { alert('Sign in first.'); return; }
            if (projectsCache.length === 0) { alert('No projects to export.'); return; }
            setStatus('Exporting all projects…');
            const jobs = projectsCache.map(function (p) {
                if (p.id === currentProjectId) {
                    // Use the live, in-memory state for whichever project
                    // is currently open, in case it has edits that
                    // haven't auto-saved to the cloud yet.
                    return Promise.resolve({ name: p.name, data: serializeTablesContainer() });
                }
                return projectsCollection().doc(p.id).get().then(function (doc) {
                    const docData = doc.data();
                    let parsed;
                    try { parsed = JSON.parse(docData && docData.json); }
                    catch (err) { parsed = defaultProjectTablesData(); }
                    return { name: (docData && docData.name) || p.name, data: parsed };
                });
            });
            Promise.all(jobs).then(function (projects) {
                const payload = {
                    type: 'thoughts-projects-export',
                    version: 1,
                    exportedAt: new Date().toISOString(),
                    projects: projects
                };
                downloadJson('AllProjects-' + new Date().toISOString().slice(0, 10) + '.json', payload);
                setStatus('Exported ' + projects.length + ' project' + (projects.length === 1 ? '' : 's'));
            }).catch(function (err) {
                console.error('Export all failed:', err);
                setStatus('Export failed');
            });
        };

        window.importProjectFromFile = function () {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,application/json';
            input.addEventListener('change', function () {
                const file = input.files && input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function () {
                    let parsed;
                    try { parsed = JSON.parse(reader.result); }
                    catch (err) { alert("That file isn't valid JSON."); return; }
                    importParsedProjectJson(parsed, file.name);
                };
                reader.onerror = function () { alert('Could not read that file.'); };
                reader.readAsText(file);
            });
            input.click();
        };

        // Loads a single project's table data straight into the page,
        // with no cloud account involved — used when signed out, where
        // there's no project list to add a new project to. Replaces
        // whatever is currently on screen (after confirming), the same
        // way opening a local HTML file used to.
        function importLocallyWithoutAccount(name, data) {
            if (!confirm('Import "' + name + '"? This will replace what\'s currently on screen ' +
                '(sign in first if you want to keep it as a separate project instead).')) {
                setStatus('');
                return;
            }
            rebuildTablesContainer(data || defaultProjectTablesData());
            applyProjectNameToUI(name);
            setStatus('Imported "' + name + '" (not signed in — sign in to save it)');
        }

        function importParsedProjectJson(parsed, fallbackFileName) {
            const isMulti = parsed && parsed.type === 'thoughts-projects-export' && Array.isArray(parsed.projects);

            if (!currentUser) {
                // No account to add project(s) to — load one project's
                // data directly into the current view instead. For a
                // multi-project export file, that means just the first
                // one (all of them would need separate projects).
                if (isMulti) {
                    if (parsed.projects.length === 0) { alert('That file has no projects in it.'); return; }
                    const first = parsed.projects[0];
                    if (parsed.projects.length > 1) {
                        alert('Signed out, so only the first project ("' + (first.name || 'Untitled') +
                            '") can be imported here. Sign in first to import all ' +
                            parsed.projects.length + ' as separate projects.');
                    }
                    importLocallyWithoutAccount(first.name || 'Imported project', first.data);
                    return;
                }
                const data = (parsed && parsed.data) ? parsed.data : parsed;
                const name = (parsed && parsed.name) ||
                    (fallbackFileName ? fallbackFileName.replace(/\.json$/i, '') : 'Imported project');
                importLocallyWithoutAccount(name, data);
                return;
            }

            if (isMulti) {
                // An "export all projects" file — recreate every one of
                // them as its own new project.
                setStatus('Importing ' + parsed.projects.length + ' projects…');
                let chain = Promise.resolve();
                parsed.projects.forEach(function (p, i) {
                    chain = chain.then(function () {
                        return createProject(p.name || ('Imported ' + (i + 1)), p.data || defaultProjectTablesData());
                    });
                });
                chain.then(function () {
                    renderProjectsList();
                    setStatus('Imported ' + parsed.projects.length + ' projects');
                }).catch(function (err) {
                    console.error('Import failed:', err);
                    setStatus('Import failed');
                });
                return;
            }
            // A single-project export (or an unrecognized/older JSON
            // shape) — treat it as one project's table data.
            const data = (parsed && parsed.data) ? parsed.data : parsed;
            const name = (parsed && parsed.name) ||
                (fallbackFileName ? fallbackFileName.replace(/\.json$/i, '') : 'Imported project');
            setStatus('Importing…');
            createProject(name, data).then(function () {
                renderProjectsList();
                setStatus('Imported "' + name + '"');
            }).catch(function (err) {
                console.error('Import failed:', err);
                setStatus('Import failed');
            });
        }

        // Keeps the small "📁 Project ▾" button label and the big top
        // page title (#pageTitle) showing the same name — called
        // whenever a project loads or gets renamed, from either
        // direction (the dropdown list or editing the title directly).
        function applyProjectNameToUI(name) {
            const label = document.getElementById('currentProjectLabel');
            if (label) label.textContent = name || 'Project';
            const pageTitle = document.getElementById('pageTitle');
            if (pageTitle && pageTitle.textContent !== name) pageTitle.textContent = name || '';
        }

        function switchProject(projectId, opts) {
            opts = opts || {};

            function applySwitchResult(result) {
                suppressAutoSave = true;
                let parsed;
                try { parsed = JSON.parse(result.json); }
                catch (err) { parsed = defaultProjectTablesData(); }
                rebuildTablesContainer(parsed);
                suppressAutoSave = false;
                currentProjectId = projectId;
                applyProjectNameToUI(result.name);
                // Every outline-root gets a fresh random id on rebuild
                // (see initOutlineTable), so any bulk selection from the
                // project being left behind would otherwise silently
                // point at elements that no longer exist.
                if (window.clearBulkSelection) window.clearBulkSelection();
                // Bookkeeping only ("which project was open last") — the
                // switch itself doesn't need to wait on this, so it runs
                // in the background instead of adding another round trip
                // to the critical path.
                db.collection('users').doc(currentUser.uid)
                    .set({ thoughtsCurrentProjectId: projectId }, { merge: true })
                    .catch(function (err) { console.error('Could not save current-project pointer:', err); });
            }

            const doSwitch = function () {
                const cached = currentUser ? readLocalProject(currentUser.uid, projectId) : null;
                // preferCloud is set for the very first project opened
                // after signing in/loading the page (see
                // initProjectsForUser) — using the local-first fast path
                // there meant reopening the app could silently show
                // whatever was last cached on THIS device, even if
                // another device had since saved newer content, with the
                // real cloud version only ever refreshed quietly in the
                // background and never actually shown. A manual switch
                // between projects later in the same session still
                // prefers the instant local copy (see below) since we
                // just confirmed we're current moments ago.
                if (cached && cached.json && !opts.preferCloud) {
                    // Local-first: this project has been opened on this
                    // device before, so switch to it immediately from the
                    // local backup instead of waiting on a network round
                    // trip. Refresh from the cloud in the background
                    // afterward (in case another device changed it) —
                    // and if it turns out to actually be newer, and nothing
                    // has been typed here since the switch, upgrade the
                    // view to match instead of leaving it stale. Skipped
                    // entirely if the user has since navigated away or
                    // started editing, so this can never clobber
                    // in-progress work.
                    const knownName = (projectsCache.find(function (p) { return p.id === projectId; }) || {}).name;
                    applySwitchResult({ json: cached.json, name: cached.name || knownName });
                    const renderedAtMs = cached.updatedAtMs || 0;
                    projectsCollection().doc(projectId).get().then(function (doc) {
                        const data = doc.data();
                        if (!data) return;
                        const cloudMs = (data.updatedAt && data.updatedAt.toMillis) ? data.updatedAt.toMillis() : Date.now();
                        writeLocalProject(currentUser.uid, projectId, {
                            json: data.json,
                            name: data.name,
                            updatedAtMs: cloudMs,
                            pendingSync: false
                        });
                        const stillHere = currentProjectId === projectId;
                        const noPendingEdit = !cloudSaveTimer;
                        const actuallyNewer = cloudMs > renderedAtMs + 1000; // small slack for clock skew
                        if (stillHere && noPendingEdit && actuallyNewer) {
                            applySwitchResult({ json: data.json, name: data.name });
                        }
                    }).catch(function (err) { console.error('Background refresh failed:', err); });
                    return Promise.resolve();
                }
                // Never opened on this device, or this is the initial
                // load right after signing in (preferCloud) — either way
                // this has to check the cloud first; local cache is only
                // a fallback if that fails (offline).
                return projectsCollection().doc(projectId).get().then(function (doc) {
                    const data = doc.data();
                    if (!data) throw new Error('Project not found');
                    writeLocalProject(currentUser.uid, projectId, {
                        json: data.json,
                        name: data.name,
                        updatedAtMs: (data.updatedAt && data.updatedAt.toMillis) ? data.updatedAt.toMillis() : Date.now(),
                        pendingSync: false
                    });
                    applySwitchResult({ json: data.json, name: data.name });
                }).catch(function (err) {
                    console.error('Cloud fetch failed, falling back to local backup if any:', err);
                    if (cached && cached.json) {
                        const knownName = (projectsCache.find(function (p) { return p.id === projectId; }) || {}).name;
                        setStatus('Loaded from local backup (offline)');
                        applySwitchResult({ json: cached.json, name: cached.name || knownName });
                        return;
                    }
                    throw err;
                });
            };

            if (opts.skipSaveCurrent || !currentProjectId) return doSwitch();
            // Save the project being left, but don't make the switch
            // wait on its cloud round trip — saveProjectNow already
            // writes the local backup synchronously up front, and there
            // is no real dependency between saving project A and
            // loading project B, so serializing them was adding a whole
            // extra network round trip to every switch.
            saveProjectNow(currentProjectId);
            return doSwitch();
        }

        // Guards against overlapping switches. Even with the local-first
        // fast path above, a click while a switch is still resolving
        // (e.g. the cold-start case waiting on the cloud) used to
        // compare against a stale currentProjectId and kick off a second
        // full switch on top of the first. Several of those overlapping
        // chains could pile up and finish out of order, so nothing
        // visibly changed until enough clicks had queued up for the
        // right one to win the race. Now only one switch runs at a time;
        // a click that arrives mid-switch just remembers its target and
        // it runs next, so rapid clicking always settles on the last
        // thing you actually clicked instead of racing.
        let switchInFlight = false;
        let pendingSwitchTarget = null;

        window.switchProjectFromMenu = function (projectId) {
            if (projectId === currentProjectId && !switchInFlight) { closeProjectsMenu(); return; }
            if (switchInFlight) {
                pendingSwitchTarget = projectId;
                return;
            }
            performProjectSwitch(projectId);
        };

        function performProjectSwitch(projectId) {
            switchInFlight = true;
            setStatus('Switching…');
            switchProject(projectId).then(function () {
                renderProjectsList();
                setStatus('');
                closeProjectsMenu();
            }).catch(function (err) {
                console.error('Switch project failed:', err);
                setStatus('Switch failed');
            }).then(function () {
                switchInFlight = false;
                if (pendingSwitchTarget !== null) {
                    const next = pendingSwitchTarget;
                    pendingSwitchTarget = null;
                    if (next !== currentProjectId) performProjectSwitch(next);
                }
            });
        }

        function saveProjectNow(projectId) {
            const json = JSON.stringify(serializeTablesContainer());
            const nowMs = Date.now();
            // Write the local backup first and unconditionally — this is
            // what keeps switching/reloading working even if the cloud
            // write below is slow or fails outright.
            writeLocalProject(currentUser.uid, projectId, { json: json, updatedAtMs: nowMs, pendingSync: false });
            return projectsCollection().doc(projectId).set({
                json: json,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(function () {
                return json;
            }).catch(function (err) {
                console.error('Cloud save failed, kept locally for retry:', err);
                const cached = readLocalProject(currentUser.uid, projectId) || { json: json, updatedAtMs: nowMs };
                cached.pendingSync = true;
                writeLocalProject(currentUser.uid, projectId, cached);
                setStatus('Saved locally — will sync when back online');
                return json;
            });
        }

        window.renameProject = function (projectId, newName) {
            newName = (newName || '').trim();
            if (!newName) return;
            projectsCollection().doc(projectId).set({ name: newName }, { merge: true }).then(function () {
                const p = projectsCache.find(function (x) { return x.id === projectId; });
                if (p) p.name = newName;
                if (currentUser) {
                    writeLocalProjectsList(currentUser.uid, projectsCache);
                    const cached = readLocalProject(currentUser.uid, projectId);
                    if (cached) { cached.name = newName; writeLocalProject(currentUser.uid, projectId, cached); }
                }
                if (projectId === currentProjectId) applyProjectNameToUI(newName);
                // Re-render in case name-based sorting needs to move
                // this row.
                renderProjectsList();
            }).catch(function (err) {
                console.error('Rename project failed:', err);
                setStatus('Rename failed');
            });
        };

        // Pinned projects always sort to the top of the list regardless
        // of the chosen sort mode (see getSortedProjectsCache) — same
        // pattern as pinned chats/messages in most apps.
        window.toggleProjectPin = function (projectId) {
            const p = projectsCache.find(function (x) { return x.id === projectId; });
            if (!p) return;
            const newPinned = !p.pinned;
            projectsCollection().doc(projectId).set({ pinned: newPinned }, { merge: true }).then(function () {
                p.pinned = newPinned;
                if (currentUser) writeLocalProjectsList(currentUser.uid, projectsCache);
                renderProjectsList();
            }).catch(function (err) {
                console.error('Pin toggle failed:', err);
                setStatus('Pin failed');
            });
        };

        window.deleteProjectFromMenu = function (projectId, name) {
            if (!confirm('Delete project "' + name + '"? This cannot be undone.')) return;
            projectsCollection().doc(projectId).delete().then(function () {
                projectsCache = projectsCache.filter(function (p) { return p.id !== projectId; });
                if (currentUser) {
                    removeLocalProject(currentUser.uid, projectId);
                    writeLocalProjectsList(currentUser.uid, projectsCache);
                }
                if (projectId === currentProjectId) {
                    currentProjectId = null;
                    if (projectsCache.length > 0) {
                        return switchProject(projectsCache[0].id, { skipSaveCurrent: true });
                    }
                    return createProject('My Notes', defaultProjectTablesData());
                }
            }).then(function () {
                renderProjectsList();
                setStatus('Deleted "' + name + '"');
            }).catch(function (err) {
                console.error('Delete project failed:', err);
                setStatus('Delete failed');
            });
        };

        function buildProjectRow(p) {
            const row = document.createElement('div');
            row.className = 'file-sidebar-row project-row' + (p.id === currentProjectId ? ' current' : '');
            row.dataset.projectId = p.id;
            row.title = 'Click to switch to this project';

            if (p.pinned) {
                const pinIcon = document.createElement('span');
                pinIcon.className = 'project-pin-icon';
                pinIcon.textContent = '📌';
                pinIcon.title = 'Pinned';
                row.appendChild(pinIcon);
            }

            const nameSpan = document.createElement('span');
            nameSpan.className = 'project-row-name';
            nameSpan.textContent = p.name;
            row.appendChild(nameSpan);

            // Single kebab menu replaces the old always-visible delete
            // ("×") and click-the-name-to-rename controls — Rename,
            // Pin/Unpin, and Delete all live behind it instead of
            // cluttering the row itself (see openProjectRowMenu).
            const menuBtn = document.createElement('button');
            menuBtn.type = 'button';
            menuBtn.className = 'project-row-menu-btn';
            menuBtn.textContent = '⋮';
            menuBtn.title = 'More actions';
            menuBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                openProjectRowMenu(menuBtn, p);
            });
            row.appendChild(menuBtn);

            row.addEventListener('click', function (e) {
                if (e.target === menuBtn) return;
                if (p.id !== currentProjectId) window.switchProjectFromMenu(p.id);
            });

            return row;
        }

        // Sort mode persists locally (not synced — it's a view
        // preference, not project data) and applies uniformly to every
        // list container. Pinned projects always form their own group
        // at the top regardless of mode, same as pinned items in most
        // chat/note apps.
        function getProjectSortMode() {
            return localStorage.getItem('th_project_sort_mode') || 'modified';
        }
        function getSortedProjectsCache() {
            const mode = getProjectSortMode();
            const list = projectsCache.slice();
            function cmp(a, b) {
                if (mode === 'name') return (a.name || '').localeCompare(b.name || '');
                if (mode === 'created') return tsToMillis(b.createdAt) - tsToMillis(a.createdAt);
                return tsToMillis(b.updatedAt) - tsToMillis(a.updatedAt); // 'modified' default
            }
            list.sort(function (a, b) {
                if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
                return cmp(a, b);
            });
            return list;
        }
        window.setProjectSortMode = function (mode) {
            localStorage.setItem('th_project_sort_mode', mode);
            renderProjectsList();
        };

        // Renders into every list container that currently exists —
        // the 📁 dropdown's #projectsList and the left Files panel's
        // #projectsListSide — using freshly-built rows for each (DOM
        // nodes can only live in one place at a time, and listeners
        // don't survive cloneNode, so each container gets its own set
        // rather than sharing elements).
        function renderProjectsList() {
            const sorted = getSortedProjectsCache();
            ['projectsList', 'projectsListSide'].forEach(function (containerId) {
                const listEl = document.getElementById(containerId);
                if (!listEl) return;
                listEl.innerHTML = '';
                if (!sorted.length) {
                    const empty = document.createElement('div');
                    empty.className = 'project-row-empty';
                    empty.textContent = 'No projects yet';
                    listEl.appendChild(empty);
                    return;
                }
                sorted.forEach(function (p) {
                    listEl.appendChild(buildProjectRow(p));
                });
            });
            const sortSelect = document.getElementById('projectSortSelect');
            if (sortSelect && sortSelect.value !== getProjectSortMode()) sortSelect.value = getProjectSortMode();
        }

        // --- Shared floating row-action menu ---------------------------
        // One menu element repositioned under whichever row's ⋮ was
        // clicked, rather than a hidden dropdown baked into every row
        // (mirrors the outline's own single shared hover-toggle
        // pattern elsewhere in this file).
        let projectRowMenuTarget = null;
        function ensureProjectRowMenu() {
            let menu = document.getElementById('projectRowMenu');
            if (menu) return menu;
            menu = document.createElement('div');
            menu.id = 'projectRowMenu';
            menu.className = 'project-row-menu';
            menu.innerHTML =
                '<button type="button" data-action="rename">✏️ Rename</button>' +
                '<button type="button" data-action="pin">📌 Pin</button>' +
                '<button type="button" data-action="delete">🗑️ Delete</button>';
            document.body.appendChild(menu);
            menu.addEventListener('click', function (e) {
                const btn = e.target.closest('button[data-action]');
                if (!btn || !projectRowMenuTarget) return;
                const action = btn.dataset.action;
                const p = projectRowMenuTarget;
                closeProjectRowMenu();
                if (action === 'rename') startInlineProjectRename(p);
                else if (action === 'pin') window.toggleProjectPin(p.id);
                else if (action === 'delete') window.deleteProjectFromMenu(p.id, p.name);
            });
            return menu;
        }
        function openProjectRowMenu(anchorBtn, p) {
            const menu = ensureProjectRowMenu();
            projectRowMenuTarget = p;
            menu.querySelector('[data-action="pin"]').textContent = p.pinned ? '📌 Unpin' : '📌 Pin';
            const rect = anchorBtn.getBoundingClientRect();
            menu.style.top = (rect.bottom + window.scrollY + 2) + 'px';
            menu.style.left = Math.max(4, rect.right + window.scrollX - 150) + 'px';
            menu.classList.add('show');
        }
        function closeProjectRowMenu() {
            const menu = document.getElementById('projectRowMenu');
            if (menu) menu.classList.remove('show');
            projectRowMenuTarget = null;
        }
        document.addEventListener('click', function (e) {
            const menu = document.getElementById('projectRowMenu');
            if (menu && menu.classList.contains('show') &&
                !e.target.closest('#projectRowMenu') && !e.target.closest('.project-row-menu-btn')) {
                closeProjectRowMenu();
            }
        });

        // Turns a row's name into an editable field on demand (triggered
        // from the ⋮ menu's Rename action) rather than the name always
        // being editable — every currently-rendered copy of this row
        // (dropdown + sidebar can each have one) gets updated so
        // renaming works from wherever it was triggered.
        let sidebarRenameTimer = null;
        function startInlineProjectRename(p) {
            document.querySelectorAll('.project-row[data-project-id="' + p.id + '"] .project-row-name').forEach(function (nameSpan) {
                nameSpan.contentEditable = 'true';
                nameSpan.focus();
                document.execCommand('selectAll', false, null);
                const commit = function () {
                    nameSpan.contentEditable = 'false';
                    nameSpan.removeEventListener('blur', commit);
                    nameSpan.removeEventListener('keydown', onKey);
                    nameSpan.removeEventListener('input', onInput);
                    clearTimeout(sidebarRenameTimer);
                    const newName = nameSpan.textContent.trim();
                    if (newName && newName !== p.name) window.renameProject(p.id, newName);
                    else nameSpan.textContent = p.name;
                };
                const onKey = function (e) {
                    if (e.key === 'Enter') { e.preventDefault(); nameSpan.blur(); }
                    else if (e.key === 'Escape') { nameSpan.textContent = p.name; nameSpan.blur(); }
                };
                // Mirrors applyProjectNameToUI / the pageTitle input
                // listener below, just in the other direction: as you
                // type here, every other copy of this row's name (the
                // dropdown vs. the sidebar) and the big top title update
                // immediately, while the actual rename (Firestore write
                // + cache update) stays debounced so it doesn't fire on
                // every keystroke.
                const onInput = function () {
                    const live = nameSpan.textContent;
                    document.querySelectorAll('.project-row[data-project-id="' + p.id + '"] .project-row-name').forEach(function (other) {
                        if (other !== nameSpan && document.activeElement !== other) other.textContent = live;
                    });
                    const pageTitleEl = document.getElementById('pageTitle');
                    if (pageTitleEl && p.id === currentProjectId && document.activeElement !== pageTitleEl) {
                        pageTitleEl.textContent = live;
                    }
                    clearTimeout(sidebarRenameTimer);
                    sidebarRenameTimer = setTimeout(function () {
                        const trimmed = live.trim();
                        if (trimmed && trimmed !== p.name) window.renameProject(p.id, trimmed);
                    }, 800);
                };
                nameSpan.addEventListener('blur', commit);
                nameSpan.addEventListener('keydown', onKey);
                nameSpan.addEventListener('input', onInput);
            });
        }

        // Test-only exposure (mirrors serializeTablesContainer/
        // rebuildTablesContainer above) — lets projectsCache/renderProjectsList
        // be exercised without a live Firestore connection.
        window.__testSetProjectsCache = function (cache, currentId) {
            projectsCache = cache;
            currentProjectId = currentId;
            renderProjectsList();
        };

        window.toggleProjectsMenu = function () {
            const menu = document.getElementById('projectsMenu');
            // Match the app's existing dropdown pattern (see the
            // DOMContentLoaded dropdown-toggle handler above): the
            // opacity/scale transition on .dropdown-content only fires
            // via the .show class. Toggling style.display directly (the
            // previous version of this function) left it stuck at
            // opacity:0 — technically "visible" in layout but invisible
            // on screen.
            menu.classList.toggle('show');
        };
        // Explicitly closes the dropdown rather than toggling it.
        // switchProjectFromMenu is shared by the 📁 toolbar dropdown
        // (where the menu is already open, so a courtesy close makes
        // sense) and the docked Files sidebar rows (where it's normally
        // closed) — a plain toggle() there would incorrectly pop the
        // dropdown open when switching from the sidebar.
        window.closeProjectsMenu = function () {
            const menu = document.getElementById('projectsMenu');
            if (menu) menu.classList.remove('show');
        };
        document.addEventListener('click', function (e) {
            const menu = document.getElementById('projectsMenu');
            if (menu && menu.classList.contains('show') && !e.target.closest('#projectsMenu') &&
                !e.target.closest('[onclick="toggleProjectsMenu()"]')) {
                menu.classList.remove('show');
            }
        });

        window.cloudSave = function () {
            if (!currentUser || !currentProjectId) return;
            setStatus('Saving…');
            saveProjectNow(currentProjectId).then(function (json) {
                setStatus('Saved ' + new Date().toLocaleTimeString() + ' (' + (json.length / 1024).toFixed(1) + ' KB)');
            }).catch(function (err) {
                console.error('Cloud save failed:', err);
                setStatus('Save failed');
            });
        };

        // The floating 💾 button (bottom of the page) — saves straight
        // to the cloud project like ☁ Save does, since that's the save
        // people actually want day to day. Falls back to the old
        // whole-page local file save only if not signed in, since
        // there's no cloud project to save to in that case.
        window.floatingSave = function () {
            if (currentUser && currentProjectId) {
                window.cloudSave();
            } else if (window.saveFile) {
                window.saveFile();
            }
        };

        window.cloudLoad = function () {
            if (!currentUser || !currentProjectId) return;
            if (!confirm('Reload current project from cloud? This replaces all tables currently on screen.')) return;
            setStatus('Loading…');
            switchProject(currentProjectId, { skipSaveCurrent: true }).then(function () {
                setStatus('Loaded ' + new Date().toLocaleTimeString());
            }).catch(function (err) {
                console.error('Cloud load failed:', err);
                setStatus('Load failed');
            });
        };

        // Debounced auto-save: fires a few seconds after the tree's own
        // local data-tree sync runs (see scheduleSyncTreeData), so the
        // cloud copy stays current without writing on every keystroke.
        window.scheduleCloudAutoSave = function () {
            if (!currentUser || !currentProjectId || suppressAutoSave) return;
            clearTimeout(cloudSaveTimer);
            cloudSaveTimer = setTimeout(function () { saveProjectNow(currentProjectId); }, 3000);
        };

        // "Sync Now" — cancels any pending debounced auto-save and pushes
        // immediately, then also refreshes the project list (in case
        // another device renamed/added/deleted a project since this tab
        // loaded). A stronger guarantee than ☁ Save alone: "everything
        // is caught up right now," not just "this project's content
        // was written."
        window.syncNow = function () {
            if (!currentUser || !currentProjectId) return;
            clearTimeout(cloudSaveTimer);
            setStatus('Syncing…');
            flushPendingLocalSync();
            saveProjectNow(currentProjectId).then(function () {
                return projectsCollection().get();
            }).then(function (snap) {
                projectsCache = snap.docs.map(function (d) {
                    return projectDocToCacheEntry(d.id, d.data());
                });
                writeLocalProjectsList(currentUser.uid, projectsCache);
                renderProjectsList();
                setStatus('Synced ' + new Date().toLocaleTimeString());
            }).catch(function (err) {
                console.error('Sync Now failed:', err);
                setStatus('Sync failed');
            });
        };

        // Also catch title edits and structural changes (add/delete
        // table), which don't go through the outline tree's own sync
        // path at all.
        let pageTitleRenameTimer = null;
        document.addEventListener('input', function (e) {
            if (e.target && e.target.classList && e.target.classList.contains('cell-title')) {
                window.scheduleCloudAutoSave();
            }
            // The reverse direction of applyProjectNameToUI: editing the
            // big top title renames the current project to match,
            // debounced so it doesn't fire a write on every keystroke.
            if (e.target && e.target.id === 'pageTitle' && currentUser && currentProjectId) {
                clearTimeout(pageTitleRenameTimer);
                pageTitleRenameTimer = setTimeout(function () {
                    const newName = e.target.textContent.trim();
                    if (newName) window.renameProject(currentProjectId, newName);
                }, 800);
            }
        });

        init();

        // --- Content search (Files sidebar) --------------------------
        // Searches the outline text of every cell in the CURRENTLY OPEN
        // project only (not other projects, not project names — that's
        // the project list above/below this). Doesn't depend on
        // Firebase/db at all, just the already-rendered #tablesContainer
        // DOM, so it works the same online or offline.
        (function () {
            const input = document.getElementById('contentSearchInput');
            const resultsEl = document.getElementById('contentSearchResults');
            const listEl = document.getElementById('projectsListSide');
            if (!input || !resultsEl || !listEl) return;

            function escapeHtml(s) {
                return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
            }

            // Wraps the matched substring in <mark>, preserving the rest
            // of the line's actual text (a full line/paragraph, not a
            // truncated snippet — outline lines are single-line by
            // design, so "full text of the line" is the natural unit).
            function highlight(text, query) {
                const escaped = escapeHtml(text);
                const idx = escaped.toLowerCase().indexOf(query.toLowerCase());
                if (idx === -1) return escaped;
                return escaped.slice(0, idx) + '<mark>' + escaped.slice(idx, idx + query.length) + '</mark>' + escaped.slice(idx + query.length);
            }

            function collectMatches(query) {
                const q = query.trim().toLowerCase();
                const matches = [];
                if (!q) return matches;
                document.querySelectorAll('#tablesContainer td').forEach(function (td) {
                    const titleEl = td.querySelector('.cell-title');
                    const tableName = (titleEl && titleEl.textContent.trim()) || '(untitled table)';
                    const outlineEl = td.querySelector('.outline-root');
                    if (!outlineEl || !outlineEl.id || !window.getOutlineTree) return;
                    const tree = window.getOutlineTree(outlineEl.id) || [];
                    (function walk(nodes) {
                        nodes.forEach(function (n) {
                            if (n.text && n.text.toLowerCase().indexOf(q) !== -1) {
                                matches.push({ rootId: outlineEl.id, nodeId: n.id, tableName: tableName, text: n.text });
                            }
                            if (n.children && n.children.length) walk(n.children);
                        });
                    })(tree);
                });
                return matches;
            }

            function renderResults(query) {
                const matches = collectMatches(query);
                resultsEl.innerHTML = '';
                if (matches.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'search-no-results';
                    empty.textContent = 'No matches for "' + query.trim() + '"';
                    resultsEl.appendChild(empty);
                    return;
                }
                matches.forEach(function (m) {
                    const row = document.createElement('div');
                    row.className = 'search-result-row';
                    const tableLabel = document.createElement('div');
                    tableLabel.className = 'search-result-table';
                    tableLabel.textContent = m.tableName;
                    const text = document.createElement('div');
                    text.className = 'search-result-text';
                    text.innerHTML = highlight(m.text, query.trim());
                    row.appendChild(tableLabel);
                    row.appendChild(text);
                    row.addEventListener('click', function () {
                        if (window.revealAndScrollToNode) window.revealAndScrollToNode(m.rootId, m.nodeId);
                    });
                    resultsEl.appendChild(row);
                });
            }

            input.addEventListener('input', function () {
                const q = input.value.trim();
                if (!q) {
                    resultsEl.style.display = 'none';
                    resultsEl.innerHTML = '';
                    listEl.style.display = '';
                    return;
                }
                listEl.style.display = 'none';
                resultsEl.style.display = '';
                renderResults(q);
            });
        })();

        // --- Multi-select: Copy/Move/Delete across outline items ------
        // Select mode shows a checkbox on every row (see renderNode); the
        // set of checked items lives in window.__bulkSelection as
        // 'rootId::nodeId' keys. Delete and same-project Move/Copy
        // operate on the live tree directly; moving/copying into a
        // DIFFERENT project fetches and mutates that project's JSON
        // directly (it isn't rendered on screen), then saves it back the
        // same way saveProjectNow does for the current one.
        (function () {
            let destPickerMode = null; // 'move' | 'copy'

            window.toggleSelectMode = function () {
                const active = !document.body.classList.contains('select-mode-active');
                document.body.classList.toggle('select-mode-active', active);
                const btn = document.getElementById('selectModeToggle');
                if (btn) btn.classList.toggle('active-toggle', active);
                if (!active) window.clearBulkSelection();
            };

            window.clearBulkSelection = function () {
                if (window.__bulkSelection) window.__bulkSelection.clear();
                document.querySelectorAll('.outline-select-checkbox:checked').forEach(function (cb) { cb.checked = false; });
                document.querySelectorAll('.outline-node-row.item-selected').forEach(function (row) { row.classList.remove('item-selected'); });
                window.updateBulkActionBar();
            };

            window.updateBulkActionBar = function () {
                const bar = document.getElementById('bulkActionBar');
                const countEl = document.getElementById('bulkActionCount');
                const n = (window.__bulkSelection && window.__bulkSelection.size) || 0;
                if (!bar) return;
                bar.classList.toggle('show', n > 0);
                if (countEl) countEl.textContent = n + (n === 1 ? ' item selected' : ' items selected');
            };

            function selectedItemRefs() {
                if (!window.__bulkSelection) return [];
                return Array.from(window.__bulkSelection).map(function (key) {
                    const sep = key.indexOf('::');
                    return { rootId: key.slice(0, sep), nodeId: key.slice(sep + 2) };
                });
            }

            // Renders a node and its subtree as an indented plain-text
            // outline (2 spaces per depth level, "[x]"/"[ ]" prefix for
            // checkbox items) — the same shape someone would type this
            // outline as in a plain-text editor, so it pastes cleanly
            // into email, chat, docs, etc.
            function nodeToTextLines(node, depth, lines) {
                const prefix = node.checkbox ? (node.done ? '[x] ' : '[ ] ') : '- ';
                lines.push('  '.repeat(depth) + prefix + (node.text || ''));
                (node.children || []).forEach(function (child) { nodeToTextLines(child, depth + 1, lines); });
            }

            function fallbackCopyToClipboard(text) {
                return new Promise(function (resolve, reject) {
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        // Off-screen but still focusable/selectable —
                        // display:none elements can't be selected, which
                        // execCommand('copy') requires.
                        ta.style.position = 'fixed';
                        ta.style.left = '-9999px';
                        document.body.appendChild(ta);
                        ta.focus();
                        ta.select();
                        const ok = document.execCommand('copy');
                        document.body.removeChild(ta);
                        if (ok) resolve(); else reject(new Error('execCommand copy failed'));
                    } catch (err) { reject(err); }
                });
            }

            function copyTextToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    // Some contexts (e.g. a plain file:// page without
                    // focus, or without clipboard permission granted)
                    // reject the async Clipboard API — fall back to the
                    // older execCommand approach rather than failing
                    // silently.
                    return navigator.clipboard.writeText(text).catch(function () {
                        return fallbackCopyToClipboard(text);
                    });
                }
                return fallbackCopyToClipboard(text);
            }

            window.bulkCopyToClipboard = function () {
                const items = selectedItemRefs();
                if (items.length === 0) return;
                const lines = [];
                items.forEach(function (item) {
                    const node = window.getLiveNode(item.rootId, item.nodeId);
                    if (node) nodeToTextLines(node, 0, lines);
                });
                if (lines.length === 0) return;
                copyTextToClipboard(lines.join('\n')).then(function () {
                    setStatus('Copied ' + items.length + (items.length === 1 ? ' item' : ' items') + ' to clipboard');
                }).catch(function (err) {
                    console.error('Copy to clipboard failed:', err);
                    setStatus('Copy to clipboard failed');
                });
            };

            window.bulkDeleteSelected = function () {
                const items = selectedItemRefs();
                if (items.length === 0) return;
                if (!confirm('Delete ' + items.length + ' selected item' + (items.length === 1 ? '' : 's') + '? This cannot be undone.')) return;
                const affectedRoots = new Set();
                items.forEach(function (item) {
                    window.removeLiveNode(item.rootId, item.nodeId);
                    affectedRoots.add(item.rootId);
                });
                affectedRoots.forEach(function (rid) { window.rerenderOutlineRoot(rid); });
                window.scheduleCloudAutoSave();
                setStatus('Deleted ' + items.length + ' item' + (items.length === 1 ? '' : 's'));
                window.clearBulkSelection();
            };

            // Every cell/"table" in the CURRENTLY OPEN project, read
            // straight from the live DOM (same source the content-search
            // feature uses).
            function getLiveProjectCells() {
                const cells = [];
                document.querySelectorAll('#tablesContainer td').forEach(function (td) {
                    const titleEl = td.querySelector('.cell-title');
                    const outlineEl = td.querySelector('.outline-root');
                    if (!outlineEl || !outlineEl.id) return;
                    cells.push({ title: (titleEl && titleEl.textContent.trim()) || '(untitled table)', rootId: outlineEl.id });
                });
                return cells;
            }

            // Every cell/"table" inside another project's PARSED (not
            // live) data — cellRef is a direct reference into that same
            // parsed object, so pushing onto cellRef.tree and then
            // JSON.stringify-ing the original data object picks it up.
            function getCellsFromProjectData(data) {
                const cells = [];
                (data.tables || []).forEach(function (table) {
                    (table.rows || []).forEach(function (row) {
                        row.forEach(function (cell) {
                            cells.push({ title: cell.title || '(untitled table)', cellRef: cell });
                        });
                    });
                });
                return cells;
            }

            function loadProjectDataForPicker(projectId) {
                return projectsCollection().doc(projectId).get().then(function (doc) {
                    const d = doc.data();
                    if (!d) throw new Error('Project not found');
                    return JSON.parse(d.json);
                }).catch(function (err) {
                    const cached = currentUser ? readLocalProject(currentUser.uid, projectId) : null;
                    if (cached && cached.json) return JSON.parse(cached.json);
                    throw err;
                });
            }

            // Mirrors saveProjectNow, but for a project that ISN'T the
            // one currently open/rendered — writes the local backup
            // immediately, then the cloud, flagging for retry on
            // failure exactly like the normal save path does.
            function saveProjectDataDirect(projectId, dataObj) {
                const json = JSON.stringify(dataObj);
                if (currentUser) writeLocalProject(currentUser.uid, projectId, { json: json, updatedAtMs: Date.now(), pendingSync: false });
                return projectsCollection().doc(projectId).set({
                    json: json,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(function (err) {
                    console.error('Saving to other project failed, kept locally for retry:', err);
                    if (currentUser) {
                        const cached = readLocalProject(currentUser.uid, projectId) || { json: json, updatedAtMs: Date.now() };
                        cached.pendingSync = true;
                        writeLocalProject(currentUser.uid, projectId, cached);
                    }
                });
            }

            function populateTableSelect(projectId) {
                const tableSelect = document.getElementById('destPickerTable');
                tableSelect.innerHTML = '<option value="">Loading…</option>';
                tableSelect.disabled = true;
                function fillOptions(cells) {
                    tableSelect.innerHTML = '';
                    // Dedupe by title for a clean dropdown — first match
                    // for a given title is what Move/Copy actually
                    // targets if there happen to be duplicate names.
                    const seenTitles = {};
                    const deduped = [];
                    cells.forEach(function (c) {
                        if (seenTitles[c.title]) return;
                        seenTitles[c.title] = true;
                        deduped.push(c);
                    });
                    deduped.forEach(function (c, idx) {
                        const opt = document.createElement('option');
                        opt.value = String(idx);
                        opt.textContent = c.title;
                        tableSelect.appendChild(opt);
                    });
                    tableSelect._cells = deduped;
                    tableSelect.disabled = false;
                }
                if (projectId === '__current__') {
                    fillOptions(getLiveProjectCells());
                } else {
                    loadProjectDataForPicker(projectId).then(function (data) {
                        tableSelect._projectData = data;
                        fillOptions(getCellsFromProjectData(data));
                    }).catch(function (err) {
                        console.error('Loading project for destination picker failed:', err);
                        tableSelect.innerHTML = '<option value="">Failed to load this project</option>';
                    });
                }
            }

            function openDestPicker(mode) {
                const items = selectedItemRefs();
                if (items.length === 0) return;
                destPickerMode = mode;
                const overlay = document.getElementById('destPickerOverlay');
                const titleEl = document.getElementById('destPickerTitle');
                const confirmBtn = document.getElementById('destPickerConfirmBtn');
                titleEl.textContent = (mode === 'move' ? 'Move ' : 'Copy ') + items.length +
                    (items.length === 1 ? ' item to…' : ' items to…');
                confirmBtn.textContent = mode === 'move' ? 'Move Here' : 'Copy Here';

                const projectSelect = document.getElementById('destPickerProject');
                projectSelect.innerHTML = '';
                const currentProj = projectsCache.find(function (p) { return p.id === currentProjectId; });
                const currentOpt = document.createElement('option');
                currentOpt.value = '__current__';
                currentOpt.textContent = 'This project' + (currentProj ? ' (' + currentProj.name + ')' : '');
                projectSelect.appendChild(currentOpt);
                projectsCache.forEach(function (p) {
                    if (p.id === currentProjectId) return;
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name;
                    projectSelect.appendChild(opt);
                });
                projectSelect.value = '__current__';
                projectSelect.onchange = function () { populateTableSelect(projectSelect.value); };
                populateTableSelect('__current__');
                overlay.classList.add('active');
            }
            window.bulkCopyTo = function () { openDestPicker('copy'); };
            window.bulkMoveTo = function () { openDestPicker('move'); };

            window.closeDestPicker = function () {
                document.getElementById('destPickerOverlay').classList.remove('active');
            };

            window.confirmDestPicker = function () {
                const projectSelect = document.getElementById('destPickerProject');
                const tableSelect = document.getElementById('destPickerTable');
                const destProjectId = projectSelect.value;
                const idx = Number(tableSelect.value);
                const cells = tableSelect._cells;
                if (!cells || !cells[idx]) return;
                const targetCell = cells[idx];
                const items = selectedItemRefs();
                if (items.length === 0) return;

                if (destProjectId === '__current__') {
                    // Same project — source and destination are both
                    // live, so this can all happen directly in memory.
                    const affectedRoots = new Set([targetCell.rootId]);
                    items.forEach(function (item) {
                        const liveNode = window.getLiveNode(item.rootId, item.nodeId);
                        if (!liveNode) return;
                        window.appendNodeToRoot(targetCell.rootId, window.cloneOutlineNodeDeep(liveNode));
                        if (destPickerMode === 'move') window.removeLiveNode(item.rootId, item.nodeId);
                        affectedRoots.add(item.rootId);
                    });
                    affectedRoots.forEach(function (rid) { window.rerenderOutlineRoot(rid); });
                    window.scheduleCloudAutoSave();
                    setStatus((destPickerMode === 'move' ? 'Moved to "' : 'Copied to "') + targetCell.title + '"');
                    window.closeDestPicker();
                    window.clearBulkSelection();
                } else {
                    // Different project — it isn't rendered, so mutate
                    // its parsed data and save that directly; only touch
                    // the live current project afterward (for Move) once
                    // the save against the OTHER project has actually
                    // gone through, so a failed cross-project save never
                    // leaves an item deleted from the source with nowhere
                    // to land.
                    const data = tableSelect._projectData;
                    items.forEach(function (item) {
                        const liveNode = window.getLiveNode(item.rootId, item.nodeId);
                        if (!liveNode) return;
                        targetCell.cellRef.tree.push(window.cloneOutlineNodeDeep(liveNode));
                    });
                    const destName = (projectsCache.find(function (p) { return p.id === destProjectId; }) || {}).name || 'other project';
                    setStatus((destPickerMode === 'move' ? 'Moving to "' : 'Copying to "') + destName + '"…');
                    saveProjectDataDirect(destProjectId, data).then(function () {
                        if (destPickerMode === 'move') {
                            const affectedRoots = new Set();
                            items.forEach(function (item) {
                                window.removeLiveNode(item.rootId, item.nodeId);
                                affectedRoots.add(item.rootId);
                            });
                            affectedRoots.forEach(function (rid) { window.rerenderOutlineRoot(rid); });
                            window.scheduleCloudAutoSave();
                        }
                        setStatus((destPickerMode === 'move' ? 'Moved to "' : 'Copied to "') + destName + '"');
                    }).catch(function (err) {
                        console.error('Cross-project ' + destPickerMode + ' failed:', err);
                        setStatus((destPickerMode === 'move' ? 'Move' : 'Copy') + ' failed');
                    });
                    window.closeDestPicker();
                    window.clearBulkSelection();
                }
            };
        })();
    })();
    </script>
</body>
</html>
