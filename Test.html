    <script>
    // ===== Outline table prototype: a real hierarchical node tree
    // (id, text, children, collapsed/checkbox/done/bold flags), same
    // model Outliner uses, rendered recursively. Scoped to elements
    // with class="outline-root" — currently just the "2nd life" /
    // "Month Goals" table — so the rest of WeekGoal is untouched.
    (function () {
        const roots = {};

        function uid() { return 'n' + Math.random().toString(36).slice(2, 10); }

        function newNode(text) {
            return {
                id: uid(), text: text || '', html: null, children: [], collapsed: false,
                checkbox: false, done: false, bold: false, textColor: null, bgColor: null
            };
        }

        // --- Inline formatting (Bold/Italic/Underline/Strike/color) for a
        // selection *within* a line, as opposed to the existing whole-line
        // bold/textColor/bgColor flags above. Stored as sanitized HTML in
        // node.html; node.text stays a plain-text mirror (used for search,
        // export, and line split/merge). Only a small allow-list of inline
        // tags survives — everything else (scripts, divs from a stray
        // paste, event handler attributes, etc.) is stripped or unwrapped.
        // Outline-text fields are single-line by design (Enter creates a
        // new node instead of a line break within the field), so <br> is
        // deliberately NOT in this allow-list, and unwrapping a stray
        // block element does NOT insert a line break in its place —
        // earlier it did, which is what caused the "several blank lines
        // after pressing Enter" bug: some browsers wrap a freshly-focused
        // empty field's first keystroke in a nested <div>, and each
        // <br> this function inserted while unwrapping that div stacked
        // up across keystrokes into several stray blank lines.
        const INLINE_ALLOWED_TAGS = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, S: 1, STRIKE: 1, SPAN: 1 };
        function sanitizeInlineHtml(html) {
            const container = document.createElement('div');
            container.innerHTML = html;
            (function clean(root) {
                let node = root.firstChild;
                while (node) {
                    if (node.nodeType === 3) { node = node.nextSibling; continue; }
                    if (node.nodeType !== 1) {
                        const rm = node; node = node.nextSibling; root.removeChild(rm); continue;
                    }
                    const tag = node.tagName;
                    if (!INLINE_ALLOWED_TAGS[tag]) {
                        // Unwrap: DIV/P/BR/etc. are all dropped, keeping
                        // only their text/inline-formatted contents in
                        // the flow — no line break is introduced.
                        const first = node.firstChild;
                        while (node.firstChild) root.insertBefore(node.firstChild, node);
                        const rm = node; node = first || node.nextSibling; root.removeChild(rm); continue;
                    }
                    clean(node);
                    Array.prototype.slice.call(node.attributes).forEach(function (a) {
                        if (!(tag === 'SPAN' && a.name === 'style')) node.removeAttribute(a.name);
                    });
                    if (tag === 'SPAN') {
                        const color = node.style.color, bg = node.style.backgroundColor;
                        node.removeAttribute('style');
                        if (color) node.style.color = color;
                        if (bg) node.style.backgroundColor = bg;
                        if (!node.getAttribute('style')) {
                            const first = node.firstChild;
                            while (node.firstChild) root.insertBefore(node.firstChild, node);
                            const rm = node; node = first || node.nextSibling; root.removeChild(rm); continue;
                        }
                    }
                    node = node.nextSibling;
                }
            })(container);
            return container.innerHTML;
        }

        // Places the caret at a plain-text character offset inside a field
        // that may contain multiple text nodes (e.g. split across inline
        // formatting spans), not just a single text node.
        function placeCaretAtOffset(field, offset) {
            let remaining = offset, target = null, targetOffset = 0;
            (function walk(el) {
                for (let i = 0; i < el.childNodes.length && !target; i++) {
                    const child = el.childNodes[i];
                    if (child.nodeType === 3) {
                        const len = child.textContent.length;
                        if (remaining <= len) { target = child; targetOffset = remaining; return; }
                        remaining -= len;
                    } else {
                        walk(child);
                    }
                }
            })(field);
            const range = document.createRange();
            const sel = window.getSelection();
            if (target) range.setStart(target, targetOffset);
            else { range.selectNodeContents(field); range.collapse(false); }
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function findNodeAndParent(tree, id, parent) {
            parent = parent || null;
            for (let i = 0; i < tree.length; i++) {
                const n = tree[i];
                if (n.id === id) return { node: n, parentArr: tree, index: i, parent: parent };
                const res = findNodeAndParent(n.children, id, n);
                if (res) return res;
            }
            return null;
        }

        function flattenVisible(tree, out) {
            out = out || [];
            tree.forEach(function (n) {
                out.push(n);
                if (n.children.length && !n.collapsed) flattenVisible(n.children, out);
            });
            return out;
        }

        function isDescendant(node, id) {
            for (const c of node.children) {
                if (c.id === id) return true;
                if (isDescendant(c, id)) return true;
            }
            return false;
        }

        // --- Node action ☰ menu (mousedown-guarded, same trick used by
        // the main table's item-hover-panel, so clicking it never steals
        // focus/selection from whichever node field is being edited) ---
        let menuEl, menuTargetId, menuRootId, menuAnchorEl;
        const outlineTextColorPopover = createColorPopover();
        const outlineBgColorPopover = createColorPopover();

        function ensureMenu() {
            if (menuEl) return menuEl;
            menuEl = document.createElement('div');
            menuEl.className = 'outline-node-menu';
            document.body.appendChild(menuEl);
            menuEl.addEventListener('mousedown', function (e) { e.preventDefault(); });
            document.addEventListener('mousedown', function (e) {
                if (menuEl.classList.contains('show') && !menuEl.contains(e.target) &&
                    !outlineTextColorPopover.pop.contains(e.target) && !outlineBgColorPopover.pop.contains(e.target)) {
                    closeMenu();
                }
                if (!outlineTextColorPopover.pop.contains(e.target)) outlineTextColorPopover.pop.classList.remove('show');
                if (!outlineBgColorPopover.pop.contains(e.target)) outlineBgColorPopover.pop.classList.remove('show');
            });

            // Reuses the same color-popover machinery the main table's
            // ☰ panel already uses (createColorPopover/showColorPopover),
            // just with its own pair of popover instances wired to the
            // outline tree's current menu target instead of the main
            // table's currentLine.
            outlineTextColorPopover.pop.addEventListener('click', function (e) {
                const sw = e.target.closest('.color-swatch');
                if (!sw || !menuTargetId) return;
                applyNodeTextColor(menuRootId, menuTargetId, sw.dataset.color);
                hideColorPopover(outlineTextColorPopover.pop);
                closeMenu();
            });
            outlineTextColorPopover.customInput.addEventListener('input', function (e) {
                if (!menuTargetId) return;
                applyNodeTextColor(menuRootId, menuTargetId, e.target.value);
            });
            outlineTextColorPopover.customInput.addEventListener('change', function () {
                hideColorPopover(outlineTextColorPopover.pop);
                closeMenu();
            });

            outlineBgColorPopover.pop.addEventListener('click', function (e) {
                const sw = e.target.closest('.color-swatch');
                if (!sw || !menuTargetId) return;
                applyNodeBgColor(menuRootId, menuTargetId, sw.dataset.color);
                hideColorPopover(outlineBgColorPopover.pop);
                closeMenu();
            });
            outlineBgColorPopover.customInput.addEventListener('input', function (e) {
                if (!menuTargetId) return;
                applyNodeBgColor(menuRootId, menuTargetId, e.target.value);
            });
            outlineBgColorPopover.customInput.addEventListener('change', function () {
                hideColorPopover(outlineBgColorPopover.pop);
                closeMenu();
            });

            return menuEl;
        }

        function closeMenu() {
            if (menuEl) menuEl.classList.remove('show');
            if (menuAnchorEl) menuAnchorEl.classList.remove('show');
            menuTargetId = null; menuRootId = null; menuAnchorEl = null;
        }

        function menuButton(label, onClick, active) {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = label;
            if (active) b.classList.add('active');
            b.addEventListener('click', function (e) { e.preventDefault(); onClick(); });
            menuEl.appendChild(b);
            return b;
        }

        function renderMenu() {
            const st = roots[menuRootId];
            if (!st) return;
            const found = findNodeAndParent(st.tree, menuTargetId);
            if (!found) return;
            const n = found.node;
            menuEl.innerHTML = '';
            menuButton(n.checkbox ? '☑ Remove checkbox' : '☑ Add checkbox', function () {
                n.checkbox = !n.checkbox;
                renderRoot(menuRootId, { focusId: n.id, cursorPos: 'keep' });
                renderMenu();
            }, n.checkbox);
            menuButton(n.done ? '✓ Mark as not complete' : '✓ Mark as complete', function () {
                n.done = !n.done;
                renderRoot(menuRootId, { focusId: n.id, cursorPos: 'keep' });
                renderMenu();
            }, n.done);
            menuButton(n.bold ? 'B Remove bold' : 'B Bold', function () {
                n.bold = !n.bold;
                renderRoot(menuRootId, { focusId: n.id, cursorPos: 'keep' });
                renderMenu();
            }, n.bold);
            const divider = document.createElement('div');
            divider.className = 'outline-node-menu-divider';
            menuEl.appendChild(divider);
            const textColorBtn = menuButton('A Text Color', function () {
                showColorPopover(outlineTextColorPopover.pop, textColorBtn.getBoundingClientRect());
            }, !!n.textColor);
            const bgColorBtn = menuButton('▧ Background', function () {
                showColorPopover(outlineBgColorPopover.pop, bgColorBtn.getBoundingClientRect());
            }, !!n.bgColor);
            const divider2 = document.createElement('div');
            divider2.className = 'outline-node-menu-divider';
            menuEl.appendChild(divider2);
            menuButton('Sub (Tab)', function () {
                indentNode(menuRootId, n.id);
                closeMenu();
            });
            menuButton('Outdent (Shift+Tab)', function () {
                outdentNode(menuRootId, n.id);
                closeMenu();
            });
            const divider3 = document.createElement('div');
            divider3.className = 'outline-node-menu-divider';
            menuEl.appendChild(divider3);
            menuButton('✕ Delete item', function () {
                deleteNode(menuRootId, n.id);
                closeMenu();
            });
        }

        function openMenuFor(rootId, nodeId, anchorEl) {
            ensureMenu();
            menuRootId = rootId; menuTargetId = nodeId; menuAnchorEl = anchorEl;
            renderMenu();
            const rect = anchorEl.getBoundingClientRect();
            menuEl.style.top = (rect.bottom + 4) + 'px';
            menuEl.style.left = rect.left + 'px';
            menuEl.classList.add('show');
            anchorEl.classList.add('show');
        }

        function deleteNode(rootId, nodeId) {
            const st = roots[rootId];
            const found = findNodeAndParent(st.tree, nodeId);
            if (!found) return;
            const arr = found.parentArr;
            const idx = found.index;
            arr.splice.apply(arr, [idx, 1].concat(found.node.children));
            let focusId = null;
            if (arr[idx]) focusId = arr[idx].id;
            else if (idx > 0) focusId = arr[idx - 1].id;
            renderRoot(rootId, { focusId: focusId, cursorPos: 'start' });
        }

        // Shared by the Tab/Shift+Tab keydown handling below and the
        // ☰ panel's "Sub"/"Outdent" buttons, so both trigger identical
        // tree mutations.
        function indentNode(rootId, nodeId) {
            const st = roots[rootId];
            const found = findNodeAndParent(st.tree, nodeId);
            if (!found || found.index === 0) return; // no previous sibling to become a child of
            const prevSibling = found.parentArr[found.index - 1];
            found.parentArr.splice(found.index, 1);
            prevSibling.children.push(found.node);
            prevSibling.collapsed = false;
            renderRoot(rootId, { focusId: nodeId, cursorPos: 'keep' });
        }

        function outdentNode(rootId, nodeId) {
            const st = roots[rootId];
            const found = findNodeAndParent(st.tree, nodeId);
            if (!found || !found.parent) return; // already top-level
            const grandFound = findNodeAndParent(st.tree, found.parent.id);
            if (!grandFound) return;
            found.parentArr.splice(found.index, 1);
            grandFound.parentArr.splice(grandFound.index + 1, 0, found.node);
            renderRoot(rootId, { focusId: nodeId, cursorPos: 'keep' });
        }

        function applyNodeTextColor(rootId, nodeId, color) {
            const st = roots[rootId];
            const found = findNodeAndParent(st.tree, nodeId);
            if (!found) return;
            found.node.textColor = color || null;
            renderRoot(rootId, { focusId: nodeId, cursorPos: 'keep' });
        }

        function applyNodeBgColor(rootId, nodeId, color) {
            const st = roots[rootId];
            const found = findNodeAndParent(st.tree, nodeId);
            if (!found) return;
            found.node.bgColor = color || null;
            renderRoot(rootId, { focusId: nodeId, cursorPos: 'keep' });
        }

        // --- Toggle/drag/menu hover overlay (position:fixed, shown on
        // hover of any .outline-node-row) — mirrors the main table's
        // ☰ hover-icon pattern exactly, so these icons never consume
        // row layout space and the bullet/text stay flush with the
        // other tables regardless of whether the icons are visible. ---
        let otToggle, otDrag, otCheckboxRemove;
        let otHoverRootId = null, otHoverNodeId = null, otHoverRow = null;
        let otHideTimer = null;
        let otSafeZone = null; // {left, right, top, bottom} — see comment below

        function ensureOtIcons() {
            if (otToggle) return;
            otToggle = document.createElement('div');
            otToggle.className = 'outline-toggle-fixed';
            otToggle.title = 'Collapse/expand sub-items';
            document.body.appendChild(otToggle);

            otDrag = document.createElement('div');
            otDrag.className = 'outline-drag-fixed';
            otDrag.textContent = '⠿';
            otDrag.title = 'Drag to reorder';
            document.body.appendChild(otDrag);

            otCheckboxRemove = document.createElement('div');
            otCheckboxRemove.className = 'outline-checkbox-toggle-fixed';
            document.body.appendChild(otCheckboxRemove);

            [otToggle, otDrag, otCheckboxRemove].forEach(function (el) {
                el.addEventListener('mouseenter', cancelOtHide);
                el.addEventListener('mouseleave', scheduleOtHide);
            });

            otCheckboxRemove.addEventListener('mousedown', function (e) { e.preventDefault(); });
            otCheckboxRemove.addEventListener('click', function (e) {
                e.preventDefault();
                if (!otHoverNodeId) return;
                const st = roots[otHoverRootId];
                const found = st && findNodeAndParent(st.tree, otHoverNodeId);
                if (!found) return;
                // Same toggle the ☰ panel's own "Add/Remove checkbox"
                // option does.
                found.node.checkbox = !found.node.checkbox;
                renderRoot(otHoverRootId, { focusId: otHoverNodeId, cursorPos: 'keep' });
            });

            otToggle.addEventListener('mousedown', function (e) { e.preventDefault(); });

            otToggle.addEventListener('click', function (e) {
                e.preventDefault();
                if (!otHoverNodeId) return;
                const st = roots[otHoverRootId];
                const found = findNodeAndParent(st.tree, otHoverNodeId);
                if (!found || !found.node.children.length) return;
                found.node.collapsed = !found.node.collapsed;
                renderRoot(otHoverRootId, { focusId: otHoverNodeId, cursorPos: 'keep' });
            });

            // --- Fully custom, mouse-driven drag (no native HTML5 Drag
            // and Drop at all). Browsers' native DnD interacts poorly
            // with contenteditable regions — especially Safari — which
            // is what caused dragged lines to get inserted as literal
            // text into whatever field the browser thought was the drop
            // target, looking like content "merging". Driving the whole
            // gesture from plain mousedown/mousemove/mouseup sidesteps
            // that entirely: nothing here ever asks the browser to
            // perform a native drag, so there's nothing for its text
            // editing behavior to intercept. ---
            otDrag.addEventListener('mousedown', function (e) {
                if (e.button !== 0 || !otHoverNodeId) return;
                e.preventDefault();
                startManualDrag(otHoverRootId, otHoverNodeId, otHoverRow);
            });
        }

        let manualDragRootId = null, manualDragNodeId = null;
        let manualDragPrevUserSelect = null;

        function startManualDrag(rootId, nodeId, row) {
            manualDragRootId = rootId;
            manualDragNodeId = nodeId;
            dragNodeId = nodeId; dragRootId = rootId; // reused by performDrop/isDescendant guards below
            const nodeEl = row && row.closest('.outline-node');
            if (nodeEl) nodeEl.classList.add('outline-dragging');
            manualDragPrevUserSelect = document.body.style.userSelect;
            document.body.style.userSelect = 'none';
            document.addEventListener('mousemove', onManualDragMove);
            document.addEventListener('mouseup', onManualDragEnd);
        }

        function onManualDragMove(e) {
            if (!manualDragNodeId) return;
            const el = document.elementFromPoint(e.clientX, e.clientY);
            const row = el && el.closest && el.closest('.outline-node-row');
            if (!row || row.dataset.rootId !== manualDragRootId || row.dataset.nodeId === manualDragNodeId) {
                clearDropIndicator();
                return;
            }
            const rect = row.getBoundingClientRect();
            const relY = e.clientY - rect.top;
            const third = rect.height / 3;
            const mode = relY < third ? 'before' : (relY > third * 2 ? 'after' : 'child');
            showDropIndicator(row, mode);
        }

        function onManualDragEnd(e) {
            document.removeEventListener('mousemove', onManualDragMove);
            document.removeEventListener('mouseup', onManualDragEnd);
            document.body.style.userSelect = manualDragPrevUserSelect || '';
            document.querySelectorAll('.outline-dragging').forEach(function (el) { el.classList.remove('outline-dragging'); });

            const targetRow = dropTargetEl;
            const mode = dropMode;
            clearDropIndicator();

            if (manualDragNodeId && targetRow && targetRow.dataset.nodeId) {
                performDrop(manualDragRootId, manualDragNodeId, targetRow.dataset.nodeId, mode);
            }
            manualDragNodeId = null; manualDragRootId = null;
            dragNodeId = null; dragRootId = null;
        }

        function positionOtIcons(row) {
            const rect = row.getBoundingClientRect();
            const top = Math.max(4, rect.top + rect.height / 2 - 8);
            const st = roots[otHoverRootId];
            const found = st ? findNodeAndParent(st.tree, otHoverNodeId) : null;
            const hasCheckbox = !!(found && found.node.checkbox);

            // Brought back in close to the bullet (was -64/-40, pushed
            // out to sit past the table's own border). That felt better
            // for breathing room but made the drag handle a long reach
            // from the bullet it's acting on — closer wins here.
            // The add/remove-checkbox icon shows for every item (its
            // glyph/mode changes, not its presence), so these three
            // positions stay fixed regardless of checkbox state.
            const checkboxLeft = Math.max(4, rect.left - 56);
            const toggleLeft = Math.max(4, rect.left - 36);
            const dragLeft = Math.max(4, rect.left - 16);
            otToggle.style.top = top + 'px';
            otToggle.style.left = toggleLeft + 'px';
            otDrag.style.top = top + 'px';
            otDrag.style.left = dragLeft + 'px';
            otCheckboxRemove.style.top = top + 'px';
            otCheckboxRemove.style.left = checkboxLeft + 'px';

            const hasKids = !!(found && found.node.children.length);
            otToggle.textContent = hasKids ? (found.node.collapsed ? '▸' : '▾') : '';
            otToggle.classList.toggle('show', hasKids);
            otDrag.classList.add('show');
            if (found) {
                otCheckboxRemove.textContent = hasCheckbox ? '✕' : '+';
                otCheckboxRemove.title = hasCheckbox ? 'Remove checkbox' : 'Add checkbox';
                otCheckboxRemove.classList.toggle('remove-mode', hasCheckbox);
                otCheckboxRemove.classList.add('show');
            } else {
                otCheckboxRemove.classList.remove('show');
            }

            // The icons sit well to the left of the row now (see the
            // spacing note below), which used to create a "dead zone":
            // moving the mouse from the row toward an icon crossed empty
            // space that belonged to neither, so a mouseout fired and the
            // icons vanished before the cursor arrived. Track a generous
            // rectangle spanning from the icons to the row instead, and
            // keep everything visible as long as the mouse is anywhere
            // inside it — see the mousemove listener below.
            otSafeZone = {
                left: checkboxLeft - 8,
                right: rect.right + 8,
                top: rect.top - 10,
                bottom: rect.bottom + 10
            };
        }

        function cancelOtHide() { clearTimeout(otHideTimer); }

        function scheduleOtHide() {
            clearTimeout(otHideTimer);
            otHideTimer = setTimeout(function () {
                otToggle.classList.remove('show');
                otDrag.classList.remove('show');
                otCheckboxRemove.classList.remove('show');
                otHoverRootId = null; otHoverNodeId = null; otHoverRow = null; otSafeZone = null;
            }, 250);
        }

        function isOtChrome(el) {
            return el === otToggle || el === otDrag || el === otCheckboxRemove;
        }

        // Each line's text is its own separate contenteditable field
        // (not one shared contenteditable spanning the whole list), so
        // dragging a text selection past the edge of the field you
        // started in crosses into unrelated, non-editable row chrome
        // (bullets, the ☰ icon, other rows entirely) — and browsers'
        // cross-element selection behavior in that situation is
        // inconsistent, sometimes ballooning the selection out to cover
        // the whole list instead of stopping at the field boundary.
        // Watch for the selection's start and end landing in two
        // different fields and clamp it back to just the field the drag
        // started in.
        document.addEventListener('selectionchange', function () {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
            const aNode = sel.anchorNode, fNode = sel.focusNode;
            if (!aNode || !fNode) return;
            const aEl = aNode.nodeType === 1 ? aNode : aNode.parentElement;
            const fEl = fNode.nodeType === 1 ? fNode : fNode.parentElement;
            const aField = aEl && aEl.closest && aEl.closest('.outline-text');
            if (!aField) return; // selection didn't start in one of these fields — leave it alone
            const fField = fEl && fEl.closest && fEl.closest('.outline-text');
            if (fField === aField) return; // still inside the same field — fine
            const range = document.createRange();
            range.selectNodeContents(aField);
            sel.removeAllRanges();
            sel.addRange(range);
        });

        // Some browsers re-run hit-testing (and fire a "phantom"
        // mouseover) against the cursor's last-known screen position —
        // often near the top-left corner, i.e. row 1 — right after a big
        // DOM rebuild, even though the mouse never actually moved. That
        // showed up as the drag handle appearing to be permanently
        // stuck on the first line until you actually touched the mouse.
        // Ignoring mouseover until we've seen at least one real
        // mousemove filters that phantom event out. Set as early as
        // possible (not deferred to DOMContentLoaded) and shared via
        // window so every hover-triggered feature in the file — the
        // outline table's icons and the older line-hover-icon system —
        // can check the same flag.
        window.__hasRealMouseMoved = false;
        document.addEventListener('mousemove', function () {
            window.__hasRealMouseMoved = true;
            document.body.classList.remove('pre-hover');
        }, { once: true });

        document.addEventListener('mouseover', function (e) {
            if (!window.__hasRealMouseMoved) return;
            const row = e.target.closest && e.target.closest('.outline-node-row');
            if (row) {
                ensureOtIcons();
                otHoverRootId = row.dataset.rootId;
                otHoverNodeId = row.dataset.nodeId;
                otHoverRow = row;
                cancelOtHide();
                positionOtIcons(row);
            }
        });

        document.addEventListener('mouseout', function (e) {
            const row = e.target.closest && e.target.closest('.outline-node-row');
            if (row && row === otHoverRow) {
                const related = e.relatedTarget;
                if (related && isOtChrome(related)) return;
                scheduleOtHide();
            }
        });

        // Continuously widen the "stay visible" check to the whole
        // row-to-icons corridor (see otSafeZone above), not just the
        // exact row/icon elements — this is what actually fixes icons
        // disappearing while the mouse is still travelling toward them.
        document.addEventListener('mousemove', function (e) {
            if (!otSafeZone) return;
            const z = otSafeZone;
            if (e.clientX >= z.left && e.clientX <= z.right && e.clientY >= z.top && e.clientY <= z.bottom) {
                cancelOtHide();
            }
        });

        // --- Rendering ---
        // Serializes the tree into a data-* attribute on the root element
        // itself, so it survives Save (which just dumps
        // document.documentElement.outerHTML — data-* attributes are
        // included in that) and gets restored on Open (which does a
        // real navigation/reload, re-running initOutlineTable). Without
        // this, the tree only ever lived in memory and reopening a saved
        // file silently wiped every outline table back to one empty line.
        function syncTreeData(rootId) {
            const st = roots[rootId];
            if (!st) return;
            st.rootEl.dataset.tree = JSON.stringify(st.tree);
            // Cloud sync (if signed in) is defined in a separate <script>
            // block further down the file and may not have loaded yet on
            // very first render — guard for that.
            if (window.scheduleCloudAutoSave) window.scheduleCloudAutoSave();
        }

        const syncDebounceTimers = {};
        function scheduleSyncTreeData(rootId) {
            clearTimeout(syncDebounceTimers[rootId]);
            syncDebounceTimers[rootId] = setTimeout(function () { syncTreeData(rootId); }, 500);
        }

        function renderRoot(rootId, focusOpts) {
            const st = roots[rootId];
            if (!st) return;
            st.rootEl.innerHTML = '';
            st.rootEl.appendChild(renderChildren(rootId, st.tree, 0));
            syncTreeData(rootId);
            if (focusOpts && focusOpts.focusId) {
                const field = st.rootEl.querySelector('[data-node-id="' + focusOpts.focusId + '"] > .outline-node-row > .outline-text');
                if (field) {
                    field.focus();
                    placeCaret(field, focusOpts.cursorPos);
                }
            }
        }

        function placeCaret(field, pos) {
            if (typeof pos === 'number') {
                // A field can now contain several text nodes (split across
                // inline formatting spans), not just one — walk the whole
                // subtree to find the right one instead of assuming
                // field.firstChild holds all the text.
                placeCaretAtOffset(field, pos);
                return;
            }
            const range = document.createRange();
            const sel = window.getSelection();
            if (pos === 'end' || pos === undefined || pos === 'keep') {
                range.selectNodeContents(field);
                range.collapse(false);
            } else if (pos === 'start') {
                range.selectNodeContents(field);
                range.collapse(true);
            }
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function renderChildren(rootId, nodes, depth) {
            const wrap = document.createElement('div');
            wrap.className = 'outline-children' + (depth === 0 ? ' outline-top' : '');
            nodes.forEach(function (n) { wrap.appendChild(renderNode(rootId, n, depth)); });
            return wrap;
        }

        function renderNode(rootId, n, depth) {
            const nodeEl = document.createElement('div');
            nodeEl.className = 'outline-node';
            nodeEl.dataset.nodeId = n.id;

            const row = document.createElement('div');
            row.className = 'outline-node-row';
            row.dataset.nodeId = n.id;
            row.dataset.rootId = rootId;

            let text; // forward reference for the checkbox handler below

            // Multi-select checkbox for the Files sidebar's bulk Copy/
            // Move/Delete (Select mode) — always in the DOM, hidden via
            // CSS (body.select-mode-active) rather than only created
            // when select mode is on, so toggling it doesn't require a
            // full re-render. Distinct from the task-style checkbox
            // below (n.checkbox/n.done), which is a content field, not
            // a selection control.
            const selectCb = document.createElement('input');
            selectCb.type = 'checkbox';
            selectCb.className = 'outline-select-checkbox';
            selectCb.title = 'Select this item';
            selectCb.addEventListener('mousedown', function (e) { e.stopPropagation(); });
            selectCb.addEventListener('click', function (e) { e.stopPropagation(); });
            selectCb.addEventListener('change', function () {
                const key = rootId + '::' + n.id;
                const sel = (window.__bulkSelection = window.__bulkSelection || new Set());
                if (selectCb.checked) sel.add(key); else sel.delete(key);
                row.classList.toggle('item-selected', selectCb.checked);
                if (window.updateBulkActionBar) window.updateBulkActionBar();
            });
            row.appendChild(selectCb);

            const bullet = document.createElement('span');
            bullet.className = 'outline-bullet';
            bullet.textContent = '•';
            row.appendChild(bullet);

            if (n.checkbox) {
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'outline-checkbox';
                cb.checked = !!n.done;
                cb.addEventListener('mousedown', function (e) { e.stopPropagation(); });
                cb.addEventListener('change', function () {
                    n.done = cb.checked;
                    text.classList.toggle('done', n.done);
                });
                row.appendChild(cb);
            }

            text = document.createElement('div');
            text.className = 'outline-text' + (n.done ? ' done' : '') + (n.bold ? ' bold' : '');
            text.contentEditable = 'true';
            if (n.html) text.innerHTML = n.html; else text.textContent = n.text;
            text.dataset.nodeId = n.id;
            if (n.textColor) text.style.color = n.textColor;
            if (n.bgColor) {
                text.style.backgroundColor = n.bgColor;
                text.style.padding = '2px 6px';
                text.style.borderRadius = '4px';
            }
            text.addEventListener('input', function () {
                // Some browsers, right after a freshly-focused empty
                // contenteditable field receives its first keystroke
                // (e.g. immediately after Enter creates a new line),
                // wrap the typed text in a nested <div>/<br> instead of
                // a plain text node — that extra block pushes the visible
                // text down onto a second line inside the field while the
                // bullet stays pinned at the top of the row. Native paste
                // can also drop in <div>/<p> wrappers. Unwrap those block
                // elements, but (unlike before) keep any inline formatting
                // — Bold/Italic/Underline/Strike/color spans — intact:
                // this field now genuinely supports per-selection
                // formatting instead of always collapsing back to plain
                // text on the very next keystroke.
                if (text.children.length > 0) {
                    const caret = caretOffsetIn(text);
                    const cleaned = sanitizeInlineHtml(text.innerHTML);
                    if (cleaned !== text.innerHTML) text.innerHTML = cleaned;
                    placeCaretAtOffset(text, caret);
                    n.html = text.querySelector('b, strong, i, em, u, s, strike, span') ? cleaned : null;
                } else {
                    n.html = null;
                }
                n.text = text.textContent;
                // Plain typing doesn't go through renderRoot (which is
                // what normally keeps the saved data-tree attribute in
                // sync — see syncTreeData), so schedule it here too,
                // debounced so fast typing doesn't re-stringify the
                // whole tree on every keystroke.
                scheduleSyncTreeData(rootId);
            });
            text.addEventListener('keydown', function (e) { handleNodeKeydown(e, rootId, n, text); });
            // contenteditable text is natively draggable once selected —
            // dragging selected text into another line's field triggers
            // the browser's own "move text" behavior, silently inserting
            // it there and making two lines look merged into one. Reordering
            // should only ever happen via the dedicated ⠿ drag handle, so
            // block the native text-drag from starting at all.
            text.addEventListener('dragstart', function (e) { e.preventDefault(); });
            // Also block the field's own default handling of any drop
            // (e.g. text dragged in from outside the app). This only
            // stops the browser's automatic insertion — the event still
            // bubbles up to the row's own drop handler below, so our
            // custom reorder/reparent logic is unaffected.
            text.addEventListener('drop', function (e) { e.preventDefault(); });
            row.appendChild(text);

            // The ☰ control-panel button is always visible now, not a
            // hover-only overlay — it kept intermittently failing to
            // appear/disappearing too fast as a fixed-position hover
            // element, and it's the single most important control on
            // each line, so reliability wins over the extra few pixels
            // a permanent icon costs.
            const menuBtn = document.createElement('span');
            menuBtn.className = 'outline-menu-inline';
            menuBtn.textContent = '☰';
            menuBtn.title = 'Item controls';
            menuBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
            menuBtn.addEventListener('click', function (e) {
                e.preventDefault();
                openMenuFor(rootId, n.id, menuBtn);
            });
            row.appendChild(menuBtn);

            // (Reordering itself is driven entirely by mousedown/mousemove/
            // mouseup on the ⠿ handle — see startManualDrag above — not by
            // native dragover/drop events on this row.)

            nodeEl.appendChild(row);

            if (n.children.length) {
                const childrenWrap = renderChildren(rootId, n.children, depth + 1);
                if (n.collapsed) childrenWrap.style.display = 'none';
                nodeEl.appendChild(childrenWrap);
            }

            return nodeEl;
        }

        // --- Outline copy: preserve indentation structure on Ctrl/Cmd+C ---
        // Each line's text is its own separate contenteditable .outline-text
        // field (see the comment above), so a mouse drag-select already
        // works natively across lines — but a plain native copy only grabs
        // each field's flat text, one per line, with no record of nesting
        // depth (the visible indent comes from CSS margins on ancestor
        // .outline-node elements, not from characters in the text). This
        // listener rebuilds a tab-indented, "- " bulleted plain-text version
        // of whatever's selected, so pasting into another outline table (or
        // another app entirely) reproduces the original tree shape instead
        // of a flat list.
        document.addEventListener('copy', function (e) {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
            const selRange = sel.getRangeAt(0);
            const startEl = selRange.startContainer.nodeType === 1
                ? selRange.startContainer
                : selRange.startContainer.parentElement;
            const root = startEl && startEl.closest('.outline-root');
            if (!root) return; // not an outline selection — let native copy run as-is

            const rows = Array.from(root.querySelectorAll('.outline-node-row'));
            const lines = [];
            rows.forEach(function (row) {
                const text = row.querySelector('.outline-text');
                if (!text || !selRange.intersectsNode(text)) return;

                // Clamp a full-field range down to just the portion that's
                // actually selected, so a selection starting/ending mid-line
                // doesn't pull in the whole line.
                const fieldRange = document.createRange();
                fieldRange.selectNodeContents(text);
                if (selRange.compareBoundaryPoints(Range.START_TO_START, fieldRange) > 0) {
                    fieldRange.setStart(selRange.startContainer, selRange.startOffset);
                }
                if (selRange.compareBoundaryPoints(Range.END_TO_END, fieldRange) < 0) {
                    fieldRange.setEnd(selRange.endContainer, selRange.endOffset);
                }
                const t = fieldRange.toString();
                if (!t) return;

                // Depth = number of ancestor .outline-node elements above
                // this row's own node (mirrors the depth param renderNode
                // was originally built with).
                let depth = 0;
                let anc = row.closest('.outline-node') && row.closest('.outline-node').parentElement;
                while (anc && anc !== root) {
                    if (anc.classList.contains('outline-node')) depth++;
                    anc = anc.parentElement;
                }
                lines.push('\t'.repeat(depth) + '- ' + t);
            });

            if (!lines.length) return; // fall back to native copy
            e.clipboardData.setData('text/plain', lines.join('\n'));
            e.preventDefault();
        });

        // Turns tab-indented, "- "/"* "/"• "-bulleted (or numbered) plain
        // text — the format the copy handler above produces, and roughly
        // what most other outliners export as plain text — into a forest
        // of real node objects with proper .children nesting. 4 leading
        // spaces are also accepted as one indent level, for text copied
        // from apps that indent with spaces instead of tabs.
        function parseOutlinePasteText(text) {
            const rawLines = text.replace(/\r\n?/g, '\n').split('\n');
            while (rawLines.length && rawLines[rawLines.length - 1].trim() === '') rawLines.pop();

            const parsed = [];
            rawLines.forEach(function (line) {
                if (line.trim() === '') return; // drop stray blank lines within the pasted block
                let rest = line, depth = 0;
                while (rest.charAt(0) === '\t') { depth++; rest = rest.slice(1); }
                if (depth === 0) {
                    const spaceMatch = rest.match(/^ +/);
                    if (spaceMatch) { depth = Math.floor(spaceMatch[0].length / 4); rest = rest.slice(spaceMatch[0].length); }
                }
                rest = rest.replace(/^[-*•]\s+/, '').replace(/^\d+[.)]\s+/, '');
                parsed.push({ depth: depth, text: rest });
            });
            if (!parsed.length) return [];

            // Re-base so the shallowest pasted line becomes depth 0,
            // preserving everything's nesting relative to it.
            const minDepth = Math.min.apply(null, parsed.map(function (p) { return p.depth; }));
            parsed.forEach(function (p) { p.depth -= minDepth; });

            const forest = [];
            const stack = []; // stack[d] = most recently placed node at depth d
            parsed.forEach(function (p) {
                const node = newNode(p.text);
                stack.length = p.depth; // drop any stale deeper entries
                if (p.depth > 0 && stack[p.depth - 1]) stack[p.depth - 1].children.push(node);
                else forest.push(node); // depth 0, or an indentation jump we can't place — top-level fallback
                stack[p.depth] = node;
            });
            return forest;
        }

        // A native paste into a single-line .outline-text field turns
        // multi-line clipboard text into one field containing several
        // wrapped <div>s — and the 'input' handler above deliberately
        // unwraps those without inserting line breaks (see the comment on
        // that handler), so the whole paste collapses onto one visible
        // line instead of becoming separate outline items. Intercept
        // multi-line pastes here and rebuild them as real sibling/child
        // nodes instead.
        document.addEventListener('paste', function (e) {
            const target = e.target && e.target.closest && e.target.closest('.outline-text');
            if (!target) return; // not an outline field — default paste applies
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            if (!text || text.indexOf('\n') === -1) return; // single line — default paste already handles this fine

            const row = target.closest('.outline-node-row');
            const rootEl = target.closest('.outline-root');
            if (!row || !rootEl) return;
            const st = roots[rootEl.id];
            if (!st) return;
            const found = findNodeAndParent(st.tree, row.dataset.nodeId);
            if (!found) return;

            const forest = parseOutlinePasteText(text);
            if (!forest.length) return; // e.g. clipboard was all blank lines — let default paste handle it

            e.preventDefault();
            const n = found.node;
            const caretOffset = caretOffsetIn(target);
            const before = target.textContent.slice(0, caretOffset);
            const after = target.textContent.slice(caretOffset);

            // The first pasted line merges into the current node (like
            // typing it in), carrying the current caret's "before" text;
            // its children, if any, are prepended ahead of this node's
            // existing children.
            n.text = before + forest[0].text;
            n.html = null;
            n.children = forest[0].children.concat(n.children);

            const restNodes = forest.slice(1);
            let focusId = n.id;
            if (restNodes.length) {
                found.parentArr.splice.apply(found.parentArr, [found.index + 1, 0].concat(restNodes));
                focusId = restNodes[restNodes.length - 1].id;
                if (after) {
                    // Text that was after the caret shouldn't get absorbed
                    // into the last pasted node — give it its own trailing
                    // line, same as pressing Enter would.
                    const trailing = newNode(after);
                    found.parentArr.splice(found.index + 1 + restNodes.length, 0, trailing);
                    focusId = trailing.id;
                }
            } else if (after) {
                n.text = n.text + after; // only one pasted line — just reattach the rest of the original line
            }

            renderRoot(rootEl.id, { focusId: focusId, cursorPos: 'end' });
        });

        // --- Shared drag state (set by startManualDrag above; consumed
        // by performDrop/showDropIndicator/clearDropIndicator below) ---
        let dragNodeId = null, dragRootId = null, dropTargetEl = null, dropMode = null;

        function showDropIndicator(row, mode) {
            clearDropIndicator();
            dropTargetEl = row; dropMode = mode;
            if (mode === 'before') row.classList.add('outline-drop-before');
            else if (mode === 'after') row.classList.add('outline-drop-after');
            else row.classList.add('outline-drop-child');
        }
        function clearDropIndicator() {
            if (dropTargetEl) dropTargetEl.classList.remove('outline-drop-before', 'outline-drop-after', 'outline-drop-child');
            dropTargetEl = null; dropMode = null;
        }

        function performDrop(rootId, sourceId, targetId, mode) {
            clearDropIndicator();
            const st = roots[rootId];
            const srcFound = findNodeAndParent(st.tree, sourceId);
            if (!srcFound) return;
            if (isDescendant(srcFound.node, targetId)) return; // can't drop onto own descendant
            srcFound.parentArr.splice(srcFound.index, 1);
            const tgtFound = findNodeAndParent(st.tree, targetId);
            if (!tgtFound) { renderRoot(rootId); return; }
            if (mode === 'child') {
                tgtFound.node.children.push(srcFound.node);
                tgtFound.node.collapsed = false;
            } else if (mode === 'before') {
                tgtFound.parentArr.splice(tgtFound.index, 0, srcFound.node);
            } else {
                tgtFound.parentArr.splice(tgtFound.index + 1, 0, srcFound.node);
            }
            renderRoot(rootId, { focusId: srcFound.node.id, cursorPos: 'keep' });
        }

        // --- Keyboard: Enter / Tab / Shift+Tab / Backspace / arrows ---
        function handleNodeKeydown(e, rootId, n, textEl) {
            const st = roots[rootId];

            if (e.key === 'Enter') {
                e.preventDefault();
                const caretOffset = caretOffsetIn(textEl);
                const before = textEl.textContent.slice(0, caretOffset);
                const after = textEl.textContent.slice(caretOffset);
                n.text = before;
                // Splitting a line at the caret works on plain-text offsets,
                // which doesn't know where formatting spans should end up —
                // simplest to drop inline formatting at the split point
                // rather than leave it applied to the wrong half.
                n.html = null;
                const sibling = newNode(after);
                // A new line created by pressing Enter on a checkbox item
                // is itself a checkbox item too — same as most outliner/
                // task apps — just unchecked, even if the line it split
                // from was already checked off.
                if (n.checkbox) sibling.checkbox = true;
                const found = findNodeAndParent(st.tree, n.id);
                if (!found) return;
                // Enter on a node with expanded children inserts the new
                // line as its first child (matches Outliner), otherwise
                // as the next sibling.
                if (n.children.length && !n.collapsed) n.children.unshift(sibling);
                else found.parentArr.splice(found.index + 1, 0, sibling);
                renderRoot(rootId, { focusId: sibling.id, cursorPos: 0 });
                return;
            }

            if (e.key === 'Tab') {
                e.preventDefault();
                if (e.shiftKey) outdentNode(rootId, n.id);
                else indentNode(rootId, n.id);
                return;
            }

            if (e.key === 'Backspace' && caretOffsetIn(textEl) === 0 && isSelectionCollapsed()) {
                e.preventDefault();
                mergeWithPrevious(rootId, n);
                return;
            }

            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                const flat = flattenVisible(st.tree);
                const idx = flat.findIndex(function (x) { return x.id === n.id; });
                if (idx === -1) return;
                const targetIdx = e.key === 'ArrowUp' ? idx - 1 : idx + 1;
                if (targetIdx < 0 || targetIdx >= flat.length) return;
                e.preventDefault();
                const targetField = st.rootEl.querySelector('[data-node-id="' + flat[targetIdx].id + '"] > .outline-node-row > .outline-text');
                if (targetField) { targetField.focus(); placeCaret(targetField, 'end'); }
            }
        }

        function isSelectionCollapsed() {
            const sel = window.getSelection();
            return sel.rangeCount > 0 && sel.getRangeAt(0).collapsed;
        }

        function caretOffsetIn(textEl) {
            const sel = window.getSelection();
            if (!sel.rangeCount) return textEl.textContent.length;
            const r = sel.getRangeAt(0);
            if (r.startContainer !== textEl && !textEl.contains(r.startContainer)) return textEl.textContent.length;
            const pre = document.createRange();
            pre.selectNodeContents(textEl);
            pre.setEnd(r.startContainer, r.startOffset);
            return pre.toString().length;
        }

        function mergeWithPrevious(rootId, n) {
            const st = roots[rootId];
            const flat = flattenVisible(st.tree);
            const idx = flat.findIndex(function (x) { return x.id === n.id; });
            if (idx <= 0) return; // first node overall — nothing to merge into
            const prev = flat[idx - 1];
            const found = findNodeAndParent(st.tree, n.id);
            if (!found) return;
            const prevLen = prev.text.length;
            prev.text = prev.text + n.text;
            // Same reasoning as the Enter-split above: merging on plain
            // text doesn't have a sensible way to recombine two lines'
            // formatting spans, so drop them rather than mismatch them.
            prev.html = null;
            prev.children = prev.children.concat(n.children);
            found.parentArr.splice(found.index, 1);
            renderRoot(rootId, { focusId: prev.id, cursorPos: prevLen });
        }

        // --- Public init ---
        window.initOutlineTable = function (rootEl, initialText) {
            const id = rootEl.id || ('outline_' + Math.random().toString(36).slice(2, 8));
            rootEl.id = id; // persist the generated id onto the element itself
            let tree = null;
            if (rootEl.dataset.tree) {
                try {
                    const parsed = JSON.parse(rootEl.dataset.tree);
                    if (Array.isArray(parsed) && parsed.length) tree = parsed;
                } catch (err) {
                    tree = null; // fall through to a fresh single line below
                }
            }
            if (!tree) tree = [newNode(initialText || '')];
            roots[id] = { rootEl: rootEl, tree: tree };
            renderRoot(id);
        };

        // --- Hooks for the global floating "Add Bullet"/"Add Checkbox"
        // buttons (see insertBulletPoint/insertCheckbox further up the
        // file) so they can delegate to proper tree operations instead
        // of raw DOM insertion when focus is inside the outline table.
        // A plain-text field can't hold an embedded checkbox mid-line
        // the way the old flat-line model could, so the closest faithful
        // equivalents are: "add bullet" = new sibling line (same as
        // Enter), "add checkbox" = turn the current line into a
        // checkbox line (same as the ☰ panel's own checkbox toggle).
        window.outlineInsertBulletAtCursor = function (textEl) {
            const rootEl = textEl.closest('.outline-root');
            const rootId = rootEl && rootEl.id;
            const st = rootId && roots[rootId];
            if (!st) return false;
            const found = findNodeAndParent(st.tree, textEl.dataset.nodeId);
            if (!found) return false;
            handleNodeKeydown({ key: 'Enter', preventDefault: function () {} }, rootId, found.node, textEl);
            return true;
        };
        window.outlineToggleCheckboxAtCursor = function (textEl) {
            const rootEl = textEl.closest('.outline-root');
            const rootId = rootEl && rootEl.id;
            const st = rootId && roots[rootId];
            if (!st) return false;
            const found = findNodeAndParent(st.tree, textEl.dataset.nodeId);
            if (!found) return false;
            found.node.checkbox = true;
            renderRoot(rootId, { focusId: found.node.id, cursorPos: 'keep' });
            return true;
        };
        // Used by the per-cell "+✓" header button (insertCheckboxInCell)
        // — appends a fresh checkbox line at the end of the tree, since
        // that button doesn't have any particular cursor position to
        // act on the way the floating global button does.
        window.outlineAppendCheckboxNode = function (rootId) {
            const st = roots[rootId];
            if (!st) return false;
            const node = newNode('');
            node.checkbox = true;
            st.tree.push(node);
            renderRoot(rootId, { focusId: node.id, cursorPos: 'start' });
            return true;
        };

        // Used by the compact JSON save/load (see the Firebase script
        // block near the end of the file) to read a root's current tree
        // without needing direct access to this IIFE's private `roots`.
        window.getOutlineTree = function (rootId) {
            const st = roots[rootId];
            return st ? st.tree : null;
        };

        // Used by the content-search feature (Files sidebar): a search
        // result only stores a rootId + nodeId, since the underlying
        // outline data can change between when a result is shown and
        // when it's clicked. This resolves that pair back to a live row
        // to scroll to — un-collapsing any collapsed ancestor nodes
        // along the way (and the cell itself, if collapsed) so the
        // match is actually visible once scrolled to, not just present
        // in the DOM with display:none.
        window.revealAndScrollToNode = function (rootId, nodeId) {
            const st = roots[rootId];
            if (!st) return false;
            let changed = false;
            let walkId = nodeId;
            for (let guard = 0; guard < 200; guard++) {
                const found = findNodeAndParent(st.tree, walkId);
                if (!found || !found.parent) break;
                if (found.parent.collapsed) { found.parent.collapsed = false; changed = true; }
                walkId = found.parent.id;
            }
            if (changed) renderRoot(rootId);
            const rootEl = document.getElementById(rootId);
            if (!rootEl) return false;
            const td = rootEl.closest('td');
            if (td && td.classList.contains('cell-collapsed')) {
                td.classList.remove('cell-collapsed');
                const toggle = td.querySelector('.cell-toggle');
                if (toggle) toggle.textContent = '▾';
            }
            const rowEl = rootEl.querySelector('.outline-node-row[data-node-id="' + nodeId + '"]');
            if (!rowEl) return false;
            rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            rowEl.classList.add('search-hit-flash');
            setTimeout(function () { rowEl.classList.remove('search-hit-flash'); }, 1800);
            return true;
        };

        // --- Helpers for bulk Copy/Move/Delete (Files sidebar's Select
        // mode) — these only ever operate on the CURRENTLY OPEN
        // project's live trees (that's the only thing a checkbox can be
        // sitting on to begin with); moving/copying into a *different*
        // project reads/writes that project's JSON directly instead
        // (see the select-mode script near the end of the file).
        function cloneNodeWithFreshIds(n) {
            return {
                id: uid(),
                text: n.text,
                html: n.html,
                children: (n.children || []).map(cloneNodeWithFreshIds),
                collapsed: n.collapsed,
                checkbox: n.checkbox,
                done: n.done,
                bold: n.bold,
                textColor: n.textColor,
                bgColor: n.bgColor
            };
        }
        window.cloneOutlineNodeDeep = cloneNodeWithFreshIds;

        window.getLiveNode = function (rootId, nodeId) {
            const st = roots[rootId];
            if (!st) return null;
            const found = findNodeAndParent(st.tree, nodeId);
            return found ? found.node : null;
        };
        window.removeLiveNode = function (rootId, nodeId) {
            const st = roots[rootId];
            if (!st) return false;
            const found = findNodeAndParent(st.tree, nodeId);
            if (!found) return false;
            found.parentArr.splice(found.index, 1);
            return true;
        };
        window.appendNodeToRoot = function (rootId, node) {
            const st = roots[rootId];
            if (!st) return false;
            st.tree.push(node);
            return true;
        };
        window.rerenderOutlineRoot = function (rootId) {
            if (!roots[rootId]) return;
            renderRoot(rootId);
        };

        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.outline-root').forEach(function (el) {
                window.initOutlineTable(el, '');
            });
        });
    })();

    <script>

            }
        }

        function setStatus(text) {
            const el = document.getElementById('cloudStatusLabel');
            if (el) el.textContent = text;
        }

        window.cloudSignIn = function () {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(function (err) {
                console.error('Popup sign-in failed, trying redirect:', err);
                // Popup can fail for reasons a redirect can still
                // recover from (blocked popup, Safari's tracking
                // prevention) — but an actual bad/misconfigured project
                // (wrong apiKey, authDomain not authorized, Google
                // sign-in not enabled) will fail the redirect the same
                // way, so surface that instead of leaving the person
                // staring at a button that visibly did nothing.
                setStatus('Sign-in failed, retrying…');
                auth.signInWithRedirect(provider).catch(function (err2) {
                    console.error('Redirect sign-in also failed:', err2);
                    setStatus('Sign-in failed: ' + (err2 && err2.code ? err2.code : 'unknown error'));
                });
            });
        };

        window.cloudSignOut = function () {
            auth.signOut();
        };

        // --- Compact JSON serialization (replaces the earlier full-HTML
        // dump). Only the essential data survives — cell titles and each
        // outline root's tree (id/text/children/flags per node) — not
        // rendered markup, wrapper divs, or inline styles. This is both
        // much smaller and avoids Firestore's "no arrays nested inside
        // arrays" restriction, which a raw rows-of-cells structure would
        // otherwise hit — kept as a single JSON string field instead of
        // native nested Firestore data. ---
        function serializeTablesContainer() {
            const container = document.getElementById('tablesContainer');
            const sidebarNotesEl = document.querySelector('#sidebar .notes-area');
            const tables = [];
            Array.from(container.children).forEach(function (child) {
                let table, wrapped;
                if (child.tagName === 'TABLE') { table = child; wrapped = false; }
                else if (child.classList.contains('table-wrapper')) { table = child.querySelector('table'); wrapped = true; }
                else { return; }
                if (!table) return;
                const rows = [];
                // getCellTableRows always returns plain row-major cells
                // regardless of whether this table's DOM is currently
                // grouped by row or by column (see applyCellTableLayout)
                // — so the stored JSON shape never changes either way.
                window.getCellTableRows(table).forEach(function (rowTds) {
                    const cells = [];
                    rowTds.forEach(function (td) {
                        const titleEl = td.querySelector('.cell-title');
                        const outlineEl = td.querySelector('.outline-root');
                        const tree = (outlineEl && outlineEl.id && window.getOutlineTree)
                            ? (window.getOutlineTree(outlineEl.id) || []) : [];
                        cells.push({
                            title: titleEl ? titleEl.textContent : '',
                            checkboxBtn: !!td.querySelector('.cell-action-button'),
                            collapsed: td.classList.contains('cell-collapsed'),
                            fullHeight: td.classList.contains('cell-full-height'),
                            tree: tree
                        });
                    });
                    rows.push(cells);
                });
                tables.push({
                    wrapped: wrapped,
                    mainTableId: table.id === 'mainTable',
                    small: table.classList.contains('cell-table-small'),
                    rows: rows
                });
            });
            return {
                version: 1,
                tables: tables,
                sidebarNotes: sidebarNotesEl ? sidebarNotesEl.innerHTML : '',
                thinkLog: window.__thinkLogEntries || []
            };
        }

        function buildCellElement(cellData) {
            const td = document.createElement('td');
            const h3 = document.createElement('h3');
            const titleSpan = document.createElement('span');
            titleSpan.className = 'cell-title';
            titleSpan.contentEditable = 'true';
            titleSpan.textContent = cellData.title || '';
            h3.appendChild(titleSpan);
            if (cellData.checkboxBtn) {
                h3.appendChild(document.createTextNode(' '));
                const btn = document.createElement('button');
                btn.setAttribute('onclick', 'insertCheckboxInCell(this)');
                btn.className = 'cell-action-button';
                btn.style.backgroundColor = '#4CAF50';
                btn.textContent = '+✓';
                h3.appendChild(btn);
            }
            td.appendChild(h3);
            const scrollBox = document.createElement('div');
            scrollBox.className = 'cell-scroll';
            const root = document.createElement('div');
            root.className = 'outline-root';
            root.dataset.tree = JSON.stringify(cellData.tree || []);
            scrollBox.appendChild(root);
            td.appendChild(scrollBox);
            if (window.ensureCellToggle) window.ensureCellToggle(td);
            if (window.ensureCellHeightToggle) window.ensureCellHeightToggle(td);
            if (cellData.collapsed) {
                td.classList.add('cell-collapsed');
                const toggle = h3.querySelector('.cell-toggle');
                if (toggle) toggle.textContent = '▸';
            }
            if (cellData.fullHeight) {
                td.classList.add('cell-full-height');
                scrollBox.style.height = 'auto';
                scrollBox.style.maxHeight = 'none';
                const heightToggle = h3.querySelector('.cell-height-toggle');
                if (heightToggle) {
                    heightToggle.textContent = '⤡';
                    heightToggle.title = 'Use a fixed height with scrolling';
                }
            }
            return td;
        }

        function rebuildTablesContainer(data) {
            const container = document.getElementById('tablesContainer');
            container.innerHTML = '';
            const sidebarNotesEl = document.querySelector('#sidebar .notes-area');
            if (sidebarNotesEl) {
                sidebarNotesEl.innerHTML = (data.sidebarNotes !== undefined && data.sidebarNotes !== null && data.sidebarNotes !== '')
                    ? data.sidebarNotes : 'Notes';
            }
            window.__thinkLogEntries = Array.isArray(data.thinkLog) ? data.thinkLog : [];
            if (window.renderThinkLogEntries) window.renderThinkLogEntries();
            (data.tables || []).forEach(function (tableData) {
                const table = document.createElement('table');
                if (tableData.mainTableId) table.id = 'mainTable';
                if (tableData.small) table.classList.add('cell-table-small');
                // Built here in plain row-major order first (one <tr>
                // per stored row) — same as always — then regrouped into
                // independent column stacks afterward, once every cell
                // exists, so the two columns' vertical positions don't
                // stay coupled to each other.
                (tableData.rows || []).forEach(function (rowCells) {
                    const tr = document.createElement('tr');
                    rowCells.forEach(function (cellData) { tr.appendChild(buildCellElement(cellData)); });
                    table.appendChild(tr);
                });
                window.applyCellTableLayout(table);
                if (tableData.wrapped) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-wrapper';
                    const delBtn = document.createElement('button');
                    delBtn.className = 'table-delete-btn table-corner-btn';
                    delBtn.title = 'Delete this table';
                    delBtn.innerHTML = window.TABLE_TRASH_ICON_SVG;
                    delBtn.onclick = function () {
                        if (confirm('Delete this table? This cannot be undone.')) {
                            wrapper.remove();
                            if (window.scheduleCloudAutoSave) window.scheduleCloudAutoSave();
                        }
                    };
                    wrapper.appendChild(table);
                    wrapper.appendChild(delBtn);
                    if (window.ensureTableDragHandle) window.ensureTableDragHandle(wrapper);
                    if (window.ensureTablePopoutButton) window.ensureTablePopoutButton(wrapper);
                    if (window.ensureTableSizeToggleBtn) window.ensureTableSizeToggleBtn(wrapper);
                    container.appendChild(wrapper);
                } else {
                    if (window.ensureTableDragHandle) window.ensureTableDragHandle(table);
                    if (window.ensureTablePopoutButton) window.ensureTablePopoutButton(table);
                    if (window.ensureTableSizeToggleBtn) window.ensureTableSizeToggleBtn(table);
                    container.appendChild(table);
                }
            });
            // Each root's tree was written to dataset.tree above, so
            // initOutlineTable restores it directly — the same
            // restore-from-data-tree path local file Open already uses.
            container.querySelectorAll('.outline-root').forEach(function (el) {
                window.initOutlineTable(el, '');
            });
        }

        // Thoughts' default starting layout: one deletable table, one
        // cell — same shape as "+ Single Table" (see
        // singleTableProjectData below, which this now just delegates
        // to) rather than Weekgoal's original 6-cell weekly grid. Every
        // brand-new project (including the very first one auto-created
        // for a new sign-in) starts here.
        function defaultProjectTablesData() {
            return singleTableProjectData();
        }

        // Exposed for debugging/testing (e.g. inspecting exactly what a
        // cloud save payload would contain without triggering a network
        // call) — cloudSave/cloudLoad above are the normal entry points.
        window.serializeTablesContainer = serializeTablesContainer;
        window.rebuildTablesContainer = rebuildTablesContainer;

        // --- Multi-project system (users/{uid}/thoughtsProjects/{id}) ---
        // Each project is a fully independent set of tables — its own
        // named "page" you can switch between, rename, or delete. Mirrors
        // the Projects concept from the other apps in this ecosystem,
        // adapted to WeekGoal's compact JSON save format.
        function projectsCollection() {
            return db.collection('users').doc(currentUser.uid).collection('thoughtsProjects');
        }

        // Normalizes a timestamp to a plain millisecond number regardless
        // of its source: a fresh Firestore Timestamp (has .toMillis()), a
        // plain {seconds,...} object (what a Firestore Timestamp becomes
        // after a JSON.stringify/parse round-trip through the local
        // backup cache), an already-plain number, or missing entirely.
        // Sorting needs a single comparable type no matter where the
        // value came from.
        function tsToMillis(ts) {
            if (!ts) return 0;
            if (typeof ts === 'number') return ts;
            if (typeof ts.toMillis === 'function') return ts.toMillis();
            if (typeof ts.seconds === 'number') return ts.seconds * 1000 + Math.floor((ts.nanoseconds || 0) / 1e6);
            return 0;
        }

        // Single place that turns a Firestore project doc into a
        // projectsCache entry — every list-loading path (initial load,
        // Sync Now) should shape entries identically so sorting/pin
        // display behaves the same regardless of which path populated
        // them.
        function projectDocToCacheEntry(id, data) {
            return {
                id: id,
                name: data.name || 'Untitled',
                updatedAt: data.updatedAt,
                createdAt: data.createdAt,
                pinned: !!data.pinned
            };
        }

        // --- Local backup cache (localStorage) ------------------------
        // Firestore stays the source of truth; this is a same-browser
        // backup kept in sync on every cloud save/load, so the app can
        // keep working — reading the last-known state, queuing writes —
        // if the network is slow or briefly down. Keyed by uid so
        // multiple accounts signed in on the same browser don't collide.
        function localCacheKey(uid, projectId) { return 'th_cache_' + uid + '_' + projectId; }
        function localCacheIndexKey(uid) { return 'th_cache_index_' + uid; }
        function localListKey(uid) { return 'th_projects_list_' + uid; }

        function readLocalProject(uid, projectId) {
            try {
                const raw = localStorage.getItem(localCacheKey(uid, projectId));
                return raw ? JSON.parse(raw) : null;
            } catch (err) { return null; }
        }
        function writeLocalProject(uid, projectId, data) {
            try {
                localStorage.setItem(localCacheKey(uid, projectId), JSON.stringify(data));
                const idx = readLocalCacheIndex(uid);
                if (idx.indexOf(projectId) === -1) {
                    idx.push(projectId);
                    localStorage.setItem(localCacheIndexKey(uid), JSON.stringify(idx));
                }
            } catch (err) {
                console.error('Local cache write failed:', err);
            }
        }
        function removeLocalProject(uid, projectId) {
            try {
                localStorage.removeItem(localCacheKey(uid, projectId));
                const idx = readLocalCacheIndex(uid).filter(function (id) { return id !== projectId; });
                localStorage.setItem(localCacheIndexKey(uid), JSON.stringify(idx));
            } catch (err) { /* non-fatal */ }
        }
        function readLocalCacheIndex(uid) {
            try {
                const raw = localStorage.getItem(localCacheIndexKey(uid));
                return raw ? JSON.parse(raw) : [];
            } catch (err) { return []; }
        }
        function readLocalProjectsList(uid) {
            try {
                const raw = localStorage.getItem(localListKey(uid));
                return raw ? JSON.parse(raw) : null;
            } catch (err) { return null; }
        }
        function writeLocalProjectsList(uid, list) {
            try { localStorage.setItem(localListKey(uid), JSON.stringify(list)); }
            catch (err) { console.error('Local projects-list cache write failed:', err); }
        }

        // Pushes any project that got saved locally but never made it to
        // the cloud (saveProjectNow flags these as pendingSync when the
        // Firestore write fails). Runs on reconnect and whenever "Sync
        // Now" is used, so a save made while offline reliably catches up
        // once the network's back — not just cached forever.
        function flushPendingLocalSync() {
            if (!currentUser) return;
            const uid = currentUser.uid;
            readLocalCacheIndex(uid).forEach(function (projectId) {
                const cached = readLocalProject(uid, projectId);
                if (!cached || !cached.pendingSync) return;
                projectsCollection().doc(projectId).set({
                    json: cached.json,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).then(function () {
                    cached.pendingSync = false;
                    writeLocalProject(uid, projectId, cached);
                }).catch(function (err) {
                    console.error('Retry sync failed for', projectId, err);
                });
            });
        }
        window.addEventListener('online', flushPendingLocalSync);

        function initProjectsForUser() {
            setStatus('Loading projects…');
            projectsCollection().get().then(function (snap) {
                projectsCache = snap.docs.map(function (d) {
                    return projectDocToCacheEntry(d.id, d.data());
                });
                writeLocalProjectsList(currentUser.uid, projectsCache);
                if (projectsCache.length > 0) {
                    return db.collection('users').doc(currentUser.uid).get().then(function (userDoc) {
                        const savedCurrentId = userDoc.data() && userDoc.data().thoughtsCurrentProjectId;
                        const targetId = (savedCurrentId && projectsCache.some(function (p) { return p.id === savedCurrentId; }))
                            ? savedCurrentId : projectsCache[0].id;
                        return switchProject(targetId, { skipSaveCurrent: true, preferCloud: true });
                    });
                }
                // No projects yet — check for data saved before the
                // project system existed (the old flat weekgoal.json
                // field) and migrate it into a first project instead of
                // silently losing it.
                return db.collection('users').doc(currentUser.uid).get().then(function (userDoc) {
                    const legacy = userDoc.data() && userDoc.data().weekgoal;
