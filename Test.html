<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thoughts</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.4.0/docx.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: top;
            align-items: center;
            height: 200vh;
            background-color: #f0f0f0;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 95vw;
            max-width: 950px;
            margin-top: 20px;
            position: relative;
        }

        /* Small grip for reordering whole tables/cells by drag-and-drop
           (see initTableReorder). Floats just above the table's own
           top-left corner, in the gap between blocks, rather than
           overlapping the first cell's own title — only the grip itself
           is draggable, not the table, so normal clicking/selecting
           text/dragging inside the table is completely unaffected.
           Shared sizing/color/hover styling lives on .table-corner-btn
           (see below, next to the other per-table icon buttons) so all
           four read as one coherent control set; this just positions it
           and sets the grab cursor. */
        .table-drag-handle {
            left: 0;
            cursor: grab;
            user-select: none;
        }
        .table-dragging {
            opacity: 0.4;
        }
        .table-drop-target {
            outline: 2px dashed #2d8cff;
            outline-offset: 4px;
        }

        /* A standalone cell sized to fit two side by side within
           #tablesContainer's own width, accounting for the 20px gap
           between them there (see #tablesContainer below) — roughly
           matching one normal cell from a 2-column row, instead of
           stretching across the full row width like a normal
           1-column table does. */
        table.cell-table-small {
            width: calc((min(95vw, 950px) - 20px) / 2);
            max-width: none;
        }

        td {
            border: 1px solid #ccc;
            background-color: white;
            text-align: left;
            vertical-align: top;
            padding: 20px;
            width: 100%;
            cursor: text;
            font-size: 1.0em;
            line-height: 1.2;
        }

        /* The actual fixed-height, scrollable/resizable box for a
           cell's content, wrapping .outline-root — deliberately NOT on
           the <td> itself. A table cell's `height` is only a minimum
           in HTML table layout: browsers let the cell grow past it to
           fit content no matter what `overflow` says, so a fixed
           height + overflow:auto on a <td> directly never reliably
           produces a scrollbar — the row just keeps growing instead.
           A plain block-level div doesn't have that table-layout
           quirk, so the scrolling/resizing lives here, while the
           header (h3 + its toggles) stays outside it and always
           visible. Padding/height/resize values match the plain td
           this app was forked from (Weekgoal) — the visual proportions
           are the same, only the growing-instead-of-scrolling bug is
           fixed. */
        .cell-scroll {
            width: 100%;
            box-sizing: border-box;
            height: 190px;
            overflow: auto;
            resize: vertical;
        }

        table h3 {
            font-weight: bold;
            font-size: 1.2em;
            margin: 0;
        }

        /* Top control bar: a single row that never wraps. The two
           sidebar toggles (Files on the left, Notes on the right) are
           pinned as fixed-size flex items at each end so they're always
           in the same easy-to-find spot; everything else lives in the
           scrollable middle strip (#toolbarScroll) between them. */
        #toolbar {
            margin-bottom: 10px;
            width: 95vw;
            max-width: 950px;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 6px;
        }

        #toolbarScroll {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 2px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            /* Thin, unobtrusive scrollbar so the row still reads as a
               single toolbar rather than a scroll widget. */
            scrollbar-width: thin;
            padding-bottom: 2px;
        }

        #toolbarScroll::-webkit-scrollbar {
            height: 5px;
        }

        #toolbarScroll::-webkit-scrollbar-thumb {
            background: #c7c7c7;
            border-radius: 3px;
        }

        .toolbar-pin {
            flex: 0 0 auto;
            white-space: nowrap;
        }

        button {
            margin-right: 5px;
            padding: 6px 10px;
            border: none;
            background-color: #3E63DD;
            color: white;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.15s ease;
        }

        button:hover {
            background-color: #3151b8;
        }

        .custom-bullet-list {
            padding-left: 20px;
            margin: 0;
        }

        .custom-bullet-list li {
            margin-bottom: 0px;
        }

        /* Numbered lists (from the "/" menu or the item hover panel's
           Number conversion) previously used the browser's default <ol>
           styling (~40px left padding, ~1em top/bottom margin), which
           didn't line up with bullet or checkbox lines at ~20px. Matching
           padding/margin here keeps all three markers flush together. */
        [contenteditable="true"] ol {
            padding-left: 20px;
            margin: 0;
        }

        [contenteditable="true"] ol li {
            margin-bottom: 0px;
        }

        /* Hanging indent for checkbox lines. A checkbox line is a plain
           <div><input type="checkbox"> text...</div> — with no special
           handling, long text wraps back to the div's left edge, landing
           directly under the checkbox instead of lining up with the text
           itself. Flex layout fixes that: the checkbox becomes a fixed-
           width column and the text (an anonymous flex item) wraps within
           its own column, staying aligned under itself, not the checkbox. */
        [contenteditable="true"] div:has(> input[type="checkbox"]) {
            display: flex;
            align-items: flex-start;
        }

        [contenteditable="true"] div:has(> input[type="checkbox"]) > input[type="checkbox"] {
            flex: 0 0 auto;
            margin-top: 4px;
        }

        .options-menu {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.1s ease, transform 0.1s ease;
        }

        .options-menu button {
            display: block;
            background: white;
            color: #2b2f36;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            font-size: 14px;
            border-radius: 5px;
        }

        .options-menu button:hover {
            background-color: #eef1fb;
            color: #3E63DD;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            border: 1px solid #e4e6ea;
            width: auto;
            min-width: 130px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.12);
            z-index: 1000;
            margin-top: 6px;
            padding: 6px;
            border-radius: 8px;
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .dropdown-content.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .dropdown-content iframe {
            width: 100%;
            height: 600px;
            border: none;
        }

        /* Structural styling only — deliberately no background-color or
           color here. Previously this rule set a brown fill on every
           button inside any dropdown regardless of class, because a
           class+element selector like this one always beats a plain
           class selector like .gray on specificity — so Export/Save/
           Load and friends (meant to be gray, via class="gray") were
           actually rendering brown. Leaving color out here lets each
           button's own class (.gray, .btn-structural, .btn-link,
           .btn-view, or none) decide its own color as intended. */
        .dropdown-content button {
            display: block;
            width: 100%;
            padding: 7px 10px;
            margin: 1px 0;
            text-align: left;
            border-radius: 6px;
            font-size: 12.5px;
        }

        #sidebar {
            position: fixed;
            top: 0;
            right: -500px;
            width: 500px;
            height: 100%;
            background-color: #fff;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.3);
            transition: right 0.3s ease;
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #sidebar.open {
            right: 0;
        }

        /* Left-side Files panel — now a docked, pinned column (like
           Selfchat's #chatSidebar) that lives inside #appWrapper next to
           #mainCol and pushes the page content over, instead of floating
           on top of it. Collapses to width:0 rather than sliding
           off-screen. On narrow screens it switches back to a fixed
           overlay with a backdrop (see the media query and
           #fileSidebarMobileOverlay below), same as Selfchat. */
        #appWrapper {
            display: flex;
            align-items: flex-start;
            width: 100%;
            gap: 0;
        }

        #mainCol {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #fileSidebar {
            width: 260px;
            min-width: 260px;
            background: #fff;
            color: #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 24px);
            position: sticky;
            top: 12px;
            overflow: hidden;
            transition: width 0.22s ease, min-width 0.22s ease, opacity 0.18s, margin 0.22s ease;
            flex-shrink: 0;
            margin: 12px 10px 12px 12px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        #fileSidebar.collapsed {
            width: 0;
            min-width: 0;
            opacity: 0;
            margin-left: 0;
            margin-right: 0;
            pointer-events: none;
            border: none;
        }

        #fileSidebarHeader {
            padding: 12px 10px 8px;
            font-weight: bold;
            font-size: 12px;
            color: #6c757d;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f7f7f7;
            flex-shrink: 0;
        }

        #fileSidebarHeader h3 {
            margin: 0;
            font-size: 1em;
            letter-spacing: normal;
            text-transform: none;
            color: #333;
        }

        #fileSidebar .file-sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
            scrollbar-width: thin;
        }

        /* Content search — searches the currently-open project's outline
           text; separate from the project list above/below it. Typing in
           #contentSearchInput hides #projectsListSide and shows
           #contentSearchResults instead (see the search wiring script
           near the end of the file); clearing it flips back. */
        #fileSidebarSearchBar {
            padding: 8px 10px 4px;
            flex-shrink: 0;
        }
        #contentSearchInput {
            width: 100%;
            box-sizing: border-box;
            font-size: 13px;
            padding: 5px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* Sort control for the project list — a view preference (see
           th_project_sort_mode in localStorage), applies to every list
           container (sidebar + the 📁 dropdown) uniformly. */
        #fileSidebarSortBar {
            padding: 0 10px 8px;
            flex-shrink: 0;
        }
        #projectSortSelect {
            width: 100%;
            box-sizing: border-box;
            font-size: 12px;
            padding: 4px 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            color: #555;
            background: #fff;
        }

        /* Professional project-row list style: pin indicator + name +
           a single kebab (⋮) menu for Rename/Pin/Delete, replacing the
           old always-visible × delete button and click-name-to-edit
           pattern. */
        .project-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            color: #222;
        }
        .project-row:hover {
            background: rgba(0, 0, 0, 0.045);
        }
        .project-row.current {
            background: rgba(43, 108, 255, 0.10);
            font-weight: 600;
        }
        .project-row.current:hover {
            background: rgba(43, 108, 255, 0.15);
        }
        .project-row-empty {
            padding: 10px 8px;
            font-size: 12.5px;
            color: #999;
            text-align: center;
        }
        .project-pin-icon {
            flex-shrink: 0;
            font-size: 11px;
        }
        .project-row-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            outline: none;
        }
        .project-row-name[contenteditable="true"] {
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            background: #fff;
            box-shadow: 0 0 0 2px #2b6cff inset;
            border-radius: 3px;
            padding: 0 2px;
            cursor: text;
        }
        .project-row-menu-btn {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            line-height: 22px;
            padding: 0;
            border: none;
            background: transparent;
            color: #888;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
        }
        .project-row:hover .project-row-menu-btn,
        .project-row-menu-btn:focus {
            opacity: 1;
        }
        .project-row-menu-btn:hover {
            background: rgba(0, 0, 0, 0.08);
            color: #333;
        }

        /* Single shared floating menu (like the outline's own hover
           toggle elsewhere in this file) repositioned under whichever
           row's ⋮ was clicked, rather than one hidden dropdown per row. */
        .project-row-menu {
            display: none;
            position: fixed;
            z-index: 4000;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
            padding: 4px;
            min-width: 140px;
        }
        .project-row-menu.show { display: block; }
        .project-row-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 6px 8px;
            border: none;
            background: none;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            color: #333;
        }
        .project-row-menu button:hover {
            background: rgba(0, 0, 0, 0.06);
        }
        .project-row-menu button[data-action="delete"] {
            color: #c33;
        }

        .search-result-row {
            padding: 6px 6px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        .search-result-row:hover { background: rgba(0,0,0,0.05); }
        .search-result-table {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #8B4513;
            margin-bottom: 2px;
        }
        .search-result-text {
            font-size: 13px;
            color: #333;
            line-height: 1.4;
            white-space: normal;
            word-break: break-word;
        }
        .search-result-text mark {
            background: #fff3a3;
            color: inherit;
            border-radius: 2px;
        }
        .search-no-results {
            padding: 10px 8px;
            color: #888;
            font-size: 13px;
        }
        /* Brief highlight when a search result is clicked and scrolled
           into view, so it's obvious which line matched. */
        .search-hit-flash {
            animation: searchHitFlash 1.8s ease-out;
        }
        @keyframes searchHitFlash {
            0% { background-color: #fff3a3; }
            100% { background-color: transparent; }
        }

        #fileSidebar .file-sidebar-row {
            display: flex;
            align-items: center;
            padding: 5px 3px;
            border-radius: 4px;
        }

        #fileSidebarFooter {
            padding: 10px 12px 12px;
            border-top: 1px solid #eee;
            background: #f7f7f7;
            flex-shrink: 0;
        }

        #fileSidebar .file-sidebar-add {
            display: flex;
            gap: 6px;
        }

        #fileSidebar .file-sidebar-add input {
            flex: 1;
            font-size: 13px;
            padding: 4px 6px;
        }

        /* Backdrop shown behind the docked sidebar only on narrow
           screens, where it switches to floating over the content
           (mirrors #sidebarMobileOverlay in Selfchat). display:none by
           default; only takes effect inside the media query below, so
           the .active class the JS toggles unconditionally has no
           visual effect on desktop, where the sidebar is docked rather
           than floating and shouldn't be covered or click-blocked. */
        #fileSidebarMobileOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 1999;
        }

        @media (max-width: 700px) {
            #fileSidebarMobileOverlay.active { display: block; }
            #fileSidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 2000;
                border-radius: 0 8px 8px 0;
                box-shadow: 2px 0 16px rgba(0,0,0,0.2);
                margin: 0;
            }
            #fileSidebar.collapsed {
                width: 0;
                min-width: 0;
                opacity: 0;
            }
        }

        /* The page title, toolbar, and tables all size themselves off
           the viewport (95vw, see those rules below) rather than off
           #mainCol — fine when the Files panel only floated on top of
           the page, but now that it's docked and actually claims
           horizontal space, that 95vw can be wider than the room
           #mainCol has left, pushing tables under the sidebar. Only on
           screens wide enough for the sidebar to stay docked (matches
           the breakpoint above), and only while it's actually open,
           subtract its real footprint (12px + 260px + 10px margin)
           from those same vw-based widths so content keeps fitting
           beside it. table.cell-table-small keeps its own existing
           calc() form (see the comment on that rule) rather than
           switching to a percentage, since percentages there hit a
           circular-sizing bug against .table-wrapper. */
        @media (min-width: 701px) {
            body:has(#fileSidebar:not(.collapsed)) #pageTitle,
            body:has(#fileSidebar:not(.collapsed)) #toolbar,
            body:has(#fileSidebar:not(.collapsed)) #tablesContainer {
                width: calc(95vw - 282px);
            }
            /* :not(.cell-table-small) matters here: without it, this
               selector's two #ids out-specificity the dedicated
               .cell-table-small rule below (one #id from :has() plus a
               class), so it would silently win and stretch "small"
               (half-width) tables to full width whenever the sidebar is
               open — exactly the bug this excludes. */
            body:has(#fileSidebar:not(.collapsed)) #tablesContainer table:not(.cell-table-small),
            body:has(#fileSidebar:not(.collapsed)) #tablesContainer .cell-table {
                width: calc(95vw - 282px);
            }
            body:has(#fileSidebar:not(.collapsed)) table.cell-table-small {
                width: calc((min(95vw - 282px, 950px) - 20px) / 2);
            }
        }

        #sidebar h3 {
            margin-top: 0;
            font-size: 1.2em;
        }

        /* Think Log — a simple, built-in per-project running log,
           replacing the old embedded iframe so notes never depend on
           an external site being reachable. */
        #think-log {
            display: flex;
            flex-direction: column;
            height: 60%;
            margin-bottom: 10px;
        }
        #think-log-entries {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px 8px;
            background: #fff;
            margin-bottom: 6px;
        }
        .think-log-entry {
            padding: 8px 4px;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        .think-log-entry:last-child {
            border-bottom: none;
        }
        .think-log-entry-time {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
        }
        .think-log-entry-text {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }
        .think-log-entry-delete {
            float: right;
            cursor: pointer;
            color: #c33;
            font-size: 12px;
            opacity: 0.6;
        }
        .think-log-entry-delete:hover {
            opacity: 1;
        }
        #think-log-empty {
            color: #999;
            font-size: 15px;
            font-style: italic;
            padding: 4px;
        }
        #think-log-composer {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #think-log-input {
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.4;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #think-log-add {
            align-self: flex-end;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
        }
        #think-log-add:hover {
            background-color: #5a6268;
        }

        #sidebar .notes-area {
            width: 100%;
            height: 20%;
            border: 1px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            background-color: #f9f9f9;
        }

        #sidebar-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ff4444;
            padding: 5px 10px;
        }

        #tablesContainer, #pageTitle {
            width: 95vw;
            max-width: 950px;
        }
        #tablesContainer {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 20px;
        }
        /* Each table/wrapper brings its own width (normal tables are
           full-width and so always end up alone on their line; small
           ones — see table.cell-table-small — are roughly half-width,
           so two fit side by side before wrapping to a new line) and
           its own top spacing, which would otherwise stack on top of
           the flex gap above and leave extra space. */
        #tablesContainer > table,
        #tablesContainer > .table-wrapper {
            margin-top: 0;
        }

        /* Phone-width layout: everything becomes one table wide.
           table.cell-table-small normally sizes itself to fit two per
           row (see the rule above) — on a narrow screen that's cramped
           enough to be unreadable, so it drops to full width and
           #tablesContainer's flex-wrap naturally puts each on its own
           line instead. .cell-table (a table's own internal columns —
           see applyCellTableLayout above) is a row of flex columns
           side by side; stacking it to flex-direction: column instead
           makes a multi-column table (like the main weekly table)
           render as its columns one after another, full width, rather
           than several squeezed-together slivers. */
        @media (max-width: 640px) {
            table.cell-table-small {
                /* A percentage here would resolve against .table-wrapper,
                   which has no fixed width of its own (it shrinks to fit
                   this table — see .table-wrapper above), so "100%" ends
                   up ambiguous and the table renders narrower than the
                   row, leaving a gap on the right. Matching the base
                   `table` rule's own absolute viewport-based width avoids
                   that circularity — same sizing a normal (non-small)
                   table already gets, which is why those don't have this
                   problem. */
                width: 95vw;
                max-width: 950px;
            }
            .cell-table {
                flex-direction: column;
            }
        }

        .separator {
            color: #666;
            margin: 0 2px;
            font-size: 12px;
        }

        button.gray {
            background-color: #5B6472;
        }

        button.gray:hover {
            background-color: #464E5B;
        }

        /* --- Consistent button color semantics ---
           blue (default)  = text formatting
           green            = structural inserts (bullet/checkbox/table/review/summary)
           violet           = primary save action
           slate            = file/output ops (open/print)
           teal             = link launchers & dropdown menus
           amber            = view toggles (sidebar) */
        button.btn-structural {
            background-color: #2F9E68;
        }
        button.btn-structural:hover {
            background-color: #257C53;
        }
        button.btn-link {
            background-color: #0E7C86;
        }
        button.btn-link:hover {
            background-color: #0B646C;
        }
        button.btn-view {
            background-color: #D98324;
            color: #2b2f36;
        }
        button.btn-view:hover {
            background-color: #BE7010;
        }
        button.btn-save {
            background-color: #6D4AFF;
        }
        button.btn-save:hover {
            background-color: #5636D9;
        }

.cell-action-button {
    float: right;
    color: white;
    font-size: 12px;
    padding: 2px 5px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    margin-left: 5px;
}

.cell-action-button:hover {
    opacity: 0.9;
}

/* Editable cell titles (h3 text) — subtle affordance so it's
   discoverable as clickable without looking like an input box. */
.cell-title {
    outline: none;
    border-radius: 3px;
    padding: 0 2px;
    cursor: text;
}
.cell-title:hover {
    background-color: rgba(0, 0, 0, 0.05);
}
.cell-title:focus {
    background-color: rgba(0, 0, 0, 0.06);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
}

/* Per-cell collapse toggle — click to hide a cell's content down to
   just its title bar, freeing up its space. Cells for a 2-column
   table live in two independent vertical stacks (.cell-table >
   .cell-column, see applyCellTableLayout/getCellTableRows below)
   rather than sharing table-row height, so collapsing one cell lets
   the cells below it *in that same column* shift up to fill the gap
   — without touching the other column's width or vertical position. */
.cell-table {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 12px;
    width: 95vw;
    max-width: 950px;
    margin-top: 20px;
}
.cell-table > .cell-column {
    display: flex;
    flex-direction: column;
    flex: 1 1 0;
    min-width: 0;
    gap: 12px;
}
.cell-table > .cell-column > td {
    width: auto;
    margin-top: 0;
}
.cell-toggle {
    position: relative;
    z-index: 2;
    float: right;
    cursor: pointer;
    user-select: none;
    pointer-events: auto;
    font-size: 18px;
    line-height: 1;
    color: #999;
    padding: 4px 8px;
    border-radius: 4px;
}
.cell-toggle:hover {
    background-color: rgba(0, 0, 0, 0.08);
    color: #444;
}
.cell-height-toggle {
    position: relative;
    z-index: 2;
    float: right;
    cursor: pointer;
    user-select: none;
    pointer-events: auto;
    font-size: 15px;
    line-height: 1;
    color: #999;
    padding: 4px 7px;
    border-radius: 4px;
}
.cell-height-toggle:hover {
    background-color: rgba(0, 0, 0, 0.08);
    color: #444;
}
td.cell-collapsed .cell-scroll,
td.cell-collapsed .cell-action-button {
    /* Collapsing hides the whole scroll box (not just .outline-root
       inside it), or an empty fixed-height box would sit there. */
    display: none;
}
td.cell-full-height .cell-scroll {
    /* A manual drag-resize (the .cell-scroll corner handle) leaves an
       inline height on .cell-scroll — override that too, not just the
       CSS default, or the box keeps its old height with a scrollbar
       hidden behind an unrelated overflow setting. */
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    resize: none;
}

/* Add to your existing CSS */
.floating-btn-group {
    position: fixed;
    top: 50%;
    right: max(2.5vw, 20px);
    transform: translateY(-50%);
    display: flex;

}

.floating-btn {

#floating-bullet::before {

/* Animation for button feedback */

}

.floating-btn.clicked {

/* Floating "Add table" bar: bottom-center, replaces the old

.floating-add-bar {

/* Selection-triggered floating formatting toolbar (appears when you

/* Multi-select mode (Copy/Move/Delete across outline items). The

.outline-select-checkbox {

#selectModeToggle.active-toggle {

/* Floating bar shown while 1+ items are checked in select mode —

#bulkActionBar {

/* Wrapper for deletable tables (Add New Table / Review / Summary / Single) */
.table-wrapper {
    position: relative;
    /* No explicit width here — sizes to whatever its <table> child
       needs (full-width for a normal table, roughly half for a small
       one via table.cell-table-small), so that width, not this
       wrapper, is what determines whether it ends up alone on its own
       line or side by side with another small one (see #tablesContainer
       flex-wrap above). */
}

/* Shared look for the small icon buttons that float around each
   table/wrapper — drag handle, pop-out, size toggle, delete. Same
   size, corner radius, muted color, and hover treatment across all
   four so they read as one coherent control cluster instead of four
   separately-styled buttons. Each one only adds position (left/right)
   on top of this. */
.table-corner-btn {
    position: absolute;
    top: -10px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 20px;
    padding: 0;
    margin: 0;
    line-height: 1;
    background: none;
    border: none;
    border-radius: 5px;
    color: #9a9a9a;
    cursor: pointer;
    z-index: 5;
    transition: background-color .15s ease, color .15s ease;
}
.table-corner-btn:hover {
    color: #444;
    background: rgba(0, 0, 0, 0.06);
}
.table-corner-btn svg {
    width: 14px;
    height: 14px;
    pointer-events: none;
}

/* Delete stays visually calm (matches the rest of the cluster) until
   hovered, when it turns red — clear about what it does without
   shouting for attention the rest of the time. */
.table-delete-btn { right: 0; }
.table-delete-btn:hover {
    color: #c53030;
    background: rgba(197, 48, 48, 0.1);
}

/* Pop-out button: moves the actual table element (not a copy) into a
   full-screen overlay so edits happen on the same DOM node and are
   already "saved" back in place the moment the overlay closes. */

/* Size-toggle button: flips the table between full-width ("Single")

/* Per-item hover control (☰): appears next to a bullet-list item on
   hover, click reveals a small panel with per-item actions (e.g. Sub). */
.item-hover-icon {
    position: fixed;
    display: none;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background-color: rgba(0, 0, 0, 0.15);
    color: #444;
    font-size: 12px;

    cursor: pointer;
    z-index: 2500;
    user-select: none;
}

.item-hover-icon.show {
    display: flex;
}

.item-hover-icon:hover {
    background-color: rgba(0, 0, 0, 0.3);
}

.item-hover-panel {
    position: fixed;
    display: none;
    flex-direction: column;
    background: #222;
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    z-index: 2600;
}

.item-hover-panel.show {

}

.item-hover-panel button {

    padding: 5px 10px;

    color: #fff;
    font-size: 12px;

.item-hover-panel button:hover {

.item-hover-panel-divider {

    margin: 3px 2px;
}

.item-hover-panel button.active {
    background: #444;

}

/* Line-level "mark as complete" state, set via the ☰ hover panel.
   Mirrors Outliner's node.done styling: strikethrough + faded. */
.line-done {
    text-decoration: line-through;
    opacity: 0.55;
}

/* Collapse/expand toggle (▸/▾), shown left of the ☰ icon only when a
   line has deeper-indented lines following it (its "children"). */
.line-collapse-toggle {
    position: fixed;
    display: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background-color: rgba(0, 0, 0, 0.15);
    color: #444;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    z-index: 2500;
    user-select: none;
}
.line-collapse-toggle.show { display: flex; }
.line-collapse-toggle.has-children { display: flex; }
.line-collapse-toggle:hover { background-color: rgba(0, 0, 0, 0.3); }

/* Drag handle (⠿), shown left of the ☰ icon; drag it onto another
   line to reorder — mirrors Outliner's draggable bullet. */
.line-drag-handle {
    position: fixed;
    display: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 18px;
    border-radius: 3px;
    background-color: rgba(0, 0, 0, 0.15);
    color: #444;
    font-size: 11px;
    line-height: 1;
    cursor: grab;
    z-index: 2500;
    user-select: none;
}
.line-drag-handle.show { display: flex; }
.line-drag-handle:hover { background-color: rgba(0, 0, 0, 0.3); }
.line-drag-handle:active { cursor: grabbing; }

/* A line currently being dragged. */
.line-dragging { opacity: 0.4; }

/* Drop position indicator on the line being hovered over while dragging. */
.line-drop-before { box-shadow: inset 0 2px 0 0 #2d8cff; }
.line-drop-after { box-shadow: inset 0 -2px 0 0 #2d8cff; }

/* Children hidden by a collapsed parent line. */
.line-child-hidden { display: none !important; }

/* ===== Outline-style table (prototype): a real hierarchical node
   tree, same model Outliner uses, instead of WeekGoal's usual
   visual-indent contenteditable lines. Scoped to .outline-root so it
   never affects the other tables. ===== */
.outline-root {
    width: 100%;
    box-sizing: border-box;
    padding: 4px 2px 6px 0;
    font-family: inherit;
}
.outline-children {
    /* Old-style <ul> bullets use the browser's default "outside marker"
       positioning: the dot itself renders close to the list's own edge
       (roughly 4px in, from padding-left:20px minus the marker's own
       ~1em inset), while the text starts at the full 20px padding.
       Our bullet is a plain inline character rather than a CSS marker,
       so match that visually: keep the row itself close to flush and
       let .outline-bullet's own width push the text out to ~20px.
       Nested levels still need a real step-in to show hierarchy.
       Deliberately no explicit width here — width:auto already shrinks
       correctly to account for margin-left below, reaching the same
       right edge as everything else in the chain; forcing width:100%
       here would overflow past it by the margin amount instead. */
    margin-left: 20px;
}
.outline-children.outline-top {
    margin-left: 4px;
}
.outline-node-row {
    display: flex;
    width: 100%;
    box-sizing: border-box;
    align-items: flex-start;
    padding: 0px 2px 0px 0;
    border-radius: 3px;
}
/* body.pre-hover (removed on the page's first genuine mousemove — see
   the script near the bottom of the file) guards against a browser
   quirk where hovering the mouse's last-known (often top-left,
   effectively row 1) position gets spuriously applied to whatever
   ends up there right after the page finishes rendering, even though
   the mouse never actually moved — which looked like row 1 permanently
   "hovered" until you first touched the mouse. */
body:not(.pre-hover) .outline-node-row:hover,
.outline-node-row:focus-within {
    background: rgba(0, 0, 0, 0.04);
}
.outline-node.outline-dragging > .outline-node-row {
    opacity: 0.4;
}
.outline-bullet {
    flex: 0 0 18px;
    width: 18px;
    margin-top: 2px;
    text-align: center;
    color: #888;
    user-select: none; /* decorative — shouldn't be draggable into a
        text selection; without this, a drag that clips the next row's
        bullet on the way to your intended stopping point silently pulls
        that row in too, making it hard to land the selection exactly
        where you meant to stop. */
}
.outline-checkbox {
    margin: 3px 4px 0 0;
    flex: 0 0 auto;
    user-select: none;
}
.outline-text {
    flex: 1;
    min-height: 1.25em;
    line-height: 1.3;
    padding: 1px 4px;
    border-radius: 3px;
    outline: none;
}
.outline-text.done {
    text-decoration: line-through;
    opacity: 0.55;
}
.outline-text.bold {
    font-weight: bold;
}
.outline-drop-before { box-shadow: inset 0 2px 0 0 #2d8cff; }
.outline-drop-after { box-shadow: inset 0 -2px 0 0 #2d8cff; }
.outline-drop-child { background: rgba(45, 140, 255, 0.12); }

/* Toggle/drag/menu icons for the outline table are position:fixed
   overlays shown on hover (same trick the main table's ☰ icon uses),
   NOT inline flex children — that way they never reserve row space,
   so the bullet/text sit flush with the other tables' bullets even
   when the icons are hidden. */
.outline-toggle-fixed {
    position: fixed;
    display: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background-color: rgba(0, 0, 0, 0.15);
    color: #444;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    z-index: 2500;
    user-select: none;
}
.outline-toggle-fixed.show { display: flex; }
.outline-toggle-fixed:hover { background-color: rgba(0, 0, 0, 0.3); }

.outline-drag-fixed {
    position: fixed;
    display: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 18px;
    border-radius: 3px;
    background-color: rgba(0, 0, 0, 0.15);
    color: #444;
    font-size: 11px;
    line-height: 1;
    cursor: grab;
    z-index: 2500;
    user-select: none;
}
.outline-drag-fixed.show { display: flex; }
.outline-drag-fixed:hover { background-color: rgba(0, 0, 0, 0.3); }
.outline-drag-fixed:active { cursor: grabbing; }

/* One-click add/remove checkbox for the hovered item — shows a "+" to
   add one when there isn't one yet, or an "✕" to remove it when there
   is, always in the same spot so it's a predictable, muscle-memory
   click either way. Same position:fixed hover-icon pattern as the
   toggle/drag icons above. */
.outline-checkbox-toggle-fixed {
    position: fixed;
    display: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background-color: rgba(0, 0, 0, 0.15);
    color: #444;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    z-index: 2500;
    user-select: none;
}
.outline-checkbox-toggle-fixed.show { display: flex; }
.outline-checkbox-toggle-fixed:hover { background-color: rgba(0, 0, 0, 0.3); }
.outline-checkbox-toggle-fixed.remove-mode:hover { background-color: rgba(220, 53, 69, 0.7); color: #fff; }

/* Always-visible inline control-panel button — not a hover overlay
   (see the comment in renderNode for why: the fixed-position hover
   version was unreliable). Faint until hovered, like the drag/toggle
   icons, but present in the row's own flex layout at all times so
   there's no hover-timing dependency for it. */
.outline-menu-inline {
    flex: 0 0 18px;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    color: #bbb;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    /* Hidden until the row is interacted with — see the rules below.
       opacity (not display/visibility) keeps its 18px of layout space
       reserved at all times, so nothing else in the row shifts when it
       fades in/out. */
    opacity: 0;

<script>
    window.addEventListener("beforeunload", function(e) {
        e.preventDefault();
        e.returnValue = "";
    });

    let menu = null;
    let placeholder = null;

    function openWin(url) {
        window.open(url, "_blank", "width=600, height=600, toolbar=yes, location=yes, directories=no, status=no, menubar=yes, scrollbars=yes, resizable=no, copyhistory=yes");
    }

    function openWin3(url) {
        window.open(url, "_blank", "width=1100, height=700, screenX=200,screenY=80, toolbar=yes, location=yes, directories=no, status=no, menubar=yes, scrollbars=yes, resizable=no, copyhistory=yes");
    }

    function openWindow(url, width, height) {
        window.open(url, "_blank", `width=${width}, height=${height}, toolbar=yes, location=yes, directories=no, status=no, menubar=yes, scrollbars=yes, resizable=no, copyhistory=yes`);
    }

    function insertTimestamp() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const timestamp = `${hours}:${minutes} `;
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            range.deleteContents();
            range.insertNode(document.createTextNode(timestamp));
            range.collapse(false);
            selection.removeAllRanges();
            selection.addRange(range);
        }
    }

function printContent() {
    const pageTitle = document.getElementById('pageTitle').innerText.trim();
    const tables = document.querySelectorAll('#tablesContainer table');

    let maxColumns = 0;
    tables.forEach(table => {
        window.getCellTableRows(table).forEach(rowTds => {
            maxColumns = Math.max(maxColumns, rowTds.length);
        });
    });

    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
        <html>
        <head>
            <title>${pageTitle}</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                h2 { text-align: center; }
                table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                td { border: 1px solid #ccc; padding: 10px; vertical-align: top; width: ${100 / maxColumns}%; }
                /* Hide buttons in print output */
                .cell-action-button { display: none !important; }
                /* Style checkboxes for print */
                input[type="checkbox"] { 
                    -webkit-appearance: checkbox !important;
                    appearance: checkbox !important;
                    width: 13px;
                    height: 13px;
                }
                /* Hanging indent for checkbox lines, matching the editor */
                div:has(> input[type="checkbox"]) {
                    display: flex;
                    align-items: flex-start;
                }
                div:has(> input[type="checkbox"]) > input[type="checkbox"] {
                    flex: 0 0 auto;
                    margin-top: 4px;
                }
                /* Mirror the outline table's own row/bullet/checkbox/
                   indent layout (see .outline-node-row and friends in
                   the main stylesheet) so bullets and checkboxes line
                   up with their text the same way they do on-screen —
                   this print window has its own separate stylesheet
                   with no access to that CSS otherwise. */
                .outline-children { margin-left: 20px; }
                .outline-children.outline-top { margin-left: 4px; }
                .outline-node-row {
                    display: flex;
                    align-items: flex-start;
                    padding: 1px 0;
                }
                .outline-bullet {
                    flex: 0 0 18px;
                    width: 18px;
                    margin-top: 2px;
                    text-align: center;
                    color: #888;
                }
                .outline-checkbox {
                    margin: 3px 4px 0 0;
                    flex: 0 0 auto;
                }
                .outline-text {
                    flex: 1;
                    line-height: 1.3;
                    padding: 1px 4px;
                }
                .outline-text.done {
                    text-decoration: line-through;
                    opacity: 0.55;
                }
                .outline-text.bold {
                    font-weight: bold;
                }
            </style>
        </head>
        <body>
            <h2>${pageTitle}</h2>
    `);

    tables.forEach(table => {
        const rows = window.getCellTableRows(table);
        printWindow.document.write('<table>');
        rows.forEach(rowTds => {
            printWindow.document.write('<tr>');
            rowTds.forEach(cell => {
                // Clone the cell to modify it without affecting the original
                const cellClone = cell.cloneNode(true);
                // Remove all buttons, the collapse/height toggles, and
                // the per-item ☰ control icon from the cloned cell
                // (also means a collapsed cell always prints with its
                // full content, regardless of its on-screen collapsed
                // state)
                const buttons = cellClone.querySelectorAll(
                    '.cell-action-button, .cell-toggle, .cell-height-toggle, .outline-menu-inline, button'
                );
                buttons.forEach(button => button.remove());
                printWindow.document.write(`<td>${cellClone.innerHTML}</td>`);
            });
            printWindow.document.write('</tr>');
        });
        printWindow.document.write('</table>');
    });

    printWindow.document.write(`</body></html>`);
    printWindow.document.close();
    printWindow.print();
}

// A clean, read-only quick-view of the whole document — cards laid out
// in a wrapping grid rather than the editor's own table/column layout,
// so it reads well regardless of how many cells you have or how
// they're currently sized/collapsed on the main page. Every cell
// always shows in full here, regardless of its collapsed/full-height
// state in the editor. Checkboxes are shown exactly as checked/
// unchecked but aren't clickable — this view doesn't write anything
// back to the document.
//
// Built as an in-page overlay rather than window.open(...) — a
// separate floating popup window is a desktop-browser-only concept.
// Mobile Safari (iPhone/iPad) doesn't support it and would just open
// this as another full tab instead, exactly what the feature was meant
// to avoid. An overlay works identically on desktop and mobile, and
// still reads as a "popup" — dimmed backdrop, floating rounded panel,
// tap outside or ✕ to close.
function quickView() {
    const pageTitle = document.getElementById('pageTitle').innerText.trim();
    const tables = document.querySelectorAll('#tablesContainer table');

    const existing = document.getElementById('quickViewOverlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'quickViewOverlay';

    // Creates a table wrapped with a small delete (×) button so it can be
    // removed later. Used by all "Add ..." table functions below — the
    // original mainTable is never wrapped, so it can't be deleted.
    // Adds the collapse/expand (▾/▸) toggle to a cell's h3 header if it
    // doesn't already have one — shared by the six built-in cells (see
    // ensureAllCellToggles below), createDeletableTable's templates, and
    // buildCellElement (cloud project restore / import).
    window.ensureCellToggle = function (td) {

            e.preventDefault();
            e.stopPropagation();

            toggle.textContent = collapsed ? '▸' : '▾';
            if (window.refreshCollapseAllLabel) window.refreshCollapseAllLabel();
            if (window.scheduleCloudAutoSave) window.scheduleCloudAutoSave();
        });
        h3.insertBefore(toggle, h3.firstChild);
    };

    // Keeps the toolbar's "Collapse All" / "Expand All" button honest

    // tracked as its own separate on/off flag, so it stays correct even
    // after cells are collapsed/expanded individually (via their own ▾
    // toggle) rather than only through this button.
    window.refreshCollapseAllLabel = function () {
        const btn = document.getElementById('collapseAllToggle');
        if (!btn) return;

        const collapsedCount = document.querySelectorAll('#tablesContainer td.cell-collapsed').length;
        const allCollapsed = cells.length > 0 && collapsedCount === cells.length;
        btn.textContent = allCollapsed ? '⊞ Expand All' : '⊟ Collapse All';
        btn.title = allCollapsed ? 'Expand every cell in every table' : 'Collapse every cell in every table';
    };

    // Collapses every cell unless every cell is already collapsed, in
    // which case it expands every cell instead — one button, and it
    // always does the sensible thing regardless of any mixed state
    // left over from toggling cells individually.
    window.toggleAllTableCells = function () {
        const cells = document.querySelectorAll('#tablesContainer td');
        if (!cells.length) return;
        const collapsedCount = document.querySelectorAll('#tablesContainer td.cell-collapsed').length;
        const shouldCollapse = collapsedCount < cells.length;
        cells.forEach(function (td) {
            td.classList.toggle('cell-collapsed', shouldCollapse);
            const toggle = td.querySelector('.cell-toggle');
            if (toggle) toggle.textContent = shouldCollapse ? '▸' : '▾';

        if (window.scheduleCloudAutoSave) window.scheduleCloudAutoSave();
    };

    // Adds a second toggle (⤢/⤡) next to the collapse toggle, switching
    // a cell between its normal fixed height + internal scrollbar (the
    // long-standing default — good for keeping the page compact) and
    // "full content" mode, where the cell simply grows to fit
    // everything with no scrolling and no height limit.
    window.ensureCellHeightToggle = function (td) {
        const h3 = td.querySelector('h3');
        if (!h3 || h3.querySelector('.cell-height-toggle')) return;
        const toggle = document.createElement('span');
        toggle.className = 'cell-height-toggle';
        toggle.title = 'Show full content (no scrolling)';
        toggle.textContent = '⤢';
        toggle.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            const full = td.classList.toggle('cell-full-height');
            toggle.textContent = full ? '⤡' : '⤢';
            toggle.title = full ? 'Use a fixed height with scrolling' : 'Show full content (no scrolling)';
            // Also touch .cell-scroll's inline style directly rather
            // than relying on the class + CSS !important alone — a box
            // the user manually drag-resized (native `resize: vertical`
            // on .cell-scroll) carries an inline height, and this
            // guarantees the toggle always wins over it rather than
            // depending on cascade specificity.
            const scrollBox = td.querySelector('.cell-scroll');

                    scrollBox.style.maxHeight = 'none';

                    scrollBox.style.maxHeight = '';

    // Regroups a 2-column table's <tr><td> markup (built/stored in the
    // normal row-major order — see getCellTableRows for the reverse
    // direction) into two independent vertical <tr class="cell-column">
    // stacks side by side, marked .cell-table (CSS makes both display:
    // flex — see the .cell-table/.cell-column rules). A 1-column table
    // is left alone: with only one cell per row there's no shared-row-
    // height coupling to begin with, so nothing needs regrouping.
    // Idempotent — safe to call more than once on the same table.
    window.applyCellTableLayout = function (table) {
        if (!table || table.classList.contains('cell-table')) return;
        // table.rows (not table.children) — browsers silently insert an
        // invisible <tbody> between <table> and <tr> for markup that
        // came from raw HTML (the page's own hardcoded tables, or any
        // table built via innerHTML=... like createDeletableTable),
        // which would make the <tr>s not direct children anymore.
        // .rows finds them either way.
        const rows = Array.from(table.rows);
        const colCount = rows.length ? rows[0].children.length : 0;
        if (colCount < 2) return;
        const grid = rows.map(function (tr) { return Array.from(tr.children); });
        table.innerHTML = '';
        table.classList.add('cell-table');
        for (let col = 0; col < colCount; col++) {
            const colTr = document.createElement('tr');
            colTr.className = 'cell-column';
            grid.forEach(function (rowCells) {
                if (rowCells[col]) colTr.appendChild(rowCells[col]);
            });
            table.appendChild(colTr);
        }
    };

    // The inverse read: given a table that may or may not have been
    // regrouped by applyCellTableLayout, returns its cells as a plain
    // row-major 2D array (same shape either way) — used by
    // serializeTablesContainer and printContent so neither needs to
    // care whether the live DOM is row-grouped or column-grouped.
    window.getCellTableRows = function (table) {
        const trs = Array.from(table.rows);
        if (!table.classList.contains('cell-table')) {
            return trs.map(function (tr) { return Array.from(tr.children); });
        }
        const colCount = trs.length;
        const rowCount = trs.reduce(function (max, tr) { return Math.max(max, tr.children.length); }, 0);
        const rows = [];
        for (let r = 0; r < rowCount; r++) {
            const row = [];
            for (let c = 0; c < colCount; c++) {
                const cell = trs[c].children[r];
                if (cell) row.push(cell);
            }
            rows.push(row);
        }
        return rows;
    };

    function ensureAllCellToggles() {

    // Holds a comment node marking exactly where the popped-out
    // element came from, so closing puts it back in the same spot
    // (same position among siblings) rather than at the end.
    let popoutPlaceholder = null;

    function openTablePopout(el) {
        const overlay = document.getElementById('tablePopoutOverlay');
        const body = document.getElementById('tablePopoutBody');
        if (!overlay || !body || !el) return;
        // If something is already popped out (shouldn't normally
        // happen), put it back first rather than stacking.
        if (body.firstElementChild) closeTablePopout();

        popoutPlaceholder = document.createComment('table-popout-placeholder');
        el.parentNode.insertBefore(popoutPlaceholder, el);
        body.appendChild(el);
        el.classList.add('table-popped-out');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    window.closeTablePopout = function () {
        const overlay = document.getElementById('tablePopoutOverlay');
        const body = document.getElementById('tablePopoutBody');
        if (!overlay || !body) return;
        const el = body.firstElementChild;
        if (el) {
            el.classList.remove('table-popped-out');
            if (popoutPlaceholder && popoutPlaceholder.parentNode) {
                popoutPlaceholder.parentNode.insertBefore(el, popoutPlaceholder);
                popoutPlaceholder.remove();
            } else {
                document.getElementById('tablesContainer').appendChild(el);
            }
        }
        popoutPlaceholder = null;
        overlay.classList.remove('active');
        document.body.style.overflow = '';
        if (window.scheduleCloudAutoSave) window.scheduleCloudAutoSave();
    }

    document.getElementById('tablePopoutOverlay').addEventListener('click', function (e) {
        if (e.target === this) window.closeTablePopout();
    });

            window.closeTablePopout();
        }
    });

    // --- Drag-and-drop reordering of top-level tables/cells ---
    let draggedTableBlock = null;
    function initTableReorder() {
        const container = document.getElementById('tablesContainer');
        if (!container) return;

        function reorderableBlocks() {
            return Array.from(container.children).filter(function (el) {
                return (el.tagName === 'TABLE' || el.classList.contains('table-wrapper')) && el !== draggedTableBlock;
            });
        }

        // Layout wraps small cells two-per-row and normal tables one
        // per row (see #tablesContainer flex-wrap), so simple "am I
        // above/below this one" logic isn't enough — instead, find
        // whichever block's own center the cursor is nearest to, and
        // insert before/after it depending on which side of that
        // center point the cursor is on.
        function findDropTarget(x, y) {
            let best = null, bestDist = Infinity;
            reorderableBlocks().forEach(function (el) {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = (x - cx) * (x - cx) + (y - cy) * (y - cy);
                if (dist < bestDist) {
                    bestDist = dist;
                    best = { el: el, before: (y < cy) || (y === cy && x < cx) };
                }
            });
            return best;
        }

        container.addEventListener('dragover', function (e) {
            if (!draggedTableBlock) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            document.querySelectorAll('.table-drop-target').forEach(function (t) { t.classList.remove('table-drop-target'); });
            const target = findDropTarget(e.clientX, e.clientY);
            if (target) target.el.classList.add('table-drop-target');
        });

        container.addEventListener('drop', function (e) {
            if (!draggedTableBlock) return;
            e.preventDefault();
            const target = findDropTarget(e.clientX, e.clientY);
            document.querySelectorAll('.table-drop-target').forEach(function (t) { t.classList.remove('table-drop-target'); });
            if (target) {
                if (target.before) container.insertBefore(draggedTableBlock, target.el);
                else container.insertBefore(draggedTableBlock, target.el.nextSibling);
            } else {
                container.appendChild(draggedTableBlock);
            }
            // serializeTablesContainer already reads tables in DOM
            // order, so simply having moved the element is enough —
            // no separate "order" field to update.
            if (window.scheduleCloudAutoSave) window.scheduleCloudAutoSave();
        });
    }

    function createDeletableTable(rowsHtml, small, toTop) {
        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';

        const newTable = document.createElement('table');
        if (small) newTable.classList.add('cell-table-small');
        newTable.innerHTML = rowsHtml;

        const delBtn = document.createElement('button');
        delBtn.className = 'table-delete-btn table-corner-btn';
        delBtn.title = 'Delete this table';
        delBtn.innerHTML = window.TABLE_TRASH_ICON_SVG;
        delBtn.onclick = function () {
            if (confirm('Delete this table? This cannot be undone.')) {
                wrapper.remove();
                if (window.scheduleCloudAutoSave) window.scheduleCloudAutoSave();
            }
        };

        wrapper.appendChild(newTable);
        wrapper.appendChild(delBtn);
        const tablesContainerEl = document.getElementById('tablesContainer');
        if (toTop) {
            tablesContainerEl.insertBefore(wrapper, tablesContainerEl.firstChild);
        } else {
            tablesContainerEl.appendChild(wrapper);
        }

        // These cells use the same tree-based outline table as the six
        // built-in ones. DOMContentLoaded already fired long before this
        // table exists, so its .outline-root elements need initializing
        // by hand here instead of relying on that startup listener.
        newTable.querySelectorAll('.outline-root').forEach(function (el) {
            window.initOutlineTable(el, '');
        });
        newTable.querySelectorAll('td').forEach(window.ensureCellToggle);
        newTable.querySelectorAll('td').forEach(window.ensureCellHeightToggle);
        window.applyCellTableLayout(newTable);
        window.ensureTableDragHandle(wrapper);
        window.ensureTablePopoutButton(wrapper);
        window.ensureTableSizeToggleBtn(wrapper);

        // Scroll to the new table and drop the cursor into its first
        // cell, so you can start typing immediately instead of
        // scrolling down and clicking in by hand.
        wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const firstField = newTable.querySelector('.outline-text');
        if (firstField) {
            setTimeout(function () {
                firstField.focus();
                const range = document.createRange();
                range.selectNodeContents(firstField);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }, 300);
        }

        return wrapper;
    }

    function addNewTable() {
        createDeletableTable(`
            <tr>
                <td>
                    <h3><span class="cell-title" contenteditable="true">NewGoal</span></h3>
                    <div class="cell-scroll"><div class="outline-root"></div></div>
                </td>
                <td>

    async function saveFile() {
        try {
            const defaultTitle = document.getElementById('pageTitle').innerText.trim() || 'Untitled';
            const options = {
                suggestedName: `${defaultTitle}.html`,
                types: [
                    {
                        description: 'HTML Files',
                        accept: {
                            'text/html': ['.html'],
                        },
                    },
                ],
            };

            const fileHandle = await window.showSaveFilePicker(options);
            const writableStream = await fileHandle.createWritable();
            await writableStream.write(document.documentElement.outerHTML);
            await writableStream.close();
            console.log('File saved successfully.');
        } catch (error) {
            console.error('Error saving file:', error);
        }
    }

    async function openFile() {
        try {
            const [fileHandle] = await window.showOpenFilePicker({
                types: [
                    {
                        description: 'HTML Files',
                        accept: {
                            'text/html': ['.html'],
                        },
                    },
                ],
            });

            const file = await fileHandle.getFile();
            // IMPORTANT: don't load the content via innerHTML — browsers
            // never execute <script> tags inserted that way, which is why
            // the item hover panel, selection toolbar, and color pickers
            // (all built by JS at page load) used to disappear after
            // Save → Open. Navigating to the file's actual bytes via a
            // blob URL triggers a real page load instead, so every script
            // runs again exactly as if the file had been opened fresh.
            const url = URL.createObjectURL(file);
            window.location.href = url;
            console.log('File opened successfully.');
        } catch (error) {
            console.error('Error opening file:', error);
        }
    }

    function insertBulletPoint() {
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            const startEl = range.startContainer.nodeType === Node.TEXT_NODE
                ? range.startContainer.parentElement : range.startContainer;
            // The outline table's fields hold plain text managed by its
            // own tree model — inserting a raw <ul>/<li> into one (the
            // old behavior below) corrupts that model instead of adding
            // a bullet. Delegate to the tree's own "new line" operation.
            const outlineField = startEl && startEl.closest && startEl.closest('.outline-text');
            if (outlineField && window.outlineInsertBulletAtCursor && window.outlineInsertBulletAtCursor(outlineField)) {
                return;
            }
            const parentBlock = range.startContainer.parentElement;
            const editor = parentBlock.closest('[contenteditable="true"]');
            if (!editor) return;
            let ul = parentBlock.closest('ul');
            if (!ul || parentBlock === editor) {
                ul = document.createElement('ul');
                ul.classList.add('custom-bullet-list');
                range.insertNode(ul);
            }
            const li = document.createElement('li');
            li.appendChild(document.createTextNode('\u200B'));
            ul.appendChild(li);
            const newRange = document.createRange();
            newRange.setStart(li, 0);
            newRange.setEnd(li, 0);
            selection.removeAllRanges();
            selection.addRange(newRange);
        }
    }

    // Indent step used by Sub/Outdent (Tab / Shift+Tab / hover panel).
    // Uses 'ch' units (~1 character width) instead of the browser's
    // default execCommand('indent'), which jumps ~40px per level.
    const INDENT_STEP_CH = 3;

    // Finds the actual editable "line" element containing `node` — a
    // bullet <li>, or a div/p that holds real line content (not a
    // wrapper around a <ul>/<ol>/table/nested div). Climbs ancestor by
    // ancestor checking each one, rather than assuming the line always
    // sits exactly one level below the editable root: some lines (e.g.
    // a checkbox line converted from a bullet item) end up nested two
    // levels deep, inside the wrapper div that also holds the cell's
    // <ul class="custom-bullet-list">. Assuming a fixed depth there
    // used to return that wrapper div itself, so indenting it shifted
    // everything inside it — looking like the whole cell/document
    // indented.
    function isLineCandidateEl(el) {
        if (!el || el.nodeType !== 1) return false;
        const tag = el.tagName;
        if (tag === 'LI') return true;
        if (tag === 'DIV' || tag === 'P') {
            for (const child of el.children) {
                if (['UL', 'OL', 'TABLE', 'DIV'].includes(child.tagName)) return false;
            }
            return true;
        }
        return false;
    }

    function getLineElement(node) {
        if (!node) return null;
        if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
        // Same exclusion as isTargetLine() above: the outline table has
        // its own separate tree-based system and must never be touched
        // by this older flat-line logic (Tab, indent, etc.) — otherwise
        // both systems can fire on the same keystroke, since preventDefault()
        // in the outline table's own keydown handler stops the browser's
        // default action but does not stop the event from also bubbling
        // up to this document-level handler.
        if (node.closest && node.closest('.outline-root')) return null;
        const editable = node.closest && node.closest('[contenteditable="true"]');
        if (!editable || node === editable) return null;
        let cur = node;
        while (cur && cur !== editable) {
            if (isLineCandidateEl(cur)) return cur;
            cur = cur.parentElement;
        }
        return null;
    }

    function currentIndentCh(line) {
        const match = /^(-?\d*\.?\d+)ch$/.exec(line.style.marginLeft || '');
        return match ? parseFloat(match[1]) : 0;
    }

    function adjustLineIndent(line, deltaSteps) {
        if (!line) return;
        const next = Math.max(0, currentIndentCh(line) + deltaSteps * INDENT_STEP_CH);
        line.style.marginLeft = next ? next + 'ch' : '';
    }

    function insertSubBullet() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const line = getLineElement(sel.getRangeAt(0).startContainer);
        adjustLineIndent(line, 1);
    }

    function outdentCurrentLine() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const line = getLineElement(sel.getRangeAt(0).startContainer);
        adjustLineIndent(line, -1);
    }

    function insertCheckbox() {
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.style.marginRight = '5px';
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            const startEl = range.startContainer.nodeType === Node.TEXT_NODE
                ? range.startContainer.parentElement : range.startContainer;
            // Same reasoning as insertBulletPoint above: a plain-text
            // outline field can't hold a raw <input> inserted mid-text
            // without corrupting the tree model, so turn the whole line
            // into a checkbox line instead (same as the ☰ panel option).
            const outlineField = startEl && startEl.closest && startEl.closest('.outline-text');
            if (outlineField && window.outlineToggleCheckboxAtCursor && window.outlineToggleCheckboxAtCursor(outlineField)) {
                return;
            }
            range.deleteContents();
            const parentBlock = range.startContainer.parentElement;
            const editor = parentBlock.closest('[contenteditable="true"]');
            if (!editor || parentBlock === editor) {
                const newLine = document.createElement('div');
                newLine.appendChild(checkbox);
                newLine.appendChild(document.createTextNode(' '));
                range.insertNode(newLine);
            } else {
                range.insertNode(document.createTextNode(' '));
                range.insertNode(checkbox);
            }
            const newRange = document.createRange();
            newRange.setStartAfter(checkbox);
            newRange.setEndAfter(checkbox);
            selection.removeAllRanges();
            selection.addRange(newRange);
        }
    }

    function insertChecklist() {
        const list = document.createElement('ul');
        list.style.listStyleType = 'none';
        list.style.padding = '0';
        const labels = [' ', ' ', ' '];
        let firstCheckbox = null;
        labels.forEach((label, index) => {
            const listItem = document.createElement('li');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            if (index === 0) {
                firstCheckbox = checkbox;
            }
            listItem.appendChild(checkbox);
            listItem.appendChild(document.createTextNode(' ' + label));
            list.appendChild(listItem);
        });
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            range.deleteContents();
            const container = document.createElement('div');
            container.appendChild(list);
            range.insertNode(container);
            if (firstCheckbox) {
                const newRange = document.createRange();
                newRange.setStartAfter(firstCheckbox);
                newRange.setEndAfter(firstCheckbox);
                selection.removeAllRanges();
                selection.addRange(newRange);
            }
        }
    }

    // serializeTablesContainer/rebuildTablesContainer) rather than being
