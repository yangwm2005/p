    // The Think Log — a simple, built-in per-project running log of
    // timestamped entries. Stored as window.__thinkLogEntries (an array
    // of {id, ts, text}), read/written by serializeTablesContainer/
    // rebuildTablesContainer the same way everything else on the page
    // is, so switching projects swaps the whole log along with it.
    window.__thinkLogEntries = [];

    function renderThinkLogEntries() {

        const container = document.getElementById('think-log-entries');
        if (!container) return;
        container.innerHTML = '';
        if (window.__thinkLogEntries.length === 0) {
            container.innerHTML = '<div id="think-log-empty">No entries yet — jot down a thought below.</div>';
            return;
        }
        // Newest first, easiest to scan when you're adding to it often.
        window.__thinkLogEntries.slice().reverse().forEach(function (entry) {
            const row = document.createElement('div');
            row.className = 'think-log-entry';
            const del = document.createElement('span');
            del.className = 'think-log-entry-delete';
            del.textContent = '✕';
            del.title = 'Delete this entry';
            del.addEventListener('click', function () { deleteThinkLogEntry(entry.id); });
            row.appendChild(del);
            const time = document.createElement('span');
            time.className = 'think-log-entry-time';
            time.textContent = new Date(entry.ts).toLocaleString();
            row.appendChild(time);
            const text = document.createElement('div');
            text.className = 'think-log-entry-text';
            text.textContent = entry.text;
            row.appendChild(text);
            container.appendChild(row);
        });
    }
    // Exposed on window (this <script> block ends above the cloud/
    // project one, which calls this from rebuildTablesContainer when
    // switching projects) — plain function declarations don't cross
    // that boundary on their own.
    window.renderThinkLogEntries = renderThinkLogEntries;

    window.addThinkLogEntry = function () {
        const input = document.getElementById('think-log-input');
        const text = (input.value || '').trim();
        if (!text) return;
        window.__thinkLogEntries.push({ id: 'tl' + Date.now() + Math.random().toString(36).slice(2, 6), ts: Date.now(), text: text });
        input.value = '';
        // Clearing .value alone doesn't reliably reset where the browser
        // thinks the cursor/scroll position is — on some browsers the
        // next thing you type starts appearing partway down the box
        // (wherever the old, now-gone text used to end) instead of at
        // the top. Explicitly put both back to the very start.
        input.setSelectionRange(0, 0);
        input.scrollTop = 0;
        input.focus();
        renderThinkLogEntries();
        if (window.scheduleCloudAutoSave) window.scheduleCloudAutoSave();
        // Safety net: on some mobile browsers, the Enter/Return keypress
        // that triggered this can still insert its newline right after
        // this function runs (a timing quirk the keydown/beforeinput
        // handlers don't always fully prevent), which would otherwise
        // leave the cursor sitting on that phantom second line. Wipe it
        // right back out and re-pin the cursor to the top once more,
        // after the browser's own handling of that keypress has settled.
        setTimeout(function () {
            if (/^[\r\n]+$/.test(input.value)) {
                input.value = '';
                input.setSelectionRange(0, 0);
                input.scrollTop = 0;
            }
        }, 0);
    };

    window.deleteThinkLogEntry = function (id) {
        window.__thinkLogEntries = window.__thinkLogEntries.filter(function (e) { return e.id !== id; });
        renderThinkLogEntries();
        if (window.scheduleCloudAutoSave) window.scheduleCloudAutoSave();
    };

    document.addEventListener('DOMContentLoaded', function () {
        renderThinkLogEntries();
        const input = document.getElementById('think-log-input');
        if (input) {
            // 'keydown' + preventDefault is the usual way to stop Enter
            // from inserting a newline, but on some mobile browsers the
            // virtual keyboard's Return key doesn't fully honor that,
            // and the newline slips in anyway — landing the cursor on a
            // second, blank line instead of back at the top. 'beforeinput'
            // with inputType 'insertLineBreak' is the more reliable,
            // mobile-safe way to catch and cancel that same keypress
            // before any newline is actually inserted into the field.
            // addThinkLogEntry() clears the field immediately, so even
            // if both handlers somehow fire for one Enter press, the
            // second call just sees an empty field and no-ops — no risk
            // of double-adding the entry.
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    window.addThinkLogEntry();
                }
            });
            input.addEventListener('beforeinput', function (e) {
                if (e.inputType === 'insertLineBreak') {
                    e.preventDefault();
                    window.addThinkLogEntry();
                }
            });
        }
    });

    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById('sidebar');
        const sidebarButton = document.querySelector('button[onclick="toggleSidebar()"]');

    // Old Copy/Paste pulldown menu removed — it was redundant with (and
    // visually conflicted with) the floating selection toolbar above,
    // which already has its own working Copy behavior (native browser
    // copy still works with Ctrl/Cmd+C on any selection) and Paste
    // (native Ctrl/Cmd+V).

    function isCursorAtBeginningOfLine() {
        const selection = window.getSelection();
        if (!selection.rangeCount) return false;
        const range = selection.getRangeAt(0);
        if (!range.collapsed) return false;
        if (range.startContainer.nodeType === Node.TEXT_NODE && range.startOffset === 0) return true;
        if (range.startOffset === 0) {
            const node = range.startContainer;
            const parentBlock = node.parentElement;
            if (parentBlock.getAttribute('contenteditable') === 'true' && 
                (parentBlock.firstChild === node || node.previousSibling === null)) {
                return true;
            }
            if (node.nodeType === Node.ELEMENT_NODE && 
                (node.tagName === 'DIV' || node.tagName === 'P')) {
                return true;
            }
        }
        return false;
    }

    document.addEventListener("keydown", function (event) {
        // Skip entirely inside the outline table — it has its own
        // Enter/Tab/etc. handling and this "/" slash-menu is designed
        // for the old flat-line model, not the tree structure.
        if (event.target && event.target.closest && event.target.closest('.outline-root')) return;
        if (event.key === "/" && isCursorAtBeginningOfLine()) {
            event.preventDefault();
            if (placeholder) removePlaceholder();
            if (menu) menu.remove();
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            placeholder = insertPlaceholder(range);
            showMenu(range.startContainer.parentElement, range);
        }
    });

    function insertPlaceholder(range) {
        const span = document.createElement("span");
        span.textContent = "/";
        span.style.color = "black";
        span.classList.add("slash-placeholder");
        range.insertNode(span);
        return span;
    }

    function showMenu(target, range) {
        menu = document.createElement("div");
        menu.classList.add("options-menu");
        menu.innerHTML = `
            <button onclick="applyOption('bullet')">• Bullet List</button>
            <button onclick="applyOption('checkbox')">☑ Checklist</button>
            <button onclick="applyOption('number')">1. Number List</button>
            <button onclick="applyOption('hr')">— Horizontal Line</button>
        `;
        document.body.appendChild(menu);
        const rect = target.getBoundingClientRect();
        menu.style.left = `${rect.left}px`;
        menu.style.top = `${rect.top + window.scrollY + 25}px`;
        requestAnimationFrame(() => {
            menu.style.opacity = "1";
            menu.style.transform = "scale(1)";
        });
        document.addEventListener("click", closeMenuOnClickOutside, true);
    }

    function closeMenuOnClickOutside(event) {
        if (menu && !menu.contains(event.target)) {
            cleanupMenu();
        }
    }

    function cleanupMenu() {
        if (menu) {
            menu.remove();
            menu = null;
        }
        removePlaceholder();
        document.removeEventListener("click", closeMenuOnClickOutside, true);
    }

    function removePlaceholder() {
        if (placeholder) {
            placeholder.remove();
            placeholder = null;
        }
    }

    window.applyOption = function(option) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        const range = selection.getRangeAt(0);
        range.deleteContents();
        switch(option) {
            case "bullet":
                insertBulletPoint();
                break;
            case "number":
                document.execCommand("insertOrderedList");
                break;
            case "checkbox":
                insertCheckbox();
                break;
            case "hr":
                document.execCommand("insertHorizontalRule");
                break;
        }
        cleanupMenu();
    };

    // Cell titles (h3 text) are their own small contenteditable, isolated
    // from the older bullet/checkbox/slash-menu keydown handlers below
    // (which assume they're editing outline content, not a one-line
    // title) — captured before those handlers ever see the keystroke.
    document.addEventListener('keydown', function (e) {
        if (e.target && e.target.classList && e.target.classList.contains('cell-title')) {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.target.blur();
            }
            e.stopPropagation();

    }, true);

    // Swaps the single shared iframe inside the "Quick ▾" dropdown
    // between the Q-Desk / Class / Inbox panels (see the toolbar
    // markup above). Doesn't need DOMContentLoaded — it only runs
    // later, from a click on one of the tab buttons.
    window.showQuickPanel = function (url) {
        const frame = document.getElementById('quickPanelFrame');
        if (frame) frame.src = url;
    };

    document.addEventListener('DOMContentLoaded', function() {
        // The top toolbar's middle strip (#toolbarScroll) scrolls
        // horizontally so the whole bar stays on one line. That
        // requires overflow-x:auto, which — per CSS's overflow-x/
        // overflow-y coupling rule — also clips absolutely-positioned
        // dropdown-content panels vertically. Fix: as soon as a panel
        // gets its "show" class (however it was toggled — the
        // .dropdown-toggle handler below, or the separate
        // toggleExportMenu/toggleProjectsMenu functions), switch it to
        // position:fixed anchored under its own toggle button.
        // position:fixed escapes the scroll container's clipping, so
        // the panel renders in front of the page instead of being cut
        // off — same visual spot as before, just no longer clipped.
        function positionDropdownPanel(panel) {
            const anchor = panel.parentElement;
            if (!anchor) return;
            const rect = anchor.getBoundingClientRect();
            panel.style.position = 'fixed';
            panel.style.top = rect.bottom + 2 + 'px';
            panel.style.left = rect.left + 'px';
            panel.style.marginTop = '0';
            // Keep it from running off the right edge of the screen.
            requestAnimationFrame(function () {
                const panelRect = panel.getBoundingClientRect();
                const overflowRight = panelRect.right - window.innerWidth;
                if (overflowRight > 0) {
                    panel.style.left = Math.max(4, rect.left - overflowRight - 4) + 'px';
                }
            });
        }
        document.querySelectorAll('.dropdown-content').forEach(function (panel) {
            new MutationObserver(function () {
                if (panel.classList.contains('show')) positionDropdownPanel(panel);
            }).observe(panel, { attributes: true, attributeFilter: ['class'] });
        });

        const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
        dropdownToggles.forEach(toggle => {
            toggle.addEventListener('click', function(event) {
                event.stopPropagation();
                const dropdown = this.parentElement;

function insertCheckboxInCell(button) {
    // Find the parent cell
    const cell = button.closest('td');

    // If this cell has been converted to the outline table (tree-based
    // model), appending a raw checkbox <div> below (the old behavior)
    // would land outside the tree entirely, invisible to it and lost
    // on the next render. Append a proper checkbox node to the tree
    // instead — same as the ☰ panel's own checkbox option.
    const outlineRoot = cell.querySelector('.outline-root');
    if (outlineRoot && window.outlineAppendCheckboxNode) {
        window.outlineAppendCheckboxNode(outlineRoot.id);
        return;
    }

    // Create a new line with checkbox
    const newLine = document.createElement('div');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.style.marginRight = '5px';
    
    // Add some space after the checkbox
    const space = document.createTextNode(' ');
    
    // Create a zero-width space to position cursor
    const zeroWidthSpace = document.createTextNode('\u200B');
    
    newLine.appendChild(checkbox);
    newLine.appendChild(space);
    newLine.appendChild(zeroWidthSpace);
    
    // Append to the cell
    cell.appendChild(newLine);
    
    // Set focus to the new line
    const range = document.createRange();
    range.setStart(zeroWidthSpace, 0);
    range.setEnd(zeroWidthSpace, 0);
    
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    
    // Scroll to the new checkbox if needed
    newLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.addEventListener('keydown', function(event) {
    // Skip entirely inside the outline table — its own Enter handler
    // (handleNodeKeydown) already manages line creation via the tree
    // model. Without this guard, this older handler would also fire on
    // every Enter keypress there (it unconditionally calls preventDefault
    // and, in its fallback branch, execCommand('insertParagraph')),
    // doubling up with the tree-based line creation and corrupting the
    // node's contenteditable content.
    if (event.target && event.target.closest && event.target.closest('.outline-root')) return;
    // Check if Enter key was pressed
    if (event.key === 'Enter') {
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        
        const range = selection.getRangeAt(0);
        const container = range.startContainer;
        
        // Find the current line element (could be div, p, li, etc.)
        let currentLine = container;
        while (currentLine && currentLine.nodeType === Node.TEXT_NODE) {
            currentLine = currentLine.parentNode;
        }
        
        if (!currentLine) return;
        
        // Check if current line has a checkbox
        const hasCheckbox = currentLine.querySelector('input[type="checkbox"]');
        
        // Check if current line starts with a bullet
        const hasBullet = currentLine.textContent.trim().startsWith('•') || 
                         currentLine.querySelector('span[style*="margin-right: 5px"]');
        
        // Prevent default Enter behavior
        event.preventDefault();
        
        // Create new line based on current line type
        if (hasCheckbox) {
            insertNewCheckboxLine(currentLine);
        } else if (hasBullet) {
            insertNewBulletLine(currentLine);
        } else {
            // Default behavior - just insert a new line
            document.execCommand('insertParagraph', false);
        }
    }
});

function insertNewCheckboxLine(currentLine) {
    const newLine = document.createElement('div');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.style.marginRight = '5px';
    
    // Add some space after the checkbox
    const space = document.createTextNode(' ');
    
    newLine.appendChild(checkbox);
    newLine.appendChild(space);
    
    // Insert after current line
    currentLine.parentNode.insertBefore(newLine, currentLine.nextSibling);
    
    // Set focus to the new line
    const range = document.createRange();
    range.setStart(space, 1);
    range.collapse(true);
    
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
}

        // whole toolbar (buttons, mouseup listener, everything). That's
        // why selecting text only ever showed the Copy/Paste menu.
        document.addEventListener('DOMContentLoaded', function () {
            const selToolbar = document.getElementById('selection-toolbar');
            if (!selToolbar) return;

            function getEditableAncestor(node) {
                if (!node) return null;
                const el = node.nodeType === 1 ? node : node.parentElement;
                if (!el) return null;

                // too (see the .outline-text 'input' handler, which
                // sanitizes and preserves Bold/Italic/Underline/Strike/
                // color spans instead of stripping them back to plain

                // available separately via the ☰ panel for formatting an
                // entire line at once.
                return el.closest('[contenteditable="true"]');
            }

            // outline node (if the selection was inside one) picks up the
            // change — its own 'input' listener does the actual

            function commitOutlineChange() {

            // unwrapping) the selected Range in the appropriate tag,
            // rather than delegating to the browser's built-in command.
            const TAG_FOR_CMD = { bold: 'B', italic: 'I', underline: 'U', strikethrough: 'S' };
            window.applySelectionFormat = function (cmd) {
                const tag = TAG_FOR_CMD[cmd];
                if (!tag) return;
                const sel = window.getSelection();
                if (!sel || !sel.rangeCount || sel.isCollapsed) return;
                const range = sel.getRangeAt(0);
                const startEl = range.startContainer.nodeType === 1

                const field = startEl && startEl.closest('[contenteditable="true"]');

                // Whether the WHOLE selection is already this format —
                // checked against every text node the range actually
                // touches, not just where the selection starts. A plain
                // "does the selection's start sit inside a <b>?" check
                // (the old approach) gets this wrong whenever a drag- or
                // double-click-select lands exactly on the tag element's
                // own boundary rather than inside its text — which is
                // the common case when selecting an entire bold word/
                // phrase — silently double-wrapping it instead of
                // unbolding it.
                function isEntireSelectionTagged() {
                    if (!field) return false;
                    const walker = document.createTreeWalker(field, NodeFilter.SHOW_TEXT);
                    let node, touchedAny = false, allTagged = true;
                    while ((node = walker.nextNode())) {
                        if (!node.textContent || !range.intersectsNode(node)) continue;
                        if (node === range.startContainer && node === range.endContainer &&
                            range.startOffset === range.endOffset) continue; // zero-length touch at a boundary
                        touchedAny = true;

                            anc = anc.parentNode;

                    return touchedAny && allTagged;
                }
                const isActive = isEntireSelectionTagged();

                const extracted = range.extractContents();
                let firstNode, lastNode;
                if (isActive) {

                    // inside the selection instead of adding it again.
                    const walker = document.createTreeWalker(extracted, NodeFilter.SHOW_ELEMENT);
                    const toUnwrap = [];
                    let n;
                    while ((n = walker.nextNode())) { if (n.tagName === tag) toUnwrap.push(n); }
                    toUnwrap.forEach(function (elx) {
                        const parent = elx.parentNode;
                        while (elx.firstChild) parent.insertBefore(elx.firstChild, elx);
                        parent.removeChild(elx);
                    });

                    // extractContents() only pulls the SELECTED portion
                    // out — if the selection started/ended exactly at a
                    // tag element's edge (rather than around the whole
                    // element), part of that tag element survives in the
                    // document and the collapsed range point lands right
                    // inside it. Reinserting the now tag-free content
                    // there would just get it silently swallowed back
                    // in. Split any such surviving tag ancestor into its
                    // before/after halves so the insertion point ends up
                    // OUTSIDE the tag, same as if the browser's own bold
                    // command had done the split.

                            el = el.parentElement;

                        if (!target) break;

                        const originalNextSibling = target.nextSibling;
                        const parent = target.parentNode;
                        const afterRange = document.createRange();
                        afterRange.setStart(container, offset);
                        afterRange.setEnd(target, target.childNodes.length);
                        const afterFrag = afterRange.extractContents();

                        let afterWrap = null;
                        if (afterFrag.textContent) {
                            afterWrap = document.createElement(tag);
                            afterWrap.appendChild(afterFrag);
                            parent.insertBefore(afterWrap, originalNextSibling);
                        }
                        if (!target.textContent) parent.removeChild(target);

                        container = parent;
                        offset = Array.prototype.indexOf.call(parent.childNodes, afterWrap || originalNextSibling || null);
                        if (offset === -1) offset = parent.childNodes.length;
                    }
                    range.setStart(container, offset);
                    range.setEnd(container, offset);

                    firstNode = extracted.firstChild;
                    lastNode = extracted.lastChild;
                    range.insertNode(extracted);
                } else {

            // first stripping that same style property off any spans
            // already inside the selection so re-applying a color/

                wrapper.appendChild(extracted);

                newRange.selectNodeContents(wrapper);

                    text += node.textContent;
                });
                return text.replace(/\u200B/g, '').trim();
            }

            function placeCursorAtEnd(el) {
                const range = document.createRange();
                range.selectNodeContents(el);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }

            // Places the cursor immediately after the line's checkbox —
            // used instead of placeCursorAtEnd() when converting a line
            // to a checkbox, so the cursor lands right next to the
            // checkbox rather than jumping to the end of any existing text.
            function placeCursorAfterCheckbox(line) {
                const cb = Array.prototype.find.call(
                    line.children, c => c.tagName === 'INPUT' && c.type === 'checkbox'
                );
                if (!cb) {
                    placeCursorAtEnd(line);
                    return;
                }
                const range = document.createRange();
                range.setStartAfter(cb);
                range.collapse(true);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }

            function toggleLineDone(line) {
                if (!line) return;
                line.classList.toggle('line-done');
            }

            function toggleLineBold(line) {
                if (!line) return;
                const isBold = line.style.fontWeight === 'bold' || line.style.fontWeight === '700';
                line.style.fontWeight = isBold ? '' : 'bold';
            }

            function refreshPanelState(line) {
                if (!line) return;
                doneBtn.textContent = line.classList.contains('line-done')
                    ? '✓ Mark as not complete' : '✓ Mark as complete';
                doneBtn.classList.toggle('active', line.classList.contains('line-done'));
                const isBold = line.style.fontWeight === 'bold' || line.style.fontWeight === '700';
                boldBtn.classList.toggle('active', isBold);
            }

            function toggleCheckbox(line) {
                // If the line is a bullet/number <li>, the checkbox should
                // replace that marker entirely — not sit alongside it — so
                // rebuild the line as a plain checkbox div.
                if (line.tagName === 'LI') {
                    const parentList = line.parentElement;
                    const indent = line.style.marginLeft || '';
                    const text = getLineTextContent(line);
                    const div = document.createElement('div');
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.style.marginRight = '5px';
                    div.appendChild(cb);
                    div.appendChild(document.createTextNode(text));
                    if (indent) div.style.marginLeft = indent;
                    if (parentList.children.length === 1) {
                        parentList.replaceWith(div);
                    } else {
                        parentList.removeChild(line);
                        parentList.after(div);
                    }
                    return div;
                }
                // Otherwise it's a plain/checkbox div — just toggle the
                // checkbox on or off within it.
                const existing = Array.prototype.find.call(
                    line.children, c => c.tagName === 'INPUT' && c.type === 'checkbox'
                );
                if (existing) {
                    existing.remove();
                } else {
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.style.marginRight = '5px';
                    line.insertBefore(cb, line.firstChild);
                }
                return line;
            }

            function convertLineToList(line, wantTag, wantClass) {
                const indent = line.style.marginLeft || '';
                const text = getLineTextContent(line);

                if (line.tagName === 'LI') {
                    const parentList = line.parentElement;
                    if (parentList && parentList.tagName === wantTag &&
                        (!wantClass || parentList.classList.contains(wantClass))) {
                        return line; // already the right type
                    }
                    const li = document.createElement('li');
                    li.textContent = text || '\u200B';
                    if (indent) li.style.marginLeft = indent;
                    const list = document.createElement(wantTag);
                    if (wantClass) list.className = wantClass;
                    list.appendChild(li);
                    if (parentList.children.length === 1) {
                        parentList.replaceWith(list);
                    } else {
                        parentList.removeChild(line);
                        parentList.after(list);
                    }
                    return li;
                }

                // line is a DIV/P — rebuild as an <li>, merging into an
                // adjacent list of the right type if one is right there.
                const li = document.createElement('li');
                li.textContent = text || '\u200B';
                if (indent) li.style.marginLeft = indent;
                const prev = line.previousElementSibling;
                const next = line.nextElementSibling;
                if (prev && prev.tagName === wantTag && (!wantClass || prev.classList.contains(wantClass))) {
                    prev.appendChild(li);
                    line.remove();
                } else if (next && next.tagName === wantTag && (!wantClass || next.classList.contains(wantClass))) {
                    next.insertBefore(li, next.firstChild);
                    line.remove();
                } else {
                    const list = document.createElement(wantTag);
                    if (wantClass) list.className = wantClass;
                    list.appendChild(li);
                    line.replaceWith(list);
                }
                return li;
            }

            function positionIcon(line) {
                const rect = line.getBoundingClientRect();
                const top = Math.max(4, rect.top + rect.height / 2 - 9);
                hoverIcon.style.top = top + 'px';
                hoverIcon.style.left = Math.max(4, rect.left - 22) + 'px';
                hoverIcon.classList.add('show');

                dragHandle.style.top = Math.max(4, rect.top + rect.height / 2 - 9) + 'px';
                dragHandle.style.left = Math.max(4, rect.left - 42) + 'px';
                dragHandle.classList.add('show');

                const editable = line.closest('[contenteditable="true"]');
                const allLines = editable ? collectAllLines(editable) : [];
                const kids = getDescendantLines(line, allLines);
                collapseToggle.style.top = Math.max(4, rect.top + rect.height / 2 - 8) + 'px';
                collapseToggle.style.left = Math.max(4, rect.left - 62) + 'px';
                collapseToggle.textContent = line.classList.contains('line-collapsed') ? '▾' : '▸';
                collapseToggle.classList.toggle('has-children', kids.length > 0);
            }

            function toggleLineCollapse(line) {
                if (!line) return;
                const editable = line.closest('[contenteditable="true"]');
                if (!editable) return;
                const allLines = collectAllLines(editable);
                const kids = getDescendantLines(line, allLines);
                if (!kids.length) return;
                const collapsing = !line.classList.contains('line-collapsed');
                line.classList.toggle('line-collapsed', collapsing);
                kids.forEach(function (k) { k.classList.toggle('line-child-hidden', collapsing); });
                collapseToggle.textContent = collapsing ? '▾' : '▸';
            }

            function scheduleHide() {
                clearTimeout(hideTimer);
                hideTimer = setTimeout(function () {
                    hoverIcon.classList.remove('show');
                    dragHandle.classList.remove('show');
                    collapseToggle.classList.remove('show', 'has-children');
                    hoverPanel.classList.remove('show');
                    currentLine = null;
                }, 250);
            }

            function cancelHide() {
                clearTimeout(hideTimer);
            }

            function isHoverChrome(el) {
                return el === hoverIcon || el === dragHandle || el === collapseToggle ||
                    (hoverIcon.contains && hoverIcon.contains(el)) ||
                    (dragHandle.contains && dragHandle.contains(el)) ||
                    (collapseToggle.contains && collapseToggle.contains(el));
            }

            document.addEventListener('mouseover', function (e) {
                if (!window.__hasRealMouseMoved) return;
                const line = findLineEl(e.target);
                if (line) {
                    currentLine = line;
                    cancelHide();
                    positionIcon(line);
                }
            });

            document.addEventListener('mouseout', function (e) {
                const line = findLineEl(e.target);
                if (line && line === currentLine) {
                    const related = e.relatedTarget;
                    if (related && isHoverChrome(related)) return;
                    scheduleHide();
                }
            });

            hoverIcon.addEventListener('mouseenter', cancelHide);
            hoverIcon.addEventListener('mouseleave', function (e) {
                const related = e.relatedTarget;
                if (related === hoverPanel || (related && hoverPanel.contains(related))) return;
                if (related && isHoverChrome(related)) return;
                scheduleHide();
            });

            dragHandle.addEventListener('mouseenter', cancelHide);
            dragHandle.addEventListener('mouseleave', function (e) {
                const related = e.relatedTarget;
                if (related && isHoverChrome(related)) return;
                scheduleHide();
            });

            collapseToggle.addEventListener('mouseenter', cancelHide);
            collapseToggle.addEventListener('mouseleave', function (e) {
                const related = e.relatedTarget;
                if (related && isHoverChrome(related)) return;
                scheduleHide();
            });

            collapseToggle.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                toggleLineCollapse(currentLine);
            });

            // --- Drag-and-drop reordering (grip handle mirrors Outliner's
            // draggable bullet). Dragging a line brings its deeper-indented
            // children along, same grouping used by the collapse toggle. ---
            let draggingLine = null;
            let draggingBlock = [];
            let dropTargetLine = null;

            function clearDropIndicator() {
                if (dropTargetLine) dropTargetLine.classList.remove('line-drop-before', 'line-drop-after');
                dropTargetLine = null;
            }

            dragHandle.addEventListener('dragstart', function (e) {
                if (!currentLine) { e.preventDefault(); return; }
                draggingLine = currentLine;
                const editable = draggingLine.closest('[contenteditable="true"]');
                const allLines = editable ? collectAllLines(editable) : [];
                draggingBlock = [draggingLine].concat(getDescendantLines(draggingLine, allLines));
                draggingBlock.forEach(function (el) { el.classList.add('line-dragging'); });
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', 'thoughts-line-drag'); } catch (err) {}
            });

            dragHandle.addEventListener('dragend', function () {
                draggingBlock.forEach(function (el) { el.classList.remove('line-dragging'); });
                draggingBlock = [];
                draggingLine = null;
                clearDropIndicator();
            });

            document.addEventListener('dragover', function (e) {
                if (!draggingLine) return;
                const line = findLineEl(e.target) || findLineEl(document.elementFromPoint(e.clientX, e.clientY));
                if (!line || draggingBlock.indexOf(line) !== -1) { clearDropIndicator(); return; }
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const rect = line.getBoundingClientRect();
                const before = (e.clientY - rect.top) < rect.height / 2;
                if (dropTargetLine && dropTargetLine !== line) {
                    dropTargetLine.classList.remove('line-drop-before', 'line-drop-after');
                }
                dropTargetLine = line;
                line.classList.toggle('line-drop-before', before);
                line.classList.toggle('line-drop-after', !before);
            });

            document.addEventListener('drop', function (e) {
                if (!draggingLine) return;
                const line = findLineEl(e.target) || findLineEl(document.elementFromPoint(e.clientX, e.clientY));
                clearDropIndicator();
                if (!line || draggingBlock.indexOf(line) !== -1) return;
                e.preventDefault();
                const rect = line.getBoundingClientRect();
                const before = (e.clientY - rect.top) < rect.height / 2;
                const parent = line.parentElement;
                const refNode = before ? line : line.nextSibling;
                draggingBlock.forEach(function (el) { parent.insertBefore(el, refNode); });
                scheduleSaveIfAvailable();
            });

            // Some builds define a scheduleSave()/persist hook elsewhere in
            // the app; call it after a drag if present, otherwise no-op.
            function scheduleSaveIfAvailable() {
                if (typeof window.scheduleSave === 'function') window.scheduleSave();
                if (typeof window.saveState === 'function') window.saveState();
            }

            hoverIcon.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!currentLine) return;
                const rect = hoverIcon.getBoundingClientRect();
                hoverPanel.style.top = (rect.bottom + 4) + 'px';
                hoverPanel.style.left = rect.left + 'px';
                hoverPanel.classList.add('show');
                refreshPanelState(currentLine);
            });

            // Keep the current selection/cursor position intact when
            // clicking the ☰ icon or a panel button — same fix already
            // used by the selection toolbar and color popovers above,
            // just missing here. Without this, mousedown on the button
            // steals focus from the contenteditable cell first, so by the
            // time the click handler runs the real cursor position (and
            // sometimes the precise "line" it was in) has already been
            // lost, which is also what caused Tab to mis-target far above
            // the intended line.
            hoverIcon.addEventListener('mousedown', function (e) { e.preventDefault(); });
            dragHandle.addEventListener('mousedown', function (e) {
                // Don't block the native drag gesture itself.
                if (e.button !== 0) return;
            });
            collapseToggle.addEventListener('mousedown', function (e) { e.preventDefault(); });
            hoverPanel.addEventListener('mousedown', function (e) { e.preventDefault(); });

            hoverPanel.addEventListener('mouseenter', cancelHide);
            hoverPanel.addEventListener('mouseleave', scheduleHide);
            itemTextColorPopover.pop.addEventListener('mouseenter', cancelHide);
            itemTextColorPopover.pop.addEventListener('mouseleave', scheduleHide);
            itemBgColorPopover.pop.addEventListener('mouseenter', cancelHide);
            itemBgColorPopover.pop.addEventListener('mouseleave', scheduleHide);

            function closePanel() {
                hoverPanel.classList.remove('show');
                hoverIcon.classList.remove('show');
            }

            bulletBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                const li = convertLineToList(currentLine, 'UL', 'custom-bullet-list');
                currentLine = li;
                placeCursorAtEnd(li);
                closePanel();
            });

            numberBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                const li = convertLineToList(currentLine, 'OL', null);
                currentLine = li;
                placeCursorAtEnd(li);
                closePanel();
            });

            checkboxBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                const line = toggleCheckbox(currentLine);
                currentLine = line;
                placeCursorAfterCheckbox(line);
                closePanel();
            });

            doneBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                toggleLineDone(currentLine);
                refreshPanelState(currentLine);
            });

            boldBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                toggleLineBold(currentLine);
                refreshPanelState(currentLine);
            });

            itemTextColorBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!currentLine) return;
                showColorPopover(itemTextColorPopover.pop, itemTextColorBtn.getBoundingClientRect());
            });
            itemBgColorBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!currentLine) return;
                showColorPopover(itemBgColorPopover.pop, itemBgColorBtn.getBoundingClientRect());
            });

            itemTextColorPopover.pop.addEventListener('click', function (e) {
                const sw = e.target.closest('.color-swatch');
                if (!sw || !currentLine) return;
                applyLineTextColor(currentLine, sw.dataset.color);
                hideColorPopover(itemTextColorPopover.pop);
                closePanel();
            });
            itemTextColorPopover.customInput.addEventListener('input', function (e) {
                if (!currentLine) return;
                applyLineTextColor(currentLine, e.target.value);
            });
            itemTextColorPopover.customInput.addEventListener('change', function () {
                hideColorPopover(itemTextColorPopover.pop);
                closePanel();
            });

            itemBgColorPopover.pop.addEventListener('click', function (e) {
                const sw = e.target.closest('.color-swatch');
                if (!sw || !currentLine) return;
                applyLineBgColor(currentLine, sw.dataset.color);
                hideColorPopover(itemBgColorPopover.pop);
                closePanel();
            });
            itemBgColorPopover.customInput.addEventListener('input', function (e) {
                if (!currentLine) return;
                applyLineBgColor(currentLine, e.target.value);
            });
            itemBgColorPopover.customInput.addEventListener('change', function () {
                hideColorPopover(itemBgColorPopover.pop);
                closePanel();
            });

            subBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                adjustLineIndent(currentLine, 1);
                hoverPanel.classList.remove('show');
                hoverIcon.classList.remove('show');
            });

            outdentBtn.addEventListener('click', function (e) {
                e.preventDefault();
                if (!currentLine) return;
                adjustLineIndent(currentLine, -1);
                closePanel();
            });

            window.addEventListener('scroll', function () {
                if (currentLine) positionIcon(currentLine);
            }, true);

            // Tab / Shift+Tab: indent / outdent the current line while
            // editing, instead of the browser's default focus-jump.
            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Tab') return;
                const editable = e.target.closest && e.target.closest('[contenteditable="true"]');
                if (!editable) return;
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return;
                const line = getLineElement(sel.getRangeAt(0).startContainer);
                if (!line) return;
                e.preventDefault();
                adjustLineIndent(line, e.shiftKey ? -1 : 1);
            });
        })();

        // Open 4 pooout windows by one clicking
		function openPopups4(url1, url2, url3, url4) {
            // Open first popup window
            window.open(url1, '_blank', 'width=700,height=450,left=50,top=50');
            // Open second popup window
            window.open(url2, '_blank', 'width=700,height=450,left=800,top=50');
            // Open third popup window
            window.open(url3, '_blank', 'width=700,height=450,left=50,top=550');
            // Open 4th popup window
            window.open(url4, '_blank', 'width=700,height=450,left=800,top=550');
        }

</script>
