<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pause</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="manifest" href='data:application/manifest+json,{"name":"The Pause","short_name":"Pause","start_url":".","display":"standalone","background_color":"#f8f9fa","theme_color":"#3b82f6"}'>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #3b82f6; 
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 8px;
            --tag-bg: #eff6ff;
            --tag-text: #1d4ed8;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
            transition: background 0.3s;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 24px;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .brand { font-size: 1.1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
        
        .top-actions { display: flex; gap: 8px; position: relative; flex-wrap: wrap; align-items: center; }
        
        .toggle-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .toggle-btn:hover { background: #f3f4f6; }
        .toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .toggle-btn.reminder-active { background: var(--success); color: white; border-color: var(--success); }
        .toggle-btn.signin-btn { background: var(--accent); color: white; border-color: var(--accent); }
        .toggle-btn.signin-btn:hover { background: var(--accent-hover); }

        .header { text-align: center; width: 100%; margin-bottom: 20px;}
        #clock { font-size: 2.5rem; font-weight: 700; margin: 0; letter-spacing: -0.05em; color: var(--text-main); font-variant-numeric: tabular-nums;}
        #date-line { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        #timer-display { font-size: 0.9rem; color: var(--text-muted); margin-top: 8px; font-weight: 500; }
        #timer-display.active { color: var(--danger); font-weight: 600; }

        .journal-entry {
            width: 100%;
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        
        .project-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            background: #f9fafb;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .project-input-wrapper label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
        #project-input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
            outline: none;
        }
        #project-input::placeholder { color: #9ca3af; font-weight: 400;}

        .first-run-tip {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: #eff6ff;
            border-left: 3px solid var(--accent);
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            transition: opacity 0.4s;
        }
        .first-run-tip.hidden { display: none; }
        .first-run-tip button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 6px;
            flex: 0 0 auto;
        }

        textarea {
            width: 100%;
            height: 120px; 
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
            margin-bottom: 12px;
            background: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s;
            line-height: 1.5;
        }
        textarea:focus { 
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: var(--surface);
        }

        .button-group { display: flex; gap: 8px; }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #start-btn { background-color: var(--accent); color: white; flex: 1; }
        #start-btn:hover { background-color: var(--accent-hover); }
        #save-btn { background-color: var(--success); color: white; flex: 1; display: none; }
        #save-btn:hover { background-color: #059669; }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .log-section { width: 100%; }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;}
        .log-header h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0; font-weight: 600;}
        .log-header-actions { display: flex; gap: 6px; }
        .export-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 0.75rem; padding: 4px 8px;}
        .export-btn:hover { background: var(--surface); color: var(--text-main); box-shadow: var(--shadow-sm);}
        .wrapup-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 0.75rem; padding: 4px 8px;}
        .wrapup-btn:hover { background: #fef3c7; color: #92400e; border-color: #fbbf24;}

        .day-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .day-divider:first-child { margin-top: 0; }
        .day-divider::before, .day-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .log-item {
            background: var(--surface);
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            animation: fadeIn 0.2s ease-out;
            position: relative;
            transition: box-shadow 0.2s;
        }
        .log-item:hover { box-shadow: var(--shadow-md); }
        .log-item.special-entry {
            background: #fffbeb;
            border-color: #fde68a;
        }
        .log-item.special-entry .project-tag {
            background: #fef3c7;
            color: #92400e;
        }
        
        .log-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .log-meta { display: flex; align-items: center; gap: 8px; }
        .log-time { font-weight: 600; font-size: 0.75rem; color: var(--text-muted); }
        
        .project-tag {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        
        .log-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s;}
        .log-item:hover .log-actions { opacity: 1; }
        
        .log-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            color: var(--text-muted);
            border-radius: 4px;
        }
        .log-actions button:hover { color: var(--text-main); background: #f3f4f6; }

        .log-content {
            white-space: pre-wrap; 
            word-wrap: break-word;
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .log-edit-area {
            display: none; 
            width: 100%;
            margin-top: 8px;
        }
        .log-edit-area .project-input-wrapper { margin-bottom: 8px; padding: 4px 8px;}
        .log-edit-area textarea {
            height: 100px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .log-edit-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .log-edit-actions button {
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-cancel:hover { background: #f3f4f6; color: var(--text-main); }
        .btn-update { background: var(--accent); color: white; }
        .btn-update:hover { background: var(--accent-hover); }

        .log-item.editing .log-content { display: none; }
        .log-item.editing .log-header-row { display: none; }
        .log-item.editing .log-edit-area { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .reminder-dropdown, .cloud-dropdown {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 8px;
            z-index: 200;
            width: 180px;
        }
        .reminder-dropdown.show, .cloud-dropdown.show { display: block; }
        .reminder-dropdown p { margin: 0 0 8px 0; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-align: center; text-transform: uppercase;}
        .reminder-dropdown button, .cloud-dropdown button {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 2px;
            background: transparent;
            color: var(--text-main);
            font-size: 0.85rem;
            text-align: left;
            border-radius: 4px;
            justify-content: flex-start;
        }
        .reminder-dropdown button:hover, .cloud-dropdown button:hover { background: #f3f4f6; color: var(--accent); }

        .cloud-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 4px;
            white-space: nowrap;
        }

        /* --- MODAL (shared by Summary & Week) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-overlay.show { display: flex; }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }
        .modal-content.wide { max-width: 1200px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9fafb;
        }
        .modal-header h2 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .close-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 4px;}
        .close-btn:hover { background: #e5e7eb; color: var(--text-main); }

        .summary-toggle-group {
            display: flex;
            gap: 4px;
            padding: 12px 24px 0 24px;
            background: #f9fafb;
            align-items: center;
        }
        .summary-toggle-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.8rem;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .summary-toggle-btn.active {
            background: var(--surface);
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: var(--shadow-sm);
        }
        .help-btn {
            flex: 0 0 auto;
            width: 28px;
            padding: 8px 0;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .help-btn:hover { background: #e5e7eb; color: var(--text-main); }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .summary-document {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111;
        }
        .summary-document h1 { font-size: 1.5rem; margin: 0 0 8px 0; text-align: center; letter-spacing: -0.02em;}
        .summary-document .summary-date { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #eee;}
        
        .summary-entry {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px dashed #eee;
        }
        .summary-entry:last-child { border-bottom: none; }
        .summary-entry-time { font-weight: 700; font-size: 0.85rem; color: var(--accent); margin-bottom: 4px; }
        .summary-entry-text { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; }

        .summary-project-group { margin-bottom: 32px; }
        .summary-project-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-project-count {
            font-size: 0.75rem;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* --- TIME SPENT TAB --- */
        .time-total {
            text-align: center;
            font-size: 1.05rem;
            color: var(--text-main);
            padding: 16px;
            margin: 8px 0 24px;
            background: #f9fafb;
            border-radius: 8px;
            font-weight: 500;
        }
        .time-total strong { color: var(--accent); font-size: 1.3rem; font-weight: 700; }
        .time-project { margin-bottom: 18px; }
        .time-project-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .time-project-name { font-weight: 600; font-size: 0.95rem; color: var(--text-main); }
        .time-project-duration {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }
        .time-project-duration .pct {
            font-weight: 400;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: 4px;
        }
        .time-bar-track {
            height: 10px;
            background: #eef2f6;
            border-radius: 5px;
            overflow: hidden;
        }
        .time-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, var(--accent));
            border-radius: 5px;
            transition: width 0.4s ease-out;
        }
        .time-bar-fill.paused { background: linear-gradient(90deg, #fbbf24, var(--warning)); }
        .time-project-entry-count { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
        .time-note {
            margin-top: 24px;
            padding: 12px 14px;
            background: #f9fafb;
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .time-warning-icon {
            display: inline-block;
            color: var(--warning);
            margin-left: 4px;
            cursor: help;
        }

        /* --- WEEK VIEW --- */
        .week-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 10px 12px;
            background: #f9fafb;
            border-radius: 8px;
        }
        .week-nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .week-nav-btn:hover { background: #f3f4f6; }
        .week-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .week-nav-label { font-weight: 600; font-size: 0.95rem; }

        .week-toggle-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .week-toggle-bar button {
            padding: 5px 12px;
            font-size: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
        }
        .week-toggle-bar button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }
        .week-col {
            background: #f9fafb;
            border-radius: 8px;
            padding: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }
        .week-col.today {
            background: #eff6ff;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }
        .week-col-header {
            text-align: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .week-col-day { font-weight: 700; font-size: 0.8rem; color: var(--text-main); }
        .week-col-date { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
        .week-col-total {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 700;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }
        .week-col-total.empty { color: var(--text-muted); font-weight: 400; font-size: 0.7rem; }

        .week-blocks {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }
        .week-block {
            border-radius: 4px;
            padding: 5px 7px;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: transform 0.15s, filter 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 22px;
        }
        .week-block:hover { filter: brightness(1.1); transform: scale(1.02); }
        .week-block-label { display: flex; justify-content: space-between; gap: 4px; align-items: baseline; }
        .week-block-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .week-block-duration { font-variant-numeric: tabular-nums; opacity: 0.9; flex: 0 0 auto; }

        /* --- Time-axis mode --- */
        .week-grid.time-axis {
            grid-template-columns: 60px repeat(7, 1fr);
        }
        .time-axis-col {
            display: flex;
            flex-direction: column;
            position: relative;
            background: transparent;
            border: none;
            padding: 0;
        }
        .time-axis-hour {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            padding-right: 8px;
            border-top: 1px solid #eef2f6;
            height: 40px;
            line-height: 40px;
            box-sizing: border-box;
        }
        .week-col.time-scheduled {
            position: relative;
            min-height: 0;
            height: 640px; /* 16 hours * 40px */
            padding: 0;
            overflow: hidden;
        }
        .week-col.time-scheduled .week-col-header {
            position: sticky;
            top: 0;
            background: inherit;
            z-index: 2;
            padding: 6px 4px;
            margin-bottom: 0;
            border-bottom: 1px solid var(--border);
        }
        .week-block-absolute {
            position: absolute;
            left: 2px;
            right: 2px;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 0.65rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            transition: filter 0.15s;
            box-sizing: border-box;
        }
        .week-block-absolute:hover { filter: brightness(1.1); z-index: 5; }
        .week-block-absolute .week-block-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .week-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            font-size: 0.75rem;
        }
        .week-legend-item { display: flex; align-items: center; gap: 5px; }
        .week-legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex: 0 0 auto;
        }
        .week-summary-row {
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }
        .week-summary-item { text-align: center; }
        .week-summary-item strong {
            display: block;
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .week-summary-item span { color: var(--text-muted); font-size: 0.75rem; }

        .week-empty-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 30px;
        }

        /* --- Block detail popover --- */
        .block-detail-popover {
            position: fixed;
            z-index: 4000;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            padding: 14px;
            max-width: 300px;
            max-height: 400px;
            overflow-y: auto;
        }
        .block-detail-popover h4 {
            margin: 0 0 8px;
            font-size: 0.9rem;
            color: var(--text-main);
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .block-detail-entry {
            padding: 6px 0;
            font-size: 0.8rem;
            border-bottom: 1px dashed #eee;
        }
        .block-detail-entry:last-child { border-bottom: none; }
        .block-detail-time { font-weight: 700; color: var(--accent); font-size: 0.75rem; margin-bottom: 2px; }
        .block-detail-text { white-space: pre-wrap; color: var(--text-main); line-height: 1.4; }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            background: #f9fafb;
        }
        .modal-footer button { flex: 1; }
        .btn-copy { background: var(--accent); color: white; }
        .btn-copy:hover { background: var(--accent-hover); }
        .btn-print { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); }
        .btn-print:hover { background: #f3f4f6; }

        @media (max-width: 900px) {
            .modal-content.wide { max-width: 100%; }
            .week-grid {
                grid-template-columns: repeat(7, minmax(80px, 1fr));
                overflow-x: auto;
            }
            .week-grid.time-axis {
                grid-template-columns: 50px repeat(7, minmax(80px, 1fr));
            }
        }
        @media (max-width: 640px) {
            .week-grid { grid-template-columns: 1fr; }
            .week-grid.time-axis { grid-template-columns: 40px 1fr; }
            .week-col { min-height: 0; }
            .week-col.time-scheduled { height: 640px; }
        }

        @media print {
            body * { visibility: hidden; }
            .modal-overlay, .modal-content, .modal-body, .summary-document, .summary-document * { visibility: visible; }
            .modal-overlay { 
                position: absolute; left: 0; top: 0; width: 100%; height: auto;
                background: white; padding: 0; display: block; margin: 0;
            }
            .modal-content { 
                box-shadow: none; max-height: none; max-width: 100%; border-radius: 0; margin: 0; padding: 0;
            }
            .modal-body { overflow: visible; padding: 0; margin: 0; }
            .modal-header, .modal-footer, .summary-toggle-group, .week-nav, .week-toggle-bar { display: none !important; }
            @page { margin: 1cm; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">🌿 The Pause</div>
        <div class="top-actions">
            <button class="toggle-btn" onclick="openSummary()">📊 Summary</button>
            <button class="toggle-btn" onclick="openWeekView()">📅 Week</button>

            <span id="cloudAuthArea">

                <span id="cloudSignedInArea" style="display:none; align-items: center; gap: 6px;">

    <div class="header">

    </div>

    <div class="journal-entry">
        <div id="first-run-tip" class="first-run-tip">
            <span>💡 Tip: Tag each log with a project name (or "Break" / "Lunch" for pauses). Then <strong>Summary</strong> and <strong>Week</strong> will show you where your focus went.</span>

                <button class="export-btn" onclick="exportMarkdown()">Export .md</button>
            </div>

        <div id="log-list"></div>
    </div>

    <!-- Summary Modal -->
    <div class="modal-overlay" id="summary-modal">
        <div class="modal-content">

            <div class="summary-toggle-group">
                <button class="summary-toggle-btn active" id="view-timeline-btn" onclick="setSummaryView('timeline')">🕐 Timeline</button>
                <button class="summary-toggle-btn" id="view-project-btn" onclick="setSummaryView('project')">📁 By Project</button>
                <button class="summary-toggle-btn" id="view-time-btn" onclick="setSummaryView('time')">⏱️ Time Spent</button>

    <!-- Week Modal -->
    <div class="modal-overlay" id="week-modal">
        <div class="modal-content wide">

            <div class="modal-body">
                <div class="week-nav">
                    <button class="week-nav-btn" id="week-prev-btn" onclick="weekNavigate(-1)">← Previous</button>

                    <button id="week-mode-time" onclick="setWeekMode('time')">🕐 Time Axis</button>

                <div id="week-grid-container"></div>
                <div id="week-legend" class="week-legend"></div>

                <button class="btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        // GLOBAL STATE
        // ============================================================
        const JOURNAL_PRESET = `1. Just did: \n2. Thinking: \n3. Next up: `;
        const DEFAULT_PROJECT = "General";
        const SPECIAL_PROJECT_KEYWORDS = ['break', 'lunch', 'paused', 'pause', 'wrap up', 'wrap-up', 'end of day'];
        const LONG_GAP_THRESHOLD_MS = 2 * 60 * 60 * 1000;

        let logs = [];
        let reminderInterval = null;
        let currentSummaryView = 'timeline';
        let weekMode = 'stacked';           // 'stacked' | 'time'
        let weekStartDate = null;           // Monday of the currently displayed week

        let cloudUser = null;
        let cloudSaveTimer = null;
        let cloudDb = null;
        let cloudAuth = null;

        const LOCAL_KEY_ANON = 'thepause_logs_anon';
        function localKeyForUser(uid) { return 'thepause_logs_' + uid; }

        // Stable color per project — deterministic hash of project name
        // → HSL hue. Special (paused) projects always get amber.
        const PROJECT_PALETTE = [
            '#3b82f6', // blue
            '#10b981', // green
            '#8b5cf6', // purple
            '#f97316', // orange
            '#ec4899', // pink
            '#06b6d4', // cyan
            '#84cc16', // lime
            '#f43f5e', // rose
            '#6366f1', // indigo
            '#14b8a6', // teal
            '#a855f7', // violet
            '#eab308'  // yellow
        ];
        const PAUSED_COLOR = '#f59e0b'; // amber

        function projectColor(name) {
            if (!name) return PROJECT_PALETTE[0];
            if (isSpecialProject(name)) return PAUSED_COLOR;
            // Simple deterministic hash
            let hash = 0;
            const s = String(name).toLowerCase();
            for (let i = 0; i < s.length; i++) {
                hash = ((hash << 5) - hash + s.charCodeAt(i)) | 0;
            }
            return PROJECT_PALETTE[Math.abs(hash) % PROJECT_PALETTE.length];
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function isSpecialProject(name) {
            if (!name) return false;
            return SPECIAL_PROJECT_KEYWORDS.indexOf(String(name).trim().toLowerCase()) !== -1;
        }

        function formatDuration(ms) {
            if (!ms || ms < 0) return '0m';
            const totalMin = Math.round(ms / 60000);
            if (totalMin < 1) return '<1m';
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            if (h === 0) return m + 'm';
            if (m === 0) return h + 'h';
            return h + 'h ' + m + 'm';
        }

        function nowTimeString() {
            return new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Returns 'YYYY-MM-DD' for the local date of a given ms timestamp
        function dateKey(ms) {
            const d = new Date(ms);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        }

        // Same as dateKey but for today's date
        function todayKey() {
            return dateKey(Date.now());
        }

        // Human-readable date relative to today
        function relativeDateLabel(ms) {
            const targetKey = dateKey(ms);
            const today = new Date();
            const todayKey_ = dateKey(today.getTime());
            
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const yesterdayKey = dateKey(yesterday.getTime());

            const d = new Date(ms);
            if (targetKey === todayKey_) {
                return 'Today · ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
            if (targetKey === yesterdayKey) {
                return 'Yesterday · ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
            return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        // Returns Monday 00:00 of the week containing the given date
        function getMondayOf(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay(); // 0=Sun
            const diff = (day === 0 ? -6 : 1) - day;
            d.setDate(d.getDate() + diff);
            return d;
        }

        // ============================================================
        // 1. CLOCK + DATE
        // ============================================================
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('date-line').textContent = now.toLocaleDateString('en-US', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ============================================================
        // 2. PROJECT FIELD + FIRST-RUN TIP
        // ============================================================
        function getCurrentProject() {
            const val = document.getElementById('project-input').value.trim();
            return val || DEFAULT_PROJECT;
        }
        function populateProjectSuggestions() {
            const projects = [...new Set(logs.map(log => log.project).filter(Boolean))];
            const datalist = document.getElementById('project-list');
            datalist.innerHTML = '';
            projects.forEach(p => {
                const option = document.createElement('option');
                option.value = p;
                datalist.appendChild(option);
            });
        }

        window.dismissFirstRunTip = function () {
            document.getElementById('first-run-tip').classList.add('hidden');
            try { localStorage.setItem('thepause_tip_dismissed', '1'); } catch (e) {}
        };

        function maybeShowFirstRunTip() {
            try {
                if (localStorage.getItem('thepause_tip_dismissed') === '1') {
                    document.getElementById('first-run-tip').classList.add('hidden');
                }
            } catch (e) {}
        }

        // ============================================================
        // 3. RENDER LOGS (with day dividers)
        // ============================================================
        function renderLogs() {
            const logList = document.getElementById('log-list');
            logList.innerHTML = '';

            if (logs.length === 0) return;

            // Group logs by calendar day, then render each day as a
            // section with a divider header.
            const grouped = {};
            logs.forEach((log, originalIndex) => {
                const ts = log.timestamp || null;
                const key = ts ? dateKey(ts) : 'undated';
                if (!grouped[key]) grouped[key] = { key: key, ts: ts, entries: [] };
                grouped[key].entries.push({ log: log, idx: originalIndex });
            });

            // Sort day-keys newest first
            const dayKeys = Object.keys(grouped).sort((a, b) => {
                if (a === 'undated') return 1;
                if (b === 'undated') return -1;
                return b.localeCompare(a);
            });

            dayKeys.forEach(dayKey_ => {
                const day = grouped[dayKey_];

                // Divider header
                const divider = document.createElement('div');
                divider.className = 'day-divider';
                divider.textContent = dayKey_ === 'undated'
                    ? 'Undated entries'
                    : relativeDateLabel(day.ts);
                logList.appendChild(divider);

                // Then this day's entries
                day.entries.forEach(({ log, idx }) => {
                    logList.appendChild(renderLogItem(log, idx));
                });
            });
        }

        function renderLogItem(log, index) {
            const logDiv = document.createElement('div');
            logDiv.className = 'log-item';
            logDiv.id = `log-item-${index}`;

            const project = log.project || DEFAULT_PROJECT;
            const safeProject = escapeHtml(project);
            const safeText = escapeHtml(log.text).replace(/\n/g, "<br>");
            const rawText = escapeHtml(log.text);

            if (isSpecialProject(project)) {
                logDiv.classList.add('special-entry');
            }

            logDiv.innerHTML = `
                <div class="log-header-row">
                    <div class="log-meta">
                        <span class="log-time">${log.time}</span>
                        <span class="project-tag">${safeProject}</span>
                    </div>
                    <div class="log-actions">
                        <button onclick="enableInlineEdit(${index})" title="Edit">✏️</button>
                        <button onclick="deleteLog(${index})" title="Delete">🗑️</button>
                    </div>
                </div>
                <div class="log-content">${safeText}</div>
                <div class="log-edit-area">
                    <div class="project-input-wrapper">
                        <label>📁</label>
                        <input type="text" id="edit-project-${index}" value="${safeProject}" list="project-list" spellcheck="false">
                    </div>
                    <textarea id="edit-textarea-${index}" spellcheck="false">${rawText}</textarea>
                    <div class="log-edit-actions">
                        <button class="btn-cancel" onclick="cancelInlineEdit(${index})">Cancel</button>
                        <button class="btn-update" onclick="saveInlineEdit(${index})">Update</button>
                    </div>
                </div>
            `;
            return logDiv;
        }

        // ============================================================
        // 4. IN-LINE EDIT
        // ============================================================
        function enableInlineEdit(index) {
            const logItem = document.getElementById(`log-item-${index}`);
            logItem.classList.add('editing');
            const textarea = document.getElementById(`edit-textarea-${index}`);
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        }
        function cancelInlineEdit(index) {
            document.getElementById(`log-item-${index}`).classList.remove('editing');
        }
        function saveInlineEdit(index) {
            const textarea = document.getElementById(`edit-textarea-${index}`);
            const projectInput = document.getElementById(`edit-project-${index}`);
            const newText = textarea.value;
            const newProject = projectInput.value.trim() || DEFAULT_PROJECT;

            if (!newText.trim()) { alert("Log cannot be empty."); return; }

            logs[index].text = newText;
            logs[index].project = newProject;
            saveLocal();
            renderLogs();
            populateProjectSuggestions();
            scheduleCloudAutoSave();
        }

        // ============================================================
        // 5. DELETE
        // ============================================================
        function deleteLog(index) {
            if(confirm("Are you sure you want to delete this entry?")) {
                logs.splice(index, 1);
                saveLocal();
                renderLogs();
                populateProjectSuggestions();
                scheduleCloudAutoSave();
            }
        }

        // ============================================================
        // 6. NEW LOG
        // ============================================================
        function loadPreset() {
            const textarea = document.getElementById('entry-text');
            textarea.value = JOURNAL_PRESET;
            const cursorPosition = JOURNAL_PRESET.indexOf('\n');
            textarea.setSelectionRange(cursorPosition, cursorPosition);
        }

        function resetEntryUI() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerEndTime = null;

            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.textContent = "Ready to write";
            timerDisplay.classList.remove('active');
            timerDisplay.style.color = "";

            const startBtn = document.getElementById('start-btn');
            startBtn.disabled = false;
            startBtn.textContent = "Start 5-Min Timer";

            document.getElementById('save-btn').style.display = "none";

            const entryText = document.getElementById('entry-text');
            entryText.style.borderColor = "var(--border)";
            loadPreset();
        }

        document.getElementById('save-btn').addEventListener('click', function() {
            const text = document.getElementById('entry-text').value;
            const project = getCurrentProject();

            if (!text.trim() || text === JOURNAL_PRESET) { alert("Please fill out the journal before saving."); return; }

            logs.unshift({
                time: nowTimeString(),
                timestamp: Date.now(),
                text: text,
                project: project
            });
            saveLocal();
            renderLogs();
            populateProjectSuggestions();

            resetEntryUI();

            if (cloudUser) cloudSaveNow();
        });

        // ============================================================
        // 6b. WRAP UP — inherits last real project's name
        // ============================================================
        window.wrapUpDay = function () {
            if (logs.length === 0) {
                alert("Nothing to wrap up yet — add at least one entry first.");
                return;
            }

            // Find the most recent entry that's NOT a wrap-up and NOT
            // a break — that's the project we're closing out.
            let lastRealProject = null;
            for (let i = 0; i < logs.length; i++) {
                const p = logs[i].project || DEFAULT_PROJECT;
                if (!isSpecialProject(p)) {
                    lastRealProject = p;
                    break;
                }
            }
            // If everything so far was a break, just use "General".
            const projectName = lastRealProject || DEFAULT_PROJECT;

            const note = prompt(
                `Wrap up "${projectName}" for today?\n\nThis adds a closing entry so your time totals aren't left "ongoing". Add an optional note (leave blank for a plain marker):`,
                "End of day"
            );
            if (note === null) return;

            logs.unshift({
                time: nowTimeString(),
                timestamp: Date.now(),
                text: note.trim() || "End of day",
                project: projectName,
                _isWrapUp: true
            });
            saveLocal();
            renderLogs();
            populateProjectSuggestions();
            if (cloudUser) cloudSaveNow();
        };

        // ============================================================
        // 7. TIMER
        // ============================================================
        let timerInterval;
        let timerEndTime = null;

        document.getElementById('start-btn').addEventListener('click', function() {
            const startBtn = this;
            const saveBtn = document.getElementById('save-btn');
            const timerDisplay = document.getElementById('timer-display');
            const entryText = document.getElementById('entry-text');

            startBtn.disabled = true;
            startBtn.textContent = "Writing...";
            saveBtn.style.display = "flex";
            entryText.focus();

            const now = Date.now();
            timerEndTime = now + (300 * 1000);

            if(timerInterval) clearInterval(timerInterval);
            timerDisplay.classList.add('active');
            timerDisplay.style.color = "";

            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 250);
        });

        function updateTimerDisplay() {
            if (!timerEndTime) return;
            const timerDisplay = document.getElementById('timer-display');
            const entryText = document.getElementById('entry-text');
            const msLeft = timerEndTime - Date.now();

            if (msLeft <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                timerEndTime = null;
                timerDisplay.textContent = "Time's up! Stop and save.";
                timerDisplay.style.color = "var(--danger)";
                entryText.style.borderColor = "var(--danger)";
                return;
            }

            const totalSecondsLeft = Math.ceil(msLeft / 1000);
            const minutes = Math.floor(totalSecondsLeft / 60);
            const seconds = totalSecondsLeft % 60;
            timerDisplay.textContent = `Time left: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        // ---- Duration math (used by Summary + Week) -----------------
        function computeTimeData() {
            const withTs = logs
                .filter(l => typeof l.timestamp === 'number' && !isNaN(l.timestamp))
                .slice()
                .sort((a, b) => a.timestamp - b.timestamp);

            const byProject = {};
            const nowMs = Date.now();
            let totalMs = 0;
            let pausedMs = 0;

            const untimedEntries = logs.length - withTs.length;

            for (let i = 0; i < withTs.length; i++) {
                const cur = withTs[i];
                const next = withTs[i + 1];
                const project = cur.project || DEFAULT_PROJECT;
                const durationMs = next ? (next.timestamp - cur.timestamp) : (nowMs - cur.timestamp);

                // An entry explicitly marked as a wrap-up should not
                // contribute its own duration to its project — it's just
                // a marker. Skip it (its own gap gets absorbed by the
                // previous entry's duration which is exactly what we
                // want — that block ran until this marker was placed).
                if (cur._isWrapUp) continue;

                if (!byProject[project]) {
                    byProject[project] = { ms: 0, entries: 0, hasWarning: false, paused: false };
                }
                byProject[project].entries += 1;
                if (isSpecialProject(project)) {
                    byProject[project].paused = true;
                    pausedMs += durationMs;
                } else {
                    byProject[project].ms += durationMs;
                    totalMs += durationMs;
                    if (durationMs > LONG_GAP_THRESHOLD_MS) {
                        byProject[project].hasWarning = true;
                    }
                }
            }

            return { byProject, totalMs, pausedMs, untimedEntries, timedCount: withTs.length };
        }

        function renderTimeSpentView(html) {
            const data = computeTimeData();

            html += `<h1>The Pause — Time Spent Today</h1>`;
            html += `<div class="summary-date">${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>`;

            if (data.timedCount === 0) {
                html += `<p style="text-align:center; color:#888; padding: 24px;">No timed entries yet. Add a couple of log entries and durations will appear here automatically.</p>`;
                document.getElementById('summary-content').innerHTML = html;
                return;
            }

            const entries = Object.entries(data.byProject);
            const realProjects = entries
                .filter(([, v]) => !v.paused && v.ms > 0)
                .sort((a, b) => b[1].ms - a[1].ms);
            const pausedProjects = entries
                .filter(([, v]) => v.paused && v.ms > 0)
                .sort((a, b) => b[1].ms - a[1].ms);

            const totalForBars = data.totalMs + data.pausedMs || 1;

            html += `<div class="time-total">`;
            if (data.totalMs > 0) {
                html += `Focus time today: <strong>${formatDuration(data.totalMs)}</strong>`;
            } else {
                html += `<strong>0m</strong> of focus time logged`;
            }
            if (data.pausedMs > 0) {
                html += `<div style="font-size: 0.8rem; color: #92400e; margin-top: 6px;">⏸️ ${formatDuration(data.pausedMs)} paused</div>`;
            }
            html += `</div>`;

            realProjects.forEach(function ([name, v]) {
                const pct = Math.round((v.ms / totalForBars) * 100);
                const safeName = escapeHtml(name);
                html += `
                    <div class="time-project">
                        <div class="time-project-header">
                            <span class="time-project-name">📁 ${safeName}</span>
                            <span class="time-project-duration">
                                ${formatDuration(v.ms)}
                                <span class="pct">${pct}%</span>
                                ${v.hasWarning ? '<span class="time-warning-icon" title="At least one gap over 2 hours was counted here — might include a break">⚠️</span>' : ''}
                            </span>
                        </div>
                        <div class="time-bar-track">
                            <div class="time-bar-fill" style="width: ${pct}%"></div>
                        </div>
                        <div class="time-project-entry-count">${v.entries} ${v.entries === 1 ? 'entry' : 'entries'}</div>
                    </div>
                `;
            });

            if (pausedProjects.length > 0) {
                html += `<div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid #eee;">`;
                html += `<div style="font-size: 0.8rem; font-weight: 600; color: #92400e; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px;">⏸️ Paused / Break Time</div>`;
                pausedProjects.forEach(function ([name, v]) {
                    const pct = Math.round((v.ms / totalForBars) * 100);
                    const safeName = escapeHtml(name);
                    html += `
                        <div class="time-project">
                            <div class="time-project-header">
                                <span class="time-project-name" style="color:#92400e;">${safeName}</span>
                                <span class="time-project-duration" style="color:#92400e;">
                                    ${formatDuration(v.ms)}
                                    <span class="pct">${pct}%</span>
                                </span>
                            </div>
                            <div class="time-bar-track">
                                <div class="time-bar-fill paused" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            html += `<div class="time-note">`;
            html += `ⓘ Durations are estimated from the gaps between your log entries. Each entry "owns" the time between it and the next one. The most recent entry runs until now.`;
            if (data.untimedEntries > 0) {
                html += `<br><br>Note: ${data.untimedEntries} older ${data.untimedEntries === 1 ? 'entry has' : 'entries have'} no timestamp and aren't counted in durations.`;
            }
            html += `</div>`;

            document.getElementById('summary-content').innerHTML = html;
        }

        function renderSummary() {
            const content = document.getElementById('summary-content');
            let html = '';

            if (logs.length === 0) {
                html = `<h1>The Pause — Daily Reflection</h1>`;

            if (currentSummaryView === 'time') {

            html += `<h1>The Pause — Daily Reflection</h1>`;
            html += `<div class="summary-date">${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>`;

            if (currentSummaryView === 'timeline') {

                            <div class="summary-entry-text">${safeText}</div>

            } else {
                const grouped = {};
                logs.forEach(log => {
                    const p = log.project || DEFAULT_PROJECT;
                    if (!grouped[p]) grouped[p] = [];
                    grouped[p].push(log);
                });

                const sortedProjects = Object.keys(grouped).sort((a, b) => grouped[b].length - grouped[a].length);

                sortedProjects.forEach(projectName => {
                    const projectLogs = grouped[projectName];
                    const safeProject = escapeHtml(projectName);
                    const pausedStyle = isSpecialProject(projectName) ? ' style="color: #92400e; border-bottom-color: #fbbf24;"' : '';

                    html += `
                        <div class="summary-project-group">
                            <div class="summary-project-header"${pausedStyle}>
                                <span>${isSpecialProject(projectName) ? '⏸️' : '📁'} ${safeProject}</span>
                                <span class="summary-project-count">${projectLogs.length} ${projectLogs.length === 1 ? 'entry' : 'entries'}</span>
                            </div>

                    [...projectLogs].reverse().forEach(log => {

                                <div class="summary-entry-text">${safeText}</div>

                    });
                    html += `</div>`;
                });
            }

            content.innerHTML = html;
        }

                ? 'Stacked view — each day shows its projects as blocks. Taller blocks = more time spent. Click any block to see that day\'s entries.'
                : 'Time Axis view — each block is positioned at the actual time of day it happened, so you can see when in the day you worked on each project.';

        // Returns the sum of a project's duration for a given day.
        function computeDayProjectDurations(dayKey_) {
            const dayLogs = logs
                .filter(l => typeof l.timestamp === 'number' && !isNaN(l.timestamp) && dateKey(l.timestamp) === dayKey_)
                .sort((a, b) => a.timestamp - b.timestamp);
            if (dayLogs.length === 0) return {};

            const byProject = {};
            const nowMs = Date.now();
            const nextDayStart = new Date(dayKey_ + 'T00:00:00');
            nextDayStart.setDate(nextDayStart.getDate() + 1);
            const nextDayStartMs = nextDayStart.getTime();

            for (let i = 0; i < dayLogs.length; i++) {
                const cur = dayLogs[i];
                const next = dayLogs[i + 1];
                const project = cur.project || DEFAULT_PROJECT;
                // If this is the last entry of the day: run until the
                // next entry if there is one; otherwise until "now", but
                // capped at the end of this calendar day so a very old
                // last entry doesn't report days of ongoing time.
                let endMs;
                if (next) {
                    endMs = next.timestamp;
                } else {
                    endMs = Math.min(nowMs, nextDayStartMs);
                }
                const durationMs = Math.max(0, endMs - cur.timestamp);
                if (cur._isWrapUp) continue;

                if (!byProject[project]) byProject[project] = { ms: 0, entries: 0, paused: isSpecialProject(project), timestamps: [] };
                byProject[project].ms += durationMs;
                byProject[project].entries += 1;
                byProject[project].timestamps.push(cur.timestamp);
            }
            return byProject;
        }

        function renderWeekView() {
            if (!weekStartDate) weekStartDate = getMondayOf(new Date());
            const monday = new Date(weekStartDate);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            // Week label
            const mLabel = monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const sLabel = sunday.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('week-label').textContent = mLabel + ' – ' + sLabel;

            // Prev/next limits — don't allow navigating to future weeks
            const thisMonday = getMondayOf(new Date());
            document.getElementById('week-next-btn').disabled = monday.getTime() >= thisMonday.getTime();

            // Days of this week
            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                days.push(d);
            }

            const todayKey_ = todayKey();

            // Gather per-day data
            const dayData = days.map(d => {
                const dk = dateKey(d.getTime());
                const projects = computeDayProjectDurations(dk);
                const totalMs = Object.values(projects).reduce((s, p) => s + (p.paused ? 0 : p.ms), 0);
                const pausedMs = Object.values(projects).reduce((s, p) => s + (p.paused ? p.ms : 0), 0);
                return { date: d, key: dk, projects: projects, totalMs: totalMs, pausedMs: pausedMs };
            });

            // Week summary
            const weekTotalMs = dayData.reduce((s, d) => s + d.totalMs, 0);
            const weekPausedMs = dayData.reduce((s, d) => s + d.pausedMs, 0);
            const allProjectsThisWeek = new Set();
            dayData.forEach(d => Object.keys(d.projects).forEach(p => allProjectsThisWeek.add(p)));

            const summaryEl = document.getElementById('week-summary');
            if (weekTotalMs === 0 && weekPausedMs === 0) {
                summaryEl.innerHTML = '';
            } else {
                summaryEl.innerHTML = `
                    <div class="week-summary-row">
                        <div class="week-summary-item"><strong>${formatDuration(weekTotalMs)}</strong><span>Focus time</span></div>
                        <div class="week-summary-item"><strong>${formatDuration(weekPausedMs)}</strong><span>Paused</span></div>
                        <div class="week-summary-item"><strong>${allProjectsThisWeek.size}</strong><span>Projects</span></div>
                    </div>
                `;
            }

            // Build the grid
            const gridEl = document.getElementById('week-grid-container');

            if (weekMode === 'stacked') {
                let html = '<div class="week-grid">';
                dayData.forEach(day => {
                    const isToday = day.key === todayKey_;
                    html += `<div class="week-col ${isToday ? 'today' : ''}">`;
                    html += `<div class="week-col-header">`;
                    html += `<div class="week-col-day">${day.date.toLocaleDateString('en-US', { weekday: 'short' })}</div>`;
                    html += `<div class="week-col-date">${day.date.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' })}</div>`;
                    if (day.totalMs > 0) {
                        html += `<div class="week-col-total">${formatDuration(day.totalMs)}</div>`;
                    } else {
                        html += `<div class="week-col-total empty">—</div>`;
                    }
                    html += `</div>`;

                    // Stacked blocks: sort by project duration desc
                    const projectEntries = Object.entries(day.projects).sort((a, b) => b[1].ms - a[1].ms);
                    if (projectEntries.length === 0) {
                        html += `<div style="flex:1; display:flex; align-items:center; justify-content:center; color:#cbd5e1; font-size:0.7rem;">—</div>`;
                    } else {
                        html += `<div class="week-blocks">`;
                        // Total for proportional sizing (excluding paused from scaling the "work" area but including for context)
                        const totalForScale = projectEntries.reduce((s, [, v]) => s + v.ms, 0) || 1;
                        // Each block gets a min height of 22px so short ones are clickable, but the total of all mins is bounded
                        projectEntries.forEach(([name, v]) => {
                            const color = projectColor(name);
                            // Proportional: proportional to its share × a virtual height (say 140px of usable space)
                            const share = v.ms / totalForScale;
                            const height = Math.max(24, Math.round(share * 140));
                            const safeName = escapeHtml(name);
                            const duration = formatDuration(v.ms);
                            html += `<div class="week-block" style="background:${color}; height:${height}px;" onclick="openBlockDetail(event, '${day.key}', '${escapeHtml(name).replace(/'/g, '&#39;')}')" title="${safeName} · ${duration} · ${v.entries} ${v.entries === 1 ? 'entry' : 'entries'}">`;
                            html += `<div class="week-block-label"><span class="week-block-name">${safeName}</span><span class="week-block-duration">${duration}</span></div>`;
                            html += `</div>`;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
                html += '</div>';
                gridEl.innerHTML = html;
            } else {
                // Time-axis mode: 09:00–24:00 (15 hours, 40px per hour = 600px + header ~40 = 640)
                const startHour = 6;   // 6 AM
                const endHour = 24;    // midnight
                const hourHeight = 40;
                const totalHours = endHour - startHour;

                let html = '<div class="week-grid time-axis">';

                // Left column: hour labels
                html += '<div class="time-axis-col">';
                html += '<div style="height: 0;"></div>'; // header spacer
                for (let h = startHour; h <= endHour; h++) {
                    html += `<div class="time-axis-hour">${String(h).padStart(2, '0')}:00</div>`;
                }
                html += '</div>';

                // 7 day columns
                dayData.forEach(day => {
                    const isToday = day.key === todayKey_;
                    html += `<div class="week-col time-scheduled ${isToday ? 'today' : ''}">`;
                    html += `<div class="week-col-header">`;
                    html += `<div class="week-col-day">${day.date.toLocaleDateString('en-US', { weekday: 'short' })}</div>`;
                    html += `<div class="week-col-date">${day.date.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' })}</div>`;
                    if (day.totalMs > 0) {
                        html += `<div class="week-col-total">${formatDuration(day.totalMs)}</div>`;
                    }
                    html += `</div>`;

                    // Hour gridlines + absolute-positioned blocks
                    for (let h = startHour; h < endHour; h++) {
                        html += `<div style="position:absolute; left:0; right:0; top:${(h - startHour) * hourHeight + 50}px; height:1px; background:#eef2f6;"></div>`;
                    }

                    // Position each project's blocks. We only have one
                    // block per project per day (aggregated), so we place
                    // it at the project's earliest start time and give it
                    // a height proportional to its total duration.
                    Object.entries(day.projects).forEach(([name, v]) => {
                        if (!v.timestamps || v.timestamps.length === 0) return;
                        const earliest = Math.min(...v.timestamps);
                        const latest = Math.max(...v.timestamps);
                        const firstDate = new Date(earliest);
                        const lastDate = new Date(latest);

                        // Position: relative to startHour
                        const startOffsetHours = (firstDate.getHours() + firstDate.getMinutes() / 60) - startHour;
                        const topPx = Math.max(0, startOffsetHours * hourHeight) + 50;

                        // Height: proportional to total duration (min 22px)
                        const heightPx = Math.max(22, (v.ms / (60 * 60 * 1000)) * hourHeight);

                        const color = projectColor(name);
                        const safeName = escapeHtml(name);
                        const duration = formatDuration(v.ms);

                        html += `<div class="week-block-absolute" style="top:${topPx}px; height:${heightPx}px; background:${color};" onclick="openBlockDetail(event, '${day.key}', '${escapeHtml(name).replace(/'/g, '&#39;')}')" title="${safeName} · ${duration}">`;
                        html += `<span class="week-block-name">${safeName} ${duration}</span>`;
                        html += `</div>`;
                    });

                    html += `</div>`;
                });
                html += '</div>';
                gridEl.innerHTML = html;
            }

            // Legend
            const allProjects = new Set();
            dayData.forEach(d => Object.keys(d.projects).forEach(p => allProjects.add(p)));
            if (allProjects.size > 0) {
                let legendHtml = '';
                Array.from(allProjects).sort().forEach(name => {
                    const color = projectColor(name);
                    legendHtml += `<div class="week-legend-item"><span class="week-legend-swatch" style="background:${color};"></span>${escapeHtml(name)}</div>`;
                });
                document.getElementById('week-legend').innerHTML = legendHtml;
            } else {
                document.getElementById('week-legend').innerHTML = '<div class="week-empty-msg" style="padding: 0; width: 100%;">No entries this week yet.</div>';
            }
        }

        // Click on a week block → popup with that day+project's entries
        window.openBlockDetail = function (e, dayKey_, projectName) {
            e.stopPropagation();
            const existing = document.getElementById('block-detail-popover');
            if (existing) existing.remove();

            const dayLogs = logs.filter(l => {
                if (typeof l.timestamp !== 'number') return false;
                if (dateKey(l.timestamp) !== dayKey_) return false;
                if ((l.project || DEFAULT_PROJECT) !== projectName) return false;
                return true;
            });

            if (dayLogs.length === 0) return;

            const pop = document.createElement('div');
            pop.id = 'block-detail-popover';
            pop.className = 'block-detail-popover';

            let html = `<h4>📁 ${escapeHtml(projectName)} · ${relativeDateLabel(new Date(dayKey_ + 'T12:00:00').getTime())}</h4>`;
            // Newest first
            dayLogs.sort((a, b) => b.timestamp - a.timestamp).forEach(log => {
                html += `<div class="block-detail-entry">`;
                html += `<div class="block-detail-time">${log.time}</div>`;
                html += `<div class="block-detail-text">${escapeHtml(log.text)}</div>`;
                html += `</div>`;
            });
            pop.innerHTML = html;

            // Position near click
            let left = e.clientX + 10;
            let top = e.clientY + 10;
            if (left + 320 > window.innerWidth) left = window.innerWidth - 330;
            if (top + 300 > window.innerHeight) top = window.innerHeight - 310;
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';

            document.body.appendChild(pop);
        };
