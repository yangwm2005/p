<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt — Project Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#5b6472;
    --ink-faint:#8d96a3;
    --paper:#fbfbfa;
    --panel:#ffffff;
    --line:#e2e6ea;
    --line-strong:#c7ccd3;
    --accent:#2c5f7c;
    --accent-child:#5f8da6;
    --accent-soft:#bcd6e2;
    --accent-fill:#dcebf1;
    --amber:#c9882c;
    --rust:#b5493d;
    --rust-fill:#f6dfdb;
    --weekend:#f2f3f4;
    --row-h:40px;
    --sidebar-w:360px;
    --inspector-w:380px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    flex-wrap:wrap;
    z-index:5;
    position:relative;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:18px; font-weight:700; margin:0; letter-spacing:0.2px;}
  .brand .tick-mark{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint);
    border-left:2px solid var(--line-strong); padding-left:10px;
  }

  /* project picker */
  .project-picker{position:relative; align-self:center;}
  .project-picker-btn{
    display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500;
    padding:6px 10px; border-radius:6px; border:1px solid var(--line-strong); background:var(--panel);
  }
  .project-picker-btn .caret-down{font-size:9px; color:var(--ink-faint);}
  .project-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; width:260px; z-index:15;
    background:var(--panel); border:1px solid var(--line-strong); border-radius:8px;
    box-shadow:0 8px 22px rgba(20,26,34,0.14); overflow:hidden;
  }
  .project-list{max-height:260px; overflow-y:auto; padding:6px;}
  .project-row{
    display:flex; align-items:center; gap:6px; padding:8px 8px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  .project-row:hover{background:#fafbfc;}
  .project-row.active{background:var(--accent-fill); font-weight:600;}
  .project-row .proj-name{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .project-row .proj-actions{display:flex; gap:2px; flex-shrink:0; opacity:0; transition:opacity .12s;}
  .project-row:hover .proj-actions{opacity:1;}
  .project-row .proj-actions button{border:none; background:none; padding:3px 5px; font-size:11px; color:var(--ink-faint); border-radius:3px;}
  .project-row .proj-actions button:hover{background:var(--accent-soft);}
  .project-row .proj-actions button.danger-icon:hover{background:var(--rust-fill); color:var(--rust);}
  .project-new-row{display:flex; gap:6px; padding:8px; border-top:1px solid var(--line);}
  .project-new-row input{
    flex:1; min-width:0; border:1px solid var(--line-strong); border-radius:5px; padding:6px 8px;
    font-family:inherit; font-size:12.5px;
  }
  .project-new-row button{padding:6px 10px; font-size:12px;}
  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  button{
    font-family:'IBM Plex Sans',sans-serif; font-size:13px; cursor:pointer;
    border-radius:5px; border:1px solid var(--line-strong); background:var(--panel);
    color:var(--ink); padding:7px 12px; transition:background .12s, border-color .12s;
  }
  button:hover{background:var(--accent-fill); border-color:var(--accent-soft);}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover{background:#244c63;}
  button.ghost{border-color:transparent; padding:6px 8px;}
  button.danger{color:var(--rust); border-color:var(--rust);}
  button.danger:hover{background:var(--rust-fill);}
  button:disabled{opacity:0.4; cursor:default; pointer-events:none;}
  .zoomgroup{display:flex; border:1px solid var(--line-strong); border-radius:5px; overflow:hidden;}
  .zoomgroup button{border:none; border-radius:0; padding:6px 12px;}
  .zoomgroup button + button{border-left:1px solid var(--line-strong);}
  .zoomgroup button.active{background:var(--accent); color:#fff;}
  .toggle{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); user-select:none;}

  /* auth + sync */
  .auth-group{display:flex; align-items:center; gap:8px; padding-left:8px; border-left:1px solid var(--line);}
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex-shrink:0; transition:background .15s;}
  .sync-dot[data-state="synced"]{background:#3f9142;}
  .sync-dot[data-state="syncing"]{background:var(--amber); animation:pulse 1s infinite ease-in-out;}
  .sync-dot[data-state="error"]{background:var(--rust);}
  .sync-dot[data-state="offline"]{background:var(--line-strong);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}
  .sync-label{font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .signin-btn{display:flex; align-items:center; gap:7px; font-weight:500;}
  .signin-btn svg{flex-shrink:0;}
  .user-chip{display:flex; align-items:center; gap:7px; border:1px solid var(--line-strong); border-radius:20px; padding:3px 10px 3px 3px; background:var(--panel); cursor:pointer;}
  .user-chip:hover{background:var(--accent-fill); border-color:var(--accent-soft);}
  .user-chip img{width:22px; height:22px; border-radius:50%; display:block;}
  .user-chip .user-name{font-size:12.5px; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .auth-disabled-note{font-size:10.5px; color:var(--ink-faint); font-style:italic;}

  /* ---------- board ---------- */
  .board{flex:1; display:flex; overflow-y:auto; overflow-x:hidden; position:relative;}

  /* sidebar tree */
  .sidebar{width:var(--sidebar-w); flex-shrink:0; border-right:1px solid var(--line); background:var(--panel);}
  .sidebar-header{
    position:sticky; top:0; z-index:3; background:var(--panel);
    height:var(--row-h); display:flex; align-items:center; padding:0 14px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint);
    font-weight:600; border-bottom:1px solid var(--line-strong);
  }
  .tree-row{
    display:flex; align-items:center; gap:4px;
    height:var(--row-h); padding:0 8px 0 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer; position:relative;
  }
  .tree-row:hover{background:#fafbfc;}
  .tree-row:hover .quick-del{opacity:1;}
  .tree-row.selected{background:var(--accent-fill);}
  .tree-row .indent{flex-shrink:0;}
  .tree-row .caret{
    flex-shrink:0; width:18px; height:18px; display:flex; align-items:center; justify-content:center;
    border:none; background:none; color:var(--ink-soft); font-size:9px; padding:0; border-radius:3px;
  }
  .tree-row .caret:hover{background:var(--accent-soft);}
  .tree-row .caret.spacer{visibility:hidden; pointer-events:none;}
  .tree-row .title{
    flex:1; min-width:0; font-size:13px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tree-row.depth-0 .title{font-weight:600;}
  .tree-row .meta{
    flex-shrink:0; font-size:10px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; margin-right:2px;
  }
  .tree-row .quick-del{
    flex-shrink:0; opacity:0; transition:opacity .12s; border:none; background:none;
    color:var(--ink-faint); font-size:12px; width:20px; height:20px; border-radius:3px;
  }
  .tree-row .quick-del:hover{background:var(--rust-fill); color:var(--rust);}
  .drag-handle{
    flex-shrink:0; width:14px; align-self:stretch; display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint); font-size:12px; cursor:grab; opacity:0; transition:opacity .12s; touch-action:none;
  }
  .tree-row:hover .drag-handle{opacity:1;}
  .drag-handle:active{cursor:grabbing;}
  .tree-row.drag-source{opacity:0.4;}
  .tree-row.drop-target-inside{outline:2px solid var(--accent); outline-offset:-2px; background:var(--accent-fill);}
  .drag-ghost{
    position:fixed; z-index:50; pointer-events:none; background:var(--ink); color:#fff;
    font-size:12px; padding:5px 10px; border-radius:5px; box-shadow:0 4px 10px rgba(0,0,0,.25);
    max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0.95;
  }
  .drop-indicator-line{
    position:fixed; height:3px; background:var(--accent); border-radius:2px; z-index:49; pointer-events:none;
  }
  .drop-indicator-line::before{
    content:""; position:absolute; left:-4px; top:-3px; width:9px; height:9px; border-radius:50%; background:var(--accent);
  }
  .root-drop-zone{
    margin:6px 10px; padding:9px; border:1px dashed var(--line-strong); border-radius:6px;
    text-align:center; font-size:11.5px; color:var(--ink-faint); display:none;
  }
  .root-drop-zone.dragover{background:var(--accent-fill); border-color:var(--accent); color:var(--accent);}
  .addrow{padding:10px;}
  .addrow button{width:100%;}
  .empty-state{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .empty-state h2{font-size:15px; margin:0 0 6px;}
  .empty-state p{font-size:13px; margin:0; color:var(--ink-faint);}

  /* timeline */
  .timeline-wrap{flex:1; overflow-x:auto; overflow-y:visible; position:relative;}
  .ruler{position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--line-strong);}
  .ruler-months{height:24px; position:relative; border-bottom:1px solid var(--line);}
  .ruler-days{height:16px; position:relative;}
  .month-label{
    position:absolute; top:0; height:24px; display:flex; align-items:center;
    font-size:11px; font-weight:600; color:var(--ink-soft); padding-left:6px;
    border-left:1px solid var(--line-strong); white-space:nowrap; overflow:hidden;
  }
  .day-tick{
    position:absolute; top:0; height:16px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--ink-faint); border-left:1px solid var(--line);
  }
  .day-tick.week-start{border-left:1px solid var(--line-strong); color:var(--ink-soft); font-weight:600;}
  .day-tick.weekend-tick{background:var(--weekend);}

  .timeline-body{position:relative;}
  .gridlines{position:absolute; top:0; left:0; bottom:0; z-index:0;}
  .gline{position:absolute; top:0; bottom:0; border-left:1px solid var(--line);}
  .gline.week{border-left:1px solid var(--line-strong);}
  .gweekend{position:absolute; top:0; bottom:0; background:var(--weekend);}
  .row-track{position:absolute; left:0; right:0; border-bottom:1px solid var(--line);}

  #depLayer{position:absolute; top:0; left:0; z-index:1; pointer-events:none; overflow:visible;}
  #barsLayer{position:absolute; top:0; left:0; z-index:2;}

  .today-line{position:absolute; top:0; bottom:0; width:0; border-left:2px dashed var(--amber); z-index:1; pointer-events:none;}
  .today-flag{
    position:absolute; top:2px; transform:translateX(-50%); background:var(--amber); color:#fff;
    font-size:9px; font-weight:600; font-family:'IBM Plex Mono',monospace; padding:2px 5px; border-radius:3px;
    white-space:nowrap; z-index:4;
  }

  .bar{
    position:absolute; height:24px; margin-top:8px; border-radius:4px; background:var(--accent);
    box-shadow:0 1px 2px rgba(28,36,48,0.18); cursor:grab; display:flex; align-items:center;
    user-select:none; touch-action:none;
  }
  .bar:active{cursor:grabbing;}
  .bar.depth-gt0{background:var(--accent-child);}
  .bar.overdue{background:var(--rust);}
  .bar.selected{box-shadow:0 0 0 2px var(--ink), 0 1px 2px rgba(28,36,48,0.18);}
  .bar .bar-label{color:#fff; font-size:11px; font-weight:500; padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;}
  .bar .handle{position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; touch-action:none;}
  .bar .handle.l{left:0; border-radius:4px 0 0 4px;}
  .bar .handle.r{right:0; border-radius:0 4px 4px 0;}
  .bar .handle:hover{background:rgba(255,255,255,0.25);}

  footer{text-align:center; font-size:11px; color:var(--ink-faint); padding:8px; border-top:1px solid var(--line); background:var(--panel);}

  /* ---------- inspector ---------- */
  .backdrop{position:fixed; inset:0; background:transparent; z-index:19; display:none;}
  .backdrop.show{display:block;}
  .inspector{
    position:fixed; top:0; right:0; bottom:0; width:var(--inspector-w);
    background:var(--panel); border-left:1px solid var(--line-strong);
    box-shadow:-6px 0 18px rgba(20,26,34,0.10);
    transform:translateX(100%); transition:transform .18s ease;
    z-index:20; display:flex; flex-direction:column;
  }
  .inspector.open{transform:translateX(0);}
  .inspector-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .inspector-eyebrow{font-size:11px; color:var(--ink-faint);}
  .inspector-body{display:flex; gap:18px; padding:18px; flex:1; overflow-y:auto;}
  .inspector-col{flex:1; display:flex; flex-direction:column; min-width:0;}
  .inspector-col.left{border-right:1px solid var(--line); padding-right:16px;}
  .inspector label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); font-weight:600; margin-bottom:6px; display:block;}
  #inspTitle{
    font-size:15px; padding:9px 10px; border:1px solid var(--line-strong); border-radius:5px;
    font-family:inherit; width:100%;
  }
  .hint{font-size:11.5px; color:var(--ink-faint); margin:8px 0 0; line-height:1.4;}
  #inspPred{
    width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:5px;
    font-size:12.5px;
  }
  .settings-label{margin-bottom:14px;}
  .date-block{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .date-block-label{font-size:12px; color:var(--ink-soft);}
  .date-selects{display:flex; gap:6px;}
  .date-selects select{flex:1; min-width:0; padding:6px 2px; border:1px solid var(--line-strong); border-radius:5px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:#fff;}
  .duration-readout{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .inspector-actions{display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .inspector-actions button{flex:1; min-width:90px;}

  @media (max-width:900px){
    :root{--inspector-w:100%;}
  }
  @media (max-width:760px){
    :root{--sidebar-w:230px;}
    .tree-row .meta{display:none;}
  }

  /* ---------- print view ---------- */
  #printArea{ display:none; }
  .print-header{ margin-bottom:14px; }
  .print-header h1{ font-size:20px; margin:0 0 4px; font-weight:700; }
  .print-meta{ font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }
  .print-table{ width:100%; border-collapse:collapse; font-size:11px; }
  .print-table th{
    text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--ink-faint); font-weight:600; padding:0 8px 6px; border-bottom:1.5px solid var(--ink);
    vertical-align:bottom;
  }
  .print-table td{ padding:4px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .print-table tr.depth-0 td.print-name{ font-weight:700; }
  .print-name-cell{ display:flex; align-items:center; }
  .print-dates, .print-pred{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); white-space:nowrap; }
  .print-timeline-th{ padding-bottom:0; }
  .print-month-band{ display:flex; width:100%; border-bottom:1.5px solid var(--ink); padding-bottom:5px; }
  .print-month-seg{ font-size:9px; font-weight:600; color:var(--ink-soft); border-left:1px solid var(--line-strong); padding-left:4px; overflow:hidden; white-space:nowrap; }
  .print-month-seg:first-child{ border-left:none; }
  .print-bar-track{ position:relative; height:18px; }
  .print-bar{ position:absolute; top:2px; height:14px; border-radius:2.5px; background:var(--accent); box-shadow:0 0.5px 0 rgba(0,0,0,0.15); }
  .print-bar.depth-gt0{ background:var(--accent-child); }
  .print-bar.overdue{ background:var(--rust); }
  .print-bar-label{ position:absolute; top:2px; height:14px; display:flex; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--ink-faint); white-space:nowrap; }
  .print-footer{ margin-top:16px; font-size:9.5px; color:var(--ink-faint); text-align:center; }

  @media print{
    @page{ size: landscape; margin: 12mm; }
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; }
    .print-table thead{ display:table-header-group; }
    .print-table tr{ break-inside:avoid; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>Gantt</h1>
    <div class="project-picker" id="projectPicker">
      <button class="project-picker-btn" id="projectPickerBtn">
        <span id="activeProjectName">Loading…</span>
        <span class="caret-down">▾</span>
      </button>
      <div class="project-dropdown" id="projectDropdown" style="display:none;">
        <div class="project-list" id="projectList"></div>
        <div class="project-new-row">
          <input type="text" id="newProjectInput" placeholder="New project name…" maxlength="80">
          <button id="newProjectBtn" class="primary">+ Add</button>
        </div>
      </div>
    </div>
    <span class="tick-mark" id="taskCountLabel">0 tasks</span>
  </div>
  <div class="controls">
    <label class="toggle">
      <input type="checkbox" id="autoShiftToggle" checked>
      Auto-shift dependents
    </label>
    <div class="zoomgroup">
      <button id="zoomDay" class="active">Day</button>
      <button id="zoomWeek">Week</button>
    </div>
    <button id="todayBtn" class="ghost" title="Scroll to today">Today</button>
    <button id="printBtn" class="ghost" title="Print or save as PDF">Print</button>
    <button id="exportBtn" class="ghost" title="Export tasks as JSON">Export</button>
    <button id="importBtn" class="ghost" title="Import tasks from JSON">Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <button id="addTaskBtn" class="primary">+ Add task</button>
    <div class="auth-group" id="authGroup">
      <span class="sync-dot" id="syncDot" data-state="offline" title="Not signed in"></span>
      <button id="signInBtn" class="ghost signin-btn">
        <svg width="15" height="15" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.95v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.05l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.95L3.97 7.28C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Sign in
      </button>
      <div class="user-chip" id="userChip" style="display:none;" title="Click to sign out">
        <img id="userAvatar" src="" alt="">
        <span class="user-name" id="userName"></span>
      </div>
    </div>
  </div>
</div>

<div class="board" id="board">
  <div class="sidebar">
    <div class="sidebar-header">Tasks</div>
    <div id="taskRows"></div>
    <div class="root-drop-zone" id="rootDropZone">Drop here to make top-level</div>
    <div class="addrow"><button id="addTaskBtn2">+ Add task</button></div>
  </div>
  <div class="timeline-wrap" id="timelineWrap">
    <div class="ruler">
      <div class="ruler-months" id="rulerMonths"></div>
      <div class="ruler-days" id="rulerDays"></div>
    </div>

  </div>

<!-- Inspector panel -->
<div class="backdrop" id="backdrop"></div>
<div class="inspector" id="inspector" aria-hidden="true">
  <div class="inspector-header">
    <span class="inspector-eyebrow mono">Task #<span id="inspNum"></span></span>
    <button id="inspClose" class="ghost" title="Close">✕</button>
  </div>
  <div class="inspector-body">
    <div class="inspector-col left">
      <label for="inspTitle">Title</label>
      <input type="text" id="inspTitle" placeholder="Task name">

        <span class="date-block-label">End date</span>
        <div class="date-selects" id="inspEndSelects"></div>

    <button id="inspAddChild">+ Sub-task</button>
    <button id="inspDelete" class="danger">Delete</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- constants ----------
  var STORE_KEY = "gantt_v2_tasks";
  var ZOOM_KEY = "gantt_v2_zoom";
  var SHIFT_KEY = "gantt_v2_autoshift";
  var ROW_H = 40;
  var ZOOMS = { day: 40, week: 13 };
  var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  // ---------- firebase config (shared qtodo-syn project) ----------
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCn-INjtwiFoS66VXAADfVLLAqmjJOyksc",
    authDomain: "qtodo-syn.firebaseapp.com",
    projectId: "qtodo-syn",
    storageBucket: "qtodo-syn.firebasestorage.app",
    messagingSenderId: "663058774385",
    appId: "1:663058774385:web:a2972f2eb032c8cc4d5ed0"
  };
  var CLOUD_FIELD = "ganttProjects";
  var CLOUD_UPDATED_FIELD = "ganttProjectsUpdatedAt";
  var firebaseReady = false;
  var auth = null, db = null;
  var currentUser = null;
  var cloudUnsub = null;
  var cloudSaveTimer = null;
  var lastSyncedJSON = null;
  var applyingRemote = false;

  // ---------- date helpers (local-time safe) ----------
  function parseDate(str){
    var parts = str.split("-").map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function formatDate(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
  function daysBetween(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }
  function todayDate(){ var n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function monthLabel(d){ return d.toLocaleDateString(undefined,{month:"short", year:"numeric"}); }
  function shortLabel(d){ return MONTH_NAMES[d.getMonth()] + " " + d.getDate(); }
  function daysInMonth(year, month){ return new Date(year, month+1, 0).getDate(); }
  function uid(){ return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  // ---------- state ----------
  var PROJECTS_KEY = "gantt_v2_projects";
  var ACTIVE_PROJECT_KEY = "gantt_v2_activeProject";
  var projects = {};
  var activeProjectId = null;
  var tasks = [];
  loadProjects();
  tasks = projects[activeProjectId].tasks;

  var zoom = localStorage.getItem(ZOOM_KEY) || "day";
  var autoShift = localStorage.getItem(SHIFT_KEY) !== "0";
  var currentInspectId = null;

  function normalizeTask(t){
    return {
      id: t.id, name: t.name, start: t.start, end: t.end,
      pred: Array.isArray(t.pred) ? t.pred : [],
      parentId: t.parentId || null,
      collapsed: !!t.collapsed
    };
  }
  function seedTasks(){
    var t = todayDate();
    function iso(offset){ return formatDate(addDays(t, offset)); }
    var p1=uid(), c1=uid(), c2=uid(), p2=uid(), c3=uid(), c4=uid();
    return [
      { id:p1, name:"Plan & design",      start:iso(-2), end:iso(6),  pred:[],   parentId:null, collapsed:false },
      { id:c1, name:"Define project scope", start:iso(-2), end:iso(1), pred:[],   parentId:p1,   collapsed:false },
      { id:c2, name:"Design data model",    start:iso(2),  end:iso(6), pred:[c1], parentId:p1,   collapsed:false },
      { id:p2, name:"Build & ship",       start:iso(7),  end:iso(17), pred:[],   parentId:null, collapsed:false },
      { id:c3, name:"Build prototype",      start:iso(7),  end:iso(13), pred:[c2], parentId:p2, collapsed:false },
      { id:c4, name:"Test & review",        start:iso(14), end:iso(17), pred:[c3], parentId:p2, collapsed:false }
    ];
  }

  function loadProjects(){
    try{
      var raw = localStorage.getItem(PROJECTS_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        var ids = Object.keys(parsed);
        if(ids.length){
          ids.forEach(function(id){
            projects[id] = {
              id: id,
              name: parsed[id].name || "Untitled project",
              tasks: Array.isArray(parsed[id].tasks) ? parsed[id].tasks.map(normalizeTask) : []
            };
          });
          activeProjectId = localStorage.getItem(ACTIVE_PROJECT_KEY);
          if(!activeProjectId || !projects[activeProjectId]) activeProjectId = ids[0];
          return;
        }
      }
    }catch(e){ console.error("Failed to load projects", e); }

    // migration path: earlier versions stored one flat task list under STORE_KEY
    try{
      var oldRaw = localStorage.getItem(STORE_KEY);
      if(oldRaw){
        var oldTasks = JSON.parse(oldRaw).map(normalizeTask);
        var mid = uid();
        projects[mid] = { id:mid, name:"My Gantt Chart", tasks: oldTasks };
        activeProjectId = mid;
        localStorage.removeItem(STORE_KEY);
        return;
      }
    }catch(e){ console.error("Failed to migrate legacy tasks", e); }

    // brand new install
    var id2 = uid();
    projects[id2] = { id:id2, name:"My Gantt Chart", tasks: seedTasks() };
    activeProjectId = id2;
  }

  function saveProjectsLocal(){
    try{
      var out = {};
      Object.keys(projects).forEach(function(id){
        out[id] = { name: projects[id].name, tasks: projects[id].tasks };
      });
      localStorage.setItem(PROJECTS_KEY, JSON.stringify(out));
      if(activeProjectId) localStorage.setItem(ACTIVE_PROJECT_KEY, activeProjectId);
    }catch(e){ console.error("Failed to save projects", e); }
  }

  function saveTasks(){
    if(activeProjectId && projects[activeProjectId]) projects[activeProjectId].tasks = tasks;
    saveProjectsLocal();
    if(!applyingRemote) scheduleCloudSave();
  }

  // ---------- project picker ----------
  var projectPickerEl = document.getElementById("projectPicker");
  var projectPickerBtnEl = document.getElementById("projectPickerBtn");
  var projectDropdownEl = document.getElementById("projectDropdown");
  var projectListEl = document.getElementById("projectList");
  var activeProjectNameEl = document.getElementById("activeProjectName");
  var newProjectInputEl = document.getElementById("newProjectInput");
  var newProjectBtnEl = document.getElementById("newProjectBtn");

  function renderProjectPicker(){
    var active = projects[activeProjectId];
    activeProjectNameEl.textContent = active ? active.name : "Untitled project";

    projectListEl.innerHTML = "";
    Object.keys(projects).sort(function(a,b){
      return projects[a].name.localeCompare(projects[b].name);
    }).forEach(function(id){
      var p = projects[id];
      var row = document.createElement("div");
      row.className = "project-row" + (id===activeProjectId ? " active" : "");

      var name = document.createElement("div");
      name.className = "proj-name";
      name.textContent = p.name;
      row.appendChild(name);

      var actions = document.createElement("div");
      actions.className = "proj-actions";

      var renameBtn = document.createElement("button");
      renameBtn.textContent = "✎";
      renameBtn.title = "Rename";
      renameBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        renameProject(id);
      });
      actions.appendChild(renameBtn);

      var delBtn = document.createElement("button");
      delBtn.textContent = "✕";
      delBtn.className = "danger-icon";
      delBtn.title = "Delete project";
      delBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        deleteProject(id);
      });
      actions.appendChild(delBtn);

      row.appendChild(actions);
      row.addEventListener("click", function(){ switchProject(id); });
      projectListEl.appendChild(row);
    });
  }

  function switchProject(id){
    if(!projects[id] || id === activeProjectId){ closeProjectDropdown(); return; }
    activeProjectId = id;
    tasks = projects[id].tasks;
    saveProjectsLocal();
    closeInspector();
    closeProjectDropdown();
    render();
    renderProjectPicker();
  }

  function createProject(name){
    var trimmed = (name || "").trim();
    var id = uid();
    projects[id] = { id:id, name: trimmed || "Untitled project", tasks: [] };
    activeProjectId = id;
    tasks = projects[id].tasks;
    saveProjectsLocal();
    closeInspector();
    closeProjectDropdown();
    render();
    renderProjectPicker();
  }

  function renameProject(id){
    var p = projects[id];
    if(!p) return;
    var name = prompt("Rename project", p.name);
    if(name === null) return;
    name = name.trim();
    if(!name) return;
    p.name = name;
    saveProjectsLocal();
    if(!applyingRemote) scheduleCloudSave();
    renderProjectPicker();
  }

  function deleteProject(id){
    var p = projects[id];
    if(!p) return;
    if(Object.keys(projects).length <= 1){
      alert("You need at least one project — create a new one before deleting this.");
      return;
    }
    if(!confirm('Delete project "' + p.name + '" and all its tasks? This cannot be undone.')) return;
    delete projects[id];
    if(activeProjectId === id){
      var nextId = Object.keys(projects)[0];
      activeProjectId = nextId;
      tasks = projects[nextId].tasks;
      closeInspector();
    }
    saveProjectsLocal();
    if(!applyingRemote) scheduleCloudSave();
    render();
    renderProjectPicker();
  }

  function openProjectDropdown(){
    projectDropdownEl.style.display = "block";
    newProjectInputEl.value = "";
  }
  function closeProjectDropdown(){
    projectDropdownEl.style.display = "none";
  }
  function toggleProjectDropdown(){
    if(projectDropdownEl.style.display === "block") closeProjectDropdown();
    else openProjectDropdown();
  }

  projectPickerBtnEl.addEventListener("click", function(e){
    e.stopPropagation();
    toggleProjectDropdown();
  });
  newProjectBtnEl.addEventListener("click", function(){
    if(newProjectInputEl.value.trim()) createProject(newProjectInputEl.value);
  });
  newProjectInputEl.addEventListener("keydown", function(e){
    if(e.key === "Enter" && newProjectInputEl.value.trim()) createProject(newProjectInputEl.value);
  });
  document.addEventListener("click", function(e){
    if(!projectPickerEl.contains(e.target)) closeProjectDropdown();
  });

  // ---------- firebase auth + firestore sync ----------
  var syncDotEl, signInBtnEl, userChipEl, userAvatarEl, userNameEl;

  function setSyncState(state, label){
    if(!syncDotEl) return;
    syncDotEl.dataset.state = state;
    syncDotEl.title = label || state;
  }

  function initFirebase(){
    syncDotEl = document.getElementById("syncDot");
    signInBtnEl = document.getElementById("signInBtn");
    userChipEl = document.getElementById("userChip");
    userAvatarEl = document.getElementById("userAvatar");
    userNameEl = document.getElementById("userName");

    var looksUnconfigured = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("PASTE_") === 0;
    if(looksUnconfigured || typeof firebase === "undefined"){
      firebaseReady = false;
      setSyncState("offline", "Cloud sync not configured — add your Firebase apiKey in the script");
      signInBtnEl.disabled = true;
      signInBtnEl.title = "Add your Firebase apiKey in the script to enable sign-in";
      return;
    }

    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
      db = firebase.firestore();
      firebaseReady = true;
      setSyncState("offline", "Not signed in");
    }catch(e){
      console.error("Firebase init failed", e);
      firebaseReady = false;
      setSyncState("error", "Firebase failed to initialize");
      signInBtnEl.disabled = true;
      return;
    }

    signInBtnEl.addEventListener("click", function(){
      var provider = new firebase.auth.GoogleAuthProvider();
      setSyncState("syncing", "Signing in…");
      auth.signInWithPopup(provider).catch(function(err){
        console.error("Sign-in failed", err);
        setSyncState("error", "Sign-in failed: " + err.message);
      });
    });
    userChipEl.addEventListener("click", function(){
      if(!confirm("Sign out of Google? Your tasks stay saved on this device either way.")) return;
      auth.signOut();
    });

    auth.onAuthStateChanged(function(user){
      currentUser = user;
      if(user){
        signInBtnEl.style.display = "none";
        userChipEl.style.display = "flex";
        userAvatarEl.src = user.photoURL || "";
        userNameEl.textContent = user.displayName || user.email || "Signed in";
        subscribeToCloud(user.uid);
      } else {
        signInBtnEl.style.display = "flex";
        userChipEl.style.display = "none";
        unsubscribeCloud();
        setSyncState("offline", "Not signed in");
      }
    });
  }

  function subscribeToCloud(firebaseUid){
    unsubscribeCloud();
    setSyncState("syncing", "Connecting…");
    cloudUnsub = db.collection("users").doc(firebaseUid).onSnapshot(function(snap){
      if(snap.metadata.hasPendingWrites) return; // ignore our own optimistic echo
      var data = snap.data() || {};
      var remote = data[CLOUD_FIELD];
      if(!remote || typeof remote !== "object" || !Object.keys(remote).length){
        // nothing in the cloud yet for this app — push what we have locally
        setSyncState("synced", "Synced");
        pushToCloud();
        return;
      }
      var remoteJSON = JSON.stringify(remote);
      if(remoteJSON === lastSyncedJSON){
        setSyncState("synced", "Synced");
        return;
      }
      applyingRemote = true;
      var newProjects = {};
      Object.keys(remote).forEach(function(id){
        newProjects[id] = {
          id: id,
          name: remote[id].name || "Untitled project",
          tasks: Array.isArray(remote[id].tasks) ? remote[id].tasks.map(normalizeTask) : []
        };
      });
      projects = newProjects;
      if(!projects[activeProjectId]){
        var ids = Object.keys(projects);
        if(ids.length){
          activeProjectId = ids[0];
        } else {
          var freshId = uid();
          projects[freshId] = { id:freshId, name:"My Gantt Chart", tasks: [] };
          activeProjectId = freshId;
        }
      }
      tasks = projects[activeProjectId].tasks;
      lastSyncedJSON = remoteJSON;
      saveProjectsLocal();
      closeInspector();
      render();
      renderProjectPicker();
      applyingRemote = false;
      setSyncState("synced", "Synced");
    }, function(err){
      console.error("Cloud sync error", err);
      setSyncState("error", "Sync error: " + err.message);
    });
  }

  function unsubscribeCloud(){
    if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
    if(cloudSaveTimer){ clearTimeout(cloudSaveTimer); cloudSaveTimer = null; }
    lastSyncedJSON = null;
  }

  function scheduleCloudSave(){
    if(!firebaseReady || !currentUser) return;
    if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
    setSyncState("syncing", "Saving…");
    cloudSaveTimer = setTimeout(pushToCloud, 700);
  }

  function pushToCloud(){
    if(!firebaseReady || !currentUser) return;
    var out = {};
    Object.keys(projects).forEach(function(id){
      out[id] = { name: projects[id].name, tasks: projects[id].tasks };
    });
    var json = JSON.stringify(out);
    if(json === lastSyncedJSON){ setSyncState("synced", "Synced"); return; }
    var payload = {};
    payload[CLOUD_FIELD] = out;
    payload[CLOUD_UPDATED_FIELD] = firebase.firestore.FieldValue.serverTimestamp();
    db.collection("users").doc(currentUser.uid).set(payload, { merge:true })
      .then(function(){
        lastSyncedJSON = json;
        setSyncState("synced", "Synced");
      })
      .catch(function(err){
        console.error("Cloud save failed", err);
        setSyncState("error", "Save failed: " + err.message);
      });
  }

  // ---------- tree helpers ----------
  function getChildren(parentId){ return tasks.filter(function(t){ return t.parentId===parentId; }); }
  function getDescendants(id){
    var out=[];
    function walk(pid){
      getChildren(pid).forEach(function(c){ out.push(c); walk(c.id); });
    }
    walk(id);
    return out;
  }
  function taskIndex(id){ return tasks.findIndex(function(t){ return t.id===id; }); }
  function insertAfter(newTask, afterId){
    var idx = taskIndex(afterId);
    tasks.splice(idx+1, 0, newTask);
  }
  function allFlatten(){
    var out=[];
    function walk(parentId, depth){
      getChildren(parentId).forEach(function(t){
        out.push({task:t, depth:depth});
        walk(t.id, depth+1);
      });
    }
    walk(null, 0);
    return out;
  }
  function visibleFlatten(){
    var out=[];
    function walk(parentId, depth){
      getChildren(parentId).forEach(function(t){
        var hasKids = getChildren(t.id).length>0;
        out.push({task:t, depth:depth, hasChildren:hasKids});
        if(!t.collapsed) walk(t.id, depth+1);
      });
    }
    walk(null, 0);
    return out;
  }

  // ---------- dependency cascade ----------
  function cascade(){
    if(!autoShift) return;
    for(var pass=0; pass<tasks.length+2; pass++){
      var changed = false;
      tasks.forEach(function(t){
        if(!t.pred || !t.pred.length) return;
        var minStart = null;
        t.pred.forEach(function(pid){
          var p = tasks.find(function(x){ return x.id===pid; });
          if(!p) return;
          var candidate = addDays(parseDate(p.end), 1);
          if(minStart===null || candidate.getTime() > minStart.getTime()) minStart = candidate;
        });
        if(minStart){
          var s = parseDate(t.start);
          if(s.getTime() < minStart.getTime()){
            var shift = daysBetween(s, minStart);
            t.start = formatDate(addDays(parseDate(t.start), shift));
            t.end = formatDate(addDays(parseDate(t.end), shift));
            changed = true;
          }
        }
      });
      if(!changed) break;
    }
  }
  function wouldCreateCycle(taskId, candidatePredIds){
    var visited = {};
    function reaches(fromId, targetId){
      if(fromId === targetId) return true;
      if(visited[fromId]) return false;
      visited[fromId] = true;
      var t = tasks.find(function(x){ return x.id===fromId; });
      if(!t || !t.pred) return false;
      return t.pred.some(function(pid){ return reaches(pid, targetId); });
    }
    return candidatePredIds.some(function(pid){ return reaches(pid, taskId); });
  }

  // ---------- predecessor <-> # number mapping (full doc order) ----------
  function allFlattenIds(){ return allFlatten().map(function(e){ return e.task.id; }); }
  function idsToNumbers(predIds){
    if(!predIds || !predIds.length) return "";
    var ids = allFlattenIds();
    return predIds.map(function(pid){
      var idx = ids.indexOf(pid);
      return idx>=0 ? (idx+1) : null;
    }).filter(function(n){ return n!==null; }).join(", ");
  }
  function numbersToIds(taskId, text){
    var ids = allFlattenIds();
    var nums = text.split(/[,\s]+/).map(function(s){ return s.trim(); }).filter(Boolean).map(Number);
    var result = [];
    nums.forEach(function(n){
      var idx = n-1;
      if(idx>=0 && idx<ids.length){
        var cand = ids[idx];
        if(cand !== taskId && result.indexOf(cand)===-1) result.push(cand);
      }
    });
    return result.filter(function(pid){ return !wouldCreateCycle(taskId, [pid]); });
  }

  // ---------- range ----------
  function getRange(){
    if(!tasks.length){
      var t = todayDate();
      return { start: addDays(t,-3), end: addDays(t,30) };
    }
    var minS=null, maxE=null;
    tasks.forEach(function(t){
      var s=parseDate(t.start), e=parseDate(t.end);
      if(minS===null || s.getTime()<minS.getTime()) minS=s;
      if(maxE===null || e.getTime()>maxE.getTime()) maxE=e;
    });
    return { start: addDays(minS,-4), end: addDays(maxE,6) };
  }

  // ---------- DOM refs ----------
  var rowsEl = document.getElementById("taskRows");
  var rulerMonths = document.getElementById("rulerMonths");
  var rulerDays = document.getElementById("rulerDays");
  var gridlinesEl = document.getElementById("gridlines");
  var barsLayer = document.getElementById("barsLayer");
  var depLayer = document.getElementById("depLayer");
  var timelineBody = document.getElementById("timelineBody");
  var todayLine = document.getElementById("todayLine");
  var todayFlag = document.getElementById("todayFlag");
  var taskCountLabel = document.getElementById("taskCountLabel");
  var inspectorEl = document.getElementById("inspector");
  var backdropEl = document.getElementById("backdrop");

  var range, pxPerDay, totalDays, totalWidth, visList;

  function render(){
    cascade();
    saveTasks();
    range = getRange();
    pxPerDay = ZOOMS[zoom];
    totalDays = Math.max(1, daysBetween(range.start, range.end));
    totalWidth = totalDays * pxPerDay;
    visList = visibleFlatten();

    taskCountLabel.textContent = tasks.length + (tasks.length===1 ? " task" : " tasks");

    renderSidebar();
    renderRuler();
    renderGrid();
    renderBars();
    renderDeps();
    renderToday();

    var bodyHeight = Math.max(visList.length, 1) * ROW_H;
    timelineBody.style.height = bodyHeight + "px";
    timelineBody.style.width = totalWidth + "px";
    rulerMonths.style.width = totalWidth + "px";
    rulerDays.style.width = totalWidth + "px";
    barsLayer.style.width = totalWidth + "px";
    barsLayer.style.height = bodyHeight + "px";
    depLayer.setAttribute("width", totalWidth);
    depLayer.setAttribute("height", bodyHeight);
    gridlinesEl.style.width = totalWidth + "px";
    gridlinesEl.style.height = bodyHeight + "px";

    if(currentInspectId && !tasks.find(function(t){ return t.id===currentInspectId; })){
      closeInspector();
    }
  }

  function dayX(date){ return daysBetween(range.start, date) * pxPerDay; }

  // ---------- sidebar tree ----------
  function renderSidebar(){
    rowsEl.innerHTML = "";
    if(!tasks.length){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = "<h2>No tasks yet</h2><p>Add your first task to start the timeline.</p>";
      rowsEl.appendChild(empty);
      return;
    }
    visList.forEach(function(entry){
      var t = entry.task, depth = entry.depth;
      var row = document.createElement("div");
      row.className = "tree-row depth-" + depth;
      if(t.id === currentInspectId) row.classList.add("selected");
      row.dataset.id = t.id;

      var indent = document.createElement("div");
      indent.className = "indent";
      indent.style.width = (depth*16) + "px";
      row.appendChild(indent);

      var handle = document.createElement("div");
      handle.className = "drag-handle";
      handle.textContent = "⠿";
      handle.title = "Drag to reorder or nest";
      handle.addEventListener("pointerdown", function(e){ startRowDrag(e, t); });
      row.appendChild(handle);

      var caret = document.createElement("button");
      caret.className = "caret" + (entry.hasChildren ? "" : " spacer");
      caret.textContent = entry.hasChildren ? (t.collapsed ? "▸" : "▾") : "•";
      caret.setAttribute("aria-label", entry.hasChildren ? (t.collapsed?"Expand":"Collapse") : "");
      if(entry.hasChildren){
        caret.addEventListener("click", function(e){
          e.stopPropagation();
          t.collapsed = !t.collapsed;
          render();
        });
      }
      row.appendChild(caret);

      var title = document.createElement("div");
      title.className = "title";
      title.textContent = t.name;
      row.appendChild(title);

      var s = parseDate(t.start), e = parseDate(t.end);
      var dur = daysBetween(s,e)+1;
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = shortLabel(s) + "–" + shortLabel(e) + " · " + dur + "d";
      row.appendChild(meta);

      var del = document.createElement("button");
      del.className = "quick-del";
      del.textContent = "✕";
      del.title = "Delete task";
      del.addEventListener("click", function(ev){
        ev.stopPropagation();
        deleteTask(t);
      });
      row.appendChild(del);

      row.addEventListener("click", function(){ openInspector(t); });

      rowsEl.appendChild(row);
    });
  }

  // ---------- shared drag-to-reorder / re-parent helpers ----------
  var rootDropZoneEl = document.getElementById("rootDropZone");
  var dragGhostEl = null, dragLineEl = null, dragTarget = null;

  function createDragGhost(label){
    var ghost = document.createElement("div");
    ghost.className = "drag-ghost";
    ghost.textContent = label;
    document.body.appendChild(ghost);
    return ghost;
  }
  function createDragLine(){
    var line = document.createElement("div");
    line.className = "drop-indicator-line";
    line.style.display = "none";
    document.body.appendChild(line);
    return line;
  }
  function positionGhost(x,y){
    if(!dragGhostEl) return;
    dragGhostEl.style.left = (x+14) + "px";
    dragGhostEl.style.top = (y+10) + "px";
  }
  function clearDropHighlights(){
    rowsEl.querySelectorAll(".drop-target-inside").forEach(function(el){ el.classList.remove("drop-target-inside"); });
    rootDropZoneEl.classList.remove("dragover");
    if(dragLineEl) dragLineEl.style.display = "none";
  }
  function hitTestDrop(clientX, clientY, excludeIds){
    var rootRect = rootDropZoneEl.getBoundingClientRect();
    if(clientY >= rootRect.top && clientY <= rootRect.bottom && clientX >= rootRect.left && clientX <= rootRect.right){
      return { mode:"root" };
    }
    var rows = rowsEl.querySelectorAll(".tree-row");
    for(var i=0;i<rows.length;i++){
      var rowEl = rows[i];
      var id = rowEl.dataset.id;
      if(excludeIds.indexOf(id)!==-1) continue;
      var rect = rowEl.getBoundingClientRect();
      if(clientY >= rect.top && clientY <= rect.bottom){
        var relY = (clientY - rect.top) / rect.height;
        var mode = relY < 0.25 ? "before" : (relY > 0.75 ? "after" : "inside");
        return { id:id, mode:mode, rect:rect };
      }
    }
    return null;
  }
  function paintDropTarget(target){
    clearDropHighlights();
    if(!target) return;
    if(target.mode === "root"){
      rootDropZoneEl.classList.add("dragover");
      return;
    }
    if(target.mode === "inside"){
      var rowEl = rowsEl.querySelector('[data-id="'+target.id+'"]');
      if(rowEl) rowEl.classList.add("drop-target-inside");
    } else {
      var y = target.mode === "before" ? target.rect.top : target.rect.bottom;
      dragLineEl.style.display = "block";
      dragLineEl.style.top = (y-1) + "px";
      dragLineEl.style.left = target.rect.left + "px";
      dragLineEl.style.width = target.rect.width + "px";
    }
  }
  function beginDragVisuals(label){
    dragGhostEl = createDragGhost(label);
    dragLineEl = createDragLine();
    dragTarget = null;
    rootDropZoneEl.style.display = "block";
    document.body.style.userSelect = "none";
  }
  function cleanupDragVisuals(){
    if(dragGhostEl){ dragGhostEl.remove(); dragGhostEl = null; }
    if(dragLineEl){ dragLineEl.remove(); dragLineEl = null; }
    clearDropHighlights();
    rootDropZoneEl.style.display = "none";
    document.body.style.userSelect = "";
    dragTarget = null;
  }
  function commitRowDrag(task, target){
    if(!target) return;
    var idx = taskIndex(task.id);
    if(idx === -1) return;
    tasks.splice(idx, 1);

    if(target.mode === "root"){
      task.parentId = null;
      tasks.push(task);
      render();
      return;
    }

    var refIdx = taskIndex(target.id);
    if(refIdx === -1){ tasks.splice(idx,0,task); return; } // safety: put back
    var refTask = tasks[refIdx];

    if(target.mode === "inside"){
      task.parentId = refTask.id;
      refTask.collapsed = false;
      tasks.splice(refIdx+1, 0, task);
    } else if(target.mode === "before"){
      task.parentId = refTask.parentId;
      tasks.splice(refIdx, 0, task);
    } else { // after
      task.parentId = refTask.parentId;
      tasks.splice(refIdx+1, 0, task);
    }
    render();
  }

  // sidebar handle: starts reorder mode immediately on pointerdown
  function startRowDrag(e, task){
    e.preventDefault();
    e.stopPropagation();
    var pointerId = e.pointerId;
    var excludeIds = getDescendants(task.id).map(function(d){ return d.id; }).concat([task.id]);
    beginDragVisuals(task.name);
    positionGhost(e.clientX, e.clientY);

    function onMove(ev){
      if(ev.pointerId !== pointerId) return;
      positionGhost(ev.clientX, ev.clientY);
      dragTarget = hitTestDrop(ev.clientX, ev.clientY, excludeIds);
      paintDropTarget(dragTarget);
    }
    function onUp(ev){
      if(ev.pointerId !== pointerId) return;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      var target = dragTarget;
      cleanupDragVisuals();
      commitRowDrag(task, target);
    }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  }

  // ---------- ruler ----------
  function renderRuler(){
    rulerMonths.innerHTML = "";
    rulerDays.innerHTML = "";
    var cur = new Date(range.start);
    var monthStart = new Date(cur);
    var dayIndex = 0;
    while(cur.getTime() <= range.end.getTime()){
      var isWeekend = (cur.getDay()===0 || cur.getDay()===6);
      var isWeekStart = cur.getDay()===1;
      var x = dayIndex * pxPerDay;

      var tick = document.createElement("div");
      tick.className = "day-tick" + (isWeekStart?" week-start":"") + (isWeekend?" weekend-tick":"");
      tick.style.left = x + "px";
      tick.style.width = pxPerDay + "px";
      if(zoom==="day" || isWeekStart){ tick.textContent = cur.getDate(); }
      rulerDays.appendChild(tick);

      var next = addDays(cur,1);
      if(next.getMonth() !== cur.getMonth() || next.getTime() > range.end.getTime()){
        var seg = document.createElement("div");
        seg.className = "month-label";
        seg.style.left = (daysBetween(range.start, monthStart))*pxPerDay + "px";
        seg.style.width = ((daysBetween(monthStart, cur)+1) * pxPerDay) + "px";
        seg.textContent = monthLabel(monthStart);
        rulerMonths.appendChild(seg);
        monthStart = next;
      }
      cur = next;
      dayIndex++;
    }
  }

  function renderGrid(){
    gridlinesEl.innerHTML = "";
    var cur = new Date(range.start);
    var dayIndex = 0;
    while(cur.getTime() <= range.end.getTime()){
      var isWeekend = (cur.getDay()===0 || cur.getDay()===6);
      var isWeekStart = cur.getDay()===1;
      var x = dayIndex * pxPerDay;
      if(isWeekend){
        var shade = document.createElement("div");
        shade.className = "gweekend";
        shade.style.left = x + "px";
        shade.style.width = pxPerDay + "px";
        gridlinesEl.appendChild(shade);
      }
      var gl = document.createElement("div");
      gl.className = "gline" + (isWeekStart ? " week" : "");
      gl.style.left = x + "px";
      gridlinesEl.appendChild(gl);
      cur = addDays(cur,1);
      dayIndex++;
    }
    visList.forEach(function(entry,i){
      var rt = document.createElement("div");
      rt.className = "row-track";
      rt.style.top = ((i+1)*ROW_H - 1) + "px";
      rt.style.height = "1px";
      gridlinesEl.appendChild(rt);
    });

  // ---------- bars ----------
  var REORDER_THRESHOLD = 18; // px of vertical drag on a bar before it switches to reorder/re-parent mode
  var POINTER = { id:null, mode:null, task:null, startX:0, startY:0, origStart:null, origEnd:null, barEl:null, origLeft:null, origWidth:null, reordering:false };

  function renderBars(){
    barsLayer.innerHTML = "";
    var today = todayDate();
    visList.forEach(function(entry, i){
      var t = entry.task;
      var s = parseDate(t.start), e = parseDate(t.end);
      var left = dayX(s);
      var width = Math.max(pxPerDay - 2, (daysBetween(s,e)+1)*pxPerDay - 4);

      var bar = document.createElement("div");
      bar.className = "bar" + (entry.depth>0 ? " depth-gt0" : "");
      if(e.getTime() < today.getTime()) bar.classList.add("overdue");
      if(t.id === currentInspectId) bar.classList.add("selected");
      bar.style.left = left + "px";
      bar.style.top = (i*ROW_H) + "px";
      bar.style.width = width + "px";
      bar.title = t.name + "  (" + t.start + " → " + t.end + ")";

      var label = document.createElement("div");
      label.className = "bar-label";
      label.textContent = t.name;
      bar.appendChild(label);

      var hl = document.createElement("div"); hl.className = "handle l"; bar.appendChild(hl);
      var hr = document.createElement("div"); hr.className = "handle r"; bar.appendChild(hr);

      attachDrag(bar, t, "move");
      attachDrag(hl, t, "resize-l");
      attachDrag(hr, t, "resize-r");

      barsLayer.appendChild(bar);
    });
  }

  function attachDrag(el, task, mode){
    el.addEventListener("pointerdown", function(e){
      e.preventDefault();
      e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      POINTER.id = e.pointerId;
      POINTER.mode = mode;
      POINTER.task = task;
      POINTER.startX = e.clientX;
      POINTER.startY = e.clientY;
      POINTER.origStart = task.start;
      POINTER.origEnd = task.end;
      POINTER.barEl = mode==="move" ? el : el.parentElement;
      POINTER.origLeft = POINTER.barEl.style.left;
      POINTER.origWidth = POINTER.barEl.style.width;
      POINTER.reordering = false;

      var excludeIds = mode==="move" ? getDescendants(task.id).map(function(d){ return d.id; }).concat([task.id]) : [];

      function onMove(ev){
        if(ev.pointerId !== POINTER.id) return;
        var dx = ev.clientX - POINTER.startX;
        var dy = ev.clientY - POINTER.startY;

        if(mode==="move" && !POINTER.reordering && Math.abs(dy) > REORDER_THRESHOLD){
          POINTER.reordering = true;
          POINTER.barEl.style.left = POINTER.origLeft;
          POINTER.barEl.style.width = POINTER.origWidth;
          POINTER.barEl.style.opacity = "0.3";
          beginDragVisuals(task.name);
        }

        if(POINTER.reordering){
          positionGhost(ev.clientX, ev.clientY);
          dragTarget = hitTestDrop(ev.clientX, ev.clientY, excludeIds);
          paintDropTarget(dragTarget);
        } else {
          previewDrag(Math.round(dx/pxPerDay));
        }
      }
      function onUp(ev){
        if(ev.pointerId !== POINTER.id) return;
        el.releasePointerCapture(ev.pointerId);
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);

        var totalDx = ev.clientX - POINTER.startX;
        var totalDy = ev.clientY - POINTER.startY;
        var wasTap = Math.abs(totalDx) < 4 && Math.abs(totalDy) < 4;

        if(POINTER.reordering){
          var target = dragTarget;
          POINTER.barEl.style.opacity = "";
          cleanupDragVisuals();
          commitRowDrag(task, target);
        } else {
          commitDrag(Math.round(totalDx/pxPerDay));
          if(wasTap && mode==="move") openInspector(task);
        }
        POINTER.id = null;
        POINTER.reordering = false;
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  }

  function previewDrag(dayDelta){
    if(!POINTER.barEl) return;
    var s = parseDate(POINTER.origStart), e = parseDate(POINTER.origEnd);
    var left, width;
    if(POINTER.mode === "move"){
      var ns = addDays(s, dayDelta), ne = addDays(e, dayDelta);
      left = dayX(ns); width = Math.max(pxPerDay-2, (daysBetween(ns,ne)+1)*pxPerDay - 4);
    } else if(POINTER.mode === "resize-l"){
      var ns2 = addDays(s, dayDelta);
      if(ns2.getTime() > e.getTime()) ns2 = new Date(e);
      left = dayX(ns2); width = Math.max(pxPerDay-2, (daysBetween(ns2,e)+1)*pxPerDay - 4);
    } else {
      var ne2 = addDays(e, dayDelta);
      if(ne2.getTime() < s.getTime()) ne2 = new Date(s);
      left = dayX(s); width = Math.max(pxPerDay-2, (daysBetween(s,ne2)+1)*pxPerDay - 4);
    }
    POINTER.barEl.style.left = left + "px";
    POINTER.barEl.style.width = width + "px";
  }

  function commitDrag(dayDelta){
    if(dayDelta === 0){ render(); return; }
    var t = POINTER.task;
    var s = parseDate(POINTER.origStart), e = parseDate(POINTER.origEnd);
    if(POINTER.mode === "move"){
      t.start = formatDate(addDays(s, dayDelta));
      t.end = formatDate(addDays(e, dayDelta));
    } else if(POINTER.mode === "resize-l"){
      var ns = addDays(s, dayDelta);
      if(ns.getTime() > e.getTime()) ns = new Date(e);
      t.start = formatDate(ns);
    } else {
      var ne = addDays(e, dayDelta);
      if(ne.getTime() < s.getTime()) ne = new Date(s);
      t.end = formatDate(ne);
    }
    render();
    if(currentInspectId === t.id) populateInspector(t);
  }

  // ---------- dependency arrows ----------
  function renderDeps(){
    while(depLayer.firstChild) depLayer.removeChild(depLayer.firstChild);
    var svgns = "http://www.w3.org/2000/svg";
    var defs = document.createElementNS(svgns,"defs");
    defs.innerHTML =
      '<marker id="arrowSlate" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5b6472"/></marker>' +
      '<marker id="arrowRust" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b5493d"/></marker>';
    depLayer.appendChild(defs);

    var visIds = visList.map(function(e){ return e.task.id; });

    visList.forEach(function(entry, i){
      var t = entry.task;
      if(!t.pred || !t.pred.length) return;
      t.pred.forEach(function(pid){
        var pi = visIds.indexOf(pid);
        if(pi === -1) return;
        var p = visList[pi].task;
        var pEnd = parseDate(p.end), tStart = parseDate(t.start);
        var violated = pEnd.getTime() >= tStart.getTime();

        var x1 = dayX(pEnd) + pxPerDay - 2;
        var y1 = pi*ROW_H + ROW_H/2;
        var x2 = dayX(tStart);
        var y2 = i*ROW_H + ROW_H/2;
        var midX = x1 + Math.max(10, (x2-x1)/2);
        var d;
        if(x2 > x1 + 4){
          d = "M"+x1+","+y1+" L"+midX+","+y1+" L"+midX+","+y2+" L"+(x2-1)+","+y2;
        } else {
          var dropY = y1 + (y2>y1 ? ROW_H*0.6 : -ROW_H*0.6);
          d = "M"+x1+","+y1+" L"+(x1+10)+","+y1+" L"+(x1+10)+","+dropY+" L"+(x2-10)+","+dropY+" L"+(x2-10)+","+y2+" L"+(x2-1)+","+y2;
        }
        var path = document.createElementNS(svgns,"path");
        path.setAttribute("d", d);
        path.setAttribute("fill","none");
        path.setAttribute("stroke", violated ? "#b5493d" : "#5b6472");
        path.setAttribute("stroke-width","1.5");
        path.setAttribute("marker-end", violated ? "url(#arrowRust)" : "url(#arrowSlate)");
        path.setAttribute("opacity","0.85");
        depLayer.appendChild(path);
      });
    });
  }

  function renderToday(){
    var today = todayDate();
    if(today.getTime() < range.start.getTime() || today.getTime() > range.end.getTime()){
      todayLine.style.display = "none"; todayFlag.style.display = "none"; return;
    }
    var x = dayX(today);
    todayLine.style.display = "block"; todayLine.style.left = x + "px";
    todayFlag.style.display = "block"; todayFlag.style.left = x + "px";
  }

  // ---------- inspector ----------
  function getYearRange(){
    var years = tasks.map(function(t){ return parseDate(t.start).getFullYear(); })
      .concat(tasks.map(function(t){ return parseDate(t.end).getFullYear(); }));
    var thisYear = todayDate().getFullYear();
    years.push(thisYear);
    var min = Math.min.apply(null, years) - 3;
    var max = Math.max.apply(null, years) + 6;
    return { min: min, max: max };
  }

  function buildDateSelects(container, dateStr, onChange){
    container.innerHTML = "";
    var d = parseDate(dateStr);
    var yr = getYearRange();

    var yearSel = document.createElement("select");
    yearSel.setAttribute("aria-label","Year");
    for(var y=yr.min; y<=yr.max; y++){
      var opt = document.createElement("option");
      opt.value = y; opt.textContent = y;
      if(y === d.getFullYear()) opt.selected = true;
      yearSel.appendChild(opt);
    }

    var monthSel = document.createElement("select");
    monthSel.setAttribute("aria-label","Month");
    MONTH_NAMES.forEach(function(m, idx){
      var opt = document.createElement("option");
      opt.value = idx; opt.textContent = m;
      if(idx === d.getMonth()) opt.selected = true;
      monthSel.appendChild(opt);
    });

    var daySel = document.createElement("select");
    daySel.setAttribute("aria-label","Day");
    function fillDays(){
      var y = Number(yearSel.value), m = Number(monthSel.value);
      var maxDay = daysInMonth(y, m);
      var prevVal = Math.min(Number(daySel.value) || d.getDate(), maxDay);
      daySel.innerHTML = "";
      for(var dd=1; dd<=maxDay; dd++){
        var opt = document.createElement("option");
        opt.value = dd; opt.textContent = dd;
        if(dd === prevVal) opt.selected = true;
        daySel.appendChild(opt);
      }
    }
    fillDays();

    function emit(){
      var y = Number(yearSel.value), m = Number(monthSel.value), dd = Number(daySel.value);
      onChange(formatDate(new Date(y, m, dd)));
    }
    yearSel.addEventListener("change", function(){ fillDays(); emit(); });
    monthSel.addEventListener("change", function(){ fillDays(); emit(); });
    daySel.addEventListener("change", emit);

    container.appendChild(yearSel);
    container.appendChild(monthSel);
    container.appendChild(daySel);
  }

  var inspTitle = document.getElementById("inspTitle");
  var inspPred = document.getElementById("inspPred");
  var inspNum = document.getElementById("inspNum");
  var inspDuration = document.getElementById("inspDuration");
  var inspStartSelects = document.getElementById("inspStartSelects");
  var inspEndSelects = document.getElementById("inspEndSelects");

  function populateInspector(t){
    inspNum.textContent = (allFlattenIds().indexOf(t.id)+1);
    inspTitle.value = t.name;
    inspPred.value = idsToNumbers(t.pred);

    var s = parseDate(t.start), e = parseDate(t.end);
    var dur = daysBetween(s,e)+1;
    inspDuration.textContent = dur + (dur===1?" day":" days") + "  ·  " + shortLabel(s) + " – " + shortLabel(e);

    buildDateSelects(inspStartSelects, t.start, function(newStart){
      if(parseDate(newStart).getTime() > parseDate(t.end).getTime()) t.end = newStart;
      t.start = newStart;
      render();
      populateInspector(t);
    });
    buildDateSelects(inspEndSelects, t.end, function(newEnd){
      if(parseDate(newEnd).getTime() < parseDate(t.start).getTime()) t.start = newEnd;
      t.end = newEnd;
      render();
      populateInspector(t);
    });
  }

  function openInspector(t){
    currentInspectId = t.id;
    inspectorEl.classList.add("open");
    inspectorEl.setAttribute("aria-hidden","false");
    backdropEl.classList.add("show");
    populateInspector(t);
    renderSidebar();
    renderBars();
  }
  function closeInspector(){
    currentInspectId = null;
    inspectorEl.classList.remove("open");
    inspectorEl.setAttribute("aria-hidden","true");
    backdropEl.classList.remove("show");
    renderSidebar();
    renderBars();
  }
  document.getElementById("inspClose").addEventListener("click", closeInspector);
  backdropEl.addEventListener("click", closeInspector);

  inspTitle.addEventListener("input", function(){
    var t = tasks.find(function(x){ return x.id===currentInspectId; });
    if(!t) return;
    t.name = inspTitle.value || "Untitled task";
    saveTasks();
    renderSidebar();
    renderRuler(); // no-op for names but cheap; keeps structure simple
    renderBars();
  });
  inspPred.addEventListener("change", function(){
    var t = tasks.find(function(x){ return x.id===currentInspectId; });
    if(!t) return;
    t.pred = numbersToIds(t.id, inspPred.value);
    render();
    populateInspector(t);
  });

  function newTaskTemplate(parentId){
    var t = todayDate();
    return { id:uid(), name:"New task", start:formatDate(t), end:formatDate(addDays(t,3)), pred:[], parentId:parentId, collapsed:false };
  }

  function addSibling(ref){
    var nt = newTaskTemplate(ref.parentId);
    insertAfter(nt, ref.id);
    render();
    openInspector(nt);
    requestAnimationFrame(function(){ inspTitle.focus(); inspTitle.select(); });
  }
  function addChild(ref){
    var nt = newTaskTemplate(ref.id);
    var desc = getDescendants(ref.id);
    var anchor = desc.length ? desc[desc.length-1].id : ref.id;
    insertAfter(nt, anchor);
    ref.collapsed = false;
    render();
    openInspector(nt);
    requestAnimationFrame(function(){ inspTitle.focus(); inspTitle.select(); });
  }
  function deleteTask(t){
    var desc = getDescendants(t.id);
    var msg = desc.length
      ? 'Delete "' + t.name + '" and its ' + desc.length + ' sub-task' + (desc.length>1?'s':'') + '?'
      : 'Delete "' + t.name + '"?';
    if(!confirm(msg)) return;
    var idsToRemove = [t.id].concat(desc.map(function(d){ return d.id; }));
    tasks = tasks.filter(function(x){ return idsToRemove.indexOf(x.id)===-1; });
    tasks.forEach(function(x){
      if(x.pred) x.pred = x.pred.filter(function(pid){ return idsToRemove.indexOf(pid)===-1; });
    });
    if(idsToRemove.indexOf(currentInspectId) !== -1) closeInspector();
    render();
  }

  document.getElementById("inspAddSibling").addEventListener("click", function(){
    var t = tasks.find(function(x){ return x.id===currentInspectId; });
    if(t) addSibling(t);
  });
  document.getElementById("inspAddChild").addEventListener("click", function(){
    var t = tasks.find(function(x){ return x.id===currentInspectId; });
    if(t) addChild(t);
  });
  document.getElementById("inspDelete").addEventListener("click", function(){
    var t = tasks.find(function(x){ return x.id===currentInspectId; });
    if(t) deleteTask(t);
  });

  // ---------- toolbar actions ----------
  function addRootTask(){
    var nt = newTaskTemplate(null);
    tasks.push(nt);
    render();
    openInspector(nt);
    requestAnimationFrame(function(){
      inspTitle.focus(); inspTitle.select();
      var wrap = document.getElementById("timelineWrap");
      wrap.scrollLeft = Math.max(0, dayX(parseDate(nt.start)) - 200);
    });
  }
  document.getElementById("addTaskBtn").addEventListener("click", addRootTask);
  document.getElementById("addTaskBtn2").addEventListener("click", addRootTask);

  document.getElementById("autoShiftToggle").checked = autoShift;
  document.getElementById("autoShiftToggle").addEventListener("change", function(e){
    autoShift = e.target.checked;
    localStorage.setItem(SHIFT_KEY, autoShift ? "1" : "0");
    render();
  });

  var zoomDayBtn = document.getElementById("zoomDay");
  var zoomWeekBtn = document.getElementById("zoomWeek");
  function setZoom(z){
    zoom = z;
    localStorage.setItem(ZOOM_KEY, z);
    zoomDayBtn.classList.toggle("active", z==="day");
    zoomWeekBtn.classList.toggle("active", z==="week");
    render();
  }
  zoomDayBtn.addEventListener("click", function(){ setZoom("day"); });
  zoomWeekBtn.addEventListener("click", function(){ setZoom("week"); });
  setZoom(zoom);

  document.getElementById("todayBtn").addEventListener("click", function(){
    var wrap = document.getElementById("timelineWrap");
    var x = dayX(todayDate());
    wrap.scrollLeft = Math.max(0, x - wrap.clientWidth/2);
  });

  document.getElementById("printBtn").addEventListener("click", function(){
    buildPrintArea();
    setTimeout(function(){ window.print(); }, 30);
  });

  function buildPrintArea(){
    var printEl = document.getElementById("printArea");
    var list = visibleFlatten(); // respects current collapse state
    var pRange = getRange();
    var pTotalDays = Math.max(1, daysBetween(pRange.start, pRange.end) + 1);
    var today = todayDate();

    function pct(days){ return (days / pTotalDays) * 100; }

    // month band segments proportional to day count in range
    var monthSegs = [];
    var cur = new Date(pRange.start);
    var curMonthStart = new Date(cur);
    var dayCount = 0;
    while(cur.getTime() <= pRange.end.getTime()){
      dayCount++;
      var next = addDays(cur, 1);
      if(next.getMonth() !== cur.getMonth() || next.getTime() > pRange.end.getTime()){
        monthSegs.push({ label: monthLabel(curMonthStart), days: dayCount });
        curMonthStart = next;
        dayCount = 0;
      }
      cur = next;
    }

    var activeProj = projects[activeProjectId];
    var projName = activeProj ? activeProj.name : "Untitled project";

    var html = "";
    html += '<div class="print-header">';
    html += '<h1>' + esc(projName) + '</h1>';
    html += '<div class="print-meta">Generated ' + esc(shortLabel(today)) + ' ' + today.getFullYear() +
            ' &middot; Range: ' + esc(shortLabel(pRange.start)) + ' &ndash; ' + esc(shortLabel(pRange.end)) +
            ' &middot; ' + list.length + (list.length===1?' task':' tasks') + '</div>';
    html += '</div>';

    html += '<table class="print-table"><colgroup>' +
      '<col style="width:220px"><col style="width:66px"><col style="width:66px">' +
      '<col style="width:56px"><col></colgroup>';
    html += '<thead><tr>' +
      '<th>Task</th><th>Start</th><th>End</th><th>Pred.</th>' +
      '<th class="print-timeline-th"><div class="print-month-band">' +
      monthSegs.map(function(seg){
        return '<div class="print-month-seg" style="flex:'+seg.days+' 0 0;">'+esc(seg.label)+'</div>';
      }).join("") +
      '</div></th>' +
      '</tr></thead><tbody>';

    list.forEach(function(entry){
      var t = entry.task;
      var s = parseDate(t.start), e = parseDate(t.end);
      var dur = daysBetween(s,e) + 1;
      var left = pct(daysBetween(pRange.start, s));
      var width = Math.max(pct(1), pct(dur));
      var overdue = e.getTime() < today.getTime();
      var predText = idsToNumbers(t.pred) || "—";
      var labelLeft = Math.min(left + width + 1, 88);

      html += '<tr class="depth-' + entry.depth + '">';
      html += '<td class="print-name"><div class="print-name-cell" style="padding-left:' + (entry.depth*14) + 'px;">' + esc(t.name) + '</div></td>';
      html += '<td class="print-dates">' + esc(t.start) + '</td>';
      html += '<td class="print-dates">' + esc(t.end) + '</td>';
      html += '<td class="print-pred">' + esc(predText) + '</td>';
      html += '<td><div class="print-bar-track"><div class="print-bar' +
        (entry.depth>0 ? ' depth-gt0' : '') + (overdue ? ' overdue' : '') +
        '" style="left:' + left.toFixed(2) + '%; width:' + width.toFixed(2) + '%;"></div>' +
        '<div class="print-bar-label" style="left:' + labelLeft.toFixed(2) + '%;">' + dur + 'd</div>' +
        '</div></td>';
      html += '</tr>';
    });

    html += '</tbody></table>';
    html += '<div class="print-footer">Copyright © 2026 Dr. Wen-Ming Yang. All Rights Reserved.</div>';

    printEl.innerHTML = html;
  }

  document.getElementById("exportBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(tasks, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "gantt-tasks-" + formatDate(todayDate()) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  var importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", function(){ importFile.click(); });
  importFile.addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var data = JSON.parse(ev.target.result);
        if(!Array.isArray(data)) throw new Error("Invalid format");
        var valid = data.every(function(t){ return t && t.id && t.name && t.start && t.end; });
        if(!valid) throw new Error("Invalid task data");
        if(tasks.length && !confirm("Replace current tasks with imported data?")) return;
        tasks = data.map(normalizeTask);
        closeInspector();
        render();
      }catch(err){
        alert("Could not import file: " + err.message);
      }
      importFile.value = "";
    };
    reader.readAsText(file);
  });

  // ---------- init ----------
  renderProjectPicker();
  initFirebase();
  render();
})();
</script>
</body>
</html>
