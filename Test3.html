<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pause</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="manifest" href='data:application/manifest+json,{"name":"The Pause","short_name":"Pause","start_url":".","display":"standalone","background_color":"#f8f9fa","theme_color":"#3b82f6"}'>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #3b82f6; 
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 8px;
            --tag-bg: #eff6ff;
            --tag-text: #1d4ed8;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
            transition: background 0.3s;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* --- TOP BAR --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 24px;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .brand { font-size: 1.1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
        
        .top-actions { display: flex; gap: 8px; position: relative; flex-wrap: wrap; align-items: center; }
        
        .toggle-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .toggle-btn:hover { background: #f3f4f6; }
        .toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .toggle-btn.reminder-active { background: var(--success); color: white; border-color: var(--success); }
        .toggle-btn.signin-btn { background: var(--accent); color: white; border-color: var(--accent); }
        .toggle-btn.signin-btn:hover { background: var(--accent-hover); }

        /* --- CLOCK & TIMER --- */
        .header { text-align: center; width: 100%; margin-bottom: 20px;}
        #clock { font-size: 2.5rem; font-weight: 700; margin: 0; letter-spacing: -0.05em; color: var(--text-main);}
        #timer-display { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
        #timer-display.active { color: var(--danger); font-weight: 600; }

        /* --- INPUT SECTION --- */
        .journal-entry {
            width: 100%;
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        
        .project-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            background: #f9fafb;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .project-input-wrapper label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
        #project-input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
            outline: none;
        }
        #project-input::placeholder { color: #9ca3af; font-weight: 400;}

        textarea {
            width: 100%;
            height: 120px; 
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
            margin-bottom: 12px;
            background: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s;
            line-height: 1.5;
        }
        textarea:focus { 
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: var(--surface);
        }

        .button-group { display: flex; gap: 8px; }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #start-btn { background-color: var(--accent); color: white; flex: 1; }
        #start-btn:hover { background-color: var(--accent-hover); }
        #save-btn { background-color: var(--success); color: white; flex: 1; display: none; }
        #save-btn:hover { background-color: #059669; }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- LOG SECTION --- */
        .log-section { width: 100%; }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;}
        .log-header h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0; font-weight: 600;}
        .export-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 0.75rem; padding: 4px 8px;}
        .export-btn:hover { background: var(--surface); color: var(--text-main); box-shadow: var(--shadow-sm);}
        
        .log-item {
            background: var(--surface);
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            animation: fadeIn 0.2s ease-out;
            position: relative;
            transition: box-shadow 0.2s;
        }
        .log-item:hover { box-shadow: var(--shadow-md); }
        
        .log-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .log-meta { display: flex; align-items: center; gap: 8px; }
        .log-time { font-weight: 600; font-size: 0.75rem; color: var(--text-muted); }
        
        .project-tag {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        
        .log-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s;}
        .log-item:hover .log-actions { opacity: 1; }
        
        .log-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            color: var(--text-muted);
            border-radius: 4px;
        }
        .log-actions button:hover { color: var(--text-main); background: #f3f4f6; }

        .log-content {
            white-space: pre-wrap; 
            word-wrap: break-word;
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* --- IN-LINE EDITING --- */
        .log-edit-area {
            display: none; 
            width: 100%;
            margin-top: 8px;
        }
        .log-edit-area .project-input-wrapper { margin-bottom: 8px; padding: 4px 8px;}
        .log-edit-area textarea {
            height: 100px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .log-edit-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .log-edit-actions button {
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-cancel:hover { background: #f3f4f6; color: var(--text-main); }
        .btn-update { background: var(--accent); color: white; }
        .btn-update:hover { background: var(--accent-hover); }

        .log-item.editing .log-content { display: none; }
        .log-item.editing .log-header-row { display: none; }
        .log-item.editing .log-edit-area { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- REMINDER DROPDOWN --- */
        .reminder-dropdown, .cloud-dropdown, .dropdown-menu {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 8px;
            z-index: 200;
            width: 180px;
        }
        .reminder-dropdown.show, .cloud-dropdown.show, .dropdown-menu.show { display: block; }
        .reminder-dropdown p, .dropdown-menu p { margin: 0 0 8px 0; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-align: center; text-transform: uppercase;}
        .reminder-dropdown button, .cloud-dropdown button, .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 2px;
            background: transparent;
            color: var(--text-main);
            font-size: 0.85rem;
            text-align: left;
            border-radius: 4px;
            justify-content: flex-start;
        }
        .reminder-dropdown button:hover, .cloud-dropdown button:hover, .dropdown-menu button:hover { background: #f3f4f6; color: var(--accent); }

        .cloud-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 4px;
            white-space: nowrap;
        }

        /* --- SUMMARY MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-overlay.show { display: flex; }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9fafb;
        }
        .modal-header h2 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .close-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 4px;}
        .close-btn:hover { background: #e5e7eb; color: var(--text-main); }

        .summary-toggle-group {
            display: flex;
            gap: 4px;
            padding: 12px 24px 0 24px;
            background: #f9fafb;
        }
        .summary-toggle-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.8rem;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .summary-toggle-btn.active {
            background: var(--surface);
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: var(--shadow-sm);
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .summary-document {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111;
        }
        .summary-document h1 { font-size: 1.5rem; margin: 0 0 8px 0; text-align: center; letter-spacing: -0.02em;}
        .summary-document .summary-date { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #eee;}
        
        .summary-entry {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px dashed #eee;
        }
        .summary-entry:last-child { border-bottom: none; }
        .summary-entry-time { font-weight: 700; font-size: 0.85rem; color: var(--accent); margin-bottom: 4px; }
        .summary-entry-text { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; }

        .summary-project-group {
            margin-bottom: 32px;
        }
        .summary-project-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-project-count {
            font-size: 0.75rem;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            background: #f9fafb;
        }
        .modal-footer button { flex: 1; }
        .btn-copy { background: var(--accent); color: white; }
        .btn-copy:hover { background: var(--accent-hover); }
        .btn-print { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); }
        .btn-print:hover { background: #f3f4f6; }

        @media print {
            body * { visibility: hidden; }
            .modal-overlay, .modal-content, .modal-body, .summary-document, .summary-document * { visibility: visible; }
            .modal-overlay { 
                position: absolute; left: 0; top: 0; width: 100%; height: auto;
                background: white; padding: 0; display: block; margin: 0;
            }
            .modal-content { 
                box-shadow: none; max-height: none; max-width: 100%; border-radius: 0; margin: 0; padding: 0;
            }
            .modal-body { overflow: visible; padding: 0; margin: 0; }
            .modal-header, .modal-footer, .summary-toggle-group { display: none !important; }
            @page { margin: 1cm; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">🌿 The Pause</div>
        <div class="top-actions">
            <button class="toggle-btn" onclick="openSummary()">📊 Summary</button>
            <button class="toggle-btn" id="analog-toggle" onclick="toggleAnalog()">📄 Analog</button>
            <button class="toggle-btn" id="remind-btn" onclick="toggleReminderMenu()">🔔 Remind</button>
            
            <!-- Cloud Auth Area -->
            <span id="cloudAuthArea">
                <button class="toggle-btn signin-btn" id="cloudSignInBtn" onclick="cloudSignIn()">☁ Sign in</button>
                <span id="cloudSignedInArea" style="display:none; align-items: center; gap: 6px;">
                    <span id="cloudUserLabel" style="font-size: 0.75rem; color: var(--text-muted);"></span>
                    <button class="toggle-btn" id="cloudMenuBtn" onclick="toggleCloudMenu()">☁ Cloud ▾</button>
                    <span id="cloudStatusLabel" class="cloud-status"></span>
                </span>
            </span>

            <!-- Reminder Menu -->
            <div class="reminder-dropdown" id="reminder-menu">
                <p>Remind me every...</p>
                <button onclick="setReminder(15)">15 Minutes</button>
                <button onclick="setReminder(30)">30 Minutes</button>
                <button onclick="setReminder(60)">1 Hour</button>
                <button onclick="setReminder(120)">2 Hours</button>
                <button onclick="stopReminders()" style="color: var(--danger); margin-top: 4px;">Stop Reminders</button>
            </div>

            <!-- Cloud Menu -->
            <div class="cloud-dropdown" id="cloud-menu" style="top: 42px; right: 0;">
                <button onclick="cloudSave()">☁ Save Now</button>
                <button onclick="cloudLoad()">⬇ Load from Cloud</button>
                <button onclick="syncNow()">🔄 Sync Now</button>
                <button onclick="cloudSignOut()" style="color: var(--danger); margin-top: 4px;">Sign out</button>
            </div>
        </div>
    </div>

    <div class="header">
        <div id="clock">00:00:00</div>
        <div id="timer-display">Ready to write</div>
    </div>

    <div class="journal-entry">
        <div class="project-input-wrapper">
            <label for="project-input">📁 Project</label>
            <input type="text" id="project-input" list="project-list" placeholder="General" spellcheck="false">
            <datalist id="project-list"></datalist>
        </div>

        <textarea id="entry-text" spellcheck="false"></textarea>
        <div class="button-group">
            <button id="start-btn">Start 5-Min Timer</button>
            <button id="save-btn">Save Log</button>
        </div>
    </div>

    <div class="log-section">
        <div class="log-header">
            <h3>Today's Log</h3>
            <button class="export-btn" onclick="exportMarkdown()">Export .md</button>
        </div>
        <div id="log-list"></div>
    </div>

    <div class="modal-overlay" id="summary-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Today's Summary</h2>
                <button class="close-btn" onclick="closeSummary()">✕</button>
            </div>
            
            <div class="summary-toggle-group">
                <button class="summary-toggle-btn active" id="view-timeline-btn" onclick="setSummaryView('timeline')">🕐 Timeline</button>
                <button class="summary-toggle-btn" id="view-project-btn" onclick="setSummaryView('project')">📁 By Project</button>
            </div>

            <div class="modal-body">
                <div class="summary-document" id="summary-content"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-copy" onclick="copySummary()">📋 Copy to Clipboard</button>
                <button class="btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
            </div>
        </div>
    </div>

    <!-- Firebase (compat build) — same project as Thoughts-v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        // GLOBAL APP STATE
        // ============================================================
        const JOURNAL_PRESET = `1. Just did: \n2. Thinking: \n3. Next up: `;
        const DEFAULT_PROJECT = "General";
        let logs = []; // [{ time, text, project }]
        let reminderInterval = null;
        let currentSummaryView = 'timeline';

        // Cloud state
        let cloudUser = null;
        let cloudSaveTimer = null;
        let suppressCloudSave = false;
        let cloudDb = null;
        let cloudAuth = null;

        // localStorage key for local backup (per-user once signed in)
        const LOCAL_KEY_ANON = 'thepause_logs_anon';
        function localKeyForUser(uid) { return 'thepause_logs_' + uid; }

        // ============================================================
        // 1. CLOCK & TIMER
        // ============================================================
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ============================================================
        // 2. PROJECT FIELD MANAGEMENT
        // ============================================================
        function getCurrentProject() {
            const val = document.getElementById('project-input').value.trim();
            return val || DEFAULT_PROJECT;
        }
        function populateProjectSuggestions() {
            const projects = [...new Set(logs.map(log => log.project).filter(Boolean))];
            const datalist = document.getElementById('project-list');
            datalist.innerHTML = '';
            projects.forEach(p => {
                const option = document.createElement('option');
                option.value = p;
                datalist.appendChild(option);
            });
        }

        // ============================================================
        // 3. RENDERING LOGS
        // ============================================================
        function escapeHtml(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function renderLogs() {
            const logList = document.getElementById('log-list');
            logList.innerHTML = ''; 
            
            logs.forEach((log, index) => {
                const logDiv = document.createElement('div');
                logDiv.className = 'log-item';
                logDiv.id = `log-item-${index}`;
                
                const project = log.project || DEFAULT_PROJECT;
                const safeProject = escapeHtml(project);
                const safeText = escapeHtml(log.text).replace(/\n/g, "<br>");
                const rawText = escapeHtml(log.text);
                
                logDiv.innerHTML = `
                    <div class="log-header-row">
                        <div class="log-meta">
                            <span class="log-time">${log.time}</span>
                            <span class="project-tag">${safeProject}</span>
                        </div>
                        <div class="log-actions">
                            <button onclick="enableInlineEdit(${index})" title="Edit">✏️</button>
                            <button onclick="deleteLog(${index})" title="Delete">🗑️</button>
                        </div>
                    </div>
                    <div class="log-content">${safeText}</div>
                    <div class="log-edit-area">
                        <div class="project-input-wrapper">
                            <label>📁</label>
                            <input type="text" id="edit-project-${index}" value="${safeProject}" list="project-list" spellcheck="false">
                        </div>
                        <textarea id="edit-textarea-${index}" spellcheck="false">${rawText}</textarea>
                        <div class="log-edit-actions">
                            <button class="btn-cancel" onclick="cancelInlineEdit(${index})">Cancel</button>
                            <button class="btn-update" onclick="saveInlineEdit(${index})">Update</button>
                        </div>
                    </div>
                `;
                logList.appendChild(logDiv);
            });
        }

        // ============================================================
        // 4. IN-LINE EDIT LOGIC
        // ============================================================
        function enableInlineEdit(index) {
            const logItem = document.getElementById(`log-item-${index}`);
            logItem.classList.add('editing');
            const textarea = document.getElementById(`edit-textarea-${index}`);
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        }
        function cancelInlineEdit(index) {
            document.getElementById(`log-item-${index}`).classList.remove('editing');
        }
        function saveInlineEdit(index) {
            const textarea = document.getElementById(`edit-textarea-${index}`);
            const projectInput = document.getElementById(`edit-project-${index}`);
            const newText = textarea.value;
            const newProject = projectInput.value.trim() || DEFAULT_PROJECT;
            
            if (!newText.trim()) { alert("Log cannot be empty."); return; }
            
            logs[index].text = newText;
            logs[index].project = newProject;
            saveLocal();
            renderLogs();
            populateProjectSuggestions();
            scheduleCloudAutoSave();
        }

        // ============================================================
        // 5. DELETE LOGIC
        // ============================================================
        function deleteLog(index) {
            if(confirm("Are you sure you want to delete this entry?")) {
                logs.splice(index, 1);
                saveLocal();
                renderLogs();
                populateProjectSuggestions();
                scheduleCloudAutoSave();
            }
        }

        // ============================================================
        // 6. NEW LOG LOGIC
        // ============================================================
        function loadPreset() {
            const textarea = document.getElementById('entry-text');
            textarea.value = JOURNAL_PRESET;
            const cursorPosition = JOURNAL_PRESET.indexOf('\n'); 
            textarea.setSelectionRange(cursorPosition, cursorPosition);
        }

        document.getElementById('save-btn').addEventListener('click', function() {
            const text = document.getElementById('entry-text').value;
            const project = getCurrentProject();
            
            if (!text.trim() || text === JOURNAL_PRESET) { alert("Please fill out the journal before saving."); return; }
            
            const now = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute:'2-digit' });
            logs.unshift({ time: now, text: text, project: project });
            saveLocal();
            renderLogs();
            populateProjectSuggestions();
            scheduleCloudAutoSave();
            
            document.getElementById('entry-text').style.borderColor = "var(--border)";
            document.getElementById('timer-display').textContent = "Ready to write";
            document.getElementById('timer-display').classList.remove('active');
            document.getElementById('save-btn').style.display = "none";
            
            clearInterval(timerInterval);
            timerEndTime = null;
            loadPreset(); 
        });

        // ============================================================
        // 7. TIMER LOGIC (timestamp-accurate)
        // ============================================================
        let timerInterval;
        let timerEndTime = null;

        document.getElementById('start-btn').addEventListener('click', function() {
            const startBtn = this;
            const saveBtn = document.getElementById('save-btn');
            const timerDisplay = document.getElementById('timer-display');
            const entryText = document.getElementById('entry-text');

            startBtn.disabled = true;
            startBtn.textContent = "Writing...";
            saveBtn.style.display = "flex";
            entryText.focus();

            const now = Date.now();
            timerEndTime = now + (300 * 1000);

            if(timerInterval) clearInterval(timerInterval);
            timerDisplay.classList.add('active');
            timerDisplay.style.color = "";

            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 250);
        });

        function updateTimerDisplay() {
            if (!timerEndTime) return;
            const timerDisplay = document.getElementById('timer-display');
            const entryText = document.getElementById('entry-text');
            const msLeft = timerEndTime - Date.now();
            
            if (msLeft <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                timerEndTime = null;
                timerDisplay.textContent = "Time's up! Stop and save.";
                timerDisplay.style.color = "var(--danger)";
                entryText.style.borderColor = "var(--danger)";
                return;
            }

            const totalSecondsLeft = Math.ceil(msLeft / 1000);
            const minutes = Math.floor(totalSecondsLeft / 60);
            const seconds = totalSecondsLeft % 60;
            timerDisplay.textContent = `Time left: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        // ============================================================
        // 8. SUMMARY MODAL
        // ============================================================
        function openSummary() {
            document.getElementById('summary-modal').classList.add('show');
            renderSummary();
        }
        function setSummaryView(view) {
            currentSummaryView = view;
            document.getElementById('view-timeline-btn').classList.toggle('active', view === 'timeline');
            document.getElementById('view-project-btn').classList.toggle('active', view === 'project');
            renderSummary();
        }

        function renderSummary() {
            const content = document.getElementById('summary-content');
            
            let html = `<h1>The Pause — Daily Reflection</h1>`;
            html += `<div class="summary-date">${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>`;
            
            if (logs.length === 0) {
                html += `<p style="text-align:center; color:#888;">No logs recorded today.</p>`;
                content.innerHTML = html;
                return;
            }

            if (currentSummaryView === 'timeline') {
                [...logs].reverse().forEach(log => {
                    const project = escapeHtml(log.project || DEFAULT_PROJECT);
                    const safeText = escapeHtml(log.text);
                    html += `
                        <div class="summary-entry">
                            <div class="summary-entry-time">${log.time} · <span class="project-tag">${project}</span></div>
                            <div class="summary-entry-text">${safeText}</div>
                        </div>
                    `;
                });
            } else {
                const grouped = {};
                logs.forEach(log => {
                    const p = log.project || DEFAULT_PROJECT;
                    if (!grouped[p]) grouped[p] = [];
                    grouped[p].push(log);
                });

                const sortedProjects = Object.keys(grouped).sort((a, b) => grouped[b].length - grouped[a].length);

                sortedProjects.forEach(projectName => {
                    const projectLogs = grouped[projectName];
                    const safeProject = escapeHtml(projectName);
                    
                    html += `
                        <div class="summary-project-group">
                            <div class="summary-project-header">
                                <span>📁 ${safeProject}</span>
                                <span class="summary-project-count">${projectLogs.length} ${projectLogs.length === 1 ? 'entry' : 'entries'}</span>
                            </div>
                    `;
                    [...projectLogs].reverse().forEach(log => {
                        const safeText = escapeHtml(log.text);
                        html += `
                            <div class="summary-entry">
                                <div class="summary-entry-time">${log.time}</div>
                                <div class="summary-entry-text">${safeText}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                });
            }
            
            content.innerHTML = html;
        }

        function closeSummary() {
            document.getElementById('summary-modal').classList.remove('show');
        }
        document.getElementById('summary-modal').addEventListener('click', function(e) {
            if (e.target === this) closeSummary();
        });

        function copySummary() {
            const content = document.getElementById('summary-content');
            const tempText = content.innerText;
            navigator.clipboard.writeText(tempText).then(() => {
                const btn = document.querySelector('.btn-copy');
                const originalText = btn.textContent;
                btn.textContent = "✅ Copied!";
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            }).catch(err => alert("Failed to copy text: " + err));
        }

        // ============================================================
        // 9. NOTIFICATIONS (Reminders)
        // ============================================================
        function toggleReminderMenu() { 
            document.getElementById('reminder-menu').classList.toggle('show');
            document.getElementById('cloud-menu').classList.remove('show');
        }
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('reminder-menu');
            const btn = document.getElementById('remind-btn');
            if (!btn.contains(event.target) && !menu.contains(event.target)) menu.classList.remove('show');
        });
        function setReminder(minutes) {
            const btn = document.getElementById('remind-btn');
            document.getElementById('reminder-menu').classList.remove('show');
            if (!("Notification" in window)) { alert("This browser does not support desktop notifications."); return; }
            if (Notification.permission !== "granted") {
                Notification.requestPermission().then(function (permission) {
                    if (permission === "granted") startReminderInterval(minutes, btn);
                });
            } else { startReminderInterval(minutes, btn); }
        }
        function startReminderInterval(minutes, btn) {
            if (reminderInterval) clearInterval(reminderInterval);
            const ms = minutes * 60 * 1000;
            btn.textContent = `🔔 Active (${minutes}m)`;
            btn.classList.add('reminder-active');
            new Notification("The Pause", { body: `Reminders set for every ${minutes} minutes.` });
            reminderInterval = setInterval(() => {
                new Notification("Time to pause?", { body: "Pause. What did you just do? What's next?" });
            }, ms);
        }
        function stopReminders() {
            if (reminderInterval) clearInterval(reminderInterval);
            const btn = document.getElementById('remind-btn');
            btn.textContent = "🔔 Remind";
            btn.classList.remove('reminder-active');
            document.getElementById('reminder-menu').classList.remove('show');
        }

        // ============================================================
        // 10. EXPORT & ANALOG MODE
        // ============================================================
        function exportMarkdown() {
            if (logs.length === 0) return alert("No logs to export.");
            
            let mdContent = "# The Pause — Daily Log\n\n";
            let currentProject = null;
            
            [...logs].reverse().forEach(log => {
                const project = log.project || DEFAULT_PROJECT;
                if (project !== currentProject) {
                    mdContent += `## 📁 ${project}\n\n`;
                    currentProject = project;
                }
                mdContent += `### ${log.time}\n${log.text}\n\n---\n`;
            });
            
            const blob = new Blob([mdContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `the-pause-log-${new Date().toISOString().slice(0,10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function toggleAnalog() {
            const body = document.body;
            const btn = document.getElementById('analog-toggle');
            if (body.style.backgroundColor === 'rgb(232, 228, 219)') {
                body.style.backgroundColor = 'var(--bg-color)';
                btn.classList.remove('active');
                btn.textContent = "📄 Analog";
            } else {
                body.style.backgroundColor = '#e8e4db'; 
                btn.classList.add('active');
                btn.textContent = "💻 Digital";
            }
        }

        // ============================================================
        // 11. LOCAL BACKUP (localStorage)
        // ============================================================
        function currentLocalKey() {
            return cloudUser ? localKeyForUser(cloudUser.uid) : LOCAL_KEY_ANON;
        }
        function saveLocal() {
            try {
                localStorage.setItem(currentLocalKey(), JSON.stringify(logs));
            } catch (e) { console.error('Local save failed:', e); }
        }
        function loadLocal() {
            try {
                const raw = localStorage.getItem(currentLocalKey());
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        }

        // ============================================================
        // 12. CLOUD SYNC (Firebase — same project as Thoughts-v10)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCn-INjtwiFoS66VXAADfVLLAqmjJOyksc",
            authDomain: "qtodo-syn.firebaseapp.com",
            projectId: "qtodo-syn",
            messagingSenderId: "663058774385",
            appId: "1:663058774385:web:a2972f2eb032c8cc4d5ed0"
        };

        let cloudApp = null;

        // Each user's Pause data lives in one Firestore document:
        //   users/{uid}/pauseData/logs
        // Field: { logsJson: string, updatedAt: timestamp }
        function pauseDocRef() {
            return cloudDb.collection('users').doc(cloudUser.uid)
                .collection('pauseData').doc('logs');
        }

        function setCloudStatus(text) {
            const el = document.getElementById('cloudStatusLabel');
            if (el) el.textContent = text;
        }

        function initCloud() {
            try {
                // Named app instance 'thepause' so its auth session is
                // isolated from Thoughts-v10 (which uses the name
                // 'thoughts') even though both share the same Firebase
                // project. You can be signed into both independently.
                cloudApp = firebase.initializeApp(firebaseConfig, 'thepause');
                cloudAuth = cloudApp.auth();
                cloudDb = cloudApp.firestore();
            } catch (err) {
                console.error('Firebase init failed:', err);
                setCloudStatus('Cloud unavailable');
                return;
            }

            cloudAuth.onAuthStateChanged(function(user) {
                cloudUser = user;
                updateAuthUI();
                if (user) {
                    loadFromCloud({ silent: true });
                } else {
                    // Signed out — fall back to anonymous local data
                    logs = loadLocal();
                    renderLogs();
                    populateProjectSuggestions();
                }
            });

            // Safari popup-block fallback
            cloudAuth.getRedirectResult().catch(function(err) {
                console.error('Redirect sign-in failed:', err);
            });
        }

        function updateAuthUI() {
            const signInBtn = document.getElementById('cloudSignInBtn');
            const signedInArea = document.getElementById('cloudSignedInArea');
            const userLabel = document.getElementById('cloudUserLabel');
            if (cloudUser) {
                signInBtn.style.display = 'none';
                signedInArea.style.display = 'inline-flex';
                userLabel.textContent = cloudUser.displayName || cloudUser.email || 'Signed in';
            } else {
                signInBtn.style.display = '';
                signedInArea.style.display = 'none';
            }
        }

        window.cloudSignIn = function () {
            const provider = new firebase.auth.GoogleAuthProvider();
            setCloudStatus('Signing in…');
            cloudAuth.signInWithPopup(provider).catch(function (err) {
                console.error('Popup sign-in failed, trying redirect:', err);
                setCloudStatus('Retrying…');
                cloudAuth.signInWithRedirect(provider).catch(function (err2) {
                    console.error('Redirect sign-in also failed:', err2);
                    setCloudStatus('Sign-in failed');
                });
            });
        };

        window.cloudSignOut = function () {
            document.getElementById('cloud-menu').classList.remove('show');
            cloudAuth.signOut().then(function() {
                setCloudStatus('');
                logs = loadLocal();
                renderLogs();
                populateProjectSuggestions();
            });
        };

        window.toggleCloudMenu = function () {
            document.getElementById('cloud-menu').classList.toggle('show');
            document.getElementById('reminder-menu').classList.remove('show');
        };
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('cloud-menu');
            const btn = document.getElementById('cloudMenuBtn');
            if (!menu || !btn) return;
            if (!btn.contains(event.target) && !menu.contains(event.target)) menu.classList.remove('show');
        });

        // Save current logs to Firestore.
        window.cloudSave = function () {
            if (!cloudUser) return;
            document.getElementById('cloud-menu').classList.remove('show');
            setCloudStatus('Saving…');
            pauseDocRef().set({
                logsJson: JSON.stringify(logs),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(function () {
                setCloudStatus('Saved ' + new Date().toLocaleTimeString());
                setTimeout(function() { setCloudStatus(''); }, 4000);
            }).catch(function (err) {
                console.error('Cloud save failed:', err);
                setCloudStatus('Save failed');
            });
        };

        // Load logs from Firestore, replacing local state.
        // silent=true is used on initial sign-in (no confirm prompt).
        window.cloudLoad = function (opts) {
            if (!cloudUser) return;
            opts = opts || {};
            if (!opts.silent) {
                document.getElementById('cloud-menu').classList.remove('show');
                if (!confirm('Reload from cloud? This will replace what\'s on screen with the cloud version.')) return;
            }
            setCloudStatus(opts.silent ? 'Syncing…' : 'Loading…');
            pauseDocRef().get().then(function (doc) {
                if (doc.exists && doc.data().logsJson) {
                    try {
                        const cloudLogs = JSON.parse(doc.data().logsJson);
                        if (Array.isArray(cloudLogs)) {
                            logs = cloudLogs;
                            saveLocal();
                            renderLogs();
                            populateProjectSuggestions();
                            setCloudStatus('Loaded ' + new Date().toLocaleTimeString());
                            setTimeout(function() { setCloudStatus(''); }, 4000);
                            return;
                        }
                    } catch (e) { console.error('Bad cloud data:', e); }
                }
                // No cloud doc yet — push current local logs up as
                // the initial cloud state.
                setCloudStatus('Uploading local data…');
                pauseDocRef().set({
                    logsJson: JSON.stringify(logs),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).then(function () {
                    setCloudStatus('Synced ' + new Date().toLocaleTimeString());
                    setTimeout(function() { setCloudStatus(''); }, 4000);
                });
            }).catch(function (err) {
                console.error('Cloud load failed:', err);
                setCloudStatus('Load failed');
            });
        };

        // Manual "Sync Now" — pull from cloud, and if remote is newer
        // than what we have, adopt it; otherwise push ours up.
        window.syncNow = function () {
            if (!cloudUser) return;
            document.getElementById('cloud-menu').classList.remove('show');
            setCloudStatus('Syncing…');
            pauseDocRef().get().then(function (doc) {
                if (doc.exists && doc.data().logsJson) {
                    try {
                        const cloudLogs = JSON.parse(doc.data().logsJson);
                        if (Array.isArray(cloudLogs) && cloudLogs.length >= logs.length) {
                            logs = cloudLogs;
                            saveLocal();
                            renderLogs();
                            populateProjectSuggestions();
                        }
                    } catch (e) { /* ignore, fall through to save */ }
                }
                return pauseDocRef().set({
                    logsJson: JSON.stringify(logs),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            }).then(function () {
                setCloudStatus('Synced ' + new Date().toLocaleTimeString());
                setTimeout(function() { setCloudStatus(''); }, 4000);
            }).catch(function (err) {
                console.error('Sync failed:', err);
                setCloudStatus('Sync failed');
            });
        };

        // Debounced auto-save — called from any mutation.
        function scheduleCloudAutoSave() {
            if (!cloudUser || suppressCloudSave) return;
            clearTimeout(cloudSaveTimer);
            cloudSaveTimer = setTimeout(function () {
                pauseDocRef().set({
                    logsJson: JSON.stringify(logs),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(function (err) {
                    console.error('Auto-save failed:', err);
                });
            }, 3000);
        }

        // ============================================================
        // 13. BOOT
        // ============================================================
        window.addEventListener('DOMContentLoaded', function () {
            logs = loadLocal();
            renderLogs();
            populateProjectSuggestions();
            loadPreset();
            initCloud();
        });

        // Save local backup before unload (belt and braces)
        window.addEventListener('beforeunload', function () {
            saveLocal();
        });
    </script>
</body>
</html>
