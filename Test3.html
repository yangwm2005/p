<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pause</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="manifest" href='data:application/manifest+json,{"name":"The Pause","short_name":"Pause","start_url":".","display":"standalone","background_color":"#f8f9fa","theme_color":"#3b82f6"}'>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #3b82f6; 
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 8px;
            --tag-bg: #eff6ff;
            --tag-text: #1d4ed8;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
            transition: background 0.3s;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 24px;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .brand { font-size: 1.1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
        
        .top-actions { display: flex; gap: 8px; position: relative; flex-wrap: wrap; align-items: center; }
        
        .toggle-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .toggle-btn:hover { background: #f3f4f6; }
        .toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .toggle-btn.reminder-active { background: var(--success); color: white; border-color: var(--success); }
        .toggle-btn.signin-btn { background: var(--accent); color: white; border-color: var(--accent); }
        .toggle-btn.signin-btn:hover { background: var(--accent-hover); }

        .header { text-align: center; width: 100%; margin-bottom: 20px;}
        #clock { font-size: 2.5rem; font-weight: 700; margin: 0; letter-spacing: -0.05em; color: var(--text-main);}
        #timer-display { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
        #timer-display.active { color: var(--danger); font-weight: 600; }

        .journal-entry {
            width: 100%;
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        
        .project-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            background: #f9fafb;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .project-input-wrapper label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
        #project-input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
            outline: none;
        }
        #project-input::placeholder { color: #9ca3af; font-weight: 400;}

        textarea {
            width: 100%;
            height: 120px; 
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
            margin-bottom: 12px;
            background: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s;
            line-height: 1.5;
        }
        textarea:focus { 
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: var(--surface);
        }

        .button-group { display: flex; gap: 8px; }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #start-btn { background-color: var(--accent); color: white; flex: 1; }
        #start-btn:hover { background-color: var(--accent-hover); }
        #save-btn { background-color: var(--success); color: white; flex: 1; display: none; }
        #save-btn:hover { background-color: #059669; }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .log-section { width: 100%; }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;}
        .log-header h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0; font-weight: 600;}
        .log-header-actions { display: flex; gap: 6px; }
        .export-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 0.75rem; padding: 4px 8px;}
        .export-btn:hover { background: var(--surface); color: var(--text-main); box-shadow: var(--shadow-sm);}
        .wrapup-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 0.75rem; padding: 4px 8px;}
        .wrapup-btn:hover { background: #fef3c7; color: #92400e; border-color: #fbbf24;}
        
        .log-item {
            background: var(--surface);
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            animation: fadeIn 0.2s ease-out;
            position: relative;
            transition: box-shadow 0.2s;
        }
        .log-item:hover { box-shadow: var(--shadow-md); }
        /* Visual treatment for special (non-project) entries */
        .log-item.special-entry {
            background: #fffbeb;
            border-color: #fde68a;
        }
        .log-item.special-entry .project-tag {
            background: #fef3c7;
            color: #92400e;
        }
        
        .log-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .log-meta { display: flex; align-items: center; gap: 8px; }
        .log-time { font-weight: 600; font-size: 0.75rem; color: var(--text-muted); }
        
        .project-tag {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        
        .log-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s;}
        .log-item:hover .log-actions { opacity: 1; }
        
        .log-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            color: var(--text-muted);
            border-radius: 4px;
        }
        .log-actions button:hover { color: var(--text-main); background: #f3f4f6; }

        .log-content {
            white-space: pre-wrap; 
            word-wrap: break-word;
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .log-edit-area {
            display: none; 
            width: 100%;
            margin-top: 8px;
        }
        .log-edit-area .project-input-wrapper { margin-bottom: 8px; padding: 4px 8px;}
        .log-edit-area textarea {
            height: 100px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .log-edit-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .log-edit-actions button {
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-cancel:hover { background: #f3f4f6; color: var(--text-main); }
        .btn-update { background: var(--accent); color: white; }
        .btn-update:hover { background: var(--accent-hover); }

        .log-item.editing .log-content { display: none; }
        .log-item.editing .log-header-row { display: none; }
        .log-item.editing .log-edit-area { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .reminder-dropdown, .cloud-dropdown {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 8px;
            z-index: 200;
            width: 180px;
        }
        .reminder-dropdown.show, .cloud-dropdown.show { display: block; }
        .reminder-dropdown p { margin: 0 0 8px 0; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-align: center; text-transform: uppercase;}
        .reminder-dropdown button, .cloud-dropdown button {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 2px;
            background: transparent;
            color: var(--text-main);
            font-size: 0.85rem;
            text-align: left;
            border-radius: 4px;
            justify-content: flex-start;
        }
        .reminder-dropdown button:hover, .cloud-dropdown button:hover { background: #f3f4f6; color: var(--accent); }

        .cloud-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 4px;
            white-space: nowrap;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-overlay.show { display: flex; }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9fafb;
        }
        .modal-header h2 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .close-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 4px;}
        .close-btn:hover { background: #e5e7eb; color: var(--text-main); }

        .summary-toggle-group {
            display: flex;
            gap: 4px;
            padding: 12px 24px 0 24px;
            background: #f9fafb;
        }
        .summary-toggle-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.8rem;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .summary-toggle-btn.active {
            background: var(--surface);
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: var(--shadow-sm);
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .summary-document {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111;
        }
        .summary-document h1 { font-size: 1.5rem; margin: 0 0 8px 0; text-align: center; letter-spacing: -0.02em;}
        .summary-document .summary-date { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #eee;}
        
        .summary-entry {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px dashed #eee;
        }
        .summary-entry:last-child { border-bottom: none; }
        .summary-entry-time { font-weight: 700; font-size: 0.85rem; color: var(--accent); margin-bottom: 4px; }
        .summary-entry-text { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; }

        .summary-project-group { margin-bottom: 32px; }
        .summary-project-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-project-count {
            font-size: 0.75rem;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* --- TIME SPENT TAB --- */
        .time-total {
            text-align: center;
            font-size: 1.05rem;
            color: var(--text-main);
            padding: 16px;
            margin: 8px 0 24px;
            background: #f9fafb;
            border-radius: 8px;
            font-weight: 500;
        }
        .time-total strong {
            color: var(--accent);
            font-size: 1.3rem;
            font-weight: 700;
        }
        .time-project {
            margin-bottom: 18px;
        }
        .time-project-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .time-project-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }
        .time-project-duration {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }
        .time-project-duration .pct {
            font-weight: 400;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: 4px;
        }
        .time-bar-track {
            height: 10px;
            background: #eef2f6;
            border-radius: 5px;
            overflow: hidden;
        }
        .time-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, var(--accent));
            border-radius: 5px;
            transition: width 0.4s ease-out;
        }
        .time-bar-fill.paused {
            background: linear-gradient(90deg, #fbbf24, var(--warning));
        }
        .time-project-entry-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .time-note {
            margin-top: 24px;
            padding: 12px 14px;
            background: #f9fafb;
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .time-warning-icon {
            display: inline-block;
            color: var(--warning);
            margin-left: 4px;
            cursor: help;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            background: #f9fafb;
        }
        .modal-footer button { flex: 1; }
        .btn-copy { background: var(--accent); color: white; }
        .btn-copy:hover { background: var(--accent-hover); }
        .btn-print { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); }
        .btn-print:hover { background: #f3f4f6; }

        @media print {
            body * { visibility: hidden; }
            .modal-overlay, .modal-content, .modal-body, .summary-document, .summary-document * { visibility: visible; }
            .modal-overlay { 
                position: absolute; left: 0; top: 0; width: 100%; height: auto;
                background: white; padding: 0; display: block; margin: 0;
            }
            .modal-content { 
                box-shadow: none; max-height: none; max-width: 100%; border-radius: 0; margin: 0; padding: 0;
            }
            .modal-body { overflow: visible; padding: 0; margin: 0; }
            .modal-header, .modal-footer, .summary-toggle-group { display: none !important; }
            @page { margin: 1cm; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">🌿 The Pause</div>
        <div class="top-actions">
            <button class="toggle-btn" onclick="openSummary()">📊 Summary</button>
            <button class="toggle-btn" id="analog-toggle" onclick="toggleAnalog()">📄 Analog</button>
            <button class="toggle-btn" id="remind-btn" onclick="toggleReminderMenu()">🔔 Remind</button>
            
            <span id="cloudAuthArea">
                <button class="toggle-btn signin-btn" id="cloudSignInBtn" onclick="cloudSignIn()">☁ Sign in</button>
                <span id="cloudSignedInArea" style="display:none; align-items: center; gap: 6px;">
                    <span id="cloudUserLabel" style="font-size: 0.75rem; color: var(--text-muted);"></span>
                    <button class="toggle-btn" id="cloudMenuBtn" onclick="toggleCloudMenu()">☁ Cloud ▾</button>
                    <span id="cloudStatusLabel" class="cloud-status"></span>
                </span>
            </span>

            <div class="reminder-dropdown" id="reminder-menu">
                <p>Remind me every...</p>
                <button onclick="setReminder(15)">15 Minutes</button>
                <button onclick="setReminder(30)">30 Minutes</button>
                <button onclick="setReminder(60)">1 Hour</button>
                <button onclick="setReminder(120)">2 Hours</button>
                <button onclick="stopReminders()" style="color: var(--danger); margin-top: 4px;">Stop Reminders</button>
            </div>

            <div class="cloud-dropdown" id="cloud-menu">
                <button onclick="cloudSave()">☁ Save Now</button>
                <button onclick="cloudLoad()">⬇ Load from Cloud</button>
                <button onclick="syncNow()">🔄 Sync Now</button>
                <button onclick="cloudSignOut()" style="color: var(--danger); margin-top: 4px;">Sign out</button>
            </div>
        </div>
    </div>

    <div class="header">
        <div id="clock">00:00:00</div>
        <div id="timer-display">Ready to write</div>
    </div>

    <div class="journal-entry">
        <div class="project-input-wrapper">
            <label for="project-input">📁 Project</label>
            <input type="text" id="project-input" list="project-list" placeholder="General" spellcheck="false">
            <datalist id="project-list"></datalist>
        </div>

        <textarea id="entry-text" spellcheck="false"></textarea>
        <div class="button-group">
            <button id="start-btn">Start 5-Min Timer</button>
            <button id="save-btn">Save Log</button>
        </div>
    </div>

    <div class="log-section">
        <div class="log-header">
            <h3>Today's Log</h3>
            <div class="log-header-actions">
                <button class="wrapup-btn" onclick="wrapUpDay()" title="Insert a final entry that closes the day's last block">🛑 Wrap up</button>
                <button class="export-btn" onclick="exportMarkdown()">Export .md</button>
            </div>
        </div>
        <div id="log-list"></div>
    </div>

    <div class="modal-overlay" id="summary-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Today's Summary</h2>
                <button class="close-btn" onclick="closeSummary()">✕</button>
            </div>
            
            <div class="summary-toggle-group">
                <button class="summary-toggle-btn active" id="view-timeline-btn" onclick="setSummaryView('timeline')">🕐 Timeline</button>
                <button class="summary-toggle-btn" id="view-project-btn" onclick="setSummaryView('project')">📁 By Project</button>
                <button class="summary-toggle-btn" id="view-time-btn" onclick="setSummaryView('time')">⏱️ Time Spent</button>
            </div>

            <div class="modal-body">
                <div class="summary-document" id="summary-content"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-copy" onclick="copySummary()">📋 Copy to Clipboard</button>
                <button class="btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
            </div>
        </div>
    </div>

    <!-- Firebase (compat build) — same project as Thoughts-v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        // GLOBAL APP STATE
        // ============================================================
        const JOURNAL_PRESET = `1. Just did: \n2. Thinking: \n3. Next up: `;
        const DEFAULT_PROJECT = "General";

        // Special project names treated as "paused time" — excluded
        // from normal project totals and shown separately in the Time
        // Spent view. Case-insensitive match.
        const SPECIAL_PROJECT_KEYWORDS = ['break', 'lunch', 'paused', 'pause', 'wrap up', 'wrap-up', 'end of day'];

        // Cap (in ms) above which a single gap between entries gets a
        // ⚠️ note in the Time Spent view — purely informational, the
        // gap is still counted in full.
        const LONG_GAP_THRESHOLD_MS = 2 * 60 * 60 * 1000; // 2 hours

        let logs = [];  // [{ time, timestamp, text, project }]
        let reminderInterval = null;
        let currentSummaryView = 'timeline';

        let cloudUser = null;
        let cloudSaveTimer = null;
        let cloudDb = null;
        let cloudAuth = null;

        const LOCAL_KEY_ANON = 'thepause_logs_anon';
        function localKeyForUser(uid) { return 'thepause_logs_' + uid; }

        // ============================================================
        // HELPERS
        // ============================================================
        function isSpecialProject(name) {
            if (!name) return false;
            return SPECIAL_PROJECT_KEYWORDS.indexOf(String(name).trim().toLowerCase()) !== -1;
        }

        function formatDuration(ms) {
            if (!ms || ms < 0) return '0m';
            const totalMin = Math.round(ms / 60000);
            if (totalMin < 1) return '<1m';
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            if (h === 0) return m + 'm';
            if (m === 0) return h + 'h';
            return h + 'h ' + m + 'm';
        }

        // ---- Duration math ------------------------------------------
        // For each entry, the amount of time it "represents" is the gap
        // between it and the NEXT entry in chronological order (the
        // older one). The most recent entry runs until now (ongoing).
        // Entries without a timestamp are excluded from duration math
        // but still counted in the entry-count-per-project display.
        //
        // Sort chronologically (oldest first) for the duration walk,
        // since durations attach to the EARLIER entry of each pair.
        function computeTimeData() {
            const withTs = logs
                .filter(l => typeof l.timestamp === 'number' && !isNaN(l.timestamp))
                .slice()
                .sort((a, b) => a.timestamp - b.timestamp);

            const byProject = {};   // { name: { ms, entries, hasWarning } }
            const nowMs = Date.now();
            let totalMs = 0;
            let pausedMs = 0;
            let unknownMs = 0; // from entries with no timestamp

            // Entries that can't contribute to duration but still count
            // toward project entry totals.
            const untimedEntries = logs.length - withTs.length;

            for (let i = 0; i < withTs.length; i++) {
                const cur = withTs[i];
                const next = withTs[i + 1];
                const project = cur.project || DEFAULT_PROJECT;
                const durationMs = next ? (next.timestamp - cur.timestamp) : (nowMs - cur.timestamp);
                const isOngoing = !next;

                // Bucket into project totals (unless it's a special
                // paused-time project).
                if (!byProject[project]) {
                    byProject[project] = { ms: 0, entries: 0, hasWarning: false, paused: false };
                }
                byProject[project].entries += 1;
                if (isSpecialProject(project)) {
                    byProject[project].paused = true;
                    pausedMs += durationMs;
                } else {
                    byProject[project].ms += durationMs;
                    totalMs += durationMs;
                    if (durationMs > LONG_GAP_THRESHOLD_MS) {
                        byProject[project].hasWarning = true;
                    }
                }
                if (isOngoing) {
                    // Nothing more to warn about from this entry.
                }
            }

            return { byProject, totalMs, pausedMs, untimedEntries, timedCount: withTs.length };
        }

        function renderTimeSpentView(html) {
            const data = computeTimeData();

            html += `<h1>The Pause — Time Spent Today</h1>`;
            html += `<div class="summary-date">${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>`;

            if (data.timedCount === 0) {
                html += `<p style="text-align:center; color:#888; padding: 24px;">No timed entries yet. Add a couple of log entries and durations will appear here automatically.</p>`;
                document.getElementById('summary-content').innerHTML = html;
                return;
            }

            // Split into real projects vs paused
            const entries = Object.entries(data.byProject);
            const realProjects = entries
                .filter(([, v]) => !v.paused && v.ms > 0)
                .sort((a, b) => b[1].ms - a[1].ms);
            const pausedProjects = entries
                .filter(([, v]) => v.paused && v.ms > 0)
                .sort((a, b) => b[1].ms - a[1].ms);

            const totalForBars = data.totalMs + data.pausedMs || 1; // avoid /0

            // Top-line total
            html += `<div class="time-total">`;
            if (data.totalMs > 0) {
                html += `Focus time today: <strong>${formatDuration(data.totalMs)}</strong>`;
            } else {
                html += `<strong>0m</strong> of focus time logged`;
            }
            if (data.pausedMs > 0) {
                html += `<div style="font-size: 0.8rem; color: #92400e; margin-top: 6px;">⏸️ ${formatDuration(data.pausedMs)} paused</div>`;
            }
            html += `</div>`;

            // Real projects
            realProjects.forEach(function ([name, v]) {
                const pct = Math.round((v.ms / totalForBars) * 100);
                const safeName = escapeHtml(name);
                html += `
                    <div class="time-project">
                        <div class="time-project-header">
                            <span class="time-project-name">📁 ${safeName}</span>
                            <span class="time-project-duration">
                                ${formatDuration(v.ms)}
                                <span class="pct">${pct}%</span>
                                ${v.hasWarning ? '<span class="time-warning-icon" title="At least one gap over 2 hours was counted here — might include a break">⚠️</span>' : ''}
                            </span>
                        </div>
                        <div class="time-bar-track">
                            <div class="time-bar-fill" style="width: ${pct}%"></div>
                        </div>
                        <div class="time-project-entry-count">${v.entries} ${v.entries === 1 ? 'entry' : 'entries'}</div>
                    </div>
                `;
            });

            // Paused section (only if any)
            if (pausedProjects.length > 0) {
                html += `<div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid #eee;">`;
                html += `<div style="font-size: 0.8rem; font-weight: 600; color: #92400e; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px;">⏸️ Paused / Break Time</div>`;
                pausedProjects.forEach(function ([name, v]) {
                    const pct = Math.round((v.ms / totalForBars) * 100);
                    const safeName = escapeHtml(name);
                    html += `
                        <div class="time-project">
                            <div class="time-project-header">
                                <span class="time-project-name" style="color:#92400e;">${safeName}</span>
                                <span class="time-project-duration" style="color:#92400e;">
                                    ${formatDuration(v.ms)}
                                    <span class="pct">${pct}%</span>
                                </span>
                            </div>
                            <div class="time-bar-track">
                                <div class="time-bar-fill paused" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            // Note about the method + any untimed entries
            html += `<div class="time-note">`;
            html += `ⓘ Durations are estimated from the gaps between your log entries. Each entry "owns" the time between it and the next one. The most recent entry runs until now.`;
            if (data.untimedEntries > 0) {
                html += `<br><br>Note: ${data.untimedEntries} older ${data.untimedEntries === 1 ? 'entry has' : 'entries have'} no timestamp (logged before this feature was added) and aren't counted in durations.`;
            }
            html += `</div>`;

            document.getElementById('summary-content').innerHTML = html;
        }

        function renderSummary() {
            const content = document.getElementById('summary-content');
            
            let html = '';
            
            if (logs.length === 0) {
                html = `<h1>The Pause — Daily Reflection</h1>`;
                html += `<div class="summary-date">${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>`;
                html += `<p style="text-align:center; color:#888;">No logs recorded today.</p>`;
                content.innerHTML = html;
                return;
            }

            // ---- Time Spent view ----
            if (currentSummaryView === 'time') {
                renderTimeSpentView(html);
                return;
            }

            // ---- Timeline / By Project views ----
            html += `<h1>The Pause — Daily Reflection</h1>`;
            html += `<div class="summary-date">${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>`;

            if (currentSummaryView === 'timeline') {
                [...logs].reverse().forEach(log => {
                    const project = escapeHtml(log.project || DEFAULT_PROJECT);
                    const safeText = escapeHtml(log.text);
                    html += `
                        <div class="summary-entry">
                            <div class="summary-entry-time">${log.time} · <span class="project-tag">${project}</span></div>
                            <div class="summary-entry-text">${safeText}</div>
                        </div>
                    `;
                });
            } else {
                const grouped = {};
                logs.forEach(log => {
                    const p = log.project || DEFAULT_PROJECT;
                    if (!grouped[p]) grouped[p] = [];
                    grouped[p].push(log);
                });

                const sortedProjects = Object.keys(grouped).sort((a, b) => grouped[b].length - grouped[a].length);

                sortedProjects.forEach(projectName => {
                    const projectLogs = grouped[projectName];
                    const safeProject = escapeHtml(projectName);
                    const pausedStyle = isSpecialProject(projectName) ? ' style="color: #92400e; border-bottom-color: #fbbf24;"' : '';
                    
                    html += `
                        <div class="summary-project-group">
                            <div class="summary-project-header"${pausedStyle}>
                                <span>${isSpecialProject(projectName) ? '⏸️' : '📁'} ${safeProject}</span>
                                <span class="summary-project-count">${projectLogs.length} ${projectLogs.length === 1 ? 'entry' : 'entries'}</span>
                            </div>
                    `;
                    [...projectLogs].reverse().forEach(log => {
                        const safeText = escapeHtml(log.text);
                        html += `
                            <div class="summary-entry">
                                <div class="summary-entry-time">${log.time}</div>
                                <div class="summary-entry-text">${safeText}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                });
            }
            
            content.innerHTML = html;
        }

        }

        window.cloudSignIn = function () {
            const provider = new firebase.auth.GoogleAuthProvider();
            setCloudStatus('Signing in…');
            cloudAuth.signInWithPopup(provider).catch(function (err) {
                console.error('Popup sign-in failed, trying redirect:', err);
                setCloudStatus('Retrying…');
                cloudAuth.signInWithRedirect(provider).catch(function (err2) {
                    console.error('Redirect sign-in also failed:', err2);
                    setCloudStatus('Sign-in failed');
                });
            });
        };

        window.cloudSignOut = function () {
            document.getElementById('cloud-menu').classList.remove('show');
            cloudAuth.signOut().then(function() {
                setCloudStatus('');
                logs = loadLocal();
                renderLogs();
                populateProjectSuggestions();
            });
        };

        window.toggleCloudMenu = function () {
            document.getElementById('cloud-menu').classList.toggle('show');
            document.getElementById('reminder-menu').classList.remove('show');
        };
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('cloud-menu');
            const btn = document.getElementById('cloudMenuBtn');
            if (!menu || !btn) return;
            if (!btn.contains(event.target) && !menu.contains(event.target)) menu.classList.remove('show');
        });

        function cloudSaveNow() {
            if (!cloudUser) return Promise.resolve();
            return pauseDocRef().set({
                logsJson: JSON.stringify(logs),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(function () {
                flashCloudStatus('☁ Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
            }).catch(function (err) {
                console.error('Cloud save failed:', err);
                flashCloudStatus('☁ Save failed');
            });
        }

        window.cloudSave = function () {
            if (!cloudUser) return;
            document.getElementById('cloud-menu').classList.remove('show');
            setCloudStatus('Saving…');
            cloudSaveNow();
        };

        function loadFromCloud(opts) {
            opts = opts || {};
            if (!cloudUser) return;
            if (!opts.silent) setCloudStatus('Loading…');
            else setCloudStatus('Syncing…');

            pauseDocRef().get().then(function (doc) {
                if (doc.exists && doc.data().logsJson) {
                    try {
                        const cloudLogs = JSON.parse(doc.data().logsJson);
                        if (Array.isArray(cloudLogs)) {
                            logs = cloudLogs;
                            saveLocal();
                            renderLogs();
                            populateProjectSuggestions();
                            flashCloudStatus('☁ Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
                            return;
                        }
                    } catch (e) { console.error('Bad cloud data:', e); }
                }
                setCloudStatus('Uploading local data…');
                pauseDocRef().set({
                    logsJson: JSON.stringify(logs),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).then(function () {
                    flashCloudStatus('☁ Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
                });
            }).catch(function (err) {
                console.error('Cloud load failed:', err);
                setCloudStatus('Load failed');
            });
        }

        window.cloudLoad = function () {
            if (!cloudUser) return;
            document.getElementById('cloud-menu').classList.remove('show');
            if (!confirm('Reload from cloud? This will replace what\'s on screen with the cloud version.')) return;
            loadFromCloud({ silent: false });
        };

        window.syncNow = function () {
            if (!cloudUser) return;
            document.getElementById('cloud-menu').classList.remove('show');
            setCloudStatus('Syncing…');
            pauseDocRef().get().then(function (doc) {
                if (doc.exists && doc.data().logsJson) {
                    try {
                        const cloudLogs = JSON.parse(doc.data().logsJson);
                        if (Array.isArray(cloudLogs) && cloudLogs.length >= logs.length) {
                            logs = cloudLogs;
                            saveLocal();
                            renderLogs();
                            populateProjectSuggestions();
                        }
                    } catch (e) { /* fall through */ }
                }
                return pauseDocRef().set({
                    logsJson: JSON.stringify(logs),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            }).then(function () {
                flashCloudStatus('☁ Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
            }).catch(function (err) {
                console.error('Sync failed:', err);
                setCloudStatus('Sync failed');
            });
        };

        function scheduleCloudAutoSave() {
            if (!cloudUser) return;
            clearTimeout(cloudSaveTimer);
            cloudSaveTimer = setTimeout(function () {
                pauseDocRef().set({
                    logsJson: JSON.stringify(logs),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(function (err) {
                    console.error('Auto-save failed:', err);
                });
            }, 3000);
        }

        // ============================================================
        // 13. BOOT
        // ============================================================
        window.addEventListener('DOMContentLoaded', function () {
            logs = loadLocal();
            renderLogs();
            populateProjectSuggestions();
            loadPreset();
            initCloud();
        });

        window.addEventListener('beforeunload', function () {
            saveLocal();
        });
    </script>
</body>
</html>
